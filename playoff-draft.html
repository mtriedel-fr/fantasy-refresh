<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Playoff Game Draft — Fantasy Refresh</title>
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/theme.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding-bottom:90px;}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px;}
  .top{display:flex;align-items:center;gap:10px;padding:16px 0 10px;}
  .logo{font-family:var(--fd);font-size:20px;font-weight:900;color:var(--or);}
  .logo span{color:var(--pk);}
  /* Round chips */
  .rounds{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;}
  .round-chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--bdr);background:var(--bg2);color:var(--ink2);font-family:var(--fd);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;cursor:pointer;white-space:nowrap;}
  .round-chip.on{background:linear-gradient(135deg,var(--or),var(--pk));color:var(--on-accent);border-color:transparent;}
  .round-chip.locked{opacity:.5;}
  /* Budget bar */
  .budget{background:var(--bg2);border:1px solid var(--bdr);border-radius:14px;padding:14px 16px;margin-bottom:14px;}
  .budget-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .budget-title{font-family:var(--fd);font-size:13px;font-weight:800;color:var(--ink);text-transform:uppercase;letter-spacing:.5px;}
  .budget-round{font-size:12px;color:var(--ink3);}
  .bar{height:12px;border-radius:999px;background:var(--bg4);overflow:hidden;}
  .bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--green),var(--or));transition:width .25s,background .25s;}
  .bar-fill.over{background:var(--pk);}
  .budget-nums{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;}
  .budget-nums .lab{color:var(--ink3);}
  .budget-nums .val{font-family:var(--fd);font-weight:800;color:var(--ink);}
  .budget-nums .val.over{color:var(--pk);}
  .budget-note{margin-top:10px;font-size:11px;color:var(--ink3);line-height:1.5;}
  .budget-note b{color:var(--gold);}
  /* Roster slots */
  .slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  .slot{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:1px solid var(--bdr);background:var(--bg2);min-height:52px;}
  .slot .pos{font-family:var(--fd);font-size:11px;font-weight:900;color:var(--ink3);width:38px;}
  .slot .nm{flex:1;font-size:13px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .slot .sal{font-family:var(--fd);font-size:12px;font-weight:800;color:var(--or);}
  .slot.empty .nm{color:var(--ink3);font-weight:400;font-style:italic;}
  .slot .x{color:var(--ink3);cursor:pointer;font-size:16px;padding:0 2px;}
  /* Player list */
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .filter{padding:6px 12px;border-radius:999px;border:1px solid var(--bdr);background:var(--bg2);color:var(--ink2);font-size:12px;font-weight:700;cursor:pointer;}
  .filter.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .plist{display:flex;flex-direction:column;gap:6px;}
  .prow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--bdr);background:var(--bg2);cursor:pointer;}
  .prow:active{background:var(--bg3);}
  .prow .pos{font-family:var(--fd);font-size:10px;font-weight:900;padding:3px 6px;border-radius:5px;background:var(--bg4);color:var(--ink2);}
  .prow .nm{flex:1;}
  .prow .nm .n{font-size:14px;font-weight:700;color:var(--ink);}
  .prow .nm .m{font-size:11px;color:var(--ink3);}
  .prow .sal{font-family:var(--fd);font-size:13px;font-weight:800;color:var(--or);text-align:right;}
  .prow.unaff{opacity:.45;}
  .prow.picked{border-color:var(--green);}
  /* Submit bar */
  .submitbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--bdr);padding:12px 16px;}
  .submitbar .inner{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;}
  .submitbar .status{flex:1;font-size:12px;color:var(--ink3);}
  .btn{padding:12px 20px;border:none;border-radius:10px;font-family:var(--fd);font-size:14px;font-weight:800;text-transform:uppercase;cursor:pointer;background:linear-gradient(135deg,var(--or),var(--pk));color:var(--on-accent);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .empty{text-align:center;padding:48px 20px;color:var(--ink3);}
  .empty .em{font-size:40px;margin-bottom:12px;}
  .empty .t{font-family:var(--fd);font-size:18px;font-weight:900;color:var(--ink2);margin-bottom:8px;}
  .notice{background:var(--bg2);border:1px solid var(--bdr);border-left:3px solid var(--pk);border-radius:8px;padding:12px 14px;margin:14px 0;font-size:13px;color:var(--ink2);line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo">Fantasy <span>Refresh</span></div></div>
  <div id="round-chips" class="rounds"></div>
  <div id="main"></div>
</div>
<div class="submitbar"><div class="inner">
  <div class="status" id="submit-status">Loading…</div>
  <button class="btn" id="submit-btn" onclick="submitRound()" disabled>Submit</button>
</div></div>

<script src="/js/auth.js"></script>
<script src="/league-context.js"></script>
<script src="/js/playoff-budget.js"></script>
<script src="/js/playoff-game.js"></script>
<script>
// ── Playoff Game round draft ──────────────────────────────────────────────
// One budget across four NFL playoff rounds (Wild Card, Divisional, Conference,
// Super Bowl). A fresh 9-man roster each round, prices regenerate, repeat picks
// allowed. The live budget is derived from the manager's SAVED earlier-round
// rosters via FRPlayoffGame/FRBudget — the one bank with the Super Bowl floor
// held back and unspent pool carrying over. This page reuses the site's
// existing salary/lineup paths (rounds map to weeks 1-4). Live locks, scoring
// and the in-round kickoff rules are later engine pieces.
var currentUser, settings = {}, currentRound = 1;
var allPlayers = [];      // this round's priced pool
var priorCosts = {};      // {roundIndex: totalSal} from saved earlier-round lineups
var lineup = {};          // {slotId: playerObj}
var posFilter = 'ALL';

var SLOT_DEFS = [
  {id:'qb1', pos:'QB',   label:'QB',   eligible:['QB']},
  {id:'rb1', pos:'RB',   label:'RB',   eligible:['RB']},
  {id:'rb2', pos:'RB',   label:'RB',   eligible:['RB']},
  {id:'wr1', pos:'WR',   label:'WR',   eligible:['WR']},
  {id:'wr2', pos:'WR',   label:'WR',   eligible:['WR']},
  {id:'wr3', pos:'WR',   label:'WR',   eligible:['WR']},
  {id:'te1', pos:'TE',   label:'TE',   eligible:['TE']},
  {id:'fx1', pos:'FLEX', label:'FLEX', eligible:['WR','RB','TE']},
  {id:'df1', pos:'DEF',  label:'DEF',  eligible:['DEF']}
];
var ROSTER_SIZE = SLOT_DEFS.length;

function money(n){ return '$' + (n||0).toLocaleString('en-US'); }
function getSpent(){ var t=0; SLOT_DEFS.forEach(function(s){ if(lineup[s.id]) t += (parseInt(lineup[s.id].salary,10)||0); }); return t; }
function filledCount(){ var n=0; SLOT_DEFS.forEach(function(s){ if(lineup[s.id]) n++; }); return n; }

// Pure display state for the budget bar — tested in tests/playoff-draft-ui.test.js.
// Given the league settings, the costs committed in earlier rounds, the current
// round, this round's in-progress roster cost and how many slots are filled,
// returns everything the bar and submit button need.
function draftBudgetView(settings, priorCosts, round, rosterCost, filled, rosterSize){
  var st = FRPlayoffGame.budgetState(settings, priorCosts, round);
  var available = st ? st.available : 0;
  var remaining = available - rosterCost;
  var over = remaining < 0;
  return {
    round: round,
    roundLabel: st ? st.roundLabel : null,
    isSuperBowl: st ? st.isSuperBowl : false,
    available: available,
    spent: rosterCost,
    remaining: remaining,
    over: over,
    overBy: over ? -remaining : 0,
    reservedFloor: st ? st.reservedFloor : 0,
    carryover: st ? st.carryover : null,
    pctUsed: available > 0 ? Math.min(100, Math.round(rosterCost / available * 100)) : (rosterCost > 0 ? 100 : 0),
    complete: filled >= rosterSize,
    canSubmit: filled >= rosterSize && !over
  };
}

// ── Boot ──
window.addEventListener('DOMContentLoaded', function(){
  FRAuth.applyTheme();
  FRAuth.requireAuth();
  currentUser = FRAuth.getUser();
  if(!currentUser) return;

  var params = new URLSearchParams(location.search);
  var r = parseInt(params.get('round'), 10);

  FR.fb.get(FR.paths.settings()).then(function(s){
    settings = s || {};
    if(!FRPlayoffGame.isPlayoffGame(settings)){
      document.getElementById('round-chips').style.display = 'none';
      document.getElementById('main').innerHTML =
        '<div class="notice">This draft is for a <b>Playoff Game</b> league. The league you’re in plays a different format — use its regular draft page.</div>';
      document.getElementById('submit-status').textContent = '';
      return;
    }
    // Which round: explicit ?round, else the league's current round, else 1.
    var cur = parseInt((settings.playoffGame && settings.playoffGame.currentRound), 10);
    currentRound = clampRound(r || cur || 1);
    renderRoundChips();
    loadRound();
  }).catch(function(){
    document.getElementById('submit-status').textContent = 'Could not load this league.';
  });
});

function clampRound(n){ return Math.max(1, Math.min(FRPlayoffGame.ROUNDS.length, n || 1)); }

function renderRoundChips(){
  var openThrough = parseInt((settings.playoffGame && settings.playoffGame.currentRound), 10) || 1;
  document.getElementById('round-chips').innerHTML = FRPlayoffGame.rounds().map(function(rd){
    var locked = rd.index > openThrough;
    return '<div class="round-chip ' + (rd.index===currentRound?'on':'') + (locked?' locked':'') + '" '
      + 'onclick="goRound(' + rd.index + ')">' + rd.label + '</div>';
  }).join('');
}
function goRound(n){ location.href = '/playoff-draft.html?round=' + clampRound(n); }

// Load this round's priced pool, the manager's earlier-round costs, and any
// roster they already saved for this round.
function loadRound(){
  lineup = {}; priorCosts = {};
  var jobs = [];
  // earlier-round costs → the running budget
  for(var i=1;i<currentRound;i++){ (function(ri){
    jobs.push(FR.fb.get(FR.paths.myLineup(ri, currentUser.uid)).then(function(l){
      priorCosts[ri] = (l && l.totalSal) || 0;
    }).catch(function(){ priorCosts[ri] = 0; }));
  })(i); }
  // this round's saved roster (resume an in-progress draft)
  jobs.push(FR.fb.get(FR.paths.myLineup(currentRound, currentUser.uid)).then(function(l){
    if(l && l.slots) lineup = l.slots;
  }).catch(function(){}));
  // this round's priced pool
  jobs.push(fetch(FR.paths.url(FR.paths.weekSalaries(currentRound))).then(function(r){ return r.json(); }).then(function(data){
    if(data && data.players) allPlayers = Object.values(data.players).filter(function(p){ return p && p.name && p.pos && p.salary; });
  }).catch(function(){ allPlayers = []; }));

  Promise.all(jobs).then(render);
}

function render(){
  var main = document.getElementById('main');
  if(!allPlayers.length){
    var rd = FRPlayoffGame.round(currentRound);
    main.innerHTML = '<div class="empty"><div class="em">🏈</div>'
      + '<div class="t">' + (rd?rd.label:'This round') + ' hasn’t opened yet</div>'
      + '<div>Prices are set when the round’s matchups are locked in. Check back once the round is live.</div></div>';
    document.getElementById('submit-status').textContent = '';
    document.getElementById('submit-btn').disabled = true;
    return;
  }
  main.innerHTML = budgetBarHTML() + slotsHTML() + filtersHTML() + playerListHTML();
  refreshSubmit();
}

function budgetBarHTML(){
  var v = draftBudgetView(settings, priorCosts, currentRound, getSpent(), filledCount(), ROSTER_SIZE);
  var note = v.isSuperBowl
    ? 'This is the <b>Super Bowl</b> — your $' + v.available.toLocaleString('en-US') + ' is the Super Bowl floor plus everything you carried over.'
    : 'A $' + (v.reservedFloor).toLocaleString('en-US') + ' Super Bowl floor is held back. Anything you don’t spend now <b>carries over</b> to later rounds.';
  return '<div class="budget">'
    + '<div class="budget-head"><div class="budget-title">Your Budget</div><div class="budget-round">' + (v.roundLabel||'') + '</div></div>'
    + '<div class="bar"><div class="bar-fill ' + (v.over?'over':'') + '" style="width:' + v.pctUsed + '%;"></div></div>'
    + '<div class="budget-nums">'
    +   '<div><span class="lab">Spent </span><span class="val">' + money(v.spent) + '</span></div>'
    +   '<div><span class="lab">' + (v.over?'Over by ':'Left ') + '</span><span class="val ' + (v.over?'over':'') + '">' + money(v.over?v.overBy:v.remaining) + '</span></div>'
    + '</div>'
    + '<div class="budget-note">' + note + '</div>'
    + '</div>';
}

function slotsHTML(){
  return '<div class="slots">' + SLOT_DEFS.map(function(s){
    var p = lineup[s.id];
    if(p) return '<div class="slot"><span class="pos">' + s.label + '</span>'
      + '<span class="nm">' + esc(p.name) + '</span><span class="sal">' + money(parseInt(p.salary,10)||0) + '</span>'
      + '<span class="x" onclick="removeSlot(\'' + s.id + '\')">×</span></div>';
    return '<div class="slot empty"><span class="pos">' + s.label + '</span><span class="nm">Empty</span></div>';
  }).join('') + '</div>';
}

function filtersHTML(){
  var cats = ['ALL','QB','RB','WR','TE','DEF'];
  return '<div class="filters">' + cats.map(function(c){
    return '<div class="filter ' + (posFilter===c?'on':'') + '" onclick="setFilter(\'' + c + '\')">' + c + '</div>';
  }).join('') + '</div>';
}
function setFilter(c){ posFilter = c; document.getElementById('main').innerHTML = budgetBarHTML()+slotsHTML()+filtersHTML()+playerListHTML(); refreshSubmit(); }

function playerListHTML(){
  var pickedIds = {}; SLOT_DEFS.forEach(function(s){ if(lineup[s.id]) pickedIds[lineup[s.id].id] = true; });
  var v = draftBudgetView(settings, priorCosts, currentRound, getSpent(), filledCount(), ROSTER_SIZE);
  var list = allPlayers
    .filter(function(p){ return posFilter==='ALL' || p.pos===posFilter; })
    .sort(function(a,b){ return (parseInt(b.salary,10)||0) - (parseInt(a.salary,10)||0); })
    .slice(0, 120);
  return '<div class="plist">' + list.map(function(p){
    var sal = parseInt(p.salary,10)||0;
    var picked = !!pickedIds[p.id];
    var unaff = !picked && sal > v.remaining;          // can't fit in what's left this round
    var cls = 'prow' + (picked?' picked':'') + (unaff?' unaff':'');
    return '<div class="' + cls + '" onclick="addPlayer(\'' + String(p.id).replace(/'/g,"") + '\')">'
      + '<span class="pos">' + p.pos + '</span>'
      + '<div class="nm"><div class="n">' + esc(p.name) + '</div><div class="m">' + esc(p.team||'') + (p.proj?' · ' + p.proj + ' proj':'') + '</div></div>'
      + '<div class="sal">' + money(sal) + '</div></div>';
  }).join('') + '</div>';
}

function addPlayer(id){
  var p = allPlayers.filter(function(x){ return String(x.id)===String(id); })[0];
  if(!p) return;
  // Open eligible slot (FLEX takes WR/RB/TE overflow)
  var slot = SLOT_DEFS.filter(function(s){ return !lineup[s.id] && s.eligible.indexOf(p.pos) > -1; })[0];
  if(!slot){ flash('No open ' + p.pos + ' slot'); return; }
  lineup[slot.id] = p;
  rerender();
}
function removeSlot(id){ delete lineup[id]; rerender(); }
function rerender(){ document.getElementById('main').innerHTML = budgetBarHTML()+slotsHTML()+filtersHTML()+playerListHTML(); refreshSubmit(); }

function refreshSubmit(){
  var v = draftBudgetView(settings, priorCosts, currentRound, getSpent(), filledCount(), ROSTER_SIZE);
  var st = document.getElementById('submit-status');
  var btn = document.getElementById('submit-btn');
  if(v.over) st.textContent = 'Over budget by ' + money(v.overBy);
  else if(!v.complete) st.textContent = (ROSTER_SIZE - filledCount()) + ' slots left · ' + money(v.remaining) + ' to spend';
  else st.textContent = 'Roster set · ' + money(v.remaining) + ' left';
  btn.disabled = !v.canSubmit;
}

function submitRound(){
  var v = draftBudgetView(settings, priorCosts, currentRound, getSpent(), filledCount(), ROSTER_SIZE);
  if(!v.canSubmit) return;
  var btn = document.getElementById('submit-btn'); btn.disabled = true; btn.textContent = 'Saving…';
  var slots = {}; SLOT_DEFS.forEach(function(s){ if(lineup[s.id]) slots[s.id] = lineup[s.id]; });
  FR.fb.get(FR.paths.member(currentUser.uid)).then(function(m){
    var teamName = (m && m.teamName) || currentUser.displayName || currentUser.email;
    return FR.fb.put(FR.paths.myLineup(currentRound, currentUser.uid), {
      uid: currentUser.uid, team: teamName, week: currentRound, round: currentRound,
      slots: slots, totalSal: getSpent(), submitted: Date.now()
    });
  }).then(function(){
    btn.textContent = 'Submitted ✓';
    document.getElementById('submit-status').textContent = 'Your ' + (v.roundLabel||'round') + ' roster is in.';
  }).catch(function(){
    btn.disabled = false; btn.textContent = 'Submit';
    document.getElementById('submit-status').textContent = '⚠️ Not saved — please try again.';
  });
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function flash(msg){ var st=document.getElementById('submit-status'); var old=st.textContent; st.textContent=msg; setTimeout(function(){ refreshSubmit(); },1400); }
</script>
</body>
</html>
