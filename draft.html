<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Fantasy Refresh — Draft</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --hdr:#050808;--bg:#0A0F0F;--bg2:#0D1515;--bg3:#101C1C;--bg4:#142020;
  --or:#00E5D4;--pk:#FF5FA0;--pu:#9B6DFF;
  --ink:#F0FAFA;--ink2:#6ABFBF;--ink3:#3A8888;
  --bdr:#0D3535;--bdr2:#104040;
  --fd:'Barlow Condensed',sans-serif;--fb:'Barlow',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);display:flex;flex-direction:column;}

/* ── HEADER ── */
.hdr{background:var(--hdr);border-top:3px solid var(--or);border-bottom:1px solid var(--bdr);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0;}
.hdr-logo{font-family:var(--fd);font-size:20px;font-weight:900;color:var(--or);text-decoration:none;letter-spacing:.5px;}
.hdr-logo span{color:var(--pk);}
.hdr-week{font-family:var(--fd);font-size:13px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.8px;}
.hdr-back{font-family:var(--fd);font-size:12px;font-weight:700;color:var(--ink3);text-decoration:none;text-transform:uppercase;letter-spacing:.5px;padding:5px 10px;border:1px solid var(--bdr);border-radius:6px;}
.hdr-back:hover{color:var(--or);border-color:var(--or);}

/* ── CAP BAR ── */
.cap-bar{background:var(--bg2);border-bottom:1px solid var(--bdr);padding:10px 20px;flex-shrink:0;}
.cap-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.cap-label{font-family:var(--fd);font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:1px;}
.cap-amount{font-family:var(--fd);font-size:26px;font-weight:900;color:var(--or);line-height:1;}
.cap-amount.tight{color:#FF9A3A;}
.cap-amount.over{color:var(--pk);}
.cap-slots-info{font-family:var(--fd);font-size:13px;font-weight:700;color:var(--ink2);}
.cap-track{height:3px;background:var(--bdr);border-radius:2px;overflow:hidden;}
.cap-track-fill{height:3px;background:linear-gradient(90deg,var(--or),var(--pk));border-radius:2px;transition:width .3s;}
.cap-track-fill.over{background:var(--pk);}

/* ── GAMES BAR ── */
.games-bar{background:var(--hdr);border-bottom:2px solid var(--pk);padding:8px 16px;overflow-x:auto;display:flex;gap:8px;flex-shrink:0;scrollbar-width:none;}
.games-bar::-webkit-scrollbar{display:none;}
.game-chip{flex-shrink:0;padding:5px 12px;background:var(--bg3);border:1px solid var(--bdr2);border-radius:20px;font-family:var(--fd);font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer;transition:all .15s;white-space:nowrap;}
.game-chip:hover{border-color:var(--pk);color:var(--pk);}
.game-chip.active{background:rgba(255,95,160,.15);border-color:var(--pk);color:var(--pk);}
.game-chip.all{border-color:var(--bdr2);color:var(--ink3);}
.game-chip.all.active{background:rgba(0,229,212,.1);border-color:var(--or);color:var(--or);}
.games-loading{font-family:var(--fd);font-size:12px;color:var(--ink3);padding:6px 0;}

/* ── MAIN LAYOUT ── */
.main{display:flex;flex:1;overflow:hidden;}

/* ── ROSTER PANEL ── */
.roster-panel{width:380px;flex-shrink:0;border-right:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden;}
.roster-title{padding:12px 20px;font-family:var(--fd);font-size:13px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--bdr);background:var(--bg2);flex-shrink:0;}
.roster-slots{flex:1;overflow-y:auto;padding:10px 14px;}
.roster-slot{background:var(--bg3);border-radius:10px;margin-bottom:8px;border:1px solid var(--bdr);cursor:pointer;transition:all .15s;overflow:hidden;}
.roster-slot:hover{border-color:var(--bdr2);}
.roster-slot.active{border-color:var(--or);box-shadow:0 0 0 1px var(--or);}
.roster-slot.filled{border-color:var(--bdr2);}
.roster-slot.filled:hover{border-color:var(--or);}
.slot-hdr{display:flex;align-items:center;gap:10px;padding:9px 12px;}
.slot-pos-tag{font-family:var(--fd);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;min-width:38px;}
.slot-empty-lbl{font-family:var(--fd);font-size:14px;color:var(--ink3);flex:1;}
.slot-tap-hint{font-family:var(--fd);font-size:10px;color:var(--ink3);opacity:.6;text-transform:uppercase;letter-spacing:.5px;}
.slot-player-body{padding:0 12px 10px;}
.slot-player-name{font-family:var(--fd);font-size:17px;font-weight:800;color:var(--ink);}
.slot-player-meta{display:flex;align-items:center;gap:8px;margin-top:2px;}
.slot-player-team{font-family:var(--fd);font-size:11px;color:var(--ink3);text-transform:uppercase;}
.slot-player-sal{font-family:var(--fd);font-size:13px;font-weight:700;color:var(--or);}
.slot-remove-btn{background:none;border:none;color:var(--ink3);font-size:14px;cursor:pointer;padding:2px 6px;border-radius:4px;margin-left:auto;}
.slot-remove-btn:hover{color:var(--pk);}

/* ── SUBMIT ── */
.submit-area{padding:12px 14px;border-top:1px solid var(--bdr);background:var(--bg2);flex-shrink:0;}
.submit-btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--or),var(--pk));border:none;border-radius:10px;color:#050808;font-family:var(--fd);font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;cursor:pointer;transition:opacity .15s;}
.submit-btn:hover{opacity:.9;}
.submit-btn:disabled{opacity:.35;cursor:not-allowed;background:var(--bg4);color:var(--ink3);border:1px solid var(--bdr);}
.submit-msg{font-family:var(--fd);font-size:11px;text-align:center;margin-top:6px;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;min-height:14px;}
.submit-msg.ok{color:var(--or);}
.submit-msg.err{color:var(--pk);}

/* ── PLAYER PICKER PANEL ── */
.picker-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
.picker-header{padding:12px 20px;border-bottom:1px solid var(--bdr);background:var(--bg2);flex-shrink:0;display:flex;align-items:center;gap:12px;}
.picker-slot-label{font-family:var(--fd);font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;}
.picker-game-filter{font-family:var(--fd);font-size:12px;color:var(--pk);background:rgba(255,95,160,.1);border:1px solid rgba(255,95,160,.3);padding:3px 10px;border-radius:12px;}
.picker-clear-btn{margin-left:auto;background:none;border:none;font-family:var(--fd);font-size:12px;color:var(--ink3);cursor:pointer;text-transform:uppercase;letter-spacing:.5px;padding:4px 8px;border-radius:6px;border:1px solid var(--bdr);}
.picker-clear-btn:hover{color:var(--or);border-color:var(--or);}
.picker-search-bar{padding:10px 16px;border-bottom:1px solid var(--bdr);background:var(--bg2);flex-shrink:0;position:relative;}
.picker-search{width:100%;padding:8px 12px 8px 36px;background:var(--bg3);border:1px solid var(--bdr2);border-radius:8px;color:var(--or);font-family:var(--fb);font-size:14px;outline:none;}
.picker-search:focus{border-color:var(--or);}
.picker-search::placeholder{color:var(--ink3);}
.picker-search-ico{position:absolute;left:28px;top:50%;transform:translateY(-50%);stroke:var(--ink3);fill:none;stroke-width:2;stroke-linecap:round;width:15px;height:15px;}
.picker-list{flex:1;overflow-y:auto;}
.picker-empty{padding:60px 20px;text-align:center;color:var(--ink3);}
.picker-empty-icon{font-size:36px;margin-bottom:10px;opacity:.5;}
.picker-empty-title{font-family:var(--fd);font-size:16px;font-weight:700;color:var(--ink2);text-transform:uppercase;margin-bottom:4px;}
.picker-empty-sub{font-size:13px;line-height:1.6;}

/* ── PLAYER ROW ── */
.player-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .1s;}
.player-row:hover{background:var(--bg3);}
.player-row.selected{background:rgba(0,229,212,.06);border-left:3px solid var(--or);}
.player-row.disabled{opacity:.4;cursor:not-allowed;pointer-events:none;}
.p-pos{font-family:var(--fd);font-size:11px;font-weight:800;width:30px;text-align:center;padding:3px 0;border-radius:5px;flex-shrink:0;}
.p-info{flex:1;min-width:0;}
.p-name{font-family:var(--fd);font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.p-meta{font-family:var(--fd);font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.3px;}
.p-inj{font-family:var(--fd);font-size:10px;font-weight:800;padding:1px 5px;border-radius:4px;text-transform:uppercase;margin-left:4px;}
.inj-Q{background:rgba(255,154,58,.2);color:#FF9A3A;}
.inj-D,.inj-O{background:rgba(255,95,160,.2);color:var(--pk);}
.p-proj{font-family:var(--fd);font-size:11px;color:var(--ink3);text-align:right;min-width:36px;}
.p-sal{font-family:var(--fd);font-size:15px;font-weight:800;color:var(--ink2);text-align:right;min-width:62px;}

/* ── NO SLOT SELECTED ── */
.pick-prompt{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:40px;text-align:center;}
.pick-prompt-icon{font-size:48px;opacity:.3;}
.pick-prompt-title{font-family:var(--fd);font-size:20px;font-weight:800;color:var(--ink2);text-transform:uppercase;}
.pick-prompt-sub{font-size:14px;color:var(--ink3);line-height:1.6;}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--or);border-radius:10px;padding:10px 20px;font-family:var(--fd);font-size:14px;font-weight:700;color:var(--or);z-index:9999;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;}
.toast.show{opacity:1;}
.toast.err{border-color:var(--pk);color:var(--pk);}

/* ── MOBILE ── */
@media(max-width:860px){
  #picker-games-bar{display:flex !important;}
  html,body{overflow:auto;}
  .main{flex-direction:column;overflow:visible;}
  .roster-panel{width:100%;border-right:none;border-bottom:1px solid var(--bdr);overflow:visible;}
  .roster-slots{overflow:visible;padding:10px 12px;}
  .picker-panel{display:none;position:fixed;inset:0;z-index:200;background:var(--bg);}
  .picker-panel.open{display:flex;flex-direction:column;}
  .picker-panel .picker-games-mobile{display:block;}
  .picker-list{flex:1;overflow-y:auto;}
  body{overflow-y:auto;}
}

/* ── NEWS MODAL ── */
.news-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:none;align-items:flex-end;justify-content:center;pointer-events:none;}
.news-overlay.open{display:flex;pointer-events:all;}
.news-sheet{background:var(--bg2);border-radius:16px 16px 0 0;border-top:2px solid var(--or);width:100%;max-width:600px;max-height:80vh;display:flex;flex-direction:column;}
.news-sheet-hdr{padding:14px 20px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.news-sheet-name{font-family:var(--fd);font-size:18px;font-weight:800;color:var(--or);text-transform:uppercase;}
.news-sheet-meta{font-family:var(--fd);font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.news-sheet-close{background:none;border:1px solid var(--bdr2);color:var(--ink3);font-size:14px;width:28px;height:28px;border-radius:6px;cursor:pointer;}
.news-body{overflow-y:auto;flex:1;}
.news-item{padding:14px 20px;border-bottom:1px solid var(--bdr);}
.news-item:last-child{border-bottom:none;}
.news-item-title{font-family:var(--fd);font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px;line-height:1.4;}
.news-item-body{font-size:13px;color:var(--ink2);line-height:1.6;}
.news-item-meta{font-family:var(--fd);font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;margin-top:6px;}
.news-loading{padding:40px 20px;text-align:center;color:var(--ink3);font-family:var(--fd);font-size:14px;}
.draft-btn{flex-shrink:0;background:rgba(0,229,212,.12);border:1px solid rgba(0,229,212,.3);color:var(--or);font-family:var(--fd);font-size:12px;font-weight:800;padding:5px 12px;border-radius:8px;cursor:pointer;text-transform:uppercase;letter-spacing:.3px;transition:all .15s;white-space:nowrap;}
.draft-btn:hover{background:var(--or);color:#050808;border-color:var(--or);}
.draft-btn.drafted{background:rgba(255,95,160,.1);border-color:rgba(255,95,160,.3);color:var(--pk);}
.draft-btn.drafted:hover{background:var(--pk);color:#fff;border-color:var(--pk);}


[data-theme="light"]{
  --hdr:#F0F8F8;--bg:#F5FAFA;--bg2:#EAFAFF;--bg3:#E0F4F4;--bg4:#D0EEEE;
  --or:#007A70;--pk:#CC3070;--pu:#6030CC;
  --ink:#0A1818;--ink2:#1A6060;--ink3:#3A8888;
  --bdr:#B0DEDE;--bdr2:#80CCCC;
}
[data-theme="light"] .hdr{border-bottom:1px solid var(--bdr);}
[data-theme="light"] .player-row:hover{background:var(--bg3);}
[data-theme="light"] .draft-btn{background:rgba(0,122,112,.12);border-color:rgba(0,122,112,.3);color:var(--or);}
[data-theme="light"] .draft-btn:hover{background:var(--or);color:#fff;}
[data-theme="light"] .draft-btn.drafted{background:rgba(204,48,112,.1);border-color:rgba(204,48,112,.3);color:var(--pk);}
[data-theme="light"] .picker-search{background:var(--bg3);border-color:var(--bdr2);color:var(--or);}
[data-theme="light"] .news-sheet{background:var(--bg2);}
[data-theme="light"] .news-overlay{background:rgba(0,0,0,.4);}

</style>
</head>
<body>

<div class="hdr">
  <a href="index.html" class="hdr-logo">Fantasy<span>Refresh</span></a>
  <div class="hdr-week" id="hdr-week">Loading…</div>
  <button onclick="toggleTheme()" id="theme-btn" style="background:none;border:1px solid var(--bdr);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:14px;" title="Toggle theme">🌙</button>
  <a href="#" class="hdr-back" onclick="goBack()">← Back</a>
</div>

<div class="cap-bar">
  <div class="cap-row">
    <div><div class="cap-label">Cap Remaining</div><div class="cap-amount" id="cap-amt">$60,000</div></div>
    <div style="text-align:right;"><div class="cap-label">Roster</div><div class="cap-slots-info"><span id="slots-n">0</span>/9 filled</div></div>
  </div>
  <div class="cap-track"><div class="cap-track-fill" id="cap-fill" style="width:0%"></div></div>
</div>

<div class="games-bar" id="games-bar">
  <div class="games-loading">Loading schedule…</div>
</div>

<div class="main">

  <!-- ROSTER -->
  <div class="roster-panel">
    <div class="roster-title">Your Roster — <span id="week-label">Week —</span></div>
    <div class="roster-slots" id="roster-slots"></div>
    <div class="submit-area">
      <button class="submit-btn" id="submit-btn" onclick="submitLineup()" disabled>Build Your Lineup</button>
      <div class="submit-msg" id="submit-msg">Tap a slot to pick a player</div>
    </div>
  </div>

  <!-- PICKER -->
  <div class="picker-panel" id="picker-panel">
    <div class="picker-header">
      <div class="picker-slot-label" id="picker-slot-label" style="color:var(--or)">Select Slot</div>
      <div class="picker-game-filter" id="picker-game-filter" style="display:none;"></div>
      <button class="picker-clear-btn" onclick="closePicker()">✕ Close</button>
    </div>
    <!-- Games bar inside picker — mobile only -->
    <div class="games-bar" id="picker-games-bar" style="border-bottom:1px solid var(--bdr);border-top:1px solid var(--bdr);display:none;"></div>
    <div class="picker-search-bar">
      <svg class="picker-search-ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" class="picker-search" id="picker-search" placeholder="Search players…" oninput="renderPicker()">
    </div>
    <div class="picker-list" id="picker-list">
      <div class="pick-prompt">
        <div class="pick-prompt-icon">👆</div>
        <div class="pick-prompt-title">Tap a slot to pick</div>
        <div class="pick-prompt-sub">Select a position slot on your roster to see available players.</div>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG ────────────────────────────────────────────────────
var FB_DB_URL = 'https://fantasy-refresh-default-rtdb.firebaseio.com';
var FR_SEASON = '2026';
var PS_MODE   = false;
var PS_WEEK   = 1;
var CAP = 60000;
var SLOT_DEFS = [
  {id:'qb1', pos:'QB',   label:'QB',   eligible:['QB']},
  {id:'rb1', pos:'RB',   label:'RB',   eligible:['RB']},
  {id:'rb2', pos:'RB',   label:'RB',   eligible:['RB']},
  {id:'wr1', pos:'WR',   label:'WR',   eligible:['WR']},
  {id:'wr2', pos:'WR',   label:'WR',   eligible:['WR']},
  {id:'wr3', pos:'WR',   label:'WR',   eligible:['WR']},
  {id:'te1', pos:'TE',   label:'TE',   eligible:['TE']},
  {id:'fx1', pos:'FLEX', label:'FLEX', eligible:['WR','RB','TE']},
  {id:'df1', pos:'DEF',  label:'DEF',  eligible:['DEF']}
];
var POS_COLORS = {QB:'var(--or)',RB:'var(--pk)',WR:'var(--pu)',TE:'#FF9A3A',DEF:'#69BE28',FLEX:'var(--ink2)'};

// ── STATE ─────────────────────────────────────────────────────
var allPlayers   = [];
var lineup       = {};   // {slotId: player}
var activeSlot   = null; // currently picking for this slotId
var activeGame   = null; // game filter: {home, away, teams:[]}
var currentWeek  = 1;
var schedule     = [];   // [{home,away,time,teams:[]}]
var currentUser  = null;

// ── BOOT ──────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function(){
  try{
    var u = localStorage.getItem('fr_user_'+FR_SEASON);
    if(u) currentUser = JSON.parse(u);
  }catch(e){}
  SLOT_DEFS.forEach(function(s){ lineup[s.id] = null; });
  renderRoster();
  loadWeekAndData();
});

// ── LOAD ──────────────────────────────────────────────────────
function loadWeekAndData(){
  // Preseason mode — week and season already set from URL params
  if(PS_MODE){
    var label = 'PS Week '+currentWeek+' Draft';
    document.getElementById('hdr-week').textContent = label;
    document.getElementById('week-label').textContent = 'PS Week '+currentWeek;
    loadSalaries();
    loadSchedule();
    loadSubmitted();
    return;
  }
  fetch(FB_DB_URL + '/season'+FR_SEASON+'.json?shallow=true')
    .then(function(r){ return r.json(); })
    .then(function(keys){
      if(keys && typeof keys === 'object'){
        var weeks = Object.keys(keys).filter(function(k){ return !isNaN(Number(k)); }).map(Number);
        currentWeek = weeks.length ? Math.min(Math.max.apply(null,weeks)+1, 18) : 1;
      }
      document.getElementById('hdr-week').textContent = 'Week '+currentWeek+' Draft';
      document.getElementById('week-label').textContent = 'Week '+currentWeek;
      loadSalaries();
      loadSchedule();
      loadSubmitted();
    })
    .catch(function(){ currentWeek=1; loadSalaries(); loadSchedule(); });
}

function loadSalaries(){
  fetch(FB_DB_URL + '/salaries'+FR_SEASON+'/week'+currentWeek+'.json')
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(!data || !data.players){
        document.getElementById('picker-list').innerHTML =
          '<div class="picker-empty"><div class="picker-empty-icon">⏳</div>'
          +'<div class="picker-empty-title">Salaries Not Set</div>'
          +'<div class="picker-empty-sub">Commissioner hasn\'t generated Week '+currentWeek+' salaries yet.</div></div>';
        return;
      }
      allPlayers = Object.values(data.players).filter(function(p){ return p && p.name && p.pos; });
      // If schedule hasn't loaded yet, build games from player teams
      if(!schedule.length) buildGamesBarFromPlayers();
    })
    .catch(function(){});
}

function loadSchedule(){
  // Use ESPN scoreboard API via Cloudflare worker (no CORS issues)
  // Falls back to building from player teams if unavailable
  var seasonType = PS_MODE ? 'Preseason' : 'Regular';
  var espnUrl = 'https://fantasy-refresh-news.mtriedel.workers.dev/schedule?week='+currentWeek+'&season=2026&seasonType='+seasonType;
  fetch(espnUrl)
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(!data || !data.games || !data.games.length) throw new Error('No games');
      schedule = data.games;
      buildGamesBar(schedule);
    })
    .catch(function(){
      setTimeout(buildGamesBarFromPlayers, 500);
    });
}

function buildGamesBar(games){
  var bar = document.getElementById('games-bar');
  var pickerBar = document.getElementById('picker-games-bar');
  if(!games || !games.length){
    // No games from Sleeper — build from player teams instead, don't recurse
    buildGamesBarFromPlayers();
    return;
  }
  var html = '<button class="game-chip all active" data-game="all" onclick="setGameFilter(null,this)">All Games</button>';
  games.forEach(function(g, i){
    var label = (g.away||'?') + ' @ ' + (g.home||'?');
    var sub = '';
    if(g.time){
      var d = new Date(g.time);
      var day = d.getDay(); // 0=Sun,1=Mon,2=Tue,3=Wed,4=Thu,5=Fri,6=Sat
      var hr  = d.getHours();
      var timeStr = d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})+' ET';
      var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      var dayLabel;
      if(day===1&&hr>=18){      dayLabel = 'MNF';
      } else if(day===0&&hr>=19){ dayLabel = 'SNF';
      } else if(day===4&&hr>=18){ dayLabel = 'TNF';
      } else {                    dayLabel = days[day]; }
      var intlBadge = g.international
        ? '<div style="font-size:9px;font-weight:800;color:#FF9A3A;margin-top:1px;">INT&#39;L</div>' : '';
      sub = '<div style="font-size:9px;margin-top:2px;display:flex;gap:4px;justify-content:center;">'
          + '<span style="color:var(--pk);font-weight:800;">'+dayLabel+'</span>'
          + '<span style="color:var(--ink3);">'+timeStr+'</span>'
          + '</div>'
          + intlBadge;
    }
    html += '<button class="game-chip" data-game="'+i+'" onclick="setGameFilter('+i+',this)" style="text-align:center;padding:5px 12px;">'+label+sub+'</button>';
  });
  bar.innerHTML = html;
  if(pickerBar) pickerBar.innerHTML = html;
}

function buildGamesBarFromPlayers(){
  // Build rough team pairings from player pool — no recursion back to buildGamesBar
  var bar = document.getElementById('games-bar');
  var pickerBar = document.getElementById('picker-games-bar');
  var teams = {};
  allPlayers.forEach(function(p){ if(p.team) teams[p.team] = 1; });
  var teamList = Object.keys(teams).sort();
  var games = [];
  for(var i = 0; i < teamList.length; i += 2){
    if(teamList[i+1]){
      games.push({home:teamList[i+1], away:teamList[i], teams:[teamList[i], teamList[i+1]]});
    } else {
      games.push({home:teamList[i], away:'', teams:[teamList[i]]});
    }
  }
  schedule = games;
  // Build HTML directly — no call back to buildGamesBar
  var html = '<button class="game-chip all active" data-game="all" onclick="setGameFilter(null,this)">All Games</button>';
  games.forEach(function(g, i){
    var label = g.away ? g.away + ' @ ' + g.home : g.home;
    html += '<button class="game-chip" data-game="'+i+'" onclick="setGameFilter('+i+',this)">'+label+'</button>';
  });
  if(bar) bar.innerHTML = html;
  if(pickerBar) pickerBar.innerHTML = html;
}

function setGameFilter(gameIdx, btn){
  // Sync active state across both game bars
  var key = gameIdx === null ? 'all' : String(gameIdx);
  document.querySelectorAll('.game-chip').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-game') === key);
  });
  activeGame = gameIdx === null ? null : (schedule[gameIdx] || null);
  var badge = document.getElementById('picker-game-filter');
  if(activeGame){
    badge.textContent = activeGame.away + ' @ ' + activeGame.home;
    badge.style.display = 'inline-flex';
  } else {
    badge.style.display = 'none';
  }

  if(activeSlot){
    // Slot selected — filter player list to this game
    renderPicker();
  } else if(activeGame){
    // No slot selected — show game preview with both rosters
    document.getElementById('picker-panel').classList.add('open');
    document.getElementById('picker-slot-label').textContent = activeGame.away + ' @ ' + activeGame.home;
    document.getElementById('picker-slot-label').style.color = 'var(--pk)';
    document.getElementById('picker-search').value = '';
    renderGamePreview(activeGame);
  } else {
    // Cleared back to All Games — close preview if no slot active
    document.getElementById('picker-panel').classList.remove('open');
    renderPicker();
  }
}

function renderGamePreview(game){
  var POS_ORDER = {QB:0, RB:1, WR:2, TE:3, DEF:4};

  function sortByPos(a, b){
    var pa = POS_ORDER[a.pos] !== undefined ? POS_ORDER[a.pos] : 9;
    var pb = POS_ORDER[b.pos] !== undefined ? POS_ORDER[b.pos] : 9;
    if(pa !== pb) return pa - pb;
    return b.salary - a.salary; // within same position, sort by salary
  }

  // Hide players already drafted into other slots
  var draftedInPreview = {};
  Object.keys(lineup).forEach(function(sid){ if(lineup[sid]) draftedInPreview[lineup[sid].id] = true; });

  var awayPlayers = allPlayers.filter(function(p){ return p.team === game.away && !draftedInPreview[p.id]; }).sort(sortByPos);
  var homePlayers = allPlayers.filter(function(p){ return p.team === game.home && !draftedInPreview[p.id]; }).sort(sortByPos);

  var inLineup = {};
  Object.values(lineup).forEach(function(p){ if(p) inLineup[p.id] = true; });

  function playerRow(p){
    var isIn  = !!inLineup[p.id];
    var isOut = p.status === 'O' || p.status === 'IR';
    var posColor = POS_COLORS[p.pos] || 'var(--ink2)';
    var injBadge = (p.status && p.status !== 'Active')
      ? '<span class="p-inj inj-'+p.status+'">'+p.status+'</span>' : '';
    var isIn2 = !!inLineup[p.id];
    var cls = 'player-row'+(isIn2?' selected':'')+(isOut?' disabled':'');
    var draftLbl2 = isIn2 ? '✓' : '+';
    var draftCls2 = 'draft-btn' + (isIn2 ? ' drafted' : '');
    return '<div class="'+cls+'">'
      + '<div class="p-pos" style="background:'+posColor+'18;color:'+posColor+'">'+p.pos+'</div>'
      + '<div class="p-info" onclick="openNews(\''+p.id+'\',event)" style="cursor:pointer;">'
      +   '<div class="p-name">'+p.name+injBadge+'</div>'
      +   '<div class="p-meta">'+(p.proj ? p.proj+' proj' : '—')+'</div>'
      + '</div>'
      + '<div class="p-sal" style="font-size:12px;">$'+(p.salary||0).toLocaleString()+'</div>'
      + '<button class="'+draftCls2+'" onclick="pickFromPreview(\''+p.id+'\')">' + draftLbl2 + '</button>'
      + '</div>';
  }

  var html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0;height:100%;">'

    // Away team
    + '<div style="border-right:1px solid var(--bdr);">'
    + '<div style="padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--bdr);font-family:var(--fd);font-size:13px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;text-align:center;">'+game.away+'</div>'
    + awayPlayers.map(playerRow).join('')
    + '</div>'

    // Home team
    + '<div>'
    + '<div style="padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--bdr);font-family:var(--fd);font-size:13px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;text-align:center;">'+game.home+'</div>'
    + homePlayers.map(playerRow).join('')
    + '</div>'

    + '</div>';

  document.getElementById('picker-list').innerHTML = html;
}

function pickFromPreview(playerId){
  var p = allPlayers.find(function(x){ return x.id === playerId; });
  if(!p) return;
  if(p.status === 'O' || p.status === 'IR'){ showToast(p.name+' is out', true); return; }

  // Find the best available slot for this player's position
  var slot = null;
  for(var i = 0; i < SLOT_DEFS.length; i++){
    var s = SLOT_DEFS[i];
    if(s.eligible.indexOf(p.pos) >= 0 && !lineup[s.id]){ slot = s; break; }
  }
  if(!slot){ showToast('No available slot for '+p.pos, true); return; }

  // Check cap
  if(getSpent() + p.salary > CAP){ showToast('Over cap!', true); return; }

  lineup[slot.id] = p;
  renderRoster();
  updateCap();
  renderGamePreview(activeGame); // refresh preview to show selection
  showToast(p.name+' → '+slot.label+' ✓');
}

function loadSubmitted(){
  if(!currentUser) return;
  fetch(FB_DB_URL + '/lineups'+FR_SEASON+'/week'+currentWeek+'/'+currentUser.uid+'.json')
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(!data || !data.slots) return;
      SLOT_DEFS.forEach(function(s){ if(data.slots[s.id]) lineup[s.id] = data.slots[s.id]; });
      renderRoster();
      updateCap();
      document.getElementById('submit-msg').textContent = '✓ Submitted — tap any slot to update';
      document.getElementById('submit-msg').className = 'submit-msg ok';
      document.getElementById('submit-btn').textContent = '↑ Update Lineup';
    })
    .catch(function(){});
}

// ── ROSTER RENDER ──────────────────────────────────────────────
function renderRoster(){
  var html = '';
  SLOT_DEFS.forEach(function(s){
    var p       = lineup[s.id];
    var isActive = activeSlot === s.id;
    var color   = POS_COLORS[s.pos] || 'var(--ink2)';
    var cls     = 'roster-slot' + (p ? ' filled' : '') + (isActive ? ' active' : '');
    html += '<div class="'+cls+'" onclick="selectSlot(\''+s.id+'\')">';
    html += '<div class="slot-hdr">';
    html += '<span class="slot-pos-tag" style="color:'+color+'">'+s.label+'</span>';
    if(p){
      html += '<span class="slot-player-name" style="font-family:var(--fd);font-size:15px;font-weight:700;flex:1;">'+p.name+'</span>';
      html += '<button class="slot-remove-btn" onclick="event.stopPropagation();removePlayer(\''+s.id+'\')">✕</button>';
    } else {
      html += '<span class="slot-empty-lbl">— empty —</span>';
      html += '<span class="slot-tap-hint">tap to pick</span>';
    }
    html += '</div>';
    if(p){
      html += '<div class="slot-player-body">';
      html += '<div class="slot-player-meta">';
      html += '<span class="slot-player-team">'+( p.team||'')+'</span>';
      html += '<span class="slot-player-sal">$'+(p.salary||0).toLocaleString()+'</span>';
      if(p.proj) html += '<span style="font-family:var(--fd);font-size:11px;color:var(--ink3);margin-left:4px;">'+p.proj+' proj</span>';
      html += '</div></div>';
    }
    html += '</div>';
  });
  document.getElementById('roster-slots').innerHTML = html;
  updateSubmitBtn();
}

// ── SLOT SELECTION ─────────────────────────────────────────────
function selectSlot(slotId){
  activeSlot = slotId;
  var slot = SLOT_DEFS.find(function(s){ return s.id === slotId; });
  var color = POS_COLORS[slot.pos] || 'var(--or)';
  var label = slot.label === 'FLEX' ? 'FLEX (WR/RB/TE)' : slot.label;
  document.getElementById('picker-slot-label').textContent = label;
  document.getElementById('picker-slot-label').style.color = color;
  document.getElementById('picker-search').value = '';
  // Open picker on mobile
  document.getElementById('picker-panel').classList.add('open');
  renderRoster();
  renderPicker();
}

function closePicker(){
  activeSlot = null;
  document.getElementById('picker-panel').classList.remove('open');
  renderRoster();
}

// ── PICKER RENDER ──────────────────────────────────────────────
function renderPicker(){
  if(!activeSlot){
    document.getElementById('picker-list').innerHTML =
      '<div class="pick-prompt"><div class="pick-prompt-icon">👆</div>'
      +'<div class="pick-prompt-title">Tap a slot to pick</div>'
      +'<div class="pick-prompt-sub">Select a position slot on your roster.</div></div>';
    return;
  }

  var slot    = SLOT_DEFS.find(function(s){ return s.id === activeSlot; });
  var query   = (document.getElementById('picker-search').value||'').toLowerCase().trim();
  var inLineup= {};
  Object.keys(lineup).forEach(function(sid){ if(lineup[sid]) inLineup[lineup[sid].id]=sid; });

  // Players already in OTHER slots (not current active slot)
  var draftedIds = {};
  Object.keys(lineup).forEach(function(sid){
    if(sid !== activeSlot && lineup[sid]) draftedIds[lineup[sid].id] = true;
  });

  var players = allPlayers.filter(function(p){
    // Position filter
    if(slot.eligible.indexOf(p.pos) < 0) return false;
    // Game filter
    if(activeGame && (!p.team || activeGame.teams.indexOf(p.team) < 0)) return false;
    // Search
    if(query && p.name.toLowerCase().indexOf(query)<0 && (p.team||'').toLowerCase().indexOf(query)<0) return false;
    // Hide players already drafted into other slots
    if(draftedIds[p.id]) return false;
    return true;
  }).sort(function(a,b){ return b.salary - a.salary; });

  if(!players.length){
    document.getElementById('picker-list').innerHTML =
      '<div class="picker-empty"><div class="picker-empty-icon">🔍</div>'
      +'<div class="picker-empty-title">No players found</div>'
      +'<div class="picker-empty-sub">'+(activeGame?'No eligible players in this game. Try All Games.':'Try a different search.')+'</div></div>';
    return;
  }

  var html = '';
  players.forEach(function(p){
    var isSelected = inLineup[p.id] === activeSlot;
    var isElsewhere= inLineup[p.id] && inLineup[p.id] !== activeSlot;
    var isOut      = p.status === 'O' || p.status === 'IR';
    var spent      = getSpent();
    var wouldOvr   = !isSelected && (spent + p.salary > CAP);
    var disabled   = isOut || (wouldOvr && !isSelected);
    var injBadge   = (p.status && p.status !== 'Active')
      ? '<span class="p-inj inj-'+p.status+'">'+p.status+'</span>' : '';
    var posColor   = POS_COLORS[p.pos] || 'var(--ink2)';
    var draftLabel = isSelected ? '✓ Drafted' : '+ Draft';
    var draftCls   = 'draft-btn' + (isSelected ? ' drafted' : '');
    var rowCls     = 'player-row'+(isSelected?' selected':'')+(disabled?' disabled':'');
    html += '<div class="'+rowCls+'">'
      + '<div class="p-pos" style="background:'+posColor+'18;color:'+posColor+'">'+p.pos+'</div>'
      + '<div class="p-info" onclick="openNews(\''+p.id+'\',event)" style="cursor:pointer;">'
      +   '<div class="p-name">'+p.name+injBadge+(isElsewhere?' <span style="font-size:10px;color:var(--ink3)">(in lineup)</span>':'')+'</div>'
      +   '<div class="p-meta">'+(p.team||'')+(p.proj?' · '+p.proj+' proj':'')+'</div>'
      + '</div>'
      + '<div class="p-sal">$'+(p.salary||0).toLocaleString()+'</div>'
      + '<button class="'+draftCls+'" onclick="pickPlayer(\''+p.id+'\')">' + draftLabel + '</button>'
      + '</div>';
  });
  document.getElementById('picker-list').innerHTML = html;
}

// ── PICK PLAYER ────────────────────────────────────────────────
function pickPlayer(playerId){
  if(!activeSlot) return;
  var p = allPlayers.find(function(x){ return x.id === playerId; });
  if(!p) return;
  if(p.status === 'O' || p.status === 'IR'){ showToast(p.name+' is out', true); return; }

  var slot = SLOT_DEFS.find(function(s){ return s.id === activeSlot; });

  // If player is already in this slot — deselect
  if(lineup[activeSlot] && lineup[activeSlot].id === playerId){
    lineup[activeSlot] = null;
    renderRoster();
    updateCap();
    renderPicker();
    return;
  }

  // Check cap (excluding current slot's player)
  var currentSlotCost = lineup[activeSlot] ? lineup[activeSlot].salary : 0;
  var spent = getSpent() - currentSlotCost;
  if(spent + p.salary > CAP){ showToast('Over cap!', true); return; }

  // If player is in another slot, remove from there
  Object.keys(lineup).forEach(function(sid){
    if(lineup[sid] && lineup[sid].id === playerId) lineup[sid] = null;
  });

  lineup[activeSlot] = p;
  renderRoster();
  updateCap();

  // Find next empty slot of the same position type
  var nextSlot = findNextEmptySlot(slot);

  if(nextSlot){
    // Auto-advance to next slot of same type
    activeSlot = nextSlot.id;
    var color = POS_COLORS[nextSlot.pos] || 'var(--or)';
    var label = nextSlot.label === 'FLEX' ? 'FLEX (WR/RB/TE)' : nextSlot.label;
    document.getElementById('picker-slot-label').textContent = label;
    document.getElementById('picker-slot-label').style.color = color;
    renderPicker();
    renderRoster(); // re-render to show new active slot
  } else {
    // No more slots for this position — close on mobile
    if(window.innerWidth <= 860){
      closePicker();
    } else {
      renderPicker();
    }
    showToast(p.name+' added ✓');
  }
}

function findNextEmptySlot(currentSlot){
  // Look for next empty slot that accepts the same position
  var found = false;
  for(var i = 0; i < SLOT_DEFS.length; i++){
    var s = SLOT_DEFS[i];
    if(s.id === currentSlot.id){ found = true; continue; }
    if(!found) continue;
    // Same position type and empty
    if(s.eligible.indexOf(currentSlot.pos) >= 0 && !lineup[s.id]) return s;
  }
  // Also check FLEX if position is FLEX-eligible and we haven't found anything
  for(var j = 0; j < SLOT_DEFS.length; j++){
    var sf = SLOT_DEFS[j];
    if(sf.id === currentSlot.id || sf.pos !== 'FLEX') continue;
    if(sf.eligible.indexOf(currentSlot.pos) >= 0 && !lineup[sf.id]) return sf;
  }
  return null;
}

function removePlayer(slotId){
  lineup[slotId] = null;
  if(activeSlot === slotId){
    activeSlot = null;
    document.getElementById('picker-panel').classList.remove('open');
  }
  renderRoster();
  updateCap();
  renderPicker();
}

// ── CAP ────────────────────────────────────────────────────────
function getSpent(){
  return Object.values(lineup).reduce(function(s,p){ return s+(p?p.salary:0); },0);
}

function updateCap(){
  var spent     = getSpent();
  var remaining = CAP - spent;
  var pct       = Math.min(100,(spent/CAP)*100);
  var filled    = Object.values(lineup).filter(Boolean).length;
  var el        = document.getElementById('cap-amt');
  el.textContent = (remaining<0?'-$':'$')+Math.abs(remaining).toLocaleString();
  el.className  = 'cap-amount'+(remaining<0?' over':remaining<5000?' tight':'');
  document.getElementById('slots-n').textContent = filled;
  var fill = document.getElementById('cap-fill');
  fill.style.width = pct+'%';
  fill.className = 'cap-track-fill'+(remaining<0?' over':'');
}

function updateSubmitBtn(){
  var filled = Object.values(lineup).filter(Boolean).length;
  var spent  = getSpent();
  var btn    = document.getElementById('submit-btn');
  var msg    = document.getElementById('submit-msg');
  if(!currentUser){
    btn.disabled=true; btn.textContent='Build Your Lineup';
    msg.textContent='Sign in to submit your lineup'; msg.className='submit-msg';
  } else if(filled<9){
    btn.disabled=true; btn.textContent='Build Your Lineup';
    msg.textContent=(9-filled)+' slot'+(9-filled===1?'':'s')+' remaining';
    msg.className='submit-msg';
  } else if(spent>CAP){
    btn.disabled=true;
    msg.textContent='Over cap by $'+(spent-CAP).toLocaleString();
    msg.className='submit-msg err';
  } else {
    btn.disabled=false; btn.textContent='Submit Lineup →';
    msg.textContent='$'+(CAP-spent).toLocaleString()+' remaining · Ready to submit';
    msg.className='submit-msg ok';
  }
}

// ── SUBMIT ─────────────────────────────────────────────────────
function submitLineup(){
  if(!currentUser){ showToast('Sign in first',true); return; }
  if(Object.values(lineup).filter(Boolean).length<9){ showToast('Fill all 9 slots',true); return; }
  if(getSpent()>CAP){ showToast('Over cap',true); return; }
  var btn = document.getElementById('submit-btn');
  btn.disabled=true; btn.textContent='Submitting…';
  var slots={};
  SLOT_DEFS.forEach(function(s){ if(lineup[s.id]) slots[s.id]=lineup[s.id]; });
  fetch(FB_DB_URL+'/lineups'+FR_SEASON+'/week'+currentWeek+'/'+currentUser.uid+'.json',{
    method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({uid:currentUser.uid,team:currentUser.team2026||currentUser.email,
      week:currentWeek,slots:slots,totalSal:getSpent(),submitted:Date.now()})
  }).then(function(){
    var msg=document.getElementById('submit-msg');
    msg.textContent='✓ Lineup submitted! Good luck.'; msg.className='submit-msg ok';
    btn.textContent='↑ Update Lineup'; btn.disabled=false;
    showToast('Lineup submitted! 🏈');
  }).catch(function(){
    document.getElementById('submit-msg').textContent='Submission failed — try again';
    document.getElementById('submit-msg').className='submit-msg err';
    btn.disabled=false; btn.textContent='Submit Lineup →';
  });
}

// ── PLAYER NEWS ────────────────────────────────────────────────
var NEWS_WORKER = 'https://fantasy-refresh-news.mtriedel.workers.dev';
var espnIdCache = {};

function openNews(playerId, event){
  if(event) event.stopPropagation();
  var p = allPlayers.find(function(x){ return x.id === playerId; });
  if(!p) return;

  document.getElementById('news-player-name').textContent = p.name;
  document.getElementById('news-player-meta').textContent =
    (p.pos||'') + (p.team ? ' · '+p.team : '') + (p.salary ? ' · $'+p.salary.toLocaleString() : '');
  document.getElementById('news-body').innerHTML = '<div class="news-loading">Loading news…</div>';
  document.getElementById('news-overlay').classList.add('open');

  fetch(NEWS_WORKER+'/news?name='+encodeURIComponent(p.name))
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(data.items && data.items.length){
        var html = data.items.map(function(item){
          return '<div class="news-item">'
            +(item.title?'<div class="news-item-title">'+item.title+'</div>':'')
            +(item.body ?'<div class="news-item-body">'+item.body+'</div>':'')
            +'<div class="news-item-meta">'+(item.date?item.date+' · ':'')+(item.source||'')+'</div>'
            +'</div>';
        }).join('');
        var slug = p.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-+$/,'');
        html += '<a href="https://www.fantasypros.com/nfl/players/'+slug+'.php" target="_blank" rel="noopener"'
          +' style="display:block;padding:12px 20px;font-family:var(--fd);font-size:12px;font-weight:700;'
          +'color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;text-align:center;'
          +'border-top:1px solid var(--bdr);">More on FantasyPros ↗</a>';
        document.getElementById('news-body').innerHTML = html;
      } else {
        showNewsLinks(p);
      }
    })
    .catch(function(){ showNewsLinks(p); });
}





// ── THEME ──────────────────────────────────────────────────────
function toggleTheme(){
  var html  = document.documentElement;
  var isDark = html.getAttribute('data-theme') !== 'light';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('theme-btn').textContent = isDark ? '☀️' : '🌙';
  try{ localStorage.setItem('fr_theme', isDark ? 'light' : 'dark'); }catch(e){}
}
(function(){
  try{
    var t = localStorage.getItem('fr_theme');
    if(t){ document.documentElement.setAttribute('data-theme', t);
      if(t === 'light'){
        window.addEventListener('DOMContentLoaded', function(){
          var btn = document.getElementById('theme-btn');
          if(btn) btn.textContent = '☀️';
        });
      }
    }
  }catch(e){}
})();

// ── PRESEASON MODE ─────────────────────────────────────────────
// If ?mode=preseason is in the URL, switch to preseason Firebase paths
// and preseason schedule type
(function(){
  var params = new URLSearchParams(window.location.search);
  if(params.get('mode') === 'preseason'){
    FR_SEASON   = 'preseason2026';
    PS_MODE     = true;
    PS_WEEK     = parseInt(params.get('week') || '1');
    currentWeek = PS_WEEK;
  }
})();

function goBack(){
  if(PS_MODE) window.location.href = 'preseason.html';
  else window.location.href = 'index.html';
}
