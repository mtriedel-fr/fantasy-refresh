<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Fantasy Refresh — Draft</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --hdr:#050808;--bg:#0A0F0F;--bg2:#0D1515;--bg3:#101C1C;--bg4:#142020;
  --or:#00E5D4;--pk:#FF5FA0;--pu:#9B6DFF;
  --ink:#F0FAFA;--ink2:#6ABFBF;--ink3:#3A8888;
  --bdr:#0D3535;--bdr2:#104040;
  --fd:'Barlow Condensed',sans-serif;--fb:'Barlow',sans-serif;
  --cap:60000;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);min-height:100vh;overflow-x:hidden;}

/* ── HEADER ── */
.hdr{background:var(--hdr);border-top:3px solid var(--or);border-bottom:3px solid var(--pk);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:100;}
.hdr-logo{font-family:var(--fd);font-size:20px;font-weight:900;color:var(--or);text-decoration:none;letter-spacing:.5px;}
.hdr-logo span{color:var(--pk);}
.hdr-week{font-family:var(--fd);font-size:13px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.8px;}
.hdr-back{font-family:var(--fd);font-size:12px;font-weight:700;color:var(--ink3);text-decoration:none;text-transform:uppercase;letter-spacing:.5px;padding:5px 10px;border:1px solid var(--bdr);border-radius:6px;transition:all .15s;}
.hdr-back:hover{color:var(--or);border-color:var(--or);}

/* ── CAP TRACKER ── */
.cap-bar{background:var(--bg2);border-bottom:1px solid var(--bdr);padding:12px 20px;}
.cap-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.cap-label{font-family:var(--fd);font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:1px;}
.cap-remaining{font-family:var(--fd);font-size:28px;font-weight:900;color:var(--or);line-height:1;}
.cap-remaining.tight{color:#FF9A3A;}
.cap-remaining.over{color:var(--pk);}
.cap-slots{display:flex;gap:4px;font-family:var(--fd);font-size:11px;color:var(--ink3);}
.cap-slot-used{color:var(--or);}
.cap-progress{height:4px;background:var(--bdr);border-radius:2px;overflow:hidden;}
.cap-progress-fill{height:4px;background:linear-gradient(90deg,var(--or),var(--pk));border-radius:2px;transition:width .3s;}
.cap-progress-fill.over{background:var(--pk);}

/* ── MAIN LAYOUT ── */
.main{display:grid;grid-template-columns:1fr 340px;gap:0;min-height:calc(100vh - 120px);}
@media(max-width:900px){.main{grid-template-columns:1fr;}}

/* ── PLAYER POOL ── */
.pool-panel{border-right:1px solid var(--bdr);display:flex;flex-direction:column;}
.pool-header{padding:16px 20px;background:var(--bg2);border-bottom:1px solid var(--bdr);position:sticky;top:72px;z-index:50;}
.pool-search-wrap{position:relative;margin-bottom:10px;}
.pool-search{width:100%;padding:9px 14px 9px 38px;background:var(--bg3);border:1px solid var(--bdr2);border-radius:10px;color:var(--or);font-family:var(--fb);font-size:14px;outline:none;transition:border-color .15s;}
.pool-search:focus{border-color:var(--or);}
.pool-search::placeholder{color:var(--ink3);}
.pool-search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--ink3);fill:none;stroke-width:2;stroke-linecap:round;}
.pos-filters{display:flex;gap:6px;flex-wrap:wrap;}
.pos-btn{font-family:var(--fd);font-size:12px;font-weight:800;padding:5px 12px;border-radius:20px;border:1px solid var(--bdr2);background:transparent;color:var(--ink3);cursor:pointer;text-transform:uppercase;letter-spacing:.5px;transition:all .15s;}
.pos-btn:hover{border-color:var(--or);color:var(--or);}
.pos-btn.active{background:var(--or);border-color:var(--or);color:#050808;}
.pos-btn.active.rb{background:var(--pk);border-color:var(--pk);}
.pos-btn.active.wr{background:var(--pu);border-color:var(--pu);color:#fff;}
.pos-btn.active.te{background:#FF9A3A;border-color:#FF9A3A;color:#050808;}
.pos-btn.active.def{background:#69BE28;border-color:#69BE28;color:#050808;}
.pool-sort{display:flex;gap:6px;margin-top:8px;align-items:center;}
.sort-lbl{font-family:var(--fd);font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;}
.sort-btn{font-family:var(--fd);font-size:11px;font-weight:700;padding:3px 10px;border-radius:6px;border:1px solid var(--bdr2);background:transparent;color:var(--ink3);cursor:pointer;transition:all .15s;}
.sort-btn.active{border-color:var(--or);color:var(--or);}

/* ── PLAYER LIST ── */
.pool-list{overflow-y:auto;flex:1;}
.pool-list-inner{padding:0;}
.player-row{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .1s;position:relative;}
.player-row:hover{background:var(--bg3);}
.player-row.in-lineup{background:rgba(0,229,212,.06);border-left:3px solid var(--or);}
.player-row.in-lineup:hover{background:rgba(0,229,212,.1);}
.player-row.locked{opacity:.5;cursor:not-allowed;}
.player-row.injured-q{border-left:3px solid #FF9A3A;}
.player-row.injured-out{opacity:.4;cursor:not-allowed;}
.player-pos-badge{font-family:var(--fd);font-size:11px;font-weight:800;width:32px;text-align:center;padding:3px 0;border-radius:6px;flex-shrink:0;}
.pos-QB{background:rgba(0,229,212,.15);color:var(--or);}
.pos-RB{background:rgba(255,95,160,.15);color:var(--pk);}
.pos-WR{background:rgba(155,109,255,.15);color:var(--pu);}
.pos-TE{background:rgba(255,154,58,.15);color:#FF9A3A;}
.pos-DEF{background:rgba(105,190,40,.15);color:#69BE28;}
.player-info{flex:1;min-width:0;}
.player-name{font-family:var(--fd);font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player-team{font-family:var(--fd);font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;}
.player-inj{font-family:var(--fd);font-size:10px;font-weight:800;padding:1px 6px;border-radius:4px;text-transform:uppercase;margin-left:4px;}
.inj-Q{background:rgba(255,154,58,.2);color:#FF9A3A;}
.inj-D{background:rgba(255,95,160,.2);color:var(--pk);}
.inj-O{background:rgba(255,50,50,.2);color:#FF4444;}
.player-proj{font-family:var(--fd);font-size:12px;color:var(--ink3);text-align:right;flex-shrink:0;}
.player-salary{font-family:var(--fd);font-size:15px;font-weight:800;color:var(--ink2);text-align:right;min-width:60px;flex-shrink:0;}
.player-action{width:28px;height:28px;border-radius:50%;border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
.player-action.add{background:rgba(0,229,212,.15);color:var(--or);}
.player-action.add:hover{background:var(--or);color:#050808;}
.player-action.remove{background:rgba(255,95,160,.15);color:var(--pk);}
.player-action.remove:hover{background:var(--pk);color:#fff;}

/* ── LINEUP PANEL ── */
.lineup-panel{background:var(--bg2);display:flex;flex-direction:column;}
.lineup-header{padding:16px 20px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;}
.lineup-title{font-family:var(--fd);font-size:16px;font-weight:800;color:var(--or);text-transform:uppercase;letter-spacing:.5px;}
.lineup-slots{padding:8px 16px;flex:1;}
.lineup-slot{background:var(--bg3);border-radius:10px;margin-bottom:8px;border:1px solid var(--bdr);overflow:hidden;transition:all .2s;}
.lineup-slot.filled{border-color:var(--bdr2);}
.lineup-slot.over-budget{border-color:var(--pk);}
.slot-header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg4);}
.slot-pos{font-family:var(--fd);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;min-width:36px;}
.slot-empty{font-family:var(--fd);font-size:13px;color:var(--ink3);flex:1;}
.slot-salary{font-family:var(--fd);font-size:13px;font-weight:700;color:var(--ink3);margin-left:auto;}
.slot-player{padding:8px 12px;display:flex;align-items:center;gap:8px;}
.slot-player-name{font-family:var(--fd);font-size:15px;font-weight:700;color:var(--ink);flex:1;}
.slot-player-team{font-family:var(--fd);font-size:11px;color:var(--ink3);text-transform:uppercase;}
.slot-player-salary{font-family:var(--fd);font-size:14px;font-weight:800;color:var(--or);}
.slot-remove{background:none;border:none;color:var(--ink3);font-size:16px;cursor:pointer;padding:2px 6px;border-radius:4px;transition:all .15s;margin-left:4px;}
.slot-remove:hover{color:var(--pk);background:rgba(255,95,160,.1);}
.slot-lock{font-size:12px;margin-left:4px;}

/* ── SUBMIT ── */
.submit-section{padding:16px;border-top:1px solid var(--bdr);}
.submit-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--or),var(--pk));border:none;border-radius:12px;color:#050808;font-family:var(--fd);font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;cursor:pointer;transition:opacity .15s;}
.submit-btn:hover{opacity:.9;}
.submit-btn:disabled{opacity:.4;cursor:not-allowed;background:var(--bg4);color:var(--ink3);border:1px solid var(--bdr);}
.submit-status{font-family:var(--fd);font-size:11px;text-align:center;margin-top:8px;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;min-height:16px;}
.submit-status.ok{color:var(--or);}
.submit-status.err{color:var(--pk);}

/* ── EMPTY / LOADING ── */
.pool-empty{padding:60px 20px;text-align:center;color:var(--ink3);}
.pool-empty-icon{font-size:40px;margin-bottom:12px;opacity:.5;}
.pool-empty-title{font-family:var(--fd);font-size:18px;font-weight:700;color:var(--ink2);margin-bottom:6px;text-transform:uppercase;}
.pool-empty-sub{font-size:13px;line-height:1.6;}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0D1515;border:1px solid var(--or);border-radius:10px;padding:10px 20px;font-family:var(--fd);font-size:14px;font-weight:700;color:var(--or);z-index:9999;pointer-events:none;opacity:0;transition:opacity .2s;}
.toast.show{opacity:1;}
.toast.err{border-color:var(--pk);color:var(--pk);}

/* ── SUBMITTED VIEW ── */
.submitted-view{padding:20px;}
.submitted-hero{background:linear-gradient(135deg,var(--hdr),var(--bg2));border-radius:14px;padding:24px;text-align:center;border-top:3px solid var(--or);border-bottom:3px solid var(--pk);margin-bottom:16px;}
.submitted-title{font-family:var(--fd);font-size:13px;font-weight:700;color:var(--pk);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;}
.submitted-team{font-family:var(--fd);font-size:32px;font-weight:900;color:var(--or);text-transform:uppercase;}
.submitted-meta{font-family:var(--fd);font-size:13px;color:var(--ink2);margin-top:6px;}
.submitted-slot{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bdr);background:var(--bg3);border-radius:0;}
.submitted-slot:first-child{border-radius:10px 10px 0 0;}
.submitted-slot:last-child{border-bottom:none;border-radius:0 0 10px 10px;}

/* ── MOBILE ── */
@media(max-width:900px){
  .lineup-panel{position:fixed;bottom:0;left:0;right:0;z-index:90;max-height:50vh;overflow-y:auto;border-top:2px solid var(--or);box-shadow:0 -8px 32px rgba(0,0,0,.6);}
  .pool-panel{padding-bottom:300px;}
  .cap-bar{position:sticky;top:72px;z-index:60;}
  .pool-header{top:130px;}
}
@media(max-width:600px){
  .hdr{padding:10px 14px;}
  .hdr-logo{font-size:17px;}
  .player-row{padding:9px 14px;}
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <a href="index.html" class="hdr-logo">Fantasy<span>Refresh</span></a>
  <div class="hdr-week" id="hdr-week">Loading…</div>
  <a href="index.html" class="hdr-back">← Standings</a>
</div>

<!-- CAP TRACKER -->
<div class="cap-bar">
  <div class="cap-row">
    <div>
      <div class="cap-label">Salary Cap Remaining</div>
      <div class="cap-remaining" id="cap-remaining">$60,000</div>
    </div>
    <div style="text-align:right;">
      <div class="cap-label">Players</div>
      <div class="cap-slots" id="cap-slots">
        <span id="slots-filled">0</span>/<span>9</span> filled
      </div>
    </div>
  </div>
  <div class="cap-progress"><div class="cap-progress-fill" id="cap-fill" style="width:0%"></div></div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- PLAYER POOL -->
  <div class="pool-panel">
    <div class="pool-header">
      <div class="pool-search-wrap">
        <svg class="pool-search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="pool-search" id="pool-search" placeholder="Search players…" oninput="filterPool()">
      </div>
      <div class="pos-filters">
        <button class="pos-btn active" data-pos="ALL" onclick="setPos('ALL',this)">All</button>
        <button class="pos-btn" data-pos="QB" onclick="setPos('QB',this)">QB</button>
        <button class="pos-btn rb" data-pos="RB" onclick="setPos('RB',this)">RB</button>
        <button class="pos-btn wr" data-pos="WR" onclick="setPos('WR',this)">WR</button>
        <button class="pos-btn te" data-pos="TE" onclick="setPos('TE',this)">TE</button>
        <button class="pos-btn def" data-pos="DEF" onclick="setPos('DEF',this)">DEF</button>
      </div>
      <div class="pool-sort">
        <span class="sort-lbl">Sort:</span>
        <button class="sort-btn active" data-sort="salary" onclick="setSort('salary',this)">Salary</button>
        <button class="sort-btn" data-sort="proj" onclick="setSort('proj',this)">Projected</button>
        <button class="sort-btn" data-sort="name" onclick="setSort('name',this)">Name</button>
      </div>
    </div>
    <div class="pool-list" id="pool-list">
      <div class="pool-empty">
        <div class="pool-empty-icon">⏳</div>
        <div class="pool-empty-title">Loading Player Pool</div>
        <div class="pool-empty-sub">Fetching this week's salaries…</div>
      </div>
    </div>
  </div>

  <!-- LINEUP PANEL -->
  <div class="lineup-panel">
    <div class="lineup-header">
      <div class="lineup-title">Your Lineup</div>
      <div style="font-family:var(--fd);font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;" id="lineup-week-label">Week —</div>
    </div>
    <div class="lineup-slots" id="lineup-slots"></div>
    <div class="submit-section">
      <button class="submit-btn" id="submit-btn" onclick="submitLineup()" disabled>Complete Your Lineup</button>
      <div class="submit-status" id="submit-status">Fill all 9 slots to submit</div>
    </div>
  </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
var FB_DB_URL  = 'https://fantasy-refresh-default-rtdb.firebaseio.com';
var FR_SEASON  = '2026';
var CAP        = 60000;
var SLOT_DEFS  = [
  {id:'qb1', pos:'QB',   label:'QB'},
  {id:'rb1', pos:'RB',   label:'RB'},
  {id:'rb2', pos:'RB',   label:'RB'},
  {id:'wr1', pos:'WR',   label:'WR'},
  {id:'wr2', pos:'WR',   label:'WR'},
  {id:'wr3', pos:'WR',   label:'WR'},
  {id:'te1', pos:'TE',   label:'TE'},
  {id:'fx1', pos:'FLEX', label:'FLEX'},
  {id:'df1', pos:'DEF',  label:'DEF'}
];
var FLEX_POS = ['WR','RB','TE'];
var POS_COLORS = {QB:'var(--or)',RB:'var(--pk)',WR:'var(--pu)',TE:'#FF9A3A',DEF:'#69BE28',FLEX:'var(--pu2)'};

// ── STATE ─────────────────────────────────────────────────────
var allPlayers  = [];   // full pool from Firebase
var lineup      = {};   // {slotId: playerObj}
var currentPos  = 'ALL';
var currentSort = 'salary';
var currentWeek = 1;
var salaryLocked = false;
var submittedLineup = null;
var currentUser = null;

// ── BOOT ──────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', function(){
  // Load user from localStorage
  try{
    var u = localStorage.getItem('fr_user_'+FR_SEASON);
    if(u) currentUser = JSON.parse(u);
  }catch(e){}

  // Determine current week
  determineWeek();
  renderSlots();
});

function determineWeek(){
  // Load season data to find latest week, default to 1
  fetch(FB_DB_URL + '/season'+FR_SEASON+'.json?shallow=true')
    .then(function(r){ return r.json(); })
    .then(function(keys){
      if(keys && typeof keys === 'object'){
        var weeks = Object.keys(keys).filter(function(k){ return !isNaN(Number(k)); }).map(Number);
        currentWeek = weeks.length ? Math.max.apply(null, weeks) + 1 : 1;
      }
      currentWeek = Math.min(currentWeek, 18);
      document.getElementById('hdr-week').textContent = 'Week ' + currentWeek + ' Draft';
      document.getElementById('lineup-week-label').textContent = 'Week ' + currentWeek;
      loadSalaries();
      loadSubmitted();
    })
    .catch(function(){
      currentWeek = 1;
      document.getElementById('hdr-week').textContent = 'Week 1 Draft';
      loadSalaries();
    });
}

// ── LOAD SALARIES ─────────────────────────────────────────────
function loadSalaries(){
  fetch(FB_DB_URL + '/salaries'+FR_SEASON+'/week'+currentWeek+'.json')
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(!data || !data.players){
        document.getElementById('pool-list').innerHTML =
          '<div class="pool-empty"><div class="pool-empty-icon">⏳</div>'
          +'<div class="pool-empty-title">Salaries Not Yet Set</div>'
          +'<div class="pool-empty-sub">The commissioner hasn\'t generated salaries for Week '+currentWeek+' yet.<br>Check back soon.</div></div>';
        return;
      }
      salaryLocked = !!(data.meta && data.meta.locked);

      allPlayers = Object.values(data.players)
        .filter(function(p){ return p && p.name && p.pos; })
        .sort(function(a,b){ return b.salary - a.salary; });

      renderPool();
    })
    .catch(function(){
      document.getElementById('pool-list').innerHTML =
        '<div class="pool-empty"><div class="pool-empty-icon">⚠️</div>'
        +'<div class="pool-empty-title">Could not load players</div>'
        +'<div class="pool-empty-sub">Check your connection and try again.</div></div>';
    });
}

// ── LOAD SUBMITTED LINEUP ─────────────────────────────────────
function loadSubmitted(){
  if(!currentUser) return;
  fetch(FB_DB_URL + '/lineups'+FR_SEASON+'/week'+currentWeek+'/'+currentUser.uid+'.json')
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(!data || !data.slots) return;
      submittedLineup = data;
      // Restore lineup from submitted data
      lineup = {};
      SLOT_DEFS.forEach(function(slot){
        if(data.slots[slot.id]){
          lineup[slot.id] = data.slots[slot.id];
        }
      });
      renderSlots();
      updateCap();
      renderPool();
      document.getElementById('submit-status').textContent = '✓ Lineup submitted · You can still make changes';
      document.getElementById('submit-status').className = 'submit-status ok';
      document.getElementById('submit-btn').textContent = '↑ Update Lineup';
      document.getElementById('submit-btn').disabled = false;
    })
    .catch(function(){});
}

// ── PLAYER POOL RENDER ────────────────────────────────────────
function filterPool(){
  renderPool();
}

function setPos(pos, btn){
  currentPos = pos;
  document.querySelectorAll('.pos-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  renderPool();
}

function setSort(sort, btn){
  currentSort = sort;
  document.querySelectorAll('.sort-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  renderPool();
}

function renderPool(){
  var query  = (document.getElementById('pool-search').value || '').toLowerCase().trim();
  var inLineup = {};
  Object.values(lineup).forEach(function(p){ if(p) inLineup[p.id] = true; });

  var filtered = allPlayers.filter(function(p){
    if(currentPos !== 'ALL'){
      if(currentPos === 'FLEX'){
        if(FLEX_POS.indexOf(p.pos) < 0) return false;
      } else {
        if(p.pos !== currentPos) return false;
      }
    }
    if(query && p.name.toLowerCase().indexOf(query) < 0 && (p.team||'').toLowerCase().indexOf(query) < 0) return false;
    return true;
  });

  // Sort
  filtered.sort(function(a,b){
    if(currentSort === 'salary') return b.salary - a.salary;
    if(currentSort === 'proj')   return (b.proj||0) - (a.proj||0);
    if(currentSort === 'name')   return a.name.localeCompare(b.name);
    return 0;
  });

  if(!filtered.length){
    document.getElementById('pool-list').innerHTML =
      '<div class="pool-empty"><div class="pool-empty-icon">🔍</div>'
      +'<div class="pool-empty-title">No players found</div>'
      +'<div class="pool-empty-sub">Try a different search or position filter.</div></div>';
    return;
  }

  var html = '<div class="pool-list-inner">';
  filtered.forEach(function(p){
    var isIn    = !!inLineup[p.id];
    var isOut   = p.status === 'O' || p.status === 'IR';
    var isQ     = p.status === 'Q' || p.status === 'D';
    var rowCls  = 'player-row'
      + (isIn ? ' in-lineup' : '')
      + (isOut ? ' injured-out' : '')
      + (isQ && !isIn ? ' injured-q' : '');
    var injBadge = p.status && p.status !== 'Active'
      ? '<span class="player-inj inj-'+p.status+'">'+p.status+'</span>' : '';
    var projStr = p.proj ? p.proj + ' pts' : '—';
    var salStr  = '$' + (p.salary||0).toLocaleString();
    html += '<div class="'+rowCls+'" onclick="togglePlayer(\''+p.id+'\')">'
      + '<div class="player-pos-badge pos-'+p.pos+'">'+p.pos+'</div>'
      + '<div class="player-info">'
      +   '<div class="player-name">'+p.name+injBadge+'</div>'
      +   '<div class="player-team">'+(p.team||'')+'</div>'
      + '</div>'
      + '<div class="player-proj">'+projStr+'</div>'
      + '<div class="player-salary">'+salStr+'</div>'
      + '<button class="player-action '+(isIn?'remove':'add')+'" onclick="event.stopPropagation();togglePlayer(\''+p.id+'\')">'
      +   (isIn ? '−' : '+')
      + '</button>'
      + '</div>';
  });
  html += '</div>';
  document.getElementById('pool-list').innerHTML = html;
}

// ── LINEUP MANAGEMENT ─────────────────────────────────────────
function togglePlayer(playerId){
  var p = allPlayers.find(function(x){ return x.id === playerId; });
  if(!p) return;

  // Already in lineup — remove
  var existingSlot = null;
  Object.keys(lineup).forEach(function(sid){
    if(lineup[sid] && lineup[sid].id === playerId) existingSlot = sid;
  });
  if(existingSlot){
    lineup[existingSlot] = null;
    renderSlots();
    updateCap();
    renderPool();
    return;
  }

  // Injured out — block
  if(p.status === 'O' || p.status === 'IR'){
    showToast(p.name + ' is out — cannot add', true);
    return;
  }

  // Find best available slot
  var slot = findSlot(p.pos);
  if(!slot){
    showToast('No available slot for ' + p.pos, true);
    return;
  }

  // Check cap
  var spent = getSpent();
  if(spent + p.salary > CAP){
    showToast('Over salary cap!', true);
    return;
  }

  lineup[slot] = p;
  renderSlots();
  updateCap();
  renderPool();
}

function findSlot(pos){
  // Try exact position slots first
  for(var i=0; i<SLOT_DEFS.length; i++){
    var s = SLOT_DEFS[i];
    if(s.pos === pos && !lineup[s.id]) return s.id;
  }
  // Try FLEX slot for eligible positions
  if(FLEX_POS.indexOf(pos) >= 0){
    var flexSlot = SLOT_DEFS.find(function(s){ return s.pos === 'FLEX' && !lineup[s.id]; });
    if(flexSlot) return flexSlot.id;
  }
  return null;
}

function removeFromSlot(slotId){
  lineup[slotId] = null;
  renderSlots();
  updateCap();
  renderPool();
}

// ── SLOTS RENDER ──────────────────────────────────────────────
function renderSlots(){
  var html = '';
  SLOT_DEFS.forEach(function(slot){
    var p = lineup[slot.id];
    var posColor = POS_COLORS[slot.pos] || 'var(--ink2)';
    html += '<div class="lineup-slot '+(p?'filled':'') +'">';
    html += '<div class="slot-header">';
    html += '<span class="slot-pos" style="color:'+posColor+'">'+slot.label+'</span>';
    if(p){
      html += '<span class="slot-player-salary">$'+(p.salary||0).toLocaleString()+'</span>';
    } else {
      html += '<span class="slot-empty">— Empty —</span>';
    }
    html += '</div>';
    if(p){
      html += '<div class="slot-player">'
        + '<div style="flex:1;">'
        +   '<div class="slot-player-name">'+p.name+'</div>'
        +   '<div class="slot-player-team">'+(p.team||'')+'</div>'
        + '</div>'
        + '<button class="slot-remove" onclick="removeFromSlot(\''+slot.id+'\')" title="Remove">✕</button>'
        + '</div>';
    }
    html += '</div>';
  });
  document.getElementById('lineup-slots').innerHTML = html;
  updateSubmitBtn();
}

// ── CAP ────────────────────────────────────────────────────────
function getSpent(){
  return Object.values(lineup).reduce(function(sum, p){
    return sum + (p ? (p.salary||0) : 0);
  }, 0);
}

function updateCap(){
  var spent     = getSpent();
  var remaining = CAP - spent;
  var pct       = Math.min(100, (spent / CAP) * 100);
  var filled    = Object.values(lineup).filter(Boolean).length;

  var remEl = document.getElementById('cap-remaining');
  remEl.textContent = (remaining < 0 ? '-$' : '$') + Math.abs(remaining).toLocaleString();
  remEl.className = 'cap-remaining' + (remaining < 0 ? ' over' : remaining < 5000 ? ' tight' : '');

  document.getElementById('slots-filled').textContent = filled;
  var fill = document.getElementById('cap-fill');
  fill.style.width = pct + '%';
  fill.className = 'cap-progress-fill' + (remaining < 0 ? ' over' : '');
}

function updateSubmitBtn(){
  var filled = Object.values(lineup).filter(Boolean).length;
  var spent  = getSpent();
  var btn    = document.getElementById('submit-btn');
  var status = document.getElementById('submit-status');
  if(!currentUser){
    btn.disabled = true;
    status.textContent = '🔑 Sign in to submit your lineup';
    status.className = 'submit-status';
    return;
  }
  if(filled < 9){
    btn.disabled = true;
    status.textContent = (9 - filled) + ' more player' + (9-filled===1?'':'s') + ' needed';
    status.className = 'submit-status';
  } else if(spent > CAP){
    btn.disabled = true;
    status.textContent = 'Over cap by $' + (spent - CAP).toLocaleString();
    status.className = 'submit-status err';
  } else {
    btn.disabled = false;
    status.textContent = 'Ready! $' + (CAP - spent).toLocaleString() + ' remaining';
    status.className = 'submit-status ok';
  }
}

// ── SUBMIT ─────────────────────────────────────────────────────
function submitLineup(){
  if(!currentUser){ showToast('Sign in first', true); return; }
  var filled = Object.values(lineup).filter(Boolean).length;
  if(filled < 9){ showToast('Fill all 9 slots first', true); return; }
  if(getSpent() > CAP){ showToast('Over salary cap', true); return; }

  var btn    = document.getElementById('submit-btn');
  var status = document.getElementById('submit-status');
  btn.disabled = true;
  btn.textContent = 'Submitting…';

  var slots = {};
  SLOT_DEFS.forEach(function(s){ if(lineup[s.id]) slots[s.id] = lineup[s.id]; });

  var payload = {
    uid:       currentUser.uid,
    team:      currentUser.team2026 || currentUser.email,
    week:      currentWeek,
    slots:     slots,
    totalSal:  getSpent(),
    submitted: Date.now(),
    locked:    false
  };

  fetch(FB_DB_URL + '/lineups'+FR_SEASON+'/week'+currentWeek+'/'+currentUser.uid+'.json', {
    method:  'PUT',
    headers: {'Content-Type':'application/json'},
    body:    JSON.stringify(payload)
  })
  .then(function(r){ return r.json(); })
  .then(function(){
    submittedLineup = payload;
    status.textContent = '✓ Lineup submitted! Good luck.';
    status.className = 'submit-status ok';
    btn.textContent = '↑ Update Lineup';
    btn.disabled = false;
    showToast('Lineup submitted! 🏈');
  })
  .catch(function(){
    status.textContent = 'Submission failed — try again';
    status.className = 'submit-status err';
    btn.disabled = false;
    btn.textContent = 'Submit Lineup';
  });
}

// ── TOAST ──────────────────────────────────────────────────────
function showToast(msg, isErr){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isErr ? ' err' : '') + ' show';
  setTimeout(function(){ t.className = 'toast' + (isErr?' err':''); }, 2500);
}
</script>
