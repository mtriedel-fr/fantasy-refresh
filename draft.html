<style>
/* :root variables now live in /css/theme.css — removed from here to stop the per-file drift the review flagged */
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);display:flex;flex-direction:column;}

/* ── HEADER ── */
.hdr{background:var(--hdr);border-top:3px solid var(--or);border-bottom:1px solid var(--bdr);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0;}
.hdr-logo{font-family:var(--fd);font-size:20px;font-weight:900;color:var(--or);text-decoration:none;letter-spacing:.5px;}
.hdr-logo span{color:var(--pk);}
.hdr-week{font-family:var(--fd);font-size:13px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.8px;}
.hdr-back{font-family:var(--fd);font-size:12px;font-weight:700;color:var(--ink3);text-decoration:none;text-transform:uppercase;letter-spacing:.5px;padding:5px 10px;border:1px solid var(--bdr);border-radius:6px;}
.hdr-back:hover{color:var(--or);border-color:var(--or);}

/* ── CAP BAR ── */
.cap-bar{background:var(--bg2);border-bottom:1px solid var(--bdr);padding:10px 20px;flex-shrink:0;}
.cap-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.cap-label{font-family:var(--fd);font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:1px;}
.cap-amount{font-family:var(--fd);font-size:26px;font-weight:900;color:var(--or);line-height:1;}
.cap-amount.tight{color:#FF9A3A;}
.cap-amount.over{color:var(--pk);}
.cap-slots-info{font-family:var(--fd);font-size:13px;font-weight:700;color:var(--ink2);}
.cap-track{height:3px;background:var(--bdr);border-radius:2px;overflow:hidden;}
.cap-track-fill{height:3px;background:linear-gradient(90deg,var(--or),var(--pk));border-radius:2px;transition:width .3s;}
.cap-track-fill.over{background:var(--pk);}

/* ── GAMES BAR ── */
.games-bar{background:var(--hdr);border-bottom:2px solid var(--pk);padding:8px 16px;overflow-x:auto;display:flex;gap:8px;flex-shrink:0;scrollbar-width:none;}
.games-bar::-webkit-scrollbar{display:none;}
.game-chip{flex-shrink:0;padding:5px 12px;background:var(--bg3);border:1px solid var(--bdr2);border-radius:20px;font-family:var(--fd);font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer;transition:all .15s;white-space:nowrap;}
.game-chip:hover{border-color:var(--pk);color:var(--pk);}
.game-chip.active{background:rgba(255,95,160,.15);border-color:var(--pk);color:var(--pk);}
.game-chip.all{border-color:var(--bdr2);color:var(--ink3);}
.game-chip.all.active{background:rgba(0,229,212,.1);border-color:var(--or);color:var(--or);}
.games-loading{font-family:var(--fd);font-size:12px;color:var(--ink3);padding:6px 0;}

/* ── MAIN LAYOUT ── */
.main{display:flex;flex:1 1 0%;min-height:0;overflow:hidden;}

/* ── ROSTER PANEL ── */
.roster-panel{width:380px;flex-shrink:0;border-right:1px solid var(--bdr);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;min-height:0;}
.roster-panel.expanded{width:100%;border-right:none;}
.roster-title{padding:12px 20px;font-family:var(--fd);font-size:13px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--bdr);background:var(--bg2);flex-shrink:0;}
.roster-slots{padding:10px 14px;}
.roster-slots::-webkit-scrollbar{width:5px;}
.roster-slots::-webkit-scrollbar-track{background:transparent;}
.roster-slots::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px;}
.roster-slots::-webkit-scrollbar-thumb:hover{background:var(--or);}
.roster-slot{background:var(--bg3);border-radius:10px;margin-bottom:8px;border:1px solid var(--bdr);cursor:pointer;transition:all .15s;overflow:hidden;}
.roster-slot:hover{border-color:var(--bdr2);}
.roster-slot.active{border-color:var(--or);box-shadow:0 0 0 1px var(--or);}
.roster-slot.filled{border-color:var(--bdr2);}
.roster-slot.filled:hover{border-color:var(--or);}
.slot-hdr{display:flex;align-items:center;gap:10px;padding:9px 12px;}
.slot-pos-tag{font-family:var(--fd);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;min-width:38px;}
.slot-empty-lbl{font-family:var(--fd);font-size:14px;color:var(--ink3);flex:1;}
.slot-tap-hint{font-family:var(--fd);font-size:10px;color:var(--ink3);opacity:.6;text-transform:uppercase;letter-spacing:.5px;}
.slot-player-body{padding:0 12px 10px;}
.slot-player-name{font-family:var(--fd);font-size:17px;font-weight:800;color:var(--ink);}
.slot-player-meta{display:flex;align-items:center;gap:8px;margin-top:2px;}
.slot-player-team{font-family:var(--fd);font-size:11px;color:var(--ink3);text-transform:uppercase;}
.slot-player-sal{font-family:var(--fd);font-size:13px;font-weight:700;color:var(--or);}
.slot-remove-btn{background:rgba(255,95,160,.1);border:1px solid rgba(255,95,160,.3);color:var(--pk);font-family:var(--fd);font-size:11px;font-weight:800;cursor:pointer;padding:4px 10px;border-radius:6px;margin-left:auto;text-transform:uppercase;letter-spacing:.3px;transition:all .15s;}
.slot-remove-btn:hover{background:var(--pk);color:#fff;border-color:var(--pk);}

/* ── SUBMIT ── */
.submit-area{position:sticky;bottom:0;padding:12px 14px;border-top:1px solid var(--bdr);background:var(--bg2);flex-shrink:0;}
.submit-btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--or),var(--pk));border:none;border-radius:10px;color:#050808;font-family:var(--fd);font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;cursor:pointer;transition:opacity .15s;}
.submit-btn:hover{opacity:.9;}
.submit-btn:disabled{opacity:.35;cursor:not-allowed;background:var(--bg4);color:var(--ink3);border:1px solid var(--bdr);}
.submit-msg{font-family:var(--fd);font-size:11px;text-align:center;margin-top:6px;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;min-height:14px;}
.submit-msg.ok{color:var(--or);}
.submit-msg.err{color:var(--pk);}

/* ── PLAYER PICKER PANEL ── */
.picker-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);min-height:0;}
.picker-panel.collapsed{display:none !important;}
.picker-header{padding:12px 20px;border-bottom:1px solid var(--bdr);background:var(--bg2);flex-shrink:0;display:flex;align-items:center;gap:12px;}
.picker-slot-label{font-family:var(--fd);font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;}
.picker-game-filter{font-family:var(--fd);font-size:12px;color:var(--pk);background:rgba(255,95,160,.1);border:1px solid rgba(255,95,160,.3);padding:3px 10px;border-radius:12px;}
.picker-clear-btn{margin-left:auto;background:none;border:none;font-family:var(--fd);font-size:12px;color:var(--ink3);cursor:pointer;text-transform:uppercase;letter-spacing:.5px;padding:4px 8px;border-radius:6px;border:1px solid var(--bdr);}
.picker-clear-btn:hover{color:var(--or);border-color:var(--or);}
.picker-search-bar{padding:10px 16px;border-bottom:1px solid var(--bdr);background:var(--bg2);flex-shrink:0;position:relative;}
.picker-search{width:100%;padding:8px 12px 8px 36px;background:var(--bg3);border:1px solid var(--bdr2);border-radius:8px;color:var(--or);font-family:var(--fb);font-size:14px;outline:none;}
.picker-search:focus{border-color:var(--or);}
.picker-search::placeholder{color:var(--ink3);}
.picker-search-ico{position:absolute;left:28px;top:50%;transform:translateY(-50%);stroke:var(--ink3);fill:none;stroke-width:2;stroke-linecap:round;width:15px;height:15px;}
.picker-list{flex:1;overflow-y:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--bdr2) transparent;}
.picker-list::-webkit-scrollbar{width:5px;}
.picker-list::-webkit-scrollbar-track{background:transparent;}
.picker-list::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px;}
.picker-list::-webkit-scrollbar-thumb:hover{background:var(--or);}
.picker-empty{padding:60px 20px;text-align:center;color:var(--ink3);}
.picker-empty-icon{font-size:36px;margin-bottom:10px;opacity:.5;}
.picker-empty-title{font-family:var(--fd);font-size:16px;font-weight:700;color:var(--ink2);text-transform:uppercase;margin-bottom:4px;}
.picker-empty-sub{font-size:13px;line-height:1.6;}

/* ── PLAYER ROW ── */
.player-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .1s;}
.player-row:hover{background:var(--bg3);}
.player-row.selected{background:rgba(0,229,212,.06);border-left:3px solid var(--or);}
.player-row.disabled{opacity:.4;cursor:not-allowed;pointer-events:none;}
.p-pos{font-family:var(--fd);font-size:11px;font-weight:800;width:30px;text-align:center;padding:3px 0;border-radius:5px;flex-shrink:0;}
.p-info{flex:1;min-width:0;}
.p-name{font-family:var(--fd);font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.p-meta{font-family:var(--fd);font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.3px;}
.p-inj{font-family:var(--fd);font-size:10px;font-weight:800;padding:1px 5px;border-radius:4px;text-transform:uppercase;margin-left:4px;}
.inj-Q{background:rgba(255,154,58,.2);color:#FF9A3A;}
.inj-D,.inj-O{background:rgba(255,95,160,.2);color:var(--pk);}
.p-proj{font-family:var(--fd);font-size:11px;color:var(--ink3);text-align:right;min-width:36px;}
.p-sal{font-family:var(--fd);font-size:15px;font-weight:800;color:var(--ink2);text-align:right;min-width:62px;}

/* ── NO SLOT SELECTED ── */
.pick-prompt{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:40px;text-align:center;}
.pick-prompt-icon{font-size:48px;opacity:.3;}
.pick-prompt-title{font-family:var(--fd);font-size:20px;font-weight:800;color:var(--ink2);text-transform:uppercase;}
.pick-prompt-sub{font-size:14px;color:var(--ink3);line-height:1.6;}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--or);border-radius:10px;padding:10px 20px;font-family:var(--fd);font-size:14px;font-weight:700;color:var(--or);z-index:9999;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;}
.toast.show{opacity:1;}
.toast.err{border-color:var(--pk);color:var(--pk);}

/* ── MOBILE ── */
@media(max-width:860px){
  #picker-games-bar{display:flex !important;}
  html,body{overflow:auto;}
  .main{flex-direction:column;overflow:visible;}
  .roster-panel{width:100%;border-right:none;border-bottom:1px solid var(--bdr);overflow:visible;}
  .roster-slots{overflow:visible;padding:10px 12px;}
  .picker-panel{display:none;position:fixed;inset:0;z-index:200;background:var(--bg);}
  .picker-panel.open{display:flex;flex-direction:column;}
  .picker-panel .picker-games-mobile{display:block;}
  .picker-list{flex:1;overflow-y:auto;}
  body{overflow-y:auto;}
}

/* ── NEWS MODAL ── */
.news-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:none;align-items:flex-end;justify-content:center;pointer-events:none;}
.news-overlay.open{display:flex;pointer-events:all;}
.news-sheet{background:var(--bg2);border-radius:16px 16px 0 0;border-top:2px solid var(--or);width:100%;max-width:600px;max-height:80vh;display:flex;flex-direction:column;}
.news-sheet-hdr{padding:14px 20px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.news-sheet-name{font-family:var(--fd);font-size:18px;font-weight:800;color:var(--or);text-transform:uppercase;}
.news-sheet-meta{font-family:var(--fd);font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.news-sheet-close{background:none;border:1px solid var(--bdr2);color:var(--ink3);font-size:14px;width:28px;height:28px;border-radius:6px;cursor:pointer;}
.news-body{overflow-y:auto;flex:1;}
.news-item{padding:14px 20px;border-bottom:1px solid var(--bdr);}
.news-item:last-child{border-bottom:none;}
.news-item-title{font-family:var(--fd);font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px;line-height:1.4;}
.news-item-body{font-size:13px;color:var(--ink2);line-height:1.6;}
.news-item-meta{font-family:var(--fd);font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;margin-top:6px;}
.news-loading{padding:40px 20px;text-align:center;color:var(--ink3);font-family:var(--fd);font-size:14px;}
.draft-btn{flex-shrink:0;background:rgba(0,229,212,.12);border:1px solid rgba(0,229,212,.3);color:var(--or);font-family:var(--fd);font-size:12px;font-weight:800;padding:5px 12px;border-radius:8px;cursor:pointer;text-transform:uppercase;letter-spacing:.3px;transition:all .15s;white-space:nowrap;}
.draft-btn:hover{background:var(--or);color:#050808;border-color:var(--or);}
.draft-btn.drafted{background:rgba(255,95,160,.1);border-color:rgba(255,95,160,.3);color:var(--pk);}
.draft-btn.drafted:hover{background:var(--pk);color:#fff;border-color:var(--pk);}


[data-theme="light"]{
  --hdr:#F0F8F8;--bg:#F5FAFA;--bg2:#EAFAFF;--bg3:#E0F4F4;--bg4:#D0EEEE;
  --or:#007A70;--pk:#CC3070;--pu:#6030CC;
  --ink:#0A1818;--ink2:#1A6060;--ink3:#3A8888;
  --bdr:#B0DEDE;--bdr2:#80CCCC;
}
[data-theme="light"] .hdr{border-bottom:1px solid var(--bdr);}
[data-theme="light"] .player-row:hover{background:var(--bg3);}
[data-theme="light"] .draft-btn{background:rgba(0,122,112,.12);border-color:rgba(0,122,112,.3);color:var(--or);}
[data-theme="light"] .draft-btn:hover{background:var(--or);color:#fff;}
[data-theme="light"] .draft-btn.drafted{background:rgba(204,48,112,.1);border-color:rgba(204,48,112,.3);color:var(--pk);}
[data-theme="light"] .picker-search{background:var(--bg3);border-color:var(--bdr2);color:var(--or);}
[data-theme="light"] .news-sheet{background:var(--bg2);}
[data-theme="light"] .news-overlay{background:rgba(0,0,0,.4);}

</style>
</head>

<script>
// ── CONFIG ────────────────────────────────────────────────────
var FB_DB_URL = 'https://fantasy-refresh-default-rtdb.firebaseio.com';
var FR_SEASON = '2026';
var PS_MODE   = false;
var PS_WEEK   = 1;
var TEST_MODE = false; // ?testMode=hof swaps all data to mock endpoints
var CAP = 60000;
var SLOT_DEFS = [
  {id:'qb1', pos:'QB',   label:'QB',   eligible:['QB']},
  {id:'rb1', pos:'RB',   label:'RB',   eligible:['RB']},
  {id:'rb2', pos:'RB',   label:'RB',   eligible:['RB']},
  {id:'wr1', pos:'WR',   label:'WR',   eligible:['WR']},
  {id:'wr2', pos:'WR',   label:'WR',   eligible:['WR']},
  {id:'wr3', pos:'WR',   label:'WR',   eligible:['WR']},
  {id:'te1', pos:'TE',   label:'TE',   eligible:['TE']},
  {id:'fx1', pos:'FLEX', label:'FLEX', eligible:['WR','RB','TE']},
  {id:'df1', pos:'DEF',  label:'DEF',  eligible:['DEF']}
];
var POS_COLORS = {QB:'var(--or)',RB:'var(--pk)',WR:'var(--pu)',TE:'#FF9A3A',DEF:'#69BE28',FLEX:'var(--ink2)',SUPERFLEX:'#FFD23F'};

// Builds SLOT_DEFS from the league's rosterConfig instead of the hardcoded
// 9-slot default — any count beyond the standard baseline (1 QB, 2 RB,
// 3 WR, 1 TE) becomes a flex-type slot rather than a dedicated single-
// position one. A 3rd RB, 4th WR, or 2nd TE becomes FLEX; a 2nd QB (a
// superflex league) becomes SUPERFLEX (QB/RB/WR/TE eligible). With
// standard counts this produces an array identical to the default above,
// so existing leagues see no change at all.
function buildSlotDefsFromConfig(cfg){
  var qbCount   = cfg.qb    != null ? cfg.qb    : 1;
  var rbCount   = cfg.rb    != null ? cfg.rb    : 2;
  var wrCount   = cfg.wr    != null ? cfg.wr    : 3;
  var teCount   = cfg.te    != null ? cfg.te    : 1;
  var flexCount = cfg.flex  != null ? cfg.flex  : 1;
  var defCount  = cfg.def   != null ? cfg.def   : 1;
  var STD = { qb:1, rb:2, wr:3, te:1 };

  var flexElig = ['RB','WR','TE'];
  if(cfg.flexEligible && cfg.flexEligible.qb) flexElig = ['QB','RB','WR','TE'];

  var defs = [];
  for(var i = 1; i <= qbCount; i++){
    defs.push(i <= STD.qb
      ? {id:'qb'+i, pos:'QB', label:'QB', eligible:['QB']}
      : {id:'qb'+i, pos:'SUPERFLEX', label:'SUPERFLEX', eligible:['QB','RB','WR','TE']});
  }
  for(var r = 1; r <= rbCount; r++){
    defs.push(r <= STD.rb
      ? {id:'rb'+r, pos:'RB', label:'RB', eligible:['RB']}
      : {id:'rb'+r, pos:'FLEX', label:'FLEX', eligible:flexElig.slice()});
  }
  for(var w = 1; w <= wrCount; w++){
    defs.push(w <= STD.wr
      ? {id:'wr'+w, pos:'WR', label:'WR', eligible:['WR']}
      : {id:'wr'+w, pos:'FLEX', label:'FLEX', eligible:flexElig.slice()});
  }
  for(var t = 1; t <= teCount; t++){
    defs.push(t <= STD.te
      ? {id:'te'+t, pos:'TE', label:'TE', eligible:['TE']}
      : {id:'te'+t, pos:'FLEX', label:'FLEX', eligible:flexElig.slice()});
  }
  for(var f = 1; f <= flexCount; f++){
    defs.push({id:'fx'+f, pos:'FLEX', label:'FLEX', eligible:flexElig.slice()});
  }
  for(var d = 1; d <= defCount; d++){
    defs.push({id:'df'+d, pos:'DEF', label:'DEF', eligible:['DEF']});
  }
  return defs;
}

// ── STATE ─────────────────────────────────────────────────────
var allPlayers   = [];
var lineup       = {};   // {slotId: player}
var activeSlot   = null; // currently picking for this slotId
var activeGame   = null; // game filter: {home, away, teams:[]}
var currentWeek  = 1;
var schedule     = [];   // [{home,away,time,teams:[]}]
var currentUser  = null;

// ── BOOT ──────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function(){
  try{
    if(typeof FRAuth !== 'undefined' && FRAuth.getUser){
      currentUser = FRAuth.getUser();
    } else {
      var u = localStorage.getItem('fr_user_'+FR_SEASON);
      if(u) currentUser = JSON.parse(u);
    }
  }catch(e){}

  function startBoot(){
    SLOT_DEFS.forEach(function(s){ lineup[s.id] = null; });
    renderRoster();
    loadWeekAndData();
    fixMainHeightForScaledDisplays();
    window.addEventListener('resize', fixMainHeightForScaledDisplays);
  }

  // Build SLOT_DEFS from the league's actual roster config before anything
  // else runs — if this fails or the league uses standard counts, the
  // default array already declared above is identical, so nothing changes.
  if(typeof FRAuth !== 'undefined' && FRAuth.getLeagueCtx && typeof FR !== 'undefined' && FR.fb){
    var ctx0 = FRAuth.getLeagueCtx();
    var leagueId0 = ctx0 ? ctx0.leagueId : 'fr_refresh26';
    FR.fb.get('/leagues/' + leagueId0 + '/settings').then(function(settings){
      if(settings && settings.rosterConfig){
        SLOT_DEFS = buildSlotDefsFromConfig(settings.rosterConfig);
      }
    }).catch(function(){}).then(startBoot);
  } else {
    startBoot();
  }
});

// ── DPI-SCALING SAFETY NET ───────────────────────────────────────
// On some displays with non-100% browser/OS zoom, flex:1 with a 0%
// basis can fail to shrink correctly due to sub-pixel rounding, causing
// .main to grow to its content height instead of fitting the viewport.
// This explicitly sets the correct height as a fallback after layout.
function fixMainHeightForScaledDisplays(){
  var main = document.querySelector('.main');
  if(!main) return;
  // Only the desktop split-panel layout needs this — mobile uses normal page scroll
  if(window.innerWidth <= 860) { main.style.height = ''; return; }
  requestAnimationFrame(function(){
    var hdr  = document.querySelector('.hdr');
    var cap  = document.querySelector('.cap-bar');
    var games = document.querySelector('.games-bar');
    var used = (hdr ? hdr.offsetHeight : 0) + (cap ? cap.offsetHeight : 0) + (games ? games.offsetHeight : 0);
    var target = window.innerHeight - used;
    if(target > 100 && Math.abs(main.clientHeight - target) > 2){
      main.style.height = target + 'px';
    }
  });
}

// ── LOAD ──────────────────────────────────────────────────────
function loadWeekAndData(){
  // Test mode — use mock HOF data
  if(TEST_MODE){
    document.getElementById('hdr-week').textContent = 'HOF Test — CAR @ ARI';
    document.getElementById('week-label').textContent = 'HOF Game (Test)';
    loadSalaries();
    loadSchedule();
    loadLocks();
    return;
  }
  // Preseason mode — week and season already set from URL params
  if(PS_MODE){
    var label = 'PS Week '+currentWeek+' Draft';
    document.getElementById('hdr-week').textContent = label;
    document.getElementById('week-label').textContent = 'PS Week '+currentWeek;
    loadSalaries();
    loadSchedule();
    loadSubmitted();
    loadLocks();
    return;
  }
  fetch(FR.paths.url(FR.paths.season()) + '?shallow=true')
    .then(function(r){ return r.json(); })
    .then(function(keys){
      if(keys && typeof keys === 'object'){
        var weeks = Object.keys(keys).filter(function(k){ return !isNaN(Number(k)); }).map(Number);
        currentWeek = weeks.length ? Math.min(Math.max.apply(null,weeks)+1, 18) : 1;
      }
      document.getElementById('hdr-week').textContent = 'Week '+currentWeek+' Draft';
      document.getElementById('week-label').textContent = 'Week '+currentWeek;
      loadSalaries();
      loadSchedule();
      loadSubmitted();
      loadLocks();
    })
    .catch(function(){ currentWeek=1; loadSalaries(); loadSchedule(); });
}


// ── TEST / LIVE DATA HELPER ──────────────────────────────────
function workerFetch(endpoint, params){
  var base = WORKER + (TEST_MODE ? '/test?endpoint=' + endpoint : '/' + endpoint + (params ? '?' + params : ''));
  return fetch(base).then(function(r){ return r.json(); });
}
function loadSalaries(){
  // Test mode — use mock HOF salaries from worker
  if(TEST_MODE){
    workerFetch('salaries').then(function(data){
      allPlayers = Object.values(data.players||{}).filter(function(p){ return p && p.name && p.pos; });
      renderPool();
    }).catch(function(){});
    return;
  }
  // Preseason: try preseason salaries, fall back to flat from pool
  var salPath = PS_MODE
    ? FR.paths.url(FR.paths.preSeasonSal(currentWeek))
    : FR.paths.url(FR.paths.weekSalaries(currentWeek));

  fetch(salPath)
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(data && data.players && Object.keys(data.players).length){
        allPlayers = Object.values(data.players).filter(function(p){ return p && p.name && p.pos; });
        if(!schedule.length) buildGamesBarFromPlayers();
        renderPool();
        repriceLineup();   // saved lineup may have loaded first with stale snapshot prices
        return;
      }
      // Real salaries haven't been generated for this week yet — fall back
      // to flat default pricing (the existing testing mechanism) rather
      // than just showing an empty picker. This used to only apply during
      // preseason; it's just as needed for a regular-season week before
      // real pricing/projections exist.
      loadFlatSalariesFromPool();
    })
    .catch(function(){ loadFlatSalariesFromPool(); });
}

function loadFlatSalariesFromPool(){
  var FLAT = {QB:8500, RB:6500, WR:6000, TE:5500, DEF:5000};
  FR.fb.getPlayerPool()
    .then(function(players){
      if(!players) return;
      allPlayers = Object.values(players)
        .filter(function(p){ return p && p.name && p.pos && p.team && FLAT[p.pos] && p.status !== 'O' && p.status !== 'IR'; })
        .map(function(p){
          return {id:p.id, name:p.name, pos:p.pos, team:p.team,
                  salary:FLAT[p.pos], proj:null, status:p.status||null};
        });
      // In preseason mode — filter to only teams playing this week
      if(PS_MODE && schedule.length){
        filterPlayersToSchedule();
      } else if(!schedule.length){
        buildGamesBarFromPlayers();
      }
      renderPool();
    })
    .catch(function(err){ FR.handleError(err, "Couldn't load players — try refreshing"); });
}

// Some data providers use different abbreviations for the same team across
// different endpoints — Washington in particular shows up as both WAS and
// WSH depending on the source. Normalize before comparing anywhere a team
// abbreviation gets matched, so a mismatch here can't silently make an
// entire team's players disappear from the pool.
var TEAM_ALIASES = { WAS: 'WSH', WSH: 'WSH' };
function normTeam(abbr){ return TEAM_ALIASES[abbr] || abbr; }

function filterPlayersToSchedule(){
  // Build set of teams playing this week from schedule
  var playingTeams = {};
  schedule.forEach(function(g){
    if(g.teams) g.teams.forEach(function(t){ playingTeams[normTeam(t)] = true; });
  });
  if(!Object.keys(playingTeams).length) return;
  allPlayers = allPlayers.filter(function(p){ return playingTeams[normTeam(p.team)]; });
}


var WORKER      = 'https://fantasy-refresh-news.mtriedel.workers.dev';
var gameOdds    = {};
var teamLocks   = {};

// ── HARDCODED 2026 PRESEASON SCHEDULE ──────────────────────────

function getHardcodedPreseasonSchedule(week){
  var games = PRESEASON_SCHEDULE[week] || [];
  return games.map(function(g){
    return { home: g.home, away: g.away, time: g.time, teams: [g.home, g.away] };
  });
}

function loadSchedule(){
  if(TEST_MODE){
    workerFetch('schedule').then(function(data){
      schedule = data.games || [];
      buildGamesBar(schedule);
      workerFetch('odds').then(function(od){
        if(od && od.odds){ Object.assign(gameOdds, od.odds); buildGamesBar(schedule); }
      }).catch(function(){});
    }).catch(function(){});
    return;
  }
  var seasonType = PS_MODE ? 'Preseason' : 'Regular';
  // Tank01 numbers preseason weeks starting at 0 (HOF Game = week 0).
  // Our app uses 1-4 (1=HOF, 2=PS Wk1, 3=PS Wk2, 4=PS Wk3) — translate before calling the API.
  var apiWeek = PS_MODE ? (currentWeek - 1) : currentWeek;
  fetch(WORKER + '/schedule?week='+apiWeek+'&season=2026&seasonType='+seasonType)
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(!data || !data.games || !data.games.length) throw new Error('No games');
      schedule = data.games;
      buildGamesBar(schedule);

      // In preseason: re-filter player pool to only teams playing this week
      if(PS_MODE && allPlayers.length){
        filterPlayersToSchedule();
        renderPool();
      }

      // Fetch odds in background — group games by date to minimize API calls
      if(!PS_MODE){
        var dates = {};
        schedule.forEach(function(g){
          if(g.time){
            var d = new Date(g.time);
            var dateStr = d.getFullYear()
              + String(d.getMonth()+1).padStart(2,'0')
              + String(d.getDate()).padStart(2,'0');
            dates[dateStr] = true;
          }
        });
        // Fetch odds for each unique game date
        Object.keys(dates).forEach(function(dateStr){
          fetch(WORKER + '/odds?gameDate=' + dateStr)
            .then(function(r){ return r.json(); })
            .then(function(data){
              if(data && data.odds){
                Object.assign(gameOdds, data.odds);
                buildGamesBar(schedule); // re-render with O/U
              }
            })
            .catch(function(){});
        });
      }
    })
    .catch(function(){
      // API unavailable or no subscription — use hardcoded preseason schedule if applicable
      if(PS_MODE){
        var fallback = getHardcodedPreseasonSchedule(currentWeek);
        if(fallback.length){
          schedule = fallback;
          buildGamesBar(schedule);
          if(allPlayers.length){
            filterPlayersToSchedule();
            renderPool();
          }
          return;
        }
      }
      setTimeout(buildGamesBarFromPlayers, 500);
    });
}

function buildGamesBar(games){
  var bar = document.getElementById('games-bar');
  var pickerBar = document.getElementById('picker-games-bar');
  if(!games || !games.length){
    buildGamesBarFromPlayers();
    return;
  }
  var html = '<button class="game-chip all active" data-game="all" onclick="setGameFilter(null,this)">All Games</button>';
  games.forEach(function(g, i){
    var label = (g.away||'?') + ' @ ' + (g.home||'?');
    var sub   = '';
    if(g.time){
      var d        = new Date(g.time);
      var day      = d.getDay();
      var hr       = d.getHours();
      var timeStr  = d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})+' ET';
      var days     = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      var dayLabel;
      if(day===1&&hr>=18){       dayLabel = 'MNF';
      } else if(day===0&&hr>=19){ dayLabel = 'SNF';
      } else if(day===4&&hr>=18){ dayLabel = 'TNF';
      } else {                    dayLabel = days[day]; }
      var intlBadge = g.international
        ? '<div style="font-size:9px;font-weight:800;color:#FF9A3A;margin-top:1px;">INT&#39;L</div>' : '';
      // O/U badge — look up by gameId
      var ouBadge = '';
      if(g.gameId && gameOdds[g.gameId] && gameOdds[g.gameId].overUnder){
        ouBadge = '<div style="font-size:9px;font-weight:800;color:#9B6DFF;margin-top:1px;">O/U '+gameOdds[g.gameId].overUnder+'</div>';
      }
      sub = '<div style="font-size:9px;margin-top:2px;display:flex;gap:4px;justify-content:center;">'
          + '<span style="color:var(--pk);font-weight:800;">'+dayLabel+'</span>'
          + '<span style="color:var(--ink3);">'+timeStr+'</span>'
          + '</div>'
          + intlBadge + ouBadge;
    }
    html += '<button class="game-chip" data-game="'+i+'" onclick="setGameFilter('+i+',this)" style="text-align:center;padding:5px 12px;">'+label+sub+'</button>';
  });
  bar.innerHTML = html;
  if(pickerBar) pickerBar.innerHTML = html;
}

function buildGamesBarFromPlayers(){
  // Build rough team pairings from player pool — no recursion back to buildGamesBar
  var bar = document.getElementById('games-bar');
  var pickerBar = document.getElementById('picker-games-bar');
  var teams = {};
  allPlayers.forEach(function(p){ if(p.team) teams[p.team] = 1; });
  var teamList = Object.keys(teams).sort();
  var games = [];
  for(var i = 0; i < teamList.length; i += 2){
    if(teamList[i+1]){
      games.push({home:teamList[i+1], away:teamList[i], teams:[teamList[i], teamList[i+1]]});
    } else {
      games.push({home:teamList[i], away:'', teams:[teamList[i]]});
    }
  }
  schedule = games;
  // Build HTML directly — no call back to buildGamesBar
  var html = '<button class="game-chip all active" data-game="all" onclick="setGameFilter(null,this)">All Games</button>';
  games.forEach(function(g, i){
    var label = g.away ? g.away + ' @ ' + g.home : g.home;
    html += '<button class="game-chip" data-game="'+i+'" onclick="setGameFilter('+i+',this)">'+label+'</button>';
  });
  if(bar) bar.innerHTML = html;
  if(pickerBar) pickerBar.innerHTML = html;
}

function setGameFilter(gameIdx, btn){
  var key = gameIdx === null ? 'all' : String(gameIdx);
  document.querySelectorAll('.game-chip').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-game') === key);
  });
  activeGame = gameIdx === null ? null : (schedule[gameIdx] || null);
  var badge = document.getElementById('picker-game-filter');
  if(activeGame){
    badge.textContent = activeGame.away + ' @ ' + activeGame.home;
    badge.style.display = 'inline-flex';
  } else {
    badge.style.display = 'none';
  }

  if(activeGame){
    // Game selected — always show side-by-side regardless of slot state
    document.getElementById('picker-panel').classList.add('open');
    document.getElementById('picker-slot-label').textContent = activeGame.away + ' @ ' + activeGame.home;
    document.getElementById('picker-slot-label').style.color = 'var(--pk)';
    document.getElementById('picker-search').value = '';
    renderGamePreview(activeGame);
  } else {
    // All Games cleared
    document.getElementById('picker-slot-label').textContent = activeSlot
      ? SLOT_DEFS.find(function(s){ return s.id===activeSlot; }).label
      : 'All Players';
    document.getElementById('picker-slot-label').style.color = activeSlot
      ? (POS_COLORS[SLOT_DEFS.find(function(s){ return s.id===activeSlot; }).pos] || 'var(--or)')
      : 'var(--ink2)';
    document.getElementById('picker-panel').classList.remove('open');
    renderPicker();
  }
}

function renderGamePreview(game){
  var POS_ORDER = {QB:0, RB:1, WR:2, TE:3, DEF:4};

  function sortByPos(a, b){
    var pa = POS_ORDER[a.pos] !== undefined ? POS_ORDER[a.pos] : 9;
    var pb = POS_ORDER[b.pos] !== undefined ? POS_ORDER[b.pos] : 9;
    if(pa !== pb) return pa - pb;
    return b.salary - a.salary; // within same position, sort by salary
  }

  var draftedInPreview = {};
  Object.keys(lineup).forEach(function(sid){ if(lineup[sid]) draftedInPreview[lineup[sid].id] = true; });

  // If a slot is active, only show eligible positions for that slot
  var slot = activeSlot ? SLOT_DEFS.find(function(s){ return s.id === activeSlot; }) : null;

  var awayPlayers = allPlayers.filter(function(p){
    if(normTeam(p.team) !== normTeam(game.away)) return false;
    if(draftedInPreview[p.id]) return false;
    if(slot && slot.eligible.indexOf(p.pos) < 0) return false;
    return true;
  }).sort(sortByPos);

  var homePlayers = allPlayers.filter(function(p){
    if(normTeam(p.team) !== normTeam(game.home)) return false;
    if(draftedInPreview[p.id]) return false;
    if(slot && slot.eligible.indexOf(p.pos) < 0) return false;
    return true;
  }).sort(sortByPos);

  var inLineup = {};
  Object.values(lineup).forEach(function(p){ if(p) inLineup[p.id] = true; });

  function playerRow(p){
    var isIn  = !!inLineup[p.id];
    var isOut = p.status === 'O' || p.status === 'IR';
    var posColor = POS_COLORS[p.pos] || 'var(--ink2)';
    var injBadge = (p.status && p.status !== 'Active')
      ? '<span class="p-inj inj-'+p.status+'">'+p.status+'</span>' : '';
    var isIn2 = !!inLineup[p.id];
    var locked2   = isPlayerLocked(p);
    // Same cap math as the main picker — exclude whoever currently
    // occupies the active slot, since they're the one being replaced.
    var currentOccupantSalary = (activeSlot && lineup[activeSlot]) ? (lineup[activeSlot].salary || 0) : 0;
    var spentExRepl = getSpent() - currentOccupantSalary;
    var wouldOvr2 = !isIn2 && (spentExRepl + p.salary > CAP);
    var cls = 'player-row'+(isIn2?' selected':'')+((isOut||wouldOvr2)?' disabled':'');
    var draftLbl2 = isIn2 ? '✓' : locked2 ? '🔒' : wouldOvr2 ? '💰' : '+';
    var draftCls2 = 'draft-btn' + (isIn2 || locked2 || wouldOvr2 ? ' drafted' : '');
    return '<div class="'+cls+'">'
      + '<div class="p-pos" style="background:'+posColor+'18;color:'+posColor+'">'+p.pos+'</div>'
      + '<div class="p-info" onclick="openNews(\''+p.id+'\',event)" style="cursor:pointer;">'
      +   '<div class="p-name">'+p.name+injBadge+'</div>'
      +   '<div class="p-meta">'+(p.proj ? p.proj+' proj' : '—')+'</div>'
      + '</div>'
      + '<div class="p-sal" style="font-size:12px;">$'+(p.salary||0).toLocaleString()+'</div>'
      + '<button class="'+draftCls2+'" onclick="pickFromPreview(\''+p.id+'\')">' + draftLbl2 + '</button>'
      + '</div>';
  }

  var html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0;">'

    // Away team
    + '<div style="border-right:1px solid var(--bdr);">'
    + '<div style="padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--bdr);font-family:var(--fd);font-size:13px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;text-align:center;">'+game.away+'</div>'
    + awayPlayers.map(playerRow).join('')
    + '</div>'

    // Home team
    + '<div>'
    + '<div style="padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--bdr);font-family:var(--fd);font-size:13px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;text-align:center;">'+game.home+'</div>'
    + homePlayers.map(playerRow).join('')
    + '</div>'

    + '</div>';

  document.getElementById('picker-list').innerHTML = html;
}

function pickFromPreview(playerId){
  var p = allPlayers.find(function(x){ return x.id === playerId; });
  if(!p) return;
  if(p.status === 'O' || p.status === 'IR'){ showToast(p.name+' is out', true); return; }
  if(isPlayerLocked(p)){ showToast(p.name+' is locked 🔒', true); return; }

  // If a slot is already active (selected before opening the game view),
  // replace directly in that slot — same behavior as the normal picker.
  var slot = activeSlot ? SLOT_DEFS.find(function(s){ return s.id === activeSlot; }) : null;
  if(slot && slot.eligible.indexOf(p.pos) < 0) slot = null; // active slot wrong position — fall through to search

  if(!slot){
    // No active slot, or wrong position — find first slot eligible for this position,
    // preferring an empty one but allowing replacement of a filled one if none are empty.
    var emptySlot = null, filledSlot = null;
    for(var i = 0; i < SLOT_DEFS.length; i++){
      var s = SLOT_DEFS[i];
      if(s.eligible.indexOf(p.pos) < 0) continue;
      if(!lineup[s.id]){ emptySlot = s; break; }
      if(!filledSlot && !isPlayerLocked(lineup[s.id])) filledSlot = s;
    }
    slot = emptySlot || filledSlot;
  }
  if(!slot){ showToast('No available slot for '+p.pos, true); return; }

  // If this exact player is already in that slot — no-op
  if(lineup[slot.id] && lineup[slot.id].id === playerId){ return; }

  // Check cap, excluding the player currently occupying the target slot
  var currentSlotCost = lineup[slot.id] ? lineup[slot.id].salary : 0;
  var spent = getSpent() - currentSlotCost;
  if(spent + p.salary > CAP){ showToast('Over cap!', true); return; }

  // If this player is already in a different slot, clear that slot first
  Object.keys(lineup).forEach(function(sid){
    if(lineup[sid] && lineup[sid].id === playerId) lineup[sid] = null;
  });

  var replaced = lineup[slot.id] ? lineup[slot.id].name : null;
  lineup[slot.id] = p;
  renderRoster();
  updateCap();
  renderGamePreview(activeGame); // refresh preview to show selection
  showToast(replaced ? (replaced+' replaced with '+p.name+' ✓') : (p.name+' → '+slot.label+' ✓'));
}

function loadSubmitted(){
  if(!currentUser) return;
  fetch(FR.paths.url(FR.paths.myLineup(currentWeek, currentUser.uid)))
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(!data || !data.slots) return;
      SLOT_DEFS.forEach(function(s){ if(data.slots[s.id]) lineup[s.id] = data.slots[s.id]; });
      repriceLineup();   // sync snapshot salaries to the current week's sheet
      renderRoster();
      updateCap();
      document.getElementById('submit-msg').textContent = '✓ Submitted — tap any slot to update';
      document.getElementById('submit-msg').className = 'submit-msg ok';
      document.getElementById('submit-btn').textContent = '↑ Update Lineup';
    })
    .catch(function(err){ console.error('[FR] Failed to load saved lineup:', err); });
}

// ── LINEUP RE-PRICING ──────────────────────────────────────────
// Saved lineups store full player objects with the salary snapshotted at
// draft time. When the week's salary sheet regenerates (e.g. flat fallback
// replaced by real projections), those snapshots go stale — the roster and
// cap math would silently use old prices. This re-syncs every drafted
// player's salary/proj to the CURRENT sheet whenever both are loaded.
// Runs from both loadSubmitted() and loadSalaries() since either can
// finish first. Players no longer on the sheet keep their snapshot price
// (they'd be flagged at lock time anyway).
function repriceLineup(){
  if(!allPlayers || !allPlayers.length) return;
  var byId = {};
  allPlayers.forEach(function(p){ byId[p.id] = p; });
  var changed = false;
  Object.keys(lineup).forEach(function(sid){
    var lp = lineup[sid];
    if(!lp || !lp.id) return;
    var cur = byId[lp.id];
    if(cur && (cur.salary !== lp.salary || cur.proj !== lp.proj)){
      lp.salary = cur.salary;
      lp.proj   = cur.proj;
      changed = true;
    }
  });
  if(changed){ renderRoster(); updateCap(); }
}

// ── ROSTER RENDER ──────────────────────────────────────────────
function renderRoster(){
  var html = '';
  SLOT_DEFS.forEach(function(s){
    var p       = lineup[s.id];
    var isActive = activeSlot === s.id;
    var color   = POS_COLORS[s.pos] || 'var(--ink2)';
    var cls     = 'roster-slot' + (p ? ' filled' : '') + (isActive ? ' active' : '');
    html += '<div class="'+cls+'" data-slot-id="'+s.id+'">';
    html += '<div class="slot-hdr">';
    html += '<span class="slot-pos-tag" style="color:'+color+'">'+s.label+'</span>';
    if(p){
      html += '<span class="slot-player-name" style="font-family:var(--fd);font-size:15px;font-weight:700;flex:1;">'+p.name+'</span>';
      html += isPlayerLocked(p)
        ? '<span style="font-size:14px;margin-left:auto;">🔒</span>'
        : '<button class="slot-remove-btn" data-remove-slot="'+s.id+'">Remove</button>';
    } else {
      html += '<span class="slot-empty-lbl">— empty —</span>';
    }
    html += '</div>';
    if(p){
      html += '<div class="slot-player-body">';
      html += '<div class="slot-player-meta">';
      html += '<span class="slot-player-team">'+( p.team||'')+'</span>';
      html += '<span class="slot-player-sal">$'+(p.salary||0).toLocaleString()+'</span>';
      if(p.proj) html += '<span style="font-family:var(--fd);font-size:11px;color:var(--ink3);margin-left:4px;">'+p.proj+' proj</span>';
      html += '</div></div>';
    }
    html += '</div>';
  });
  document.getElementById('roster-slots').innerHTML = html;
  updateSubmitBtn();
}

// ── EVENT DELEGATION FOR ROSTER SLOTS ──────────────────────────
// Single listener on the parent avoids re-firing/duplicate-touch issues
// that can occur when innerHTML is rebuilt during a touch event on mobile.
(function(){
  var rosterContainer = document.getElementById('roster-slots');
  if(!rosterContainer) return;
  var lastHandledTime = 0;
  rosterContainer.addEventListener('click', function(e){
    var now = Date.now();
    if(now - lastHandledTime < 150) return; // debounce rapid-fire duplicate events
    lastHandledTime = now;

    var removeBtn = e.target.closest('[data-remove-slot]');
    if(removeBtn){
      e.stopPropagation();
      removePlayer(removeBtn.getAttribute('data-remove-slot'));
      return;
    }
    var slotEl = e.target.closest('[data-slot-id]');
    if(slotEl){
      selectSlot(slotEl.getAttribute('data-slot-id'));
    }
  });
})();

// ── SLOT SELECTION ─────────────────────────────────────────────
// Friendly label showing exactly which positions are eligible for a flex-type slot
function friendlySlotLabel(slot){
  if(slot.label === 'FLEX') return 'FLEX (' + slot.eligible.join('/') + ')';
  if(slot.label === 'SUPERFLEX') return 'SUPERFLEX (' + slot.eligible.join('/') + ')';
  return slot.label;
}

function selectSlot(slotId){
  activeSlot = slotId;
  var slot  = SLOT_DEFS.find(function(s){ return s.id === slotId; });
  var color = POS_COLORS[slot.pos] || 'var(--or)';
  var label = friendlySlotLabel(slot);
  document.getElementById('picker-slot-label').textContent = label;
  document.getElementById('picker-slot-label').style.color = color;
  document.getElementById('picker-search').value = '';
  document.getElementById('picker-panel').classList.add('open');
  document.getElementById('picker-panel').classList.remove('collapsed');
  document.querySelector('.roster-panel').classList.remove('expanded');
  var browseBtn = document.getElementById('browse-players-btn');
  if(browseBtn) browseBtn.style.display = 'none';
  renderRoster();
  renderPicker();
}

function closePicker(){
  activeSlot = null;
  document.getElementById('picker-slot-label').textContent = 'All Players';
  document.getElementById('picker-slot-label').style.color = 'var(--ink2)';
  document.getElementById('picker-panel').classList.remove('open');
  // On desktop the picker is a permanent side panel, not an overlay, so
  // just resetting the filter had no visible effect — Close now actually
  // collapses it and lets the roster take the full width. "Browse Players"
  // brings it back.
  if(window.innerWidth > 860){
    document.getElementById('picker-panel').classList.add('collapsed');
    document.querySelector('.roster-panel').classList.add('expanded');
    var browseBtn = document.getElementById('browse-players-btn');
    if(browseBtn) browseBtn.style.display = 'flex';
  }
  renderRoster();
  renderPicker();
}

function openPickerPanel(){
  document.getElementById('picker-panel').classList.remove('collapsed');
  document.querySelector('.roster-panel').classList.remove('expanded');
  var browseBtn = document.getElementById('browse-players-btn');
  if(browseBtn) browseBtn.style.display = 'none';
  renderPicker();
}

// ── PICKER RENDER ──────────────────────────────────────────────
function renderPicker(){
  // If a game is selected, always show side-by-side view
  if(activeGame){
    renderGamePreview(activeGame);
    return;
  }
  var query   = (document.getElementById('picker-search').value||'').toLowerCase().trim();
  var inLineup= {};
  Object.keys(lineup).forEach(function(sid){ if(lineup[sid]) inLineup[lineup[sid].id]=sid; });

  var draftedIds = {};
  Object.keys(lineup).forEach(function(sid){
    if(sid !== activeSlot && lineup[sid]) draftedIds[lineup[sid].id] = true;
  });

  // Filter by active slot position if one is selected, otherwise show all
  var slot = activeSlot ? SLOT_DEFS.find(function(s){ return s.id === activeSlot; }) : null;

  var players = allPlayers.filter(function(p){
    // Position filter — only apply when a slot is active
    if(slot && slot.eligible.indexOf(p.pos) < 0) return false;
    // Game filter
    if(activeGame && (!p.team || activeGame.teams.indexOf(p.team) < 0)) return false;
    // Search
    if(query && p.name.toLowerCase().indexOf(query)<0 && (p.team||'').toLowerCase().indexOf(query)<0) return false;
    // Hide players already drafted into other slots
    if(draftedIds[p.id]) return false;
    return true;
  }).sort(function(a,b){ return b.salary - a.salary; });

  if(!allPlayers.length){
    document.getElementById('picker-list').innerHTML =
      '<div class="picker-empty"><div class="picker-empty-icon">⏳</div>'
      +'<div class="picker-empty-title">Loading Players…</div>'
      +'<div class="picker-empty-sub">Fetching this week\'s salaries.</div></div>';
    return;
  }

  if(!players.length){
    document.getElementById('picker-list').innerHTML =
      '<div class="picker-empty"><div class="picker-empty-icon">🔍</div>'
      +'<div class="picker-empty-title">No players found</div>'
      +'<div class="picker-empty-sub">'+(activeGame?'No eligible players in this game. Try All Games.':'Try a different search.')+'</div></div>';
    return;
  }

  var html = '';
  players.forEach(function(p){
    var isSelected = inLineup[p.id] === activeSlot;
    var isElsewhere= inLineup[p.id] && inLineup[p.id] !== activeSlot;
    var isOut      = p.status === 'O' || p.status === 'IR';
    // If we're replacing whoever's currently in the active slot, their
    // salary comes back out of the budget first — otherwise it's double
    // counted and players that are actually affordable look like they're not.
    var currentOccupantSalary = (activeSlot && lineup[activeSlot]) ? (lineup[activeSlot].salary || 0) : 0;
    var spent      = getSpent() - currentOccupantSalary;
    var wouldOvr   = !isSelected && (spent + p.salary > CAP);
    var locked     = isPlayerLocked(p);
    var disabled   = isOut || locked || (wouldOvr && !isSelected);
    var injBadge   = (p.status && p.status !== 'Active')
      ? '<span class="p-inj inj-'+p.status+'">'+p.status+'</span>' : '';
    var posColor   = POS_COLORS[p.pos] || 'var(--ink2)';
    var draftLabel = isSelected ? '✓ Drafted' : locked ? '🔒 Locked' : wouldOvr ? '💰 Can\'t Afford' : '+ Draft';
    var draftCls   = 'draft-btn' + (isSelected || locked || wouldOvr ? ' drafted' : '');
    var rowCls     = 'player-row'+(isSelected?' selected':'')+(disabled?' disabled':'');
    html += '<div class="'+rowCls+'">'
      + '<div class="p-pos" style="background:'+posColor+'18;color:'+posColor+'">'+p.pos+'</div>'
      + '<div class="p-info" onclick="openNews(\''+p.id+'\',event)" style="cursor:pointer;">'
      +   '<div class="p-name">'+p.name+injBadge+(isElsewhere?' <span style="font-size:10px;color:var(--ink3)">(in lineup)</span>':'')+'</div>'
      +   '<div class="p-meta">'+(p.team||'')+(p.proj?' · '+p.proj+' proj':'')+'</div>'
      + '</div>'
      + '<div class="p-sal">$'+(p.salary||0).toLocaleString()+'</div>'
      + '<button class="'+draftCls+'" onclick="pickPlayer(\''+p.id+'\')">' + draftLabel + '</button>'
      + '</div>';
  });
  document.getElementById('picker-list').innerHTML = html;
}

// ── PICK PLAYER ────────────────────────────────────────────────
// Finds the best open slot for a position when no slot was pre-selected —
// dedicated slot for that position first, then FLEX, then SUPERFLEX last
// (that slot is precious — usually meant for a 2nd QB in a superflex
// league, not just an extra parking spot for any position).
function findOpenSlotForPosition(pos){
  for(var i = 0; i < SLOT_DEFS.length; i++){
    var s = SLOT_DEFS[i];
    if(s.pos !== 'FLEX' && s.pos !== 'SUPERFLEX' && s.eligible.indexOf(pos) >= 0 && !lineup[s.id]) return s;
  }
  for(var j = 0; j < SLOT_DEFS.length; j++){
    var sf = SLOT_DEFS[j];
    if(sf.pos === 'FLEX' && sf.eligible.indexOf(pos) >= 0 && !lineup[sf.id]) return sf;
  }
  for(var k = 0; k < SLOT_DEFS.length; k++){
    var ss = SLOT_DEFS[k];
    if(ss.pos === 'SUPERFLEX' && ss.eligible.indexOf(pos) >= 0 && !lineup[ss.id]) return ss;
  }
  return null;
}

function pickPlayer(playerId){
  var p = allPlayers.find(function(x){ return x.id === playerId; });
  if(!p) return;
  if(p.status === 'O' || p.status === 'IR'){ showToast(p.name+' is out', true); return; }
  if(isPlayerLocked(p)){ showToast(p.name+' is locked 🔒', true); return; }

  // No slot pre-selected — tapping a slot is now an optional filter, not a
  // requirement, so a direct tap on a player drafts them straight to the
  // best open slot for their position.
  var wasAutoSlot = false;
  if(!activeSlot){
    var alreadyAt = Object.keys(lineup).find(function(sid){ return lineup[sid] && lineup[sid].id === playerId; });
    if(alreadyAt){ removePlayer(alreadyAt); return; }

    var openSlot = findOpenSlotForPosition(p.pos);
    if(!openSlot){ showToast('No open slot for ' + p.pos, true); return; }
    activeSlot = openSlot.id;
    wasAutoSlot = true;
  }

  var slot = SLOT_DEFS.find(function(s){ return s.id === activeSlot; });

  // If player is already in this slot — deselect
  if(lineup[activeSlot] && lineup[activeSlot].id === playerId){
    lineup[activeSlot] = null;
    renderRoster();
    updateCap();
    renderPicker();
    return;
  }

  // Check cap (excluding current slot's player cost)
  var currentSlotCost = lineup[activeSlot] ? lineup[activeSlot].salary : 0;
  var spent = getSpent() - currentSlotCost;
  if(spent + p.salary > CAP){ showToast('Over cap!', true); return; }

  // If player is already in another slot, remove from there first
  Object.keys(lineup).forEach(function(sid){
    if(lineup[sid] && lineup[sid].id === playerId) lineup[sid] = null;
  });

  // Replace whatever is in the active slot directly — no removal step needed
  var wasEmpty = !lineup[activeSlot];
  var replaced = lineup[activeSlot] ? lineup[activeSlot].name : null;
  lineup[activeSlot] = p;
  renderRoster();
  updateCap();

  if(replaced){
    showToast(replaced + ' replaced with ' + p.name + ' ✓');
    var stillFull = Object.values(lineup).filter(Boolean).length >= SLOT_DEFS.length;
    if(window.innerWidth <= 860 && stillFull){
      closePicker();
    } else {
      renderPicker();
    }
    return;
  }

  // Only auto-advance to next empty slot if we filled an empty slot AND
  // the slot was explicitly tapped — a free-browse draft (auto-derived
  // slot) goes back to the unfiltered All Players view instead, so the
  // picker doesn't lock itself into "now fill this specific slot" mode.
  var nextSlot = wasAutoSlot ? null : findNextEmptySlot(slot);
  var rosterComplete = Object.values(lineup).filter(Boolean).length >= SLOT_DEFS.length;

  if(nextSlot){
    activeSlot = nextSlot.id;
    var color = POS_COLORS[nextSlot.pos] || 'var(--or)';
    var label = friendlySlotLabel(nextSlot);
    document.getElementById('picker-slot-label').textContent = label;
    document.getElementById('picker-slot-label').style.color = color;
    renderPicker();
    renderRoster();
  } else if(wasAutoSlot && !rosterComplete){
    // Free-browse pick, more slots still open — stay in the picker,
    // reset to unfiltered so the next direct click works the same way.
    activeSlot = null;
    document.getElementById('picker-slot-label').textContent = 'All Players';
    document.getElementById('picker-slot-label').style.color = 'var(--ink2)';
    renderPicker();
    renderRoster();
    showToast(p.name + ' added ✓');
    return;
  } else {
    if(window.innerWidth <= 860){
      closePicker();
    } else {
      renderPicker();
    }
    showToast(p.name + ' added ✓');
  }
}

function findNextEmptySlot(currentSlot){
  // Look for next empty slot that accepts the same position
  var found = false;
  for(var i = 0; i < SLOT_DEFS.length; i++){
    var s = SLOT_DEFS[i];
    if(s.id === currentSlot.id){ found = true; continue; }
    if(!found) continue;
    // Same position type and empty
    if(s.eligible.indexOf(currentSlot.pos) >= 0 && !lineup[s.id]) return s;
  }
  // Also check FLEX if position is FLEX-eligible and we haven't found anything
  for(var j = 0; j < SLOT_DEFS.length; j++){
    var sf = SLOT_DEFS[j];
    if(sf.id === currentSlot.id || sf.pos !== 'FLEX') continue;
    if(sf.eligible.indexOf(currentSlot.pos) >= 0 && !lineup[sf.id]) return sf;
  }
  return null;
}

function removePlayer(slotId){
  var p = lineup[slotId];
  if(p && isPlayerLocked(p)){ showToast(p.name+' is locked — cannot remove 🔒', true); return; }
  lineup[slotId] = null;
  if(activeSlot === slotId){
    activeSlot = null;
    document.getElementById('picker-panel').classList.remove('open');
  }
  renderRoster();
  updateCap();
  renderPicker();
}

// ── CAP ────────────────────────────────────────────────────────
function getSpent(){
  return Object.values(lineup).reduce(function(s,p){ return s+(p?p.salary:0); },0);
}

function updateCap(){
  var spent     = getSpent();
  var remaining = CAP - spent;
  var pct       = Math.min(100,(spent/CAP)*100);
  var filled    = Object.values(lineup).filter(Boolean).length;
  var slotsLeft = 9 - filled;

  var el = document.getElementById('cap-amt');
  el.textContent = (remaining<0?'-$':'$')+Math.abs(remaining).toLocaleString();
  el.className  = 'cap-amount'+(remaining<0?' over':remaining<5000?' tight':'');

  document.getElementById('slots-n').textContent = filled;

  // Avg per remaining slot
  var avgEl = document.getElementById('avg-per-slot');
  if(avgEl){
    if(slotsLeft <= 0){
      avgEl.textContent = '—';
      avgEl.style.color = 'var(--ink3)';
    } else {
      var avg = Math.floor(remaining / slotsLeft);
      avgEl.textContent = (avg < 0 ? '-$' : '$') + Math.abs(avg).toLocaleString();
      avgEl.style.color = avg < 4000 ? 'var(--pk)' : avg < 5500 ? '#FF9A3A' : 'var(--ink2)';
    }
  }

  var fill = document.getElementById('cap-fill');
  fill.style.width = pct+'%';
  fill.className = 'cap-track-fill'+(remaining<0?' over':'');
}

function updateSubmitBtn(){
  var filled = Object.values(lineup).filter(Boolean).length;
  var total  = SLOT_DEFS.length;
  var spent  = getSpent();
  var btn    = document.getElementById('submit-btn');
  var msg    = document.getElementById('submit-msg');
  if(!currentUser){
    btn.disabled=true; btn.textContent='Build Your Lineup';
    msg.textContent='Sign in to submit your lineup'; msg.className='submit-msg';
  } else if(filled===0){
    btn.disabled=true; btn.textContent='Build Your Lineup';
    msg.textContent='Add players to your roster'; msg.className='submit-msg';
  } else if(spent>CAP){
    btn.disabled=true;
    msg.textContent='Over cap by $'+(spent-CAP).toLocaleString();
    msg.className='submit-msg err';
  } else if(filled<total){
    btn.disabled=false; btn.textContent='Save Lineup →';
    msg.textContent=(total-filled)+' slot'+(total-filled===1?'':'s')+' still open · saved picks are kept';
    msg.className='submit-msg ok';
  } else {
    btn.disabled=false; btn.textContent='Submit Lineup →';
    msg.textContent='$'+(CAP-spent).toLocaleString()+' remaining · Ready to submit';
    msg.className='submit-msg ok';
  }
}

// ── SUBMIT ─────────────────────────────────────────────────────
function submitLineup(){
  if(!currentUser){ showToast('Sign in first',true); return; }
  if(Object.values(lineup).filter(Boolean).length===0){ showToast('Add at least one player first',true); return; }
  if(getSpent()>CAP){ showToast('Over cap',true); return; }
  var btn = document.getElementById('submit-btn');
  btn.disabled=true; btn.textContent='Submitting…';
  var slots={};
  SLOT_DEFS.forEach(function(s){ if(lineup[s.id]) slots[s.id]=lineup[s.id]; });

  var ctx = FRAuth.getLeagueCtx();
  var leagueId = ctx ? ctx.leagueId : 'fr_refresh26';

  // This used to write to a legacy /lineups{year}/week{N}/{uid} path with
  // no league scoping at all — left over from before multi-league support.
  // Nothing else in the app (roster dropdowns, the Draft/Review button,
  // kickoff-lock reveals) ever read from that path; they all read from
  // /leagues/{id}/lineups/{season}/week{N}/{uid}. A submitted lineup was
  // saving somewhere nothing else could ever find it.
  FR.fb.get('/leagues/' + leagueId + '/members/' + currentUser.uid).then(function(member){
    var teamName = (member && member.teamName) || (ctx && ctx.teamName) || currentUser.team2026 || currentUser.email;
    return FR.fb.put('/leagues/' + leagueId + '/lineups/' + (ctx.season || FR_SEASON) + '/week' + currentWeek + '/' + currentUser.uid, {
      uid: currentUser.uid, team: teamName,
      week: currentWeek, slots: slots, totalSal: getSpent(), submitted: Date.now()
    });
  }).then(function(){
    var msg=document.getElementById('submit-msg');
    msg.textContent='✓ Lineup submitted! Good luck.'; msg.className='submit-msg ok';
    btn.textContent='↑ Update Lineup'; btn.disabled=false;
    showToast('Lineup submitted! 🏈');
    setTimeout(function(){ window.location.href = '/league.html'; }, 1200);
  }).catch(function(err){
    console.error('Lineup submit failed:', err);
    document.getElementById('submit-msg').textContent='Submission failed — try again';
    document.getElementById('submit-msg').className='submit-msg err';
    btn.disabled=false; btn.textContent='Submit Lineup →';
  });
}

function closeNews(){
  document.getElementById('news-overlay').classList.remove('open');
}

function showNewsLinks(p){
  var slug = p.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-+$/,'');
  var links = [
    {label:'📰 FantasyPros', url:'https://www.fantasypros.com/nfl/players/'+slug+'.php', desc:'News, rankings & projections'},
    {label:'🏈 ESPN',        url:'https://www.espn.com/search/results?q='+encodeURIComponent(p.name), desc:'Stats & news'},
    {label:'🔍 Google News', url:'https://news.google.com/search?q='+encodeURIComponent(p.name+' NFL'), desc:'Latest headlines'}
  ];
  document.getElementById('news-body').innerHTML =
    '<div style="padding:12px 20px;font-size:12px;color:var(--ink3);border-bottom:1px solid var(--bdr);">No recent news — check these sources:</div>'
    + links.map(function(l){
        return '<a href="'+l.url+'" target="_blank" rel="noopener"'
          +' style="display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--bdr);text-decoration:none;"'
          +' onmouseover="this.style.background=\'var(--bg3)\'" onmouseout="this.style.background=\'\'">'
          +'<div style="flex:1;"><div style="font-family:var(--fd);font-size:15px;font-weight:700;color:var(--or);">'+l.label+'</div>'
          +'<div style="font-size:12px;color:var(--ink3);margin-top:2px;">'+l.desc+'</div></div>'
          +'<div style="font-family:var(--fd);font-size:14px;color:var(--ink3);">↗</div></a>';
      }).join('');
}



// ── KICKOFF LOCKS ──────────────────────────────────────────────
var teamLocks    = {}; // {teamAbbr: {lockedAt, gameId}}
var lockPollTimer = null;

function loadLocks(){
  if(TEST_MODE){
    // Start with no locks — use URL param ?locks=live to simulate kickoff
    var params = new URLSearchParams(window.location.search);
    var locksEndpoint = params.get('locks') === 'live' ? 'locks_live' : 'schedule'; // schedule returns no locks
    if(params.get('locks') === 'live'){
      workerFetch('locks_live').then(function(d){ teamLocks = d || {}; renderRoster(); renderPicker(); }).catch(function(){});
    } else {
      teamLocks = {};
    }
    return;
  }
  var path = FR.paths.url(FR.paths.weekLocks(currentWeek));
  fetch(path)
    .then(function(r){ return r.json(); })
    .then(function(data){
      teamLocks = data || {};
      renderRoster();
      renderPicker();
      // Poll every 60 seconds to pick up new locks during game days
      if(lockPollTimer) clearInterval(lockPollTimer);
      lockPollTimer = setInterval(function(){
        fetch(path).then(function(r){ return r.json(); }).then(function(d){
          if(!d) return;
          var changed = JSON.stringify(d) !== JSON.stringify(teamLocks);
          teamLocks = d;
          if(changed){ renderRoster(); if(activeGame) renderGamePreview(activeGame); else renderPicker(); }
        }).catch(function(){});
      }, 60000);
    })
    .catch(function(){ teamLocks = {}; });
}

function isPlayerLocked(player){
  return !!(player && player.team && teamLocks[normTeam(player.team)]);
}

function isTeamLocked(team){
  return !!(team && teamLocks[normTeam(team)]);
}

function showToast(msg,isErr){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast'+(isErr?' err':'')+' show';
  setTimeout(function(){ t.className='toast'+(isErr?' err':''); },2500);
}

// ── PLAYER NEWS ────────────────────────────────────────────────

var espnIdCache = {};

function openNews(playerId, event){
  if(event) event.stopPropagation();
  var p = allPlayers.find(function(x){ return x.id === playerId; });
  if(!p) return;

  document.getElementById('news-player-name').textContent = p.name;
  document.getElementById('news-player-meta').textContent =
    (p.pos||'') + (p.team ? ' · '+p.team : '') + (p.salary ? ' · $'+p.salary.toLocaleString() : '');
  document.getElementById('news-body').innerHTML = '<div class="news-loading">Loading news…</div>';
  document.getElementById('news-overlay').classList.add('open');

  fetch(WORKER+'/news?name='+encodeURIComponent(p.name))
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(data.items && data.items.length){
        var html = data.items.map(function(item){
          return '<div class="news-item">'
            +(item.title?'<div class="news-item-title">'+item.title+'</div>':'')
            +(item.body ?'<div class="news-item-body">'+item.body+'</div>':'')
            +'<div class="news-item-meta">'+(item.date?item.date+' · ':'')+(item.source||'')+'</div>'
            +'</div>';
        }).join('');
        var slug = p.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-+$/,'');
        html += '<a href="https://www.fantasypros.com/nfl/players/'+slug+'.php" target="_blank" rel="noopener"'
          +' style="display:block;padding:12px 20px;font-family:var(--fd);font-size:12px;font-weight:700;'
          +'color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;text-align:center;'
          +'border-top:1px solid var(--bdr);">More on FantasyPros ↗</a>';
        document.getElementById('news-body').innerHTML = html;
      } else {
        showNewsLinks(p);
      }
    })
    .catch(function(){ showNewsLinks(p); });
}

function toggleTheme(){
  var html  = document.documentElement;
  var isDark = html.getAttribute('data-theme') !== 'light';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('theme-btn').textContent = isDark ? '☀️' : '🌙';
  try{ localStorage.setItem('fr_theme', isDark ? 'light' : 'dark'); }catch(e){}
}
(function(){
  try{
    var t = localStorage.getItem('fr_theme');
    if(t){ document.documentElement.setAttribute('data-theme', t);
      if(t === 'light'){
        window.addEventListener('DOMContentLoaded', function(){
          var btn = document.getElementById('theme-btn');
          if(btn) btn.textContent = '☀️';
        });
      }
    }
  }catch(e){}
})();
