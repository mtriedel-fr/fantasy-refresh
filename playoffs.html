<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/theme.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Refresh — Playoffs</title>
<script src="/js/auth.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/theme.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
/* :root variables now live in /css/theme.css — removed from here to stop the per-file drift the review flagged */
/* light-mode colors: /css/theme.css */
body{background:var(--bg);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px 80px;font-family:var(--fb);}
.wrap{width:100%;max-width:960px;border-radius:16px;overflow:hidden;border:1px solid var(--frame);box-shadow:0 24px 80px rgba(0,0,0,.6);}

/* HEADER */
.hdr{background:var(--hdr);padding:22px 28px;display:flex;justify-content:space-between;align-items:center;border-top:3px solid var(--or);border-bottom:3px solid var(--pk);}
.logo{display:flex;align-items:center;gap:12px;}
.logo-box{width:40px;height:40px;background:linear-gradient(135deg,var(--or),var(--pk));border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logo-box svg{width:22px;height:22px;stroke:#060E0E;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.logo-txt{font-family:var(--fd);font-size:28px;font-weight:800;color:var(--logo-ink);text-transform:uppercase;letter-spacing:.5px;line-height:1;}
.logo-txt span{color:var(--pk);}
.logo-sub{font-family:var(--fd);font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:2px;text-transform:uppercase;margin-top:2px;}
.hdr-r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.back-btn{background:transparent;border:1px solid var(--bdr2);color:var(--ink3);font-family:var(--fd);font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:4px 12px;border-radius:6px;cursor:pointer;transition:all .15s;text-decoration:none;display:inline-block;}
.back-btn:hover{border-color:var(--or);color:var(--or);}
.playoff-badge{background:rgba(200,152,0,.12);color:var(--gold);font-family:var(--fd);font-size:11px;font-weight:700;padding:4px 13px;border-radius:20px;letter-spacing:1.2px;text-transform:uppercase;border:1px solid rgba(200,152,0,.35);}
.hdr-sub{color:var(--ink3);font-size:11px;font-family:var(--fd);letter-spacing:.8px;text-transform:uppercase;}

/* MOBILE */
@media(max-width:600px){
  body{padding:0;}
  .wrap{border-radius:0;border:none;}
  .hdr{padding:14px 16px;}
  .logo-sub{display:none;}
  .tiers{padding:12px;}
  .rounds{grid-template-columns:1fr;overflow-x:auto;}
  .tier-block{overflow-x:auto;}
  .rounds{display:flex;flex-direction:column;gap:0;}
  .round-col{min-width:100%;}
}
/* HORIZONTAL SCROLL on rounds for mobile */
.rounds-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.rounds-inner{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;background:var(--bdr);min-width:540px;}
/* MY TEAM highlight in playoffs */
.t-name.is-me{color:var(--or);font-weight:700;}
.team-row.is-me .t-name{color:var(--or);}
/* CLICKABLE team names */
.t-link{color:inherit;text-decoration:none;transition:color .15s;}
.t-link:hover{color:var(--or);text-decoration:underline;}
.status-bar{background:var(--hdr2);padding:10px 28px;border-bottom:2px solid var(--bg2);display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.round-pill{padding:5px 16px;border-radius:20px;font-family:var(--fd);font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;border:1px solid var(--field-bdr);color:var(--ink3);}
.round-pill.active{background:var(--or);color:var(--on-accent);border-color:var(--or);}
.round-pill.done{background:var(--bg3);color:var(--ink2);border-color:var(--bdr2);}
.round-pill.upcoming{color:var(--ink3);}
.status-note{font-family:var(--fd);font-size:11px;color:var(--ink3);letter-spacing:.5px;text-transform:uppercase;margin-left:auto;}

/* TIERS */
.tiers{background:var(--bg);padding:20px 24px;display:flex;flex-direction:column;gap:20px;}
.tier-block{border-radius:12px;overflow:hidden;border:1px solid var(--bdr2);}
.tier-hdr{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;}
.tier-hdr.elite{background:linear-gradient(135deg,rgba(255,200,50,.2),rgba(255,200,50,.08));border-bottom:2px solid rgba(255,200,50,.4);}
.tier-hdr.mid{background:linear-gradient(135deg,rgba(60,160,80,.2),rgba(60,160,80,.08));border-bottom:2px solid rgba(60,160,80,.35);}
.tier-hdr.low{background:linear-gradient(135deg,rgba(120,100,200,.2),rgba(120,100,200,.08));border-bottom:2px solid rgba(120,100,200,.3);}
.tier-title{font-family:var(--fd);font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;}
.tier-title.elite{color:#C89800;}
.tier-title.mid{color:#2A7840;}
.tier-title.low{color:#6050A8;}
.tier-sub{font-family:var(--fd);font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;margin-top:2px;color:var(--ink2);}
.tier-count{font-family:var(--fd);font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;}

/* ROUNDS inside tier */
.rounds{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;background:var(--bdr);}
.round-col{background:var(--bg3);padding:14px 16px;}
.round-col.mid-col{background:var(--bg4);}
.round-label{font-family:var(--fd);font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink2);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--bdr);}
.team-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--bdr);font-size:13px;}
.team-row:last-child{border-bottom:none;}
.team-row.eliminated{opacity:.4;}
.team-row.advanced{font-weight:500;}
.team-row.champion{background:rgba(255,200,50,.12);border-radius:6px;padding:5px 7px;margin:-2px -7px;}
.t-rank{font-family:var(--fd);font-weight:700;font-size:13px;color:var(--ink2);width:22px;flex-shrink:0;}
.t-name{color:var(--ink);flex:1;font-family:var(--fd);font-weight:600;font-size:13px;}
.t-score{font-family:var(--fd);font-weight:700;font-size:13px;color:var(--or);white-space:nowrap;}
.t-status{font-size:11px;margin-left:4px;}
.elim-line{text-decoration:line-through;color:var(--ink3);}
.round-empty{color:var(--ink3);font-size:13px;font-family:var(--fd);text-transform:uppercase;letter-spacing:.5px;padding:8px 0;}

/* PAYOUT LEGEND */
.payout-legend{background:var(--bg2);padding:6px 16px;display:flex;gap:16px;border-top:1px solid var(--bdr);flex-wrap:wrap;}
.payout-item{font-family:var(--fd);font-size:11px;font-weight:700;color:var(--ink2);letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:4px;}

/* EMPTY STATE */
.empty{padding:60px 24px;text-align:center;background:var(--bg);}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:.4;}
.empty-title{font-family:var(--fd);font-size:20px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.empty-sub{font-size:14px;color:var(--ink3);line-height:1.6;}

.toast{position:fixed;bottom:24px;right:24px;background:var(--grn);color:var(--on-accent);font-family:var(--fd);font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:12px 20px;border-radius:8px;transform:translateY(80px);opacity:0;transition:all .3s;z-index:999;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.error{background:var(--red);}

html[data-theme="light"] body{background:#D8F0EE;}
html[data-theme="light"] .wrap{box-shadow:0 8px 40px rgba(0,180,168,.15);}
th{background:linear-gradient(90deg,var(--bg2),var(--pu4));}
tr:nth-child(odd) td{background:rgba(155,109,255,.03);}
tr:hover td{background:rgba(255,95,160,.08) !important;}
.tier-label.elite{background:rgba(255,95,160,.15);color:var(--pk);border:1px solid rgba(255,95,160,.4);}
.tier-label.mid{background:rgba(155,109,255,.15);color:var(--pu);border:1px solid rgba(155,109,255,.4);}
.up{color:var(--or);}.dn{color:var(--pk);}
.theme-toggle{font-size:14px;cursor:pointer;}
html[data-theme="light"] body{background:#D8F0EE;}

/* Same top bar as the league and draft pages (Oct 2026): app logo, stacked
   FANTASY / REFRESH, buttons in one row; edge-to-edge on phones. */
.hdr{padding:12px 18px !important;gap:10px;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-txt{font-size:20px !important;line-height:.95 !important;display:flex;flex-direction:column;}
.hdr-r{flex-direction:row !important;align-items:center !important;flex-wrap:wrap;justify-content:flex-end;}
.back-btn{white-space:nowrap;}
@media (max-width:600px){
  body{padding-left:0 !important;padding-right:0 !important;padding-top:0 !important;}
  .wrap{border-radius:0 !important;border:none !important;box-shadow:none !important;}
}
</style>
</head>
<body>
<div class="wrap">

<div class="hdr">
  <a class="logo" href="/league.html" style="text-decoration:none;">
    <svg style="width:32px;height:32px;flex-shrink:0;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
      <defs>
        <linearGradient id="tlg" x1="100%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#00E5D4"/><stop offset="100%" stop-color="#00E5D4" stop-opacity="0.6"/></linearGradient>
        <linearGradient id="plg" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FF5FA0"/><stop offset="100%" stop-color="#FF5FA0" stop-opacity="0.6"/></linearGradient>
      </defs>
      <rect x="25" y="25" width="350" height="350" rx="70" fill="#050808"/>
      <g transform="translate(200,200) scale(3.79) translate(-475.5,-241.6)">
        <path fill="url(#tlg)" d="M504.547,265.443h-9.019a30.964,30.964,0,0,0-29.042-52.733,1.5,1.5,0,1,0,.792,2.894,27.955,27.955,0,0,1,25.512,48.253l0-10.169h-.011a1.493,1.493,0,0,0-2.985,0h0v13.255a1.5,1.5,0,0,0,1.5,1.5h13.256a1.5,1.5,0,1,0,0-3Z"/>
        <path fill="url(#plg)" d="M485.389,267.995a27.956,27.956,0,0,1-25.561-48.213l0,10.2h.015a1.491,1.491,0,0,0,2.978,0h.007V216.791a1.484,1.484,0,0,0-1.189-1.532l-.018-.005a1.533,1.533,0,0,0-.223-.022c-.024,0-.046-.007-.07-.007H448.071a1.5,1.5,0,0,0,0,3h8.995a30.963,30.963,0,0,0,29.115,52.664,1.5,1.5,0,0,0-.792-2.894Z"/>
      </g>
    </svg>
    <div class="logo-txt">Fantasy <span>Refresh</span></div>
  </a>
  <div class="hdr-r">
    <button onclick="window.location.href='/league.html'" class="back-btn">← League</button>
    <button class="back-btn theme-toggle" onclick="toggleTheme()" id="theme-btn" title="Toggle light/dark">🌙</button>
  </div>
</div>

<div class="status-bar" id="status-bar">
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;"><div class="playoff-badge">🏆 Playoffs</div><div class="hdr-sub" id="hdr-sub">Loading...</div></div>
  <div class="round-pill" id="pill-r1">Wk 15 — Round 1</div>
  <div class="round-pill" id="pill-r2">Wk 16 — Round 2</div>
  <div class="round-pill" id="pill-r3">Wk 17 — Championship</div>
  <div class="status-note" id="status-note"></div>
</div>

<div id="main"></div>

</div>
<div class="toast" id="toast"></div>

<script>
// ── AUTH CHECK ─────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function(){
  if(typeof FRAuth !== 'undefined' && !FRAuth.getUser()){
    window.location.href = '/welcome.html';
  }
});

// ── FIREBASE CONFIG ────────────────────────────────────────────
var FB_DB_URL   = 'https://fantasy-refresh-default-rtdb.firebaseio.com';
// Playoff schedule by season. 2026 on (commissioner, Oct 27, 2026): groups set
// after Week 14, playoffs Weeks 15–17 — same as league.html. The 2025 archive
// (?season=2025) keeps the 2025 schedule: groups after Week 15, playoffs Weeks 16 to 18.
var PO_SEASON = (new URLSearchParams(window.location.search)).get('season') || '2026';
var TIER_LOCK_WEEK = PO_SEASON === '2025' ? 15 : 14;
var PLAYOFF_WEEKS = PO_SEASON === '2025' ? [16, 17, 18] : [15, 16, 17];
var seasonData = {};
var myTeam = '';
try{ myTeam = localStorage.getItem('fr_myteam') || ''; }catch(e){}

function teamLink(name){
  var isMe = myTeam && name.toLowerCase() === myTeam.toLowerCase();
  return '<a class="t-link' + (isMe ? ' is-me' : '') + '" href="player.html?team=' + encodeURIComponent(name) + '">' + name + '</a>';
}

// ── LOAD ───────────────────────────────────────────────────────
function loadFromCloud(){
  document.getElementById('hdr-sub').textContent = 'Loading...';
  var urlSeason = (new URLSearchParams(window.location.search)).get('season') || '2026';
  var backBtn = document.getElementById('back-btn-href');
  if(backBtn) backBtn.href = urlSeason === '2025' ? '/archive2025.html' : '/league.html';
  var pCtx = FRAuth.getLeagueCtx();
  var pLeagueId = pCtx ? pCtx.leagueId : 'fr_refresh26';
  console.log('playoffs loading season:', urlSeason, 'league:', pLeagueId);
  // Same legacy-path bug as league.html's playoffs tab: /season{year} is a
  // top-level path with no security rule granting read access (only
  // /season2025 exists, and even that's read-only for the old single-league
  // data). Scores live per-league now.
  fetch(FB_DB_URL + '/leagues/' + pLeagueId + '/season/' + urlSeason + '.json')
    .then(function(r){ return r.json(); })
    .then(function(data){
      console.log('playoffs data received, null?', data === null, 'keys:', data ? Object.keys(data).length : 0);
      if(data && typeof data === 'object' && !data.error){
        seasonData = normalizeSeason(data);
      } else if(data === null){
        // Empty season — try localStorage backup
        try{ var d = localStorage.getItem('fr_'+urlSeason+'_backup'); if(d) seasonData = JSON.parse(d); }catch(e){}
      }
      render();
    })
    .catch(function(err){
      console.error('playoffs load error:', err);
      try{ var d = localStorage.getItem('fr_'+urlSeason+'_backup'); if(d) seasonData = JSON.parse(d); }catch(e){}
      render();
    });
}

// Scores are saved per week as { uid: { team, score, … } } (plus a "meta"
// entry); the bracket code below expects each week as a list of
// { name, score }. Without this the page saw no weeks at all — it said
// "Currently through Week 0" and would never have shown the bracket.
function normalizeSeason(data){
  var out = {};
  Object.keys(data || {}).forEach(function(w){
    if(isNaN(Number(w))) return;                       // skip "meta" etc.
    var wk = data[w];
    if(Array.isArray(wk)){ out[w] = wk; return; }      // old format already a list
    out[w] = Object.keys(wk || {}).map(function(uid){
      var e = wk[uid] || {};
      return { uid: e.uid || uid, name: e.team || e.name || '', score: parseFloat(e.score) || 0 };
    }).filter(function(e){ return e.name; });
  });
  return out;
}

// ── TIER CALCULATION ───────────────────────────────────────────
function getCumulativeTotals(upToWeek){
  var totals = {};
  Object.keys(seasonData).forEach(function(w){
    if(Number(w) > upToWeek) return;
    (seasonData[w] || []).forEach(function(e){
      totals[e.name] = (totals[e.name] || 0) + e.score;
    });
  });
  return totals;
}

function splitTiers(sorted){
  var n = sorted.length;
  var top = Math.ceil(n / 3);
  var mid = Math.ceil((n - top) / 2);
  return {
    elite: sorted.slice(0, top),
    mid:   sorted.slice(top, top + mid),
    low:   sorted.slice(top + mid)
  };
}

function getWeeklyScores(week){
  var map = {};
  (seasonData[String(week)] || []).forEach(function(e){ map[e.name] = e.score; });
  return map;
}

// ── SURVIVAL LOGIC ─────────────────────────────────────────────
// Each week: bottom 50% eliminated, top 50% advance
function applyRound(teams, weekScores){
  if(!weekScores || !Object.keys(weekScores).length) return { advanced: teams, eliminated: [], scores: {} };
  var scored = teams.map(function(t){
    return { name: t.name || t, score: weekScores[t.name || t] || 0 };
  }).sort(function(a,b){ return b.score - a.score; });
  var cutoff = Math.ceil(scored.length / 2);
  return {
    advanced:   scored.slice(0, cutoff),
    eliminated: scored.slice(cutoff),
    scores:     weekScores
  };
}

// ── RENDER ─────────────────────────────────────────────────────
function render(){
  var weeks = Object.keys(seasonData).filter(function(k){ return seasonData[k] && seasonData[k].length; }).map(Number);
  var maxWeek = weeks.length ? Math.max.apply(null, weeks) : 0;

  var tiersLocked = maxWeek >= TIER_LOCK_WEEK;

  if(!tiersLocked){
    document.getElementById('main').innerHTML = '<div class="empty">'
      + '<div class="empty-icon">⏳</div>'
      + '<div class="empty-title">Playoffs unlock after Week ' + TIER_LOCK_WEEK + '</div>'
      + '<div class="empty-sub">Tiers are determined by cumulative scoring through Week ' + TIER_LOCK_WEEK + '.<br>'
      + 'Currently through Week ' + maxWeek + ' — ' + (TIER_LOCK_WEEK - maxWeek) + ' week(s) remaining.</div>'
      + '</div>';
    document.getElementById('hdr-sub').textContent = 'Locked after Wk ' + TIER_LOCK_WEEK + ' · ' + (TIER_LOCK_WEEK - maxWeek) + ' wks away';
    return;
  }

  // Build tiers from cumulative totals through TIER_LOCK_WEEK
  var totals = getCumulativeTotals(TIER_LOCK_WEEK);
  var sorted = Object.keys(totals).map(function(name){ return { name: name, total: totals[name] }; })
    .sort(function(a,b){ return b.total - a.total; });
  var tiers = splitTiers(sorted);

  // Get weekly scores for playoff weeks
  var wkR1 = getWeeklyScores(PLAYOFF_WEEKS[0]);
  var wkR2 = getWeeklyScores(PLAYOFF_WEEKS[1]);
  var wkR3 = getWeeklyScores(PLAYOFF_WEEKS[2]);

  var hasR1 = Object.keys(wkR1).length > 0;
  var hasR2 = Object.keys(wkR2).length > 0;
  var hasR3 = Object.keys(wkR3).length > 0;

  // Update round pills
  PLAYOFF_WEEKS.forEach(function(w, i){
    var pill = document.getElementById('pill-r' + (i+1));
    if(!pill) return;
    pill.textContent = ['Wk {w} — Round 1','Wk {w} — Round 2','Wk {w} — Championship'][i].replace('{w}', w);
    var has = [hasR1, hasR2, hasR3][i];
    var isCurrent = maxWeek === w;
    pill.className = 'round-pill' + (has ? ' done' : isCurrent ? ' active' : ' upcoming');
  });

  var statusText = hasR3 ? 'Season Complete' : hasR2 ? 'Championship — Wk ' + PLAYOFF_WEEKS[2] : hasR1 ? 'Round 2 — Wk ' + PLAYOFF_WEEKS[1] : 'Round 1 — Wk ' + PLAYOFF_WEEKS[0];
  document.getElementById('status-note').textContent = statusText;
  document.getElementById('hdr-sub').textContent = sorted.length + ' teams · 3 tiers';

  var tierDefs = [
    { key: 'elite', label: '🏆 Elite Tier', payouts: ['1st Place', '2nd Place', '3rd Place'] },
    { key: 'mid',   label: '🥈 Mid Tier',   payouts: ['1st Place', '2nd Place', '3rd Place'] },
    { key: 'low',   label: '🥉 Survivor Tier', payouts: ['1st Place', '2nd Place', '3rd Place'] }
  ];

  var html = '<div class="tiers">';

  tierDefs.forEach(function(td){
    var tierTeams = tiers[td.key];

    // Run rounds
    var r1 = applyRound(tierTeams, hasR1 ? wkR1 : null);
    var r2 = applyRound(r1.advanced, hasR2 ? wkR2 : null);
    var r3 = applyRound(r2.advanced, hasR3 ? wkR3 : null);

    html += '<div class="tier-block">';

    // Tier header
    html += '<div class="tier-hdr ' + td.key + '">'
      + '<div><div class="tier-title ' + td.key + '">' + td.label + '</div>'
      + '<div class="tier-sub">' + tierTeams.length + ' teams · Survival format · Weeks ' + PLAYOFF_WEEKS[0] + '–' + PLAYOFF_WEEKS[2] + '</div></div>'
      + '<div class="tier-count">' + (hasR3 ? 'Complete' : hasR1 ? (r1.advanced.length + ' remaining') : tierTeams.length + ' competing') + '</div>'
      + '</div>';

    // Rounds columns — wrapped for horizontal scroll on mobile
    html += '<div class="rounds-scroll"><div class="rounds-inner">';

    // Round 1
    html += '<div class="round-col">';
    html += '<div class="round-label">Round 1 — Week ' + PLAYOFF_WEEKS[0] + '</div>';
    if(!hasR1){
      html += '<div class="round-empty">Pending</div>';
      tierTeams.forEach(function(t, i){
        html += '<div class="team-row"><span class="t-rank">' + (i+1) + '</span><span class="t-name">' + teamLink(t.name) + '</span></div>';
      });
    } else {
      var allR1 = r1.advanced.concat(r1.eliminated).sort(function(a,b){ return b.score - a.score; });
      allR1.forEach(function(t, i){
        var isElim = r1.eliminated.some(function(e){ return e.name === t.name; });
        var isMe = myTeam && t.name.toLowerCase() === myTeam.toLowerCase();
        html += '<div class="team-row' + (isElim ? ' eliminated' : ' advanced') + (isMe ? ' is-me' : '') + '">'
          + '<span class="t-rank">' + (i+1) + '</span>'
          + '<span class="t-name' + (isElim ? ' elim-line' : '') + '">' + teamLink(t.name) + '</span>'
          + '<span class="t-score">' + (t.score > 0 ? t.score.toFixed(1) : '—') + '</span>'
          + '<span class="t-status">' + (isElim ? '❌' : '✅') + '</span>'
          + '</div>';
      });
    }
    html += '</div>';

    // Round 2
    html += '<div class="round-col mid-col">';
    html += '<div class="round-label">Round 2 — Week ' + PLAYOFF_WEEKS[1] + '</div>';
    if(!hasR1){
      html += '<div class="round-empty">After Wk ' + PLAYOFF_WEEKS[0] + '</div>';
    } else if(!hasR2){
      r1.advanced.forEach(function(t, i){
        var isMe = myTeam && t.name.toLowerCase() === myTeam.toLowerCase();
        html += '<div class="team-row' + (isMe ? ' is-me' : '') + '"><span class="t-rank">' + (i+1) + '</span><span class="t-name">' + teamLink(t.name) + '</span></div>';
      });
    } else {
      var allR2 = r2.advanced.concat(r2.eliminated).sort(function(a,b){ return b.score - a.score; });
      allR2.forEach(function(t, i){
        var isElim = r2.eliminated.some(function(e){ return e.name === t.name; });
        var isMe = myTeam && t.name.toLowerCase() === myTeam.toLowerCase();
        html += '<div class="team-row' + (isElim ? ' eliminated' : ' advanced') + (isMe ? ' is-me' : '') + '">'
          + '<span class="t-rank">' + (i+1) + '</span>'
          + '<span class="t-name' + (isElim ? ' elim-line' : '') + '">' + teamLink(t.name) + '</span>'
          + '<span class="t-score">' + (t.score > 0 ? t.score.toFixed(1) : '—') + '</span>'
          + '<span class="t-status">' + (isElim ? '❌' : '✅') + '</span>'
          + '</div>';
      });
    }
    html += '</div>';

    // Championship
    html += '<div class="round-col">';
    html += '<div class="round-label">Championship — Week ' + PLAYOFF_WEEKS[2] + '</div>';
    if(!hasR2){
      html += '<div class="round-empty">After Wk ' + PLAYOFF_WEEKS[1] + '</div>';
    } else if(!hasR3){
      r2.advanced.forEach(function(t, i){
        var isMe = myTeam && t.name.toLowerCase() === myTeam.toLowerCase();
        html += '<div class="team-row' + (isMe ? ' is-me' : '') + '"><span class="t-rank">' + (i+1) + '</span><span class="t-name">' + teamLink(t.name) + '</span></div>';
      });
    } else {
      var finals = r3.advanced.concat(r3.eliminated).sort(function(a,b){ return b.score - a.score; });
      finals.forEach(function(t, i){
        var crown = i === 0 ? '🏆' : i === 1 ? '🥈' : i === 2 ? '🥉' : '';
        var isChamp = i === 0;
        var isMe = myTeam && t.name.toLowerCase() === myTeam.toLowerCase();
        html += '<div class="team-row' + (isChamp ? ' champion' : '') + (isMe ? ' is-me' : '') + '">'
          + '<span class="t-rank">' + crown + '</span>'
          + '<span class="t-name">' + teamLink(t.name) + '</span>'
          + '<span class="t-score">' + (t.score > 0 ? t.score.toFixed(1) : '—') + '</span>'
          + '</div>';
      });
    }
    html += '</div>';

    html += '</div></div>'; // close rounds-inner + rounds-scroll

    // Payout legend
    html += '<div class="payout-legend">'
      + '<div class="payout-item">🏆 1st Place</div>'
      + '<div class="payout-item">🥈 2nd Place</div>'
      + '<div class="payout-item">🥉 3rd Place</div>'
      + '</div>';

    html += '</div>'; // tier-block
  });

  html += '</div>'; // tiers
  document.getElementById('main').innerHTML = html;
}

function showToast(msg, isError){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '') + ' show';
  setTimeout(function(){ t.className = 'toast' + (isError ? ' error' : ''); }, 3000);
}

loadFromCloud();

function toggleTheme(){
  var html = document.documentElement;
  var isDark = html.getAttribute('data-theme') !== 'light';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  var btn = document.getElementById('theme-btn');
  if(btn) btn.textContent = isDark ? '☀️' : '🌙';
  try{ localStorage.setItem('fr_theme', isDark ? 'light' : 'dark'); }catch(e){}
}
(function(){
  try{ var t=localStorage.getItem('fr_theme'); if(t) document.documentElement.setAttribute('data-theme',t); }catch(e){}
})();

</script>
