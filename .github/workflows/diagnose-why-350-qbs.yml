name: One-Time Diagnostic — Why Are There 350 QBs In The Pool

# ONE-TIME USE — delete this file after running it once.
# Checks the real, raw player pool for exactly how many entries are
# tagged pos='QB', and inspects a sample to understand what's
# inflating the count from the expected ~32-64 real NFL QBs to 350 -
# checking status/roster fields available on each entry. Read-only.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect real QB pool entries
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const SEASON = 2026;

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            const pool = await fetchJson(`/playerPool/${SEASON}/players.json`).catch(() => null);
            if (!pool) { console.log('No player pool found.'); return; }

            const all = Object.values(pool);
            console.log(`Total real players in pool: ${all.length}`);

            const qbs = all.filter(p => p && p.pos === 'QB');
            console.log(`Real entries tagged pos='QB': ${qbs.length}`);
            console.log('');

            // Break down by team - a real, rostered QB should have a
            // real team; anyone with no team or a weird team value is
            // likely a free agent / practice squad / stale entry.
            const byTeam = {};
            qbs.forEach(p => { const t = p.team || '(none)'; byTeam[t] = (byTeam[t]||0) + 1; });
            const teamsWithMultiple = Object.entries(byTeam).filter(([,c]) => c > 3);
            console.log(`Teams with more than 3 QB entries: ${teamsWithMultiple.length}`);
            teamsWithMultiple.slice(0, 10).forEach(([team, count]) => console.log(`  ${team}: ${count}`));
            console.log('');

            // Status breakdown
            const byStatus = {};
            qbs.forEach(p => { const s = p.status || '(none)'; byStatus[s] = (byStatus[s]||0) + 1; });
            console.log('Status breakdown:', JSON.stringify(byStatus));
            console.log('');

            // Sample a few real entries in full to see what fields are available
            console.log('Sample entries:');
            qbs.slice(0, 5).forEach(p => console.log('  ' + JSON.stringify(p)));
            console.log('...');
            qbs.slice(-5).forEach(p => console.log('  ' + JSON.stringify(p)));
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
