name: Lineup read check (read-only)
on:
  push:
    branches: [audit/draft-check]
    paths: ['.github/workflows/lineup-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Dump a team's lineups + save-log history
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB = process.env.FIREBASE_DB_URL, T = process.env.FIREBASE_AUTH_TOKEN;
          const get = p => new Promise((res, rej) => https.get(`${FB}${p}${p.includes('?')?'&':'?'}auth=${T}`, r => { let d=''; r.on('data',c=>d+=c); r.on('end',()=>{ try{res(JSON.parse(d));}catch(e){res(null);} }); }).on('error', rej));
          const esc = s => String(s).replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A');
          const ann = (l,t,m) => console.log(`::${l} title=${esc(t).replace(/:/g,'%3A').replace(/,/g,'%2C')}::${esc(m)}`);
          const ct = ms => (typeof ms==='number') ? new Date(ms).toLocaleString('en-US',{timeZone:'America/Chicago',weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit'})+' CT' : String(ms);
          const norm = s => String(s||'').toLowerCase().replace(/\b(jr|sr|ii|iii|iv|v)\b/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
          const TEAM = 'yyyy';
          const WANT = ['mike evans','nico collins'];

          (async () => {
            const settings = await get('/leagues/fr_refresh26/settings.json') || {};
            const season = settings.season || 2026;
            const meta = await get(`/leagues/fr_refresh26/season/${season}/meta.json`) || {};
            const cur = (typeof meta.week==='number') ? meta.week : 9;
            const lock = settings.draftLockedUntil;
            const out = [`Season ${season} · current week ${cur} · now ${ct(Date.now())}`,
                        `draftLockedUntil: ${ct(lock)} → drafting ${(typeof lock==='number' && lock<=Date.now())?'OPEN':'LOCKED'}`, ''];

            // Find yyyy's uid + dump their lineups across a window of weeks
            let uid = null;
            for (const w of [7,8,9,10,11]) {
              const wk = await get(`/leagues/fr_refresh26/lineups/${season}/week${w}.json`) || {};
              for (const u of Object.keys(wk)) {
                const lu = wk[u] || {};
                if (norm(lu.team) === norm(TEAM) || (norm(lu.team).includes(norm(TEAM)))) {
                  uid = u;
                  const slots = lu.slots || {};
                  const present = WANT.filter(n => Object.values(slots).some(p => norm((p||{}).name)===n));
                  const wr = Object.keys(slots).filter(s=>/wr|flex/i.test(s)).map(s=>`${s}=${(slots[s]||{}).name}`).join(', ');
                  out.push(`week ${w}: saved ${ct(lu.submitted)} · Evans=${present.includes('mike evans')?'Y':'n'} Collins=${present.includes('nico collins')?'Y':'n'} · ${wr}`);
                }
              }
            }
            out.push('');

            // Save-log history for this uid (new as of today — only captures attempts after logging went live)
            if (uid) {
              const log = await get(`/saveLog/fr_refresh26/${uid}.json`) || {};
              const keys = Object.keys(log);
              if (!keys.length) {
                out.push('saveLog: NO entries for this member yet (logging went live ~today; the Week 9 attempt predates it).');
              } else {
                out.push(`saveLog (${keys.length} entries):`);
                keys.map(k=>log[k]).sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach(e=>{
                  out.push(`  ${ct(e.ts)} · ${e.outcome}${e.reason?(' · '+e.reason):''}${e.week!=null?(' · wk'+e.week):''}`);
                });
              }
            } else {
              out.push(`No lineup found for a team matching "${TEAM}" in weeks 7-11.`);
            }

            ann('notice', `yyyy lineups + save log`, out.join('\n'));
          })().catch(e => { ann('error','check failed', e.message); process.exit(1); });
          SCRIPT
