name: Lineup read check (read-only)
on:
  push:
    branches: [audit/draft-check]
    paths: ['.github/workflows/lineup-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify a team's saved roster (Evans/Collins swap)
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB = process.env.FIREBASE_DB_URL, T = process.env.FIREBASE_AUTH_TOKEN;
          const get = p => new Promise((res, rej) => https.get(`${FB}${p}${p.includes('?')?'&':'?'}auth=${T}`, r => { let d=''; r.on('data',c=>d+=c); r.on('end',()=>{ try{res(JSON.parse(d));}catch(e){res(null);} }); }).on('error', rej));
          const esc = s => String(s).replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A');
          const ann = (l,t,m) => console.log(`::${l} title=${esc(t).replace(/:/g,'%3A').replace(/,/g,'%2C')}::${esc(m)}`);
          const ct = ms => (typeof ms==='number') ? new Date(ms).toLocaleString('en-US',{timeZone:'America/Chicago',weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' CT' : 'no timestamp';
          const norm = s => String(s||'').toLowerCase().replace(/\b(jr|sr|ii|iii|iv|v)\b/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();

          const TEAM_QUERY = 'yyyy';              // the team the commissioner asked about
          const WANT = ['mike evans','nico collins'];

          (async () => {
            const settings = await get('/leagues/fr_refresh26/settings.json') || {};
            const season = settings.season || 2026;
            const meta = await get(`/leagues/fr_refresh26/season/${season}/meta.json`) || {};
            const cur = (typeof meta.week === 'number') ? meta.week : null;
            const lock = settings.draftLockedUntil, now = Date.now();
            const lockState = typeof lock!=='number' ? 'unknown' : (lock<=now ? `OPEN (since ${ct(lock)})` : `LOCKED until ${ct(lock)}`);

            const head = [];
            head.push(`Season ${season}, current week ${cur}. Draft: ${lockState}.`);

            const weeks = [cur-1, cur, cur+1].filter(w => w>=1 && w<=18);
            const allTeams = new Set();
            const hits = [];   // team-name matches for TEAM_QUERY

            for (const w of weeks) {
              const wk = await get(`/leagues/fr_refresh26/lineups/${season}/week${w}.json`) || {};
              for (const uid of Object.keys(wk)) {
                const lu = wk[uid] || {};
                const team = lu.team || '(no name)';
                allTeams.add(team);
                const nteam = norm(team), nq = norm(TEAM_QUERY);
                if (nteam === nq || (nq && nteam.includes(nq))) {
                  const slots = lu.slots || {};
                  const roster = Object.keys(slots).map(s => {
                    const p = slots[s] || {};
                    const star = WANT.includes(norm(p.name)) ? ' <<' : '';
                    return `  ${s}: ${p.name||'?'}${p.sal?` ($${p.sal})`:''}${star}`;
                  });
                  const present = WANT.filter(n => Object.values(slots).some(p => norm((p||{}).name)===n));
                  hits.push([
                    `— ${team} · week ${w} —`,
                    `  saved: ${ct(lu.submitted)}  ·  totalSal: ${lu.totalSal!=null?('$'+lu.totalSal):'?'}`,
                    `  Mike Evans present: ${present.includes('mike evans')?'YES':'no'}  ·  Nico Collins present: ${present.includes('nico collins')?'YES':'no'}`,
                    ...roster
                  ].join('\n'));
                }
              }
            }

            if (hits.length) {
              ann('notice', `Roster check — "${TEAM_QUERY}"`, head.concat('', hits).join('\n'));
            } else {
              const names = [...allTeams].sort((a,b)=>a.localeCompare(b));
              const chunk = [];
              let cur2 = `No team matched "${TEAM_QUERY}". ${names.length} teams with lineups in weeks ${weeks.join('/')}:\n`;
              names.forEach(n => { if ((cur2+n).length > 3500){ chunk.push(cur2); cur2=''; } cur2 += '• '+n+'\n'; });
              chunk.push(cur2);
              ann('warning', 'Team not found — pick from this list', head.concat('', chunk).join('\n'));
            }
          })().catch(e => { ann('error','check failed', e.message); process.exit(1); });
          SCRIPT
