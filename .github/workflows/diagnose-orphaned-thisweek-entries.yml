name: One-Time Diagnostic — Find Orphaned Score Entries Polluting This Week

# ONE-TIME USE — delete this file after running it once.
# Checks for real Week 1 score entries whose uid doesn't correspond
# to any real, currently-active member - the same pattern as the
# earlier PackrBackr bug. Also identifies what the real, current
# high-score entry is, and whether it's a real, active member or an
# orphaned one. Read-only.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Find orphaned entries and check the real high score
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;
          const WEEK = 1;

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            const members = await fetchJson(`/leagues/${LEAGUE_ID}/members.json`).catch(() => ({})) || {};
            const rawScores = await fetchJson(`/leagues/${LEAGUE_ID}/season/${SEASON}/${WEEK}.json`).catch(() => ({})) || {};

            const realActiveUids = new Set(
              Object.entries(members).filter(([, m]) => m && m.teamName && m.active !== false).map(([uid]) => uid)
            );
            console.log(`Real, active members: ${realActiveUids.size}`);
            console.log(`Real score entries: ${Object.keys(rawScores).length}`);
            console.log('');

            const orphaned = Object.entries(rawScores).filter(([uid]) => !realActiveUids.has(uid));
            console.log(`Score entries with NO matching real, active member: ${orphaned.length}`);
            orphaned.forEach(([uid, entry]) => {
              console.log(`  uid=${uid} team="${entry.team}" score=${entry.score}`);
            });
            console.log('');

            // What the real "high score" computation actually picks right now
            const allEntries = Object.entries(rawScores);
            if (allEntries.length) {
              const highest = allEntries.reduce((a, b) => (b[1].score > a[1].score ? b : a));
              const [highUid, highEntry] = highest;
              console.log(`Current real "high score" pick: team="${highEntry.team}" score=${highEntry.score} uid=${highUid}`);
              console.log(`  Is this a real, active member: ${realActiveUids.has(highUid)}`);
            }

            // For comparison: the real high score AMONG genuine active members only
            const realOnly = allEntries.filter(([uid]) => realActiveUids.has(uid));
            if (realOnly.length) {
              const realHighest = realOnly.reduce((a, b) => (b[1].score > a[1].score ? b : a));
              console.log(`Real high score among genuine active members only: team="${realHighest[1].team}" score=${realHighest[1].score}`);
            }
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
