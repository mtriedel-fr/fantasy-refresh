name: URGENT One-Time Fix — Remove Premature Lock From Week 1 Scores

# ONE-TIME USE — delete this file after it runs successfully once.
#
# The now-fixed day-of-week bug in auto-scoring.yml caused every
# Tuesday run (including the external cron-job.org service's
# every-2-minute calls) to lock every scored entry, while games were
# still genuinely live. Confirmed directly: the real scoring logic
# now correctly runs, but skips every single team because they're
# all still marked locked from before the fix. This removes that
# incorrect, premature lock so real scoring can resume - touches
# ONLY the locked/lockedAt fields, never any real score or stat data.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to remove the premature lock from Week 1 scores'
        required: true
        default: 'NO'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Remove premature lock from Week 1 scores
        if: ${{ github.event.inputs.confirm == 'YES' }}
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const SEASON = 2026;
          const WEEK = 1;
          const LEAGUES = ['fr_refresh26', 'fr_test_full', 'fr_test_h2h'];

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }
          function firebasePatch(path, value) {
            return new Promise((resolve, reject) => {
              const url = new URL(fbAuth(`${FB_URL}${path}`));
              const body = JSON.stringify(value);
              const req = https.request({
                hostname: url.hostname, path: url.pathname + url.search, method: 'PATCH',
                headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) }
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => {
                  if (res.statusCode < 200 || res.statusCode >= 300) reject(new Error(`Write failed: HTTP ${res.statusCode} — ${d}`));
                  else resolve(d);
                });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          async function unlockLeague(leagueId) {
            const scores = await fetchJson(`/leagues/${leagueId}/season/${SEASON}/${WEEK}.json`).catch(() => null);
            if (!scores) { console.log(`${leagueId}: no score data found.`); return; }

            const updates = {};
            Object.entries(scores).forEach(([uid, entry]) => {
              if (uid === 'ownership' || uid === 'ownershipMeta') return; // not real team entries — leave untouched
              if (entry && entry.locked === true) {
                updates[uid + '/locked'] = false; // deep-path key — PATCHes only this one nested field, never replaces the whole entry
              }
            });

            if (!Object.keys(updates).length) {
              console.log(`${leagueId}: nothing locked — already clean.`);
              return;
            }

            await firebasePatch(`/leagues/${leagueId}/season/${SEASON}/${WEEK}.json`, updates);
            console.log(`${leagueId}: unlocked ${Object.keys(updates).length} team(s).`);
          }

          async function main() {
            for (const leagueId of LEAGUES) {
              await unlockLeague(leagueId);
            }
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT

      - name: Skipped - confirmation not provided
        if: ${{ github.event.inputs.confirm != 'YES' }}
        run: echo "Skipped — re-run with confirm=YES to actually remove the premature lock."
