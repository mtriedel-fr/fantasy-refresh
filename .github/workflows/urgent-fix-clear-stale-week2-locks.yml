name: URGENT One-Time Fix — Clear Stale Preseason Lock Data From Week 2

# ONE-TIME USE — delete this file after it runs successfully once.
#
# Confirmed directly: /leagues/fr_refresh26/locks/2026/week2 contains
# leftover preseason lock data (August 13-15 game dates, from
# kickoff-locks.yml preseason testing) that never got cleared before
# the real regular season began. draft.html's eligibility filter
# treats ANY entry in this data as "team is locked right now" with
# no check for whether that lock is actually relevant to the current
# real week - so every single team reads as locked, and every player
# in every game shows as ineligible. This clears it so the real,
# correct state (no Week 2 games have actually started yet) can take
# over.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to clear the stale Week 2 lock data'
        required: true
        default: 'NO'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Clear stale preseason lock data
        if: ${{ github.event.inputs.confirm == 'YES' }}
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;
          const WEEK = 2;

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }
          function firebaseDelete(path) {
            return new Promise((resolve, reject) => {
              const url = new URL(fbAuth(`${FB_URL}${path}`));
              const req = https.request({
                hostname: url.hostname, path: url.pathname + url.search, method: 'DELETE'
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => {
                  if (res.statusCode < 200 || res.statusCode >= 300) reject(new Error(`Delete failed: HTTP ${res.statusCode} — ${d}`));
                  else resolve(d);
                });
              });
              req.on('error', reject);
              req.end();
            });
          }

          async function main() {
            const locks = await fetchJson(`/leagues/${LEAGUE_ID}/locks/${SEASON}/week${WEEK}.json`).catch(() => null);
            if (!locks) { console.log('No lock data found at all — already clear, nothing to do.'); return; }

            const entries = Object.values(locks);
            const staleCount = entries.filter(e => e && e.gameId && (e.gameId.startsWith('20260813') || e.gameId.startsWith('20260814') || e.gameId.startsWith('20260815'))).length;
            console.log(`Real entries: ${entries.length}, confirmed-stale (August preseason dates): ${staleCount}`);

            if (staleCount !== entries.length) {
              console.log('⚠️  Not every entry matches the confirmed stale pattern — refusing to delete, something may have changed. Stopping for manual review.');
              return;
            }

            await firebaseDelete(`/leagues/${LEAGUE_ID}/locks/${SEASON}/week${WEEK}.json`);
            console.log(`✅ Cleared ${entries.length} stale preseason lock entries from Week 2.`);
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT

      - name: Skipped - confirmation not provided
        if: ${{ github.event.inputs.confirm != 'YES' }}
        run: echo "Skipped — re-run with confirm=YES to actually clear the stale data."
