name: Weekly Auto-Open (Salaries + Draft Unlock)

# Ongoing, recurring workflow (not one-time) - runs every 30 minutes to
# reliably catch the real 7:00 AM CT target moment, whichever day of
# the week that lands on for a given week (the target moves depending
# on each week's actual first kickoff, not a fixed weekday).
#
# Once next week's real first kickoff is known from the cached
# schedule, this computes 7:00 AM CT on the real calendar day
# immediately before that kickoff's CT calendar day (DST-safe -
# verified directly against both a real CDT and CST case before this
# ever ran for real), and once that moment has passed:
#   1. Generates real salaries for that week (same self-calibrating,
#      exponent-based formula as the real "Generate Salaries" button,
#      with the same real-projections-with-flat-fallback behavior).
#   2. Unlocks drafting immediately by setting draftLockedUntil to now.
#
# Hard fairness safeguard: if that week already has real salaries
# saved (checked first, every run), this does nothing at all - it
# will never regenerate over an existing sheet. This is the direct,
# structural fix for the repriceLineup() risk confirmed earlier: since
# this only ever runs automatically, once, there's no human in the
# loop who could accidentally re-trigger generation after people have
# already started drafting.
#
# Targets the real league (fr_refresh26) explicitly, rather than a
# generic loop over every league - the preseason test league uses a
# different season-key structure (2026P vs 2026) and its own already-
# established weekly-prep cadence, and getting a generic filter wrong
# here risks unsupervised salary generation misfiring on the wrong
# league entirely.

on:
  # Triggered externally by cron-job.org (a POST to this workflow's
  # workflow_dispatch), the same reliable cadence used for auto-scoring and
  # kickoff-locks. GitHub's own schedule trigger was REMOVED in favor of that
  # reliable external cadence — the draft opening on time depends on this job,
  # so it shouldn't ride GitHub's flaky scheduler.
  workflow_dispatch:

jobs:
  auto-open:
    runs-on: ubuntu-latest
    steps:
      - name: Check and open next week if it's time
        env:
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const T01_KEY = process.env.TANK01_KEY;
          const T01_HOST = 'tank01-nfl-live-in-game-real-time-statistics-nfl.p.rapidapi.com';
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';

          // Confirmed directly tonight: writes to /leagues/{id}/settings
          // fail with a real 401 Permission Denied without this token -
          // every other successful write in this project appends it the
          // same way. Missing this silently breaks writes rather than
          // erroring loudly, so every write below also checks its real
          // HTTP status rather than assuming success.
          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }

          function t01(path) {
            return new Promise((resolve, reject) => {
              https.get({
                hostname: T01_HOST, path, headers: {
                  'X-RapidAPI-Key': T01_KEY, 'X-RapidAPI-Host': T01_HOST
                }
              }, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve({ status: res.statusCode, body: JSON.parse(data) }); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }
          function firebaseGet(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }
          function firebasePut(path, value) {
            return new Promise((resolve, reject) => {
              const url = new URL(fbAuth(`${FB_URL}${path}`));
              const body = JSON.stringify(value);
              const req = https.request({
                hostname: url.hostname, path: url.pathname + url.search, method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) }
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => {
                  if (res.statusCode < 200 || res.statusCode >= 300) {
                    reject(new Error(`Firebase write failed: HTTP ${res.statusCode} — ${d}`));
                  } else {
                    resolve(d);
                  }
                });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          // DST-safe: finds the real UTC offset for Chicago at a given
          // approximate moment, rather than assuming CDT or CST.
          function getChicagoOffsetMinutes(approxDate) {
            const parts = new Intl.DateTimeFormat('en-US', {
              timeZone: 'America/Chicago', timeZoneName: 'shortOffset'
            }).formatToParts(approxDate);
            const offsetPart = parts.find(p => p.type === 'timeZoneName').value;
            const match = offsetPart.match(/GMT([+-]\d+)/);
            return match ? parseInt(match[1]) * 60 : -300;
          }

          // 7:00 AM CT on the real calendar day immediately before
          // kickoffMs's own real CT calendar day. Verified directly
          // against both a real CDT (September) and CST (December)
          // case before this workflow ever ran for real.
          function computeTargetOpenTime(kickoffMs) {
            const ctParts = new Intl.DateTimeFormat('en-US', {
              timeZone: 'America/Chicago', year: 'numeric', month: '2-digit', day: '2-digit'
            }).formatToParts(new Date(kickoffMs));
            const y = parseInt(ctParts.find(p => p.type === 'year').value);
            const m = parseInt(ctParts.find(p => p.type === 'month').value);
            const d = parseInt(ctParts.find(p => p.type === 'day').value);
            const dayBeforeMs = Date.UTC(y, m - 1, d - 1, 12, 0, 0); // noon UTC, safe from any date-shifting
            const offsetMin = getChicagoOffsetMinutes(new Date(dayBeforeMs));
            const dayBefore = new Date(dayBeforeMs);
            return Date.UTC(dayBefore.getUTCFullYear(), dayBefore.getUTCMonth(), dayBefore.getUTCDate(), 7, 0, 0) - (offsetMin * 60 * 1000);
          }

          // Real, confirmed target ceilings and exponent - same formula
          // just fixed in the real "Generate Salaries" button, so an
          // automatically-generated week prices identically to a
          // manually-generated one.
          const TOP_ANCHOR_EXP = 0.6; // shared cross-position rate, calibrated off whichever position has the single highest real projection this week
          const SHARED_CAP = 8600;   // QB, TE, DEF clamp
          const RB_WR_MAX = 9100;    // RB, WR get their own, higher clamp — confirmed needed for real separation from TE specifically
          const MIN_SANITY = 100;
          const POSITIONS = {
            QB:  { exp: 1.3,  premium: 1.0,   clamp: SHARED_CAP },
            RB:  { exp: 0.55, premium: 1.058, clamp: RB_WR_MAX },
            WR:  { exp: 0.55, premium: 1.12,  clamp: RB_WR_MAX },
            TE:  { exp: 0.7,  premium: 1.21,  clamp: SHARED_CAP },
            DEF: { exp: 0.6,  premium: 0.97,  clamp: SHARED_CAP }
          };
          const SAL_MIN_DEFAULT = 100;
          const SAL_MAX_DEFAULT = 9100;
          const SAL_ROUND = 100;
          const BACKUP_QB_SALARY = 3800; // floor for a QB with no real projection yet

          // Suffix/punctuation-safe name match — confirmed directly:
          // Tank01's projections source and the real player pool
          // sometimes disagree on "Jr."/"II" formatting, and a raw
          // lowercase compare silently fails the match for any
          // suffixed player, losing their real pool id/headshot even
          // though nothing about the underlying data was wrong.
          function normalizeNameForMatch(name) {
            return (name || '')
              .toLowerCase()
              .replace(/[.,']/g, '')
              .replace(/\s+(jr|sr|ii|iii|iv|v)$/i, '')
              .trim();
          }

          async function getRealProjections(week, season) {
            const scoring = [
              'itemFormat=list', 'twoPointConversions=2', 'passYards=.04', 'passTD=4',
              'passInterceptions=-1', 'pointsPerReception=1', 'rushYards=.1', 'rushTD=6',
              'fumbles=-1', 'receivingYards=.1', 'receivingTD=6'
            ].join('&');
            const attempts = [
              `/getNFLProjections?week=${week}&${scoring}`,
              `/getNFLProjections?week=${week}&archiveSeason=${parseInt(season) - 1}&${scoring}`
            ];
            for (const path of attempts) {
              try {
                const res = await t01(path);
                const body = (res.body && res.body.body) || {};
                const playerArr = Array.isArray(body.playerProjections) ? body.playerProjections : [];
                const defArr = Array.isArray(body.teamDefenseProjections) ? body.teamDefenseProjections : [];
                if (!playerArr.length && !defArr.length) continue;

                const players = playerArr.map(p => {
                  const pts = parseFloat(p.fantasyPoints || 0) ||
                    ((p.fantasyPointsDefault && p.fantasyPointsDefault.PPR) ? parseFloat(p.fantasyPointsDefault.PPR) : 0);
                  return { id: p.playerID || '', name: p.longName || p.playerName || '', pos: p.pos || '', team: p.team || p.teamAbv || '', proj: pts, status: p.injuryStatus || p.injury || 'Active' };
                }).filter(p => p.name && p.pos && ['QB','RB','WR','TE'].includes(p.pos) && p.proj > 0);

                const defs = defArr.map(d => ({ id: (d.teamAbv || d.team || '') + '_DEF', name: d.teamAbv || d.team || '', pos: 'DEF', team: d.teamAbv || d.team || '', proj: parseFloat(d.fantasyPointsDefault || 0), status: 'Active' })).filter(d => d.name && d.proj > 0);

                const all = [...players, ...defs];
                if (all.length) return all;
              } catch(e) { continue; }
            }
            return [];
          }

          async function generateRealSalaries(season, week) {
            const projPlayers = await getRealProjections(week, season);
            if (!projPlayers.length) {
              console.log(`  No real projections available yet for week ${week} — leaving unsalaried, will retry next run.`);
              return false;
            }

            const pool = await firebaseGet(`/playerPool/${season}/players.json`).catch(() => null);
            const nameMap = {};
            if (pool) Object.values(pool).forEach(p => { if (p && p.name) nameMap[normalizeNameForMatch(p.name)] = p; });

            // Real, current max projection PER POSITION this week —
            // anchors each position's own top price.
            const maxProjByPos = {};
            ['QB','RB','WR','TE','DEF'].forEach(pos => {
              const atPos = projPlayers.filter(p => p.pos === pos && p.proj > 0);
              maxProjByPos[pos] = atPos.length ? Math.max(...atPos.map(p => p.proj)) : 0;
            });
            const globalMaxProj = Math.max(...Object.values(maxProjByPos).filter(v => v > 0), 1);
            const baseRate = SHARED_CAP / Math.pow(globalMaxProj, TOP_ANCHOR_EXP);

            const multByPos = {};
            Object.entries(POSITIONS).forEach(([pos, conf]) => {
              if (!maxProjByPos[pos]) return;
              let topAnchor = Math.pow(maxProjByPos[pos], TOP_ANCHOR_EXP) * baseRate * conf.premium;
              topAnchor = Math.min(topAnchor, conf.clamp);
              multByPos[pos] = topAnchor / Math.pow(maxProjByPos[pos], conf.exp);
            });

            const salaries = {};
            let count = 0;
            projPlayers.forEach(p => {
              if (!p.proj || p.proj <= 0) return;
              if (!POSITIONS[p.pos]) return;
              const poolP = nameMap[normalizeNameForMatch(p.name)];
              const pid = poolP ? poolP.id : ('t01_' + p.id);
              const inj = poolP ? (poolP.status || p.status || null) : (p.status || null);
              if (inj === 'O' || inj === 'IR') return;
              const conf = POSITIONS[p.pos];
              const mult = multByPos[p.pos] || 0;
              let sal = Math.ceil((Math.pow(p.proj, conf.exp) * mult) / SAL_ROUND) * SAL_ROUND;
              sal = Math.max(MIN_SANITY, Math.min(conf.clamp, sal));
              sal = Math.max(SAL_MIN_DEFAULT, Math.min(SAL_MAX_DEFAULT, sal));
              salaries[pid] = { id: pid, name: p.name, pos: p.pos, team: p.team, proj: Math.round(p.proj * 10) / 10, salary: sal, status: inj, tank01PlayerID: poolP ? poolP.tank01PlayerID : null, headshot: poolP ? poolP.headshot : null };
              count++;
            });

            // Backup QBs — a player with no meaningful role isn't
            // returned by the projections source at all, not even with
            // proj:0, so this second pass checks the real, full player
            // pool (which does include every real QB) for anyone still
            // missing from salaries after the main loop above.
            Object.values(pool || {}).forEach(poolP => {
              if (!poolP || poolP.pos !== 'QB') return;
              if (salaries[poolP.id]) return;
              const inj = poolP.status || null;
              if (inj === 'O' || inj === 'IR') return;
              salaries[poolP.id] = { id: poolP.id, name: poolP.name, pos: 'QB', team: poolP.team, proj: 0, salary: BACKUP_QB_SALARY, status: inj, tank01PlayerID: poolP.tank01PlayerID || null, headshot: poolP.headshot || null };
              count++;
            });

            await firebasePut(`/leagues/${LEAGUE_ID}/salaries/${season}/week${week}.json`, {
              players: salaries,
              meta: { cap: 60000, count, flat: false, generated: Date.now(), locked: false, week }
            });
            console.log(`  Generated real salaries for week ${week} (${count} players).`);
            return true;
          }

          // Ranks all 32 real defenses by total fantasy points allowed
          // to each position group (QB/RB/WR/TE) so far this season,
          // computed once here instead of live on every draft.html page
          // load by every user — which would otherwise mean redundantly
          // re-fetching and re-aggregating a growing number of weeks'
          // archives, for every single visit, as the season progresses.
          async function computeAndStoreDefVsPosRanks(season, upToWeek) {
            if (upToWeek < 1) return;
            const weekNums = [];
            for (let w = 1; w <= upToWeek; w++) weekNums.push(w);

            const archives = await Promise.all(
              weekNums.map(w => firebaseGet(`/nflStatsArchive/${season}/Regular_wk${w}.json`).catch(() => null))
            );

            function opponentMapForWeek(games) {
              const map = {};
              (games || []).forEach(g => {
                if (!g || !g.home || !g.away) return;
                map[g.home] = g.away;
                map[g.away] = g.home;
              });
              return map;
            }

            const allowed = {};
            archives.forEach(archive => {
              if (!archive || !archive.players) return;
              const oppMap = opponentMapForWeek(archive.games);
              Object.values(archive.players).forEach(p => {
                if (!p || !p.team || !p.pos || typeof p.pts !== 'number') return;
                if (!['QB','RB','WR','TE'].includes(p.pos)) return;
                const opp = oppMap[p.team];
                if (!opp) return;
                if (!allowed[opp]) allowed[opp] = { QB: 0, RB: 0, WR: 0, TE: 0 };
                allowed[opp][p.pos] += p.pts;
              });
            });

            const ranks = {};
            ['QB','RB','WR','TE'].forEach(pos => {
              const teams = Object.keys(allowed).sort((a, b) => allowed[b][pos] - allowed[a][pos]);
              teams.forEach((team, idx) => {
                if (!ranks[team]) ranks[team] = {};
                ranks[team][pos] = idx + 1;
              });
            });

            await firebasePut(`/leagues/${LEAGUE_ID}/defVsPosRanks/${season}.json`, {
              ranks, computedThroughWeek: upToWeek, generated: Date.now()
            });
            console.log(`  Computed and stored defense-vs-position ranks through week ${upToWeek} (${Object.keys(ranks).length} teams).`);
          }

          async function main() {
            const settings = await firebaseGet(`/leagues/${LEAGUE_ID}/settings.json`).catch(() => null);
            if (!settings || !settings.active) { console.log('League not found or not active — nothing to do.'); return; }
            const season = settings.season || 2026;

            const seasonMeta = await firebaseGet(`/leagues/${LEAGUE_ID}/season/${season}/meta.json`).catch(() => null);
            const currentWeek = (seasonMeta && typeof seasonMeta.week === 'number') ? seasonMeta.week : 1;
            const nextWeek = currentWeek + 1;
            if (nextWeek > 18) { console.log('Season complete — nothing to open.'); return; }

            const cachedSeason = await firebaseGet(`/nflSchedule/${season}/Regular.json`).catch(() => null);
            const weekGames = cachedSeason && cachedSeason.weeks && cachedSeason.weeks[`week${nextWeek}`];
            if (!Array.isArray(weekGames) || !weekGames.length) {
              console.log(`No cached schedule yet for week ${nextWeek} — skipping this run.`);
              return;
            }
            const gameTimes = weekGames.filter(g => g && g.time).map(g => new Date(g.time).getTime());
            if (!gameTimes.length) { console.log(`Week ${nextWeek} schedule has no real game times yet — skipping.`); return; }
            const firstKickoffMs = Math.min(...gameTimes);
            const targetMs = computeTargetOpenTime(firstKickoffMs);

            console.log(`Week ${nextWeek} first kickoff ${new Date(firstKickoffMs).toISOString()}, target open time ${new Date(targetMs).toISOString()}, now ${new Date().toISOString()}`);

            if (Date.now() < targetMs) {
              console.log(`Not yet time — will check again next run.`);
              return;
            }

            // It's time to open. Ensure salaries exist — but NEVER
            // regenerate over an existing sheet (fairness), and, crucially,
            // decouple UNLOCKING the draft from whether WE were the one to
            // generate the salaries. Another job (weekly-prep) or a
            // commissioner may have already created this week's salaries;
            // the draft must still open on time regardless. The previous
            // version returned early the moment salaries existed — before
            // ever reaching the unlock — so if anything generated this
            // week's salaries first (e.g. weekly-prep's Wednesday run, or a
            // manual test), the draft would silently never open.
            const existingMeta = await firebaseGet(`/leagues/${LEAGUE_ID}/salaries/${season}/week${nextWeek}/meta.json`).catch(() => null);
            let haveSalaries = !!(existingMeta && existingMeta.count > 0);
            if (haveSalaries) {
              console.log(`Week ${nextWeek} already has salaries (${existingMeta.count}, flat=${!!existingMeta.flat}) — not regenerating, proceeding to open.`);
            } else {
              haveSalaries = await generateRealSalaries(season, nextWeek);
            }

            if (!haveSalaries) {
              console.log(`No salaries yet for week ${nextWeek} (no projections and none pre-existing) — leaving draft locked, will retry next run.`);
              return;
            }

            // Idempotent unlock: only flip the lock (and only recompute DVP
            // ranks) on the first run that actually opens the draft. Every
            // later cron firing this week is a quiet no-op, so repeated
            // triggers don't re-unlock or re-read a full season of archives.
            const now = Date.now();
            const currentLock = await firebaseGet(`/leagues/${LEAGUE_ID}/settings/draftLockedUntil.json`).catch(() => null);
            if (typeof currentLock !== 'number' || currentLock > now) {
              await firebasePut(`/leagues/${LEAGUE_ID}/settings/draftLockedUntil.json`, now);
              console.log(`Draft unlocked for week ${nextWeek}.`);
              // Real games completed through currentWeek (not nextWeek,
              // whose games haven't been played yet) — computed once here,
              // at the moment the new draft week opens.
              await computeAndStoreDefVsPosRanks(season, currentWeek).catch(e => console.log('DVP rank computation failed (non-fatal):', e.message));
            } else {
              console.log(`Draft already open for week ${nextWeek} (draftLockedUntil ${currentLock}) — no change.`);
            }
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
