name: URGENT Diagnostic — Is Scoring Writing To Week 1 Or Week 2 Right Now

# ONE-TIME USE — delete this file after running it once.
# Checks real, live scoring activity right now for both Week 1 (the
# stuck meta.week value) and Week 2 (the real, actual current week) -
# to confirm or rule out whether auto-scoring.yml is also keying off
# the same stuck meta.week and actively re-scoring the wrong week
# instead of touching Week 2's real, live games. Read-only.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check real live scoring activity for both weeks
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            console.log('Current real time:', new Date().toISOString());
            console.log('');

            const seasonMeta = await fetchJson(`/leagues/${LEAGUE_ID}/season/${SEASON}/meta.json`).catch(() => null);
            console.log('Real, current season/meta:', JSON.stringify(seasonMeta));
            if (seasonMeta && seasonMeta.lastScored) {
              console.log('lastScored as real date:', new Date(seasonMeta.lastScored).toISOString());
              console.log('How long ago:', ((Date.now() - seasonMeta.lastScored) / 1000 / 60).toFixed(1), 'minutes');
            }
            console.log('');

            for (const week of [1, 2]) {
              console.log(`=== Week ${week} real scoring data ===`);
              const weekData = await fetchJson(`/leagues/${LEAGUE_ID}/season/${SEASON}/${week}.json`).catch(() => null);
              if (!weekData) {
                console.log('  No real data at all for this week.');
                console.log('');
                continue;
              }
              const entries = Object.entries(weekData).filter(([k]) => k !== 'ownership' && k !== 'ownershipMeta');
              console.log(`  Real team entries: ${entries.length}`);
              // Sample a few real scores to see if they look live/current or static
              const sample = entries.slice(0, 3);
              sample.forEach(([uid, e]) => {
                console.log(`  ${e && e.name ? e.name : uid}: score=${e ? e.score : 'MISSING'}, uid=${uid}`);
              });
              console.log('');
            }

            const week2Finalized = await fetchJson(`/leagues/${LEAGUE_ID}/season/${SEASON}/2/finalizedAt.json`).catch(() => null);
            console.log('Week 2 finalizedAt (should NOT exist yet, week just started):', week2Finalized);
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
