name: One-Time Diagnostic — Search All Games For A Real Blocked Kick

# ONE-TIME USE — delete this file after running it once.
# Searches every real game from this preseason for any mention of a
# blocked kick anywhere in the data - scoring plays, team stats, full
# player stat objects - to find an actual game where one happened and
# see exactly how (or whether) Tank01 records it when it's genuinely
# real, rather than only checking one game that happened not to have
# any blocks in it at all.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Search all real games for a genuine blocked kick
        env:
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const T01_KEY = process.env.TANK01_KEY;
          const T01_HOST = 'tank01-nfl-live-in-game-real-time-statistics-nfl.p.rapidapi.com';

          // Every real, confirmed preseason week 3 game from tonight's
          // work.
          const GAME_IDS = [
            '20260820_LV@HOU', '20260820_SF@LAC', '20260821_NYJ@PIT',
            '20260821_CAR@JAX', '20260821_GB@DEN', '20260822_WSH@DET',
            '20260822_ATL@IND', '20260822_BAL@MIN', '20260822_BUF@CLE',
            '20260822_NO@LAR', '20260822_NYG@MIA', '20260822_CHI@CIN',
            '20260822_PHI@NE', '20260822_KC@TB', '20260822_DAL@ARI',
            '20260823_SEA@TEN'
          ];

          function t01(path) {
            return new Promise((resolve, reject) => {
              https.get({
                hostname: T01_HOST, path, headers: {
                  'X-RapidAPI-Key': T01_KEY, 'X-RapidAPI-Host': T01_HOST
                }
              }, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            let foundAny = false;
            for (const gid of GAME_IDS) {
              try {
                const bs = await t01(`/getNFLBoxScore?gameID=${gid}&fantasyPoints=true&PPRScoring=true`);
                if (!bs.body) { console.log(`${gid}: no body returned`); continue; }

                // Check scoring plays for any "block" mention.
                const blockedPlays = (bs.body.scoringPlays || []).filter(p => /block/i.test(p.score || ''));

                // Check team-level stats for anything block-related.
                const teamStats = bs.body.teamStats || {};
                const teamStatKeys = new Set();
                ['home', 'away'].forEach(side => {
                  if (teamStats[side]) Object.keys(teamStats[side]).forEach(k => { if (/block/i.test(k)) teamStatKeys.add(side + '.' + k); });
                });

                // Check every individual player's every stat category for
                // anything block-related, whatever the category is called.
                const players = Object.values(bs.body.playerStats || {});
                const playerBlockFields = [];
                players.forEach(p => {
                  Object.keys(p).forEach(cat => {
                    if (p[cat] && typeof p[cat] === 'object') {
                      Object.keys(p[cat]).forEach(k => {
                        if (/block/i.test(k) && parseFloat(p[cat][k]) > 0) {
                          playerBlockFields.push(`${p.longName} — ${cat}.${k} = ${p[cat][k]}`);
                        }
                      });
                    }
                  });
                });

                if (blockedPlays.length || teamStatKeys.size || playerBlockFields.length) {
                  foundAny = true;
                  console.log(`\n=== ${gid}: FOUND something block-related ===`);
                  if (blockedPlays.length) blockedPlays.forEach(p => console.log(`  Scoring play: [${p.team}] ${p.score}`));
                  if (teamStatKeys.size) console.log(`  Team stat keys: ${[...teamStatKeys].join(', ')}`);
                  if (playerBlockFields.length) playerBlockFields.forEach(f => console.log(`  Player stat: ${f}`));
                } else {
                  console.log(`${gid}: nothing block-related found anywhere.`);
                }
              } catch(e) {
                console.log(`${gid}: fetch failed - ${e.message}`);
              }
            }
            console.log(foundAny ? '\n✅ Found at least one real example — see above.' : '\n❌ Checked all 16 real games this preseason — zero mentions of a blocked kick anywhere, in any field, in any game.');
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
