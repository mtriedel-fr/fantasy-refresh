name: One-Time Cleanup — Stale liveGameStatus Data

# ONE-TIME USE — delete this file after running it once.
# Removes confirmed stale/misplaced data at /liveGameStatus/2026/... —
# real preseason Week 2 games (Aug 15) sitting mislabeled as "wk3",
# written before both the earlier calendar-math fix and the
# just-fixed client-side hardcoded-path bug (draft.html/league.html
# were permanently reading this wrong, plain "2026" path instead of
# the real preseason path, "2026P"). Only ever touches this specific,
# confirmed-wrong data — nothing else.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to actually delete the stale data'
        required: true
        default: ''

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm, then clear, the stale entries
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          node << 'SCRIPT'
          const https = require('https');

          const FB_URL   = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const CONFIRM  = process.env.CONFIRM;
          const PATHS = [
            '/liveGameStatus/2026/Preseason_wk3',
            '/liveGameStatus/2026/Preseason_wk2'
          ];

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          function firebaseDelete(path) {
            return new Promise((resolve, reject) => {
              const fullPath = fbAuth(FB_URL + path + '.json');
              const u = new URL(fullPath);
              const req = https.request({
                hostname: u.hostname, path: u.pathname + u.search, method: 'DELETE'
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) resolve(d);
                  else reject(new Error(`DELETE rejected (HTTP ${res.statusCode}) — ${d.slice(0,200)}`));
                });
              });
              req.on('error', reject);
              req.end();
            });
          }

          async function main() {
            for (const path of PATHS) {
              const data = await fetchJson(FB_URL + path + '.json').catch(() => null);
              console.log(`\n${path}:`);
              console.log(data ? JSON.stringify(data, null, 2) : '  (already empty)');
            }

            if (CONFIRM !== 'YES') {
              console.log('\n⚠️  Confirm input was not "YES" — nothing was deleted. Set confirm=YES and re-run to actually clean this up.');
              return;
            }

            for (const path of PATHS) {
              await firebaseDelete(path);
              console.log(`✅ Deleted ${path}`);
            }
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
