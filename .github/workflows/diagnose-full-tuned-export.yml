name: One-Time Diagnostic — Tune All Positions Under 15% And Export Full CSV

# ONE-TIME USE — delete this file after running it once.
# Two steps: (1) for every position, finds the highest (least
# adjusted from the validated 0.6 base) exponent that gets
# floor-clamping under 15% of that position's real pool - QB and DEF
# already clear this at 0.6, RB/WR/TE need their own gentler,
# position-specific slope. (2) Applies the final, tuned formula to
# every real Week 1 player and prints the complete result as compact
# CSV lines (name,pos,team,proj,salary), sorted by position then
# salary descending, ready to paste into a spreadsheet.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Tune all positions and export full CSV
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;
          const WEEK = 1;

          const SAL_MAX = 11300;
          const SAL_MIN = 2400;
          const TOP_ANCHOR_EXPONENT = 0.6;
          const TARGET_PCT = 15;
          // Test from the validated 0.6 base down to 0.2, in fine steps,
          // so we find the gentlest possible adjustment that still clears
          // the 15% target rather than overshooting further than needed.
          const CANDIDATE_EXPONENTS = [0.60,0.55,0.50,0.45,0.40,0.35,0.30,0.25,0.20];

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }
          function salRound(n) {
            return Math.ceil(Math.max(SAL_MIN, Math.min(SAL_MAX, n)) / 100) * 100;
          }

          async function main() {
            const salaryData = await fetchJson(`/leagues/${LEAGUE_ID}/salaries/${SEASON}/week${WEEK}.json`).catch(() => null);
            if (!salaryData || !salaryData.players) { console.log('No real salary data found.'); return; }

            const allPlayers = Object.values(salaryData.players);
            const withProj = allPlayers.filter(p => p.proj > 0);
            const positions = ['QB', 'RB', 'WR', 'TE', 'DEF'];

            const globalMaxProj = Math.max(...withProj.map(p => p.proj));
            const sharedMult = SAL_MAX / Math.pow(globalMaxProj, TOP_ANCHOR_EXPONENT);

            console.log('=== STEP 1: Tuning each position under 15% ===\n');

            const tunedParams = {}; // pos -> { topAnchor, maxProj, exponent, mult }

            positions.forEach(pos => {
              const posPlayers = withProj.filter(p => p.pos === pos);
              if (!posPlayers.length) return;

              const maxProj = Math.max(...posPlayers.map(p => p.proj));
              const topAnchor = Math.pow(maxProj, TOP_ANCHOR_EXPONENT) * sharedMult;

              let chosenExp = null, chosenPct = null;
              for (const exp of CANDIDATE_EXPONENTS) {
                const mult = topAnchor / Math.pow(maxProj, exp);
                const clamped = posPlayers.filter(p => Math.pow(p.proj, exp) * mult < SAL_MIN).length;
                const pct = (clamped / posPlayers.length) * 100;
                if (pct < TARGET_PCT) { chosenExp = exp; chosenPct = pct; break; }
              }
              if (chosenExp === null) { chosenExp = CANDIDATE_EXPONENTS[CANDIDATE_EXPONENTS.length - 1]; chosenPct = null; }

              const finalMult = topAnchor / Math.pow(maxProj, chosenExp);
              tunedParams[pos] = { topAnchor, maxProj, exponent: chosenExp, mult: finalMult };

              console.log(`${pos}: top anchor $${topAnchor.toFixed(0)} @ ${maxProj.toFixed(1)} pts -> exponent ${chosenExp}${chosenPct !== null ? ` (${chosenPct.toFixed(1)}% clamp)` : ' (target not reached even at gentlest tested)'}`);
            });

            console.log('\n=== STEP 2: Full player export (CSV) ===\n');
            console.log('name,pos,team,proj,salary');

            const results = [];
            allPlayers.forEach(p => {
              if (!p.proj || p.proj <= 0 || !tunedParams[p.pos]) {
                results.push({ name: p.name, pos: p.pos, team: p.team, proj: p.proj || 0, salary: SAL_MIN });
                return;
              }
              const { exponent, mult } = tunedParams[p.pos];
              const sal = salRound(Math.pow(p.proj, exponent) * mult);
              results.push({ name: p.name, pos: p.pos, team: p.team, proj: p.proj, salary: sal });
            });

            const posOrder = { QB: 0, RB: 1, WR: 2, TE: 3, DEF: 4 };
            results.sort((a, b) => (posOrder[a.pos] - posOrder[b.pos]) || (b.salary - a.salary));

            results.forEach(r => {
              console.log(`${r.name},${r.pos},${r.team},${r.proj.toFixed(1)},${r.salary}`);
            });

            console.log(`\nTotal players exported: ${results.length}`);
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
