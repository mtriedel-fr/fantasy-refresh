name: One-Time Diagnostic — Find SEA Defense Score Discrepancy

# ONE-TIME USE — delete this file after running it once.
# Compares the real, fresh gameStats data (what "All Players" reads
# directly) against every real team's stored lineup slot data for
# any slot rostering SEA DEF, to find exactly which team has a stale
# score, what their stored value is vs the real fresh one, whether
# their entry is locked, and whether their lineup's stored player id
# for that slot actually matches "SEA" exactly. Read-only.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Compare fresh SEA DEF stats against stored lineup scores
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;
          const WEEK = 1;

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            // Find SEA's real gameId this week via the schedule the app itself uses
            const schedule = await fetchJson(`/nflSchedule/${SEASON}/week${WEEK}.json`).catch(() => null)
              || await fetchJson(`/schedule/${SEASON}/week${WEEK}.json`).catch(() => null);

            // Search all real gameStats entries for one containing SEA's defense
            const allGameStats = await fetchJson(`/gameStats/${SEASON}.json`).catch(() => null);
            let seaGameId = null, seaFreshStats = null, seaFreshPts = null;
            if (allGameStats) {
              for (const [gameId, gs] of Object.entries(allGameStats)) {
                if (gs && gs.players) {
                  const seaEntry = gs.players.find(p => p.name === 'SEA' || p.team === 'SEA');
                  if (seaEntry) {
                    seaGameId = gameId;
                    seaFreshStats = seaEntry;
                    seaFreshPts = seaEntry.pts;
                    break;
                  }
                }
              }
            }
            console.log(`Real, fresh SEA DEF data (what "All Players" reads): gameId=${seaGameId}`);
            console.log(JSON.stringify(seaFreshStats, null, 2));

            // Now scan every real team's stored lineup + score for a SEA DEF slot
            const lineups = await fetchJson(`/leagues/${LEAGUE_ID}/lineups/${SEASON}/week${WEEK}.json`).catch(() => ({}));
            const scores = await fetchJson(`/leagues/${LEAGUE_ID}/season/${SEASON}/${WEEK}.json`).catch(() => ({}));

            console.log(`\n--- Teams rostering SEA DEF ---`);
            for (const [uid, lineup] of Object.entries(lineups || {})) {
              if (!lineup || !lineup.slots) continue;
              for (const [slotId, player] of Object.entries(lineup.slots)) {
                if (!player) continue;
                const isSea = player.id === 'SEA' || (player.name || '').toUpperCase() === 'SEA' || (player.team || '').toUpperCase() === 'SEA';
                if (!isSea) continue;
                const scoreEntry = scores[uid];
                const storedPts = scoreEntry && scoreEntry.slotPts ? scoreEntry.slotPts[slotId] : undefined;
                const storedBreakdown = scoreEntry && scoreEntry.slotBreakdown ? scoreEntry.slotBreakdown[slotId] : undefined;
                console.log(`\nTeam: ${lineup.team || uid} (uid=${uid})`);
                console.log(`  Lineup slot player: id="${player.id}" name="${player.name}" team="${player.team}"`);
                console.log(`  Stored slot points: ${storedPts}  (fresh real value: ${seaFreshPts})`);
                console.log(`  locked: ${scoreEntry ? scoreEntry.locked : '(no score entry at all)'}`);
                console.log(`  status: ${scoreEntry ? scoreEntry.status : '(none)'}`);
                console.log(`  Stored breakdown: ${JSON.stringify(storedBreakdown)}`);
                if (storedPts !== seaFreshPts) {
                  console.log(`  ⚠️  MISMATCH: stored ${storedPts} vs fresh ${seaFreshPts}`);
                }
              }
            }
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
