name: One-Time Diagnostic — Full Salary Distribution

# ONE-TIME USE — delete this file after running it once.
# Pulls the real, full week-1 projection distribution per position (not
# just the elite tier) and shows what the current formula prices each
# tier at, to check where salaries might be too low relative to real
# value across the whole pool, not just at the ceiling.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and price the full real distribution
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const WORKER = 'https://fantasy-refresh-news.mtriedel.workers.dev';

          const MULT = { QB: 380, RB: 525, WR: 505, TE: 525, DEF: 500 };
          const SAL_MIN = 4500, SAL_MAX = 11300, SAL_ROUND = 100;

          function price(proj, pos) {
            let sal = Math.ceil((proj * MULT[pos]) / SAL_ROUND) * SAL_ROUND;
            return Math.max(SAL_MIN, Math.min(SAL_MAX, sal));
          }

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            const proj = await fetchJson(`${WORKER}/projections?week=1&season=2026`);
            const players = proj.players || [];

            ['QB','RB','WR','TE','DEF'].forEach(pos => {
              const atPos = players.filter(p => p.pos === pos && p.proj > 0).sort((a,b) => b.proj - a.proj);
              console.log(`\n=== ${pos} (${atPos.length} players with proj > 0) ===`);
              // Show rank 1, 5, 12, 24, 36, and last — a realistic spread from
              // "elite" through "startable" through "replacement level"
              [1, 5, 12, 24, 36].forEach(rank => {
                const p = atPos[rank - 1];
                if (!p) return;
                console.log(`  #${rank}: ${p.name} — ${p.proj} proj -> $${price(p.proj, pos).toLocaleString()}`);
              });
              const last = atPos[atPos.length - 1];
              if (last) console.log(`  #${atPos.length} (last): ${last.name} — ${last.proj} proj -> $${price(last.proj, pos).toLocaleString()}`);
            });
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
