name: One-Time Diagnostic — Check Real Salary Distribution Floor-Clamping

# ONE-TIME USE — delete this file after running it once.
# Pulls the real, current Week 1 salary data and computes, per
# position: how many players are sitting exactly at the $4,500 floor,
# a full salary histogram (10 buckets), and what percentage of each
# position's real player pool is floor-clamped. Gives a direct,
# data-backed answer to whether "too many players hitting the floor"
# is genuinely widespread, and exactly where.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check real salary distribution
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;
          const WEEK = 1;
          const SAL_MIN = 4500;

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            const salaryData = await fetchJson(`/leagues/${LEAGUE_ID}/salaries/${SEASON}/week${WEEK}.json`).catch(() => null);
            if (!salaryData || !salaryData.players) { console.log('No real salary data found.'); return; }

            const players = Object.values(salaryData.players);
            console.log(`Real Week 1 salary pool: ${players.length} players total.\n`);

            const positions = ['QB', 'RB', 'WR', 'TE', 'DEF'];
            positions.forEach(pos => {
              const posPlayers = players.filter(p => p.pos === pos);
              if (!posPlayers.length) return;

              const salaries = posPlayers.map(p => p.salary).sort((a, b) => a - b);
              const atFloor = salaries.filter(s => s === SAL_MIN).length;
              const min = salaries[0], max = salaries[salaries.length - 1];
              const pctAtFloor = ((atFloor / posPlayers.length) * 100).toFixed(1);

              console.log(`=== ${pos} (${posPlayers.length} players) ===`);
              console.log(`  Range: $${min} - $${max}`);
              console.log(`  At exact floor ($${SAL_MIN}): ${atFloor} of ${posPlayers.length} (${pctAtFloor}%)`);

              const bucketSize = Math.max(100, Math.ceil((max - min) / 10 / 100) * 100);
              const buckets = {};
              salaries.forEach(s => {
                const b = min + Math.floor((s - min) / bucketSize) * bucketSize;
                buckets[b] = (buckets[b] || 0) + 1;
              });
              Object.keys(buckets).sort((a, b) => a - b).forEach(b => {
                const bar = '█'.repeat(buckets[b]);
                console.log(`    $${b}-${parseInt(b) + bucketSize}: ${bar} (${buckets[b]})`);
              });
              console.log('');
            });
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
