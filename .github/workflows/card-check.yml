name: Player card check (read-only)
on:
  push:
    branches: [audit/draft-check]
    paths: ['.github/workflows/card-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Is the new Worker live?
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const getUrl = u => new Promise((res, rej) => https.get(u, r => { let d = ''; r.on('data', c => d += c); r.on('end', () => { try { res(JSON.parse(d)); } catch (e) { rej(new Error(d.slice(0, 200))); } }); }).on('error', rej));
          const esc = s => String(s).replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          const ann = (l, t, m) => console.log(`::${l} title=${esc(t).replace(/:/g,'%3A').replace(/,/g,'%2C')}::${esc(m)}`);
          const W = 'https://fantasy-refresh-news.mtriedel.workers.dev';
          (async () => {
            for (const [n, t, p] of [['Harold Fannin','CLE','TE'],['Kenneth Walker','KC','RB'],['Marvin Harrison','HOU','WR'],['Justin Jefferson','MIN','WR']]) {
              const r = await getUrl(`${W}/playerhistory?name=${encodeURIComponent(n)}&team=${t}&pos=${p}&season=2026&currentWeek=8`);
              ann('notice', `worker ${n}`, (r.weeks || []).filter(w => w.seasonType === 'Regular' && w.week >= 4 && w.week <= 7).map(w => `wk${w.week} ${w.opp} pts=${w.pts} rank=${w.rank} snp=${w.snapPct}`).join('\n'));
            }
            const pj = await getUrl(`${W}/projections?week=8&season=2026`);
            ann('notice', 'worker projections', `count ${pj.count}; ${pj.error || 'ok'}`);
          })().catch(e => { ann('error', 'worker check failed', e.message); process.exit(1); });
          SCRIPT
