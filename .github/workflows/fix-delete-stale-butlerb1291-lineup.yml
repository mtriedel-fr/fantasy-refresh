name: One-Time Fix — Delete Stale Butlerb1291 Week 1 Lineup

# ONE-TIME USE — delete this file after running it once.
# Deletes the confirmed stale, pre-season test lineup for
# butlerb1291's Team (real UID 1yppBKdF3nemHe7u7sSHLkbfDXn2) at Week
# 1 - submitted June 25, 2026 (months before real Week 1 salaries
# existed), containing retired/mismatched players (Ben
# Roethlisberger, Le'Veon Bell, etc.) not found in the real current
# salary pool. Confirmed isolated to this one member only - checked
# all 63 real members, everyone else correctly has no lineup at all.
#
# After this runs, butlerb1291's Team will correctly show "Roster
# Not Submitted" in standings, same as everyone else, until they
# actually draft for real once the draft opens.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to delete this stale lineup'
        required: true
        default: 'NO'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the confirmed stale lineup
        if: ${{ github.event.inputs.confirm == 'YES' }}
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;
          const WEEK = 1;
          const TARGET_UID = '1yppBKdF3nemHe7u7sSHLkbfDXn2'; // butlerb1291's Team

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }
          function firebaseDelete(path) {
            return new Promise((resolve, reject) => {
              const url = new URL(fbAuth(`${FB_URL}${path}`));
              const req = https.request({
                hostname: url.hostname, path: url.pathname + url.search, method: 'DELETE'
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => {
                  if (res.statusCode < 200 || res.statusCode >= 300) reject(new Error(`Delete failed: HTTP ${res.statusCode} — ${d}`));
                  else resolve(d);
                });
              });
              req.on('error', reject);
              req.end();
            });
          }

          async function main() {
            const path = `/leagues/${LEAGUE_ID}/lineups/${SEASON}/week${WEEK}/${TARGET_UID}`;

            console.log('Confirming the stale record still exists before deleting...');
            const before = await fetchJson(`${path}.json`).catch(() => null);
            if (!before) { console.log('No lineup found at this path already — nothing to delete.'); return; }
            console.log('Found the real, existing record — confirmed submitted ' + new Date(before.submitted).toISOString());

            await firebaseDelete(`${path}.json`);

            const after = await fetchJson(`${path}.json`).catch(() => null);
            if (after) { console.log('⚠️  Delete may not have taken — record still present. Check manually.'); return; }

            console.log(`\n✓ Deleted. butlerb1291's Team will now correctly show "Roster Not Submitted" in standings until they draft for real.`);
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT

      - name: Skipped - confirmation not provided
        if: ${{ github.event.inputs.confirm != 'YES' }}
        run: echo "Skipped — re-run with confirm=YES to actually delete."
