name: One-Time Diagnostic — Check Butlerb1291 Lineup Completeness

# ONE-TIME USE — delete this file after running it once.
# Checks the real, actual lineup data for butlerb1291's Team (real UID
# 1yppBKdF3nemHe7u7sSHLkbfDXn2, confirmed from tonight's cloning
# workflow's real-name mapping log) to confirm directly whether their
# roster is genuinely complete, or only partially drafted - the
# standings table only checks whether ANY slots data exists at all,
# not whether all 9 slots are actually filled, so a partial draft
# would incorrectly display as "submitted."

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'Which week to check (e.g. 1)'
        required: true
        default: '1'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check the real lineup data for this specific member
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
          WEEK_INPUT: ${{ github.event.inputs.week }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;
          const WEEK = process.env.WEEK_INPUT;
          const TARGET_UID = '1yppBKdF3nemHe7u7sSHLkbfDXn2'; // butlerb1291's Team

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            console.log(`Checking real lineup data for butlerb1291's Team (${TARGET_UID}), week ${WEEK}...\n`);

            const lineup = await fetchJson(`/leagues/${LEAGUE_ID}/lineups/${SEASON}/week${WEEK}/${TARGET_UID}.json`).catch(() => null);

            if (!lineup) {
              console.log('No lineup data exists at all for this member/week — standings should correctly show "Roster Not Submitted." If it is NOT showing that, the bug is elsewhere.');
              return;
            }

            console.log('Real, raw lineup record found:');
            console.log(JSON.stringify(lineup, null, 2));

            const slots = lineup.slots || {};
            const slotKeys = Object.keys(slots);
            const filledCount = slotKeys.filter(k => slots[k]).length;

            console.log(`\n--- Analysis ---`);
            console.log(`Slots present in the record: ${slotKeys.length}`);
            console.log(`Slots actually filled with a player: ${filledCount} / 9`);
            console.log(`submitted timestamp: ${lineup.submitted ? new Date(lineup.submitted).toISOString() : '(none)'}`);

            if (filledCount > 0 && filledCount < 9) {
              console.log(`\nCONFIRMED: this is a genuinely PARTIAL roster (${filledCount} of 9 slots filled) — not a real, complete submission. The standings table only checks whether "slots" exists at all, not whether it's complete, so this displays as "0.00" (submitted) when it should arguably still read as incomplete.`);
            } else if (filledCount === 9) {
              console.log(`\nThis roster IS actually fully filled (9/9 slots) — the "0.00" display is correct as-is; the score is genuinely 0.00 because scoring hasn't run yet or the players scored zero.`);
            } else if (filledCount === 0) {
              console.log(`\nA lineup record exists but has zero filled slots — an edge case worth flagging separately.`);
            }
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
