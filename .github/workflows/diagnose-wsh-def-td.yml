name: One-Time Diagnostic — Check WSH Defense TD Count

# ONE-TIME USE — delete this file after running it once.
# Checks the real, raw Tank01 data for the WSH@DET game directly -
# whether Tank01 itself reports defTD=2 (meaning this is a real
# data-source issue, not something in our own code) or whether the
# value only becomes 2 somewhere in our own processing. Also pulls the
# real scoring plays list to directly cross-check against the actual
# final score and confirm how many real defensive/ST TDs happened.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check real Tank01 data for this game
        env:
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const T01_KEY = process.env.TANK01_KEY;
          const T01_HOST = 'tank01-nfl-live-in-game-real-time-statistics-nfl.p.rapidapi.com';
          // Real gameId, derived from the real schedule confirmed
          // earlier tonight (WSH@DET, Aug 22).
          const GAME_ID = '20260822_WSH@DET';

          function t01(path) {
            return new Promise((resolve, reject) => {
              https.get({
                hostname: T01_HOST, path, headers: {
                  'X-RapidAPI-Key': T01_KEY, 'X-RapidAPI-Host': T01_HOST
                }
              }, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            const bs = await t01(`/getNFLBoxScore?gameID=${GAME_ID}&fantasyPoints=true&PPRScoring=true`);
            if (!bs.body) { console.log('No box score body returned:', JSON.stringify(bs)); return; }

            console.log('=== Real, raw DST field ===');
            console.log(JSON.stringify(bs.body.DST, null, 2));

            console.log('\n=== Real final score ===');
            console.log(`away (${bs.body.away}): ${bs.body.awayPts}, home (${bs.body.home}): ${bs.body.homePts}`);
            console.log('gameStatus:', bs.body.gameStatus);

            console.log('\n=== Real scoring plays (full list) ===');
            (bs.body.scoringPlays || []).forEach(p => {
              console.log(`  [${p.scorePeriod} ${p.scoreTime}] ${p.team}: ${p.score} (${p.scoreType}) — running score ${p.awayScore}-${p.homeScore}`);
            });

            // Count real defensive/ST TDs directly from the scoring
            // plays themselves, independent of whatever DST.defTD says.
            const realDefTds = (bs.body.scoringPlays || []).filter(p =>
              p.scoreType === 'TD' && /fumble|interception|blocked|return/i.test(p.score || '')
            );
            console.log(`\nReal defensive/ST TDs found by scanning scoring play descriptions: ${realDefTds.length}`);
            realDefTds.forEach(p => console.log(`  ${p.team}: ${p.score}`));
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
