name: One-Time Diagnostic — Check Full Board Stats Data Chain

# ONE-TIME USE — delete this file after running it once.
# Checks each step of the All Players Stats data chain directly: what
# the week's schedule fetch actually returns (game IDs), and whether
# gameStats exists under those exact IDs - to find where a mismatch
# might be breaking the chain, rather than guessing.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check the full data chain
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const WORKER = 'https://fantasy-refresh-news.mtriedel.workers.dev';

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            console.log('=== Step 1: What the week 3 schedule fetch actually returns ===');
            const sched = await fetchJson(`${WORKER}/schedule?week=3&season=2026P&seasonType=Preseason`);
            const games = (sched && sched.games) || [];
            console.log(`Found ${games.length} game(s) in schedule response.`);
            games.forEach(g => console.log(`  gameId: "${g.gameId}"  (${g.away} @ ${g.home})`));

            console.log('\n=== Step 2: Does gameStats exist under each of those exact IDs? ===');
            for (const g of games) {
              const gs = await fetchJson(`${FB_URL}/gameStats/2026P/${g.gameId}.json`).catch(() => null);
              console.log(`  /gameStats/2026P/${g.gameId}: ${gs ? `FOUND (${(gs.players||[]).length} players)` : 'NOT FOUND'}`);
            }

            console.log('\n=== Step 3: Direct check of the two known-completed games, real IDs ===');
            const knownIds = ['20260820_LV@HOU', '20260820_SF@LAC'];
            for (const gid of knownIds) {
              const gs = await fetchJson(`${FB_URL}/gameStats/2026P/${gid}.json`).catch(() => null);
              console.log(`  /gameStats/2026P/${gid}: ${gs ? `FOUND (${(gs.players||[]).length} players)` : 'NOT FOUND'}`);
              // Also check the plain, non-preseason path in case of a
              // season-key mismatch between what schedule fetch expects
              // and what auto-scoring.yml actually wrote.
              const gsWrong = await fetchJson(`${FB_URL}/gameStats/2026/${gid}.json`).catch(() => null);
              console.log(`  /gameStats/2026/${gid} (non-preseason path): ${gsWrong ? `FOUND (${(gsWrong.players||[]).length} players)` : 'NOT FOUND'}`);
            }
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
