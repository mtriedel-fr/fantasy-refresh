name: One-Time Diagnostic — Check All Members For Stale Week 1 Lineups

# ONE-TIME USE — delete this file after running it once.
# Checks EVERY real member's Week 1 lineup for the same stale-data
# pattern found in butlerb1291's Team: a submitted timestamp from
# months before the real season, or player IDs that don't exist in
# the real, current Week 1 salary pool - both strong signals of old
# test/mock data left over from early development, not a genuine
# real draft against real current players.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check every member's Week 1 lineup for stale data
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;
          const WEEK = 1;
          const SUSPICIOUS_BEFORE = new Date('2026-08-01T00:00:00Z').getTime();

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            console.log(`Fetching real members and real Week ${WEEK} lineups + salary pool...\n`);
            const [members, lineups, salaryData] = await Promise.all([
              fetchJson(`/leagues/${LEAGUE_ID}/members.json`).catch(() => ({})),
              fetchJson(`/leagues/${LEAGUE_ID}/lineups/${SEASON}/week${WEEK}.json`).catch(() => ({})),
              fetchJson(`/leagues/${LEAGUE_ID}/salaries/${SEASON}/week${WEEK}.json`).catch(() => null)
            ]);

            const realPlayerIds = new Set(
              salaryData && salaryData.players ? Object.values(salaryData.players).map(p => String(p.id)) : []
            );
            console.log(`Real Week ${WEEK} salary pool: ${realPlayerIds.size} players.\n`);

            const memberUids = Object.keys(members || {});
            let staleCount = 0, cleanCount = 0, noLineupCount = 0;

            for (const uid of memberUids) {
              const m = members[uid] || {};
              const teamName = m.teamName || '(no team name)';
              const lu = (lineups || {})[uid];

              if (!lu || !lu.slots) { noLineupCount++; continue; }

              const slotPlayers = Object.values(lu.slots).filter(Boolean);
              const unknownPlayers = slotPlayers.filter(p => p.id && !realPlayerIds.has(String(p.id)));
              const submittedTime = lu.submitted || null;
              const isOldTimestamp = submittedTime && submittedTime < SUSPICIOUS_BEFORE;

              if (isOldTimestamp || unknownPlayers.length > 0) {
                staleCount++;
                console.log(`⚠️  ${teamName} (${uid})`);
                if (isOldTimestamp) console.log(`    Submitted: ${new Date(submittedTime).toISOString()} — before real Week 1 salaries would have existed`);
                if (unknownPlayers.length) console.log(`    ${unknownPlayers.length}/9 players not found in the real current salary pool: ${unknownPlayers.map(p => p.name).join(', ')}`);
              } else {
                cleanCount++;
              }
            }

            console.log(`\n--- Summary ---`);
            console.log(`Total real members: ${memberUids.length}`);
            console.log(`No lineup submitted at all (correctly shows "Roster Not Submitted"): ${noLineupCount}`);
            console.log(`Clean, real-looking Week 1 lineups: ${cleanCount}`);
            console.log(`Flagged as likely stale/mock data: ${staleCount}`);
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
