name: One-Time Diagnostic — Export Real Member Email List

# ONE-TIME USE — delete this file after running it once.
# Exports a clean, easy-to-use list of every real team name and email
# across both leagues, sorted alphabetically by team name - for
# cross-referencing against last year's list and for sending a group
# email. Anyone still missing an email is clearly flagged rather than
# silently skipped, so real gaps stay visible.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Export real member email list
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            for (const [leagueId, label] of [['fr_refresh26', 'OG King/Queen of Fantasy \'26 (real league)'], ['fr_nth60cij', 'Preseason test league']]) {
              const members = await fetchJson(`${FB_URL}/leagues/${leagueId}/members.json`).catch(() => null);
              console.log(`\n=== ${label} ===`);
              if (!members) { console.log('No members found.'); continue; }

              const list = Object.values(members)
                .filter(m => m && m.active !== false)
                .sort((a, b) => (a.teamName || '').localeCompare(b.teamName || ''));

              const missing = [];
              list.forEach(m => {
                if (m.email) {
                  console.log(`${m.teamName || '(no team name)'}: ${m.email}`);
                } else {
                  missing.push(m.teamName || m.uid);
                }
              });

              console.log(`\n${list.length} active member(s) total.`);
              if (missing.length) {
                console.log(`⚠️  Still missing email (${missing.length}): ${missing.join(', ')}`);
              } else {
                console.log('✅ Everyone has a real email on file.');
              }
            }
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
