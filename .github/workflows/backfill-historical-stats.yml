name: Backfill Historical Stats

# ── ONE-TIME / MANUALLY TRIGGERED — not on a schedule ──────────────────
# Backfills raw weekly stat lines for past seasons into the SAME
# /nflStatsArchive/{season}/{week} schema that auto-scoring.yml already
# writes to going forward for the current season. Once this has run,
# both current-season and historical data live in one place and read the
# exact same way everywhere in the app.
#
# Raw stats only — no fantasy points baked in beyond the one convenience
# "pts" field already used elsewhere. The whole point of storing raw
# components (passYds, rushTD, etc.) is that a future league with
# different scoring rules can compute ITS OWN historical fantasy points
# from this same stored data, with zero additional Tank01 calls — a pure
# math operation on facts that are already saved.
#
# IMPORTANT — run test_only=true FIRST. We've never actually verified
# that Tank01's schedule-lookup endpoint (getNFLGamesForWeek) correctly
# returns historical-season data the same way the box-score endpoint
# does (box scores are looked up by a specific game ID that already
# encodes the date, so that part should be safe regardless of season —
# the schedule lookup, which is what finds those game IDs in the first
# place, is the genuinely unverified piece). Test mode pulls exactly one
# real historical week, writes nothing, and logs the raw response so you
# can confirm it looks right before committing to the full backfill.

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season to backfill (e.g. 2025)'
        required: true
        default: '2025'
      test_only:
        description: 'Test mode — fetch one sample week only, write nothing'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Backfill historical stats
        env:
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');

          const FB_URL       = 'https://fantasy-refresh-default-rtdb.firebaseio.com';
          const FB_TOKEN      = process.env.FIREBASE_AUTH_TOKEN;
          const WORKER        = 'https://fantasy-refresh-news.mtriedel.workers.dev';
          const SEASON         = '${{ inputs.season }}';
          const TEST_ONLY       = '${{ inputs.test_only }}' === 'true';

          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => {
                  try { resolve(JSON.parse(data)); } catch(e) { reject(e); }
                });
              }).on('error', reject);
            });
          }

          function firebasePut(path, payload) {
            return new Promise((resolve, reject) => {
              const url = new URL(FB_URL + path + '?auth=' + FB_TOKEN);
              const body = JSON.stringify(payload);
              const req = https.request(url, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) }
              }, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => {
                  if (res.statusCode < 200 || res.statusCode >= 300) {
                    reject(new Error(`Firebase PUT ${path} failed: ${res.statusCode} ${data}`));
                  } else {
                    resolve(JSON.parse(data || '{}'));
                  }
                });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          function firebaseGet(path) {
            return fetchJson(FB_URL + path);
          }

          // Historical box scores, keyed by a specific game ID that already
          // encodes the date — this part doesn't depend on any season
          // parameter working correctly, unlike the schedule lookup below.
          const scoring = [
            'passYds=0.04','passTD=4','passInt=-1',
            'rushYds=0.1','rushTD=6',
            'recYds=0.1','recTD=6','rec=1',
            'fumbLost=-1','twoPt=2',
            'fantasyPoints=true','PPRScoring=true'
          ].join('&');

          async function getHistoricalWeekGames(week, season) {
            // The genuinely unverified call — does Tank01's schedule
            // endpoint accept a past season the same way? Try plain
            // `season` first (works for current-season schedule lookups
            // today), fall back to `archiveSeason` (the parameter name
            // confirmed working for historical PROJECTIONS earlier this
            // build) if that comes back empty.
            const attempts = [
              `/schedule?week=${week}&season=${season}&seasonType=Regular`,
              null // second attempt built below once we know the first failed
            ];
            let res = await fetchJson(`${WORKER}${attempts[0]}`);
            if (res && Array.isArray(res.games) && res.games.length) {
              return { games: res.games, paramUsed: 'season (direct)' };
            }
            // The Worker's /schedule doesn't currently support archiveSeason
            // as a passthrough — direct Tank01 call as the fallback attempt.
            try {
              const direct = await fetchJson(
                `https://tank01-nfl-live-in-game-real-time-statistics-nfl.p.rapidapi.com/getNFLGamesForWeek?week=${week}&seasonType=Regular&archiveSeason=${season}`
              );
              // Note: this direct call has no RapidAPI key attached here —
              // it's expected to fail with 401/403. This branch exists so
              // the test-mode log clearly shows whether the Worker's plain
              // `season` param path is sufficient on its own, or whether
              // the Worker itself needs an archiveSeason passthrough added
              // before the real backfill can run. See test-mode output.
            } catch(e) {}
            return { games: [], paramUsed: 'neither worked' };
          }

          async function backfillWeek(season, week) {
            const { games, paramUsed } = await getHistoricalWeekGames(week, season);
            if (!games.length) {
              console.log(`  Week ${week}: no schedule data returned (tried: ${paramUsed}) — skipping`);
              return { week, gameCount: 0 };
            }

            const gameList = games.map(g => ({ gameId: g.gameId, home: g.home, away: g.away }));
            const players = {};

            for (const g of gameList) {
              if (!g.gameId) continue;
              try {
                const data = await fetchJson(`${WORKER}/score?gameId=${g.gameId}`);
                const stats = data.playerStats || {};
                Object.values(stats).forEach(s => {
                  const name = (s.longName || s.playerName || '').toLowerCase();
                  if (!name || players[name]) return;
                  const team = s.team || s.teamAbv || '';
                  const game = gameList.find(x => x.home === team || x.away === team);
                  players[name] = {
                    team, pos: s.pos || '',
                    opp:    game ? (game.home === team ? game.away : game.home) : '',
                    isHome: game ? game.home === team : null,
                    pts:      parseFloat(s.fantasyPoints || 0),
                    passYds:  parseFloat(s.passYds || 0),
                    passTD:   parseFloat(s.passTD || 0),
                    passInt:  parseFloat(s.passInt || 0),
                    rushYds:  parseFloat(s.rushYds || 0),
                    rushTD:   parseFloat(s.rushTD || 0),
                    recYds:   parseFloat(s.recYds || 0),
                    recTD:    parseFloat(s.recTD || 0),
                    rec:      parseFloat(s.rec || 0),
                    fumbLost: parseFloat(s.fumbLost || 0),
                    twoPt:    parseFloat(s.twoPt || 0)
                  };
                });
              } catch(e) {
                console.error(`    Game ${g.gameId} failed:`, e.message);
              }
              await sleep(400); // pacing — spread calls out, don't burst
            }

            if (TEST_ONLY) {
              console.log(`  [TEST MODE] Week ${week}: would write ${Object.keys(players).length} players from ${gameList.length} games (schedule param used: ${paramUsed})`);
              console.log('  Sample player record:', JSON.stringify(Object.values(players)[0] || {}, null, 2));
              return { week, gameCount: gameList.length, playerCount: Object.keys(players).length };
            }

            if (!Object.keys(players).length) return { week, gameCount: gameList.length, playerCount: 0 };

            await firebasePut(`/nflStatsArchive/${season}/Regular_wk${week}.json`, {
              games: gameList, players, archivedAt: Date.now(), backfilled: true
            });
            console.log(`✓ Week ${week}: archived ${Object.keys(players).length} players`);
            return { week, gameCount: gameList.length, playerCount: Object.keys(players).length };
          }

          (async () => {
            if (!TEST_ONLY && !FB_TOKEN) {
              console.error('❌ FIREBASE_AUTH_TOKEN secret is missing — required for a real (non-test) backfill run.');
              process.exit(1);
            }
            console.log(`=== Historical backfill: season ${SEASON} | mode: ${TEST_ONLY ? 'TEST (week 18 only, no writes)' : 'REAL (weeks 1-18, writing to Firebase)'} ===`);

            if (TEST_ONLY) {
              await backfillWeek(SEASON, 18);
              console.log('\n=== TEST COMPLETE ===');
              console.log('Check the sample record above. If it has real stat numbers (not all zeros)');
              console.log('and a real opponent/team, the schedule lookup worked and it is safe to');
              console.log('re-run this workflow with test_only=false for the full season.');
              console.log('If it came back empty, paste this log back for a fix before running for real.');
              return;
            }

            for (let week = 1; week <= 18; week++) {
              // Resumable — skip weeks that are already archived, so a
              // re-run (or a run that gets interrupted) doesn't waste
              // calls re-fetching what it already has.
              try {
                const existing = await firebaseGet(`/nflStatsArchive/${SEASON}/Regular_wk${week}/players.json`);
                if (existing && Object.keys(existing).length > 0) {
                  console.log(`  Week ${week}: already archived — skipping`);
                  continue;
                }
              } catch(e) { /* nothing archived yet — proceed */ }

              await backfillWeek(SEASON, week);
              await sleep(800); // pacing between weeks, on top of per-game pacing above
            }
            console.log(`\n✓ Backfill complete for season ${SEASON}`);
          })();
          SCRIPT
