name: One-Time Diagnostic — Check Real Archived News Content

# ONE-TIME USE — delete this file after running it once.
# Pulls real, actual archived news items for a handful of currently
# relevant players, to see exactly what's being archived - the real
# titles, sources, and archivedAt timestamps. Read-only.

on:
  workflow_dispatch:
    inputs:
      player_names:
        description: 'Comma-separated player names to check (real, currently rostered/salary-eligible names)'
        required: true
        default: 'Josh Allen,Christian McCaffrey,Joe Burrow'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check real archived news content
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = 'https://fantasy-refresh-default-rtdb.firebaseio.com';
          const names = '${{ inputs.player_names }}'.split(',').map(s => s.trim()).filter(Boolean);

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            console.log('Current real time:', new Date().toISOString());
            console.log('');

            for (const name of names) {
              const key = name.toLowerCase().replace(/[.$#\[\]\/]/g, '');
              console.log(`=== ${name} (key: ${key}) ===`);
              const archive = await fetchJson(`${FB_URL}/nflNewsArchive/${key}.json`).catch(() => null);

              if (!archive || archive.error) {
                console.log('  No archived news found at all.');
                console.log('');
                continue;
              }

              const items = Object.values(archive).sort((a, b) => (b.archivedAt || 0) - (a.archivedAt || 0));
              console.log(`  Real item count: ${items.length}`);
              items.slice(0, 5).forEach(item => {
                const ageMs = Date.now() - (item.archivedAt || 0);
                const ageHrs = (ageMs / 1000 / 60 / 60).toFixed(1);
                console.log(`  - [${ageHrs}h old] "${item.title}"`);
                console.log(`      source: ${item.source || 'n/a'} | link: ${item.link || 'n/a'}`);
              });
              console.log('');
            }
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
