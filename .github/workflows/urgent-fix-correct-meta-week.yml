name: URGENT Fix — Correct Stuck season/meta/week From 1 To 2

# ONE-TIME USE — delete this file after it runs successfully once.
#
# Confirmed directly, right now, in real time: season/meta/week is
# stuck at 1 despite the real season being well into Week 2.
# auto-scoring.yml is confirmed actively running (lastScored was 0.7
# minutes old) and correctly detecting tonight's real, live game - but
# because it reads this same stuck value, it's writing that live
# game's data into Week 1's already-finalized historical record
# (86 team scores rewritten seconds before this was confirmed) instead
# of Week 2, which currently has zero data at all. This is active,
# ongoing corruption happening every ~2 minutes via the external
# scoring trigger - not a one-time, already-done mistake.
#
# This corrects the single, stuck value directly. Re-verifies it's
# still exactly 1 immediately before writing, refusing to proceed if
# it's changed since confirmation, in case another process touches it
# in the meantime.
#
# This does NOT fix the actual root cause (whatever was supposed to
# advance this value automatically once Week 1 genuinely finished,
# and never did) - that still needs the real auto-scoring.yml source
# to investigate properly, so this doesn't silently happen again for
# Week 3.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to correct season/meta/week to 2 now'
        required: true
        default: 'NO'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Correct the stuck week value
        if: ${{ github.event.inputs.confirm == 'YES' }}
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }
          function firebasePut(path, value) {
            return new Promise((resolve, reject) => {
              const url = new URL(fbAuth(`${FB_URL}${path}`));
              const body = JSON.stringify(value);
              const req = https.request(url, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) }
              }, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => {
                  if (res.statusCode < 200 || res.statusCode >= 300) reject(new Error(`Write failed: HTTP ${res.statusCode} — ${data}`));
                  else resolve(data);
                });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          async function main() {
            const meta = await fetchJson(`/leagues/${LEAGUE_ID}/season/${SEASON}/meta.json`).catch(() => null);
            console.log('Real, current meta right now:', JSON.stringify(meta));

            if (!meta || meta.week !== 1) {
              console.log(`⚠️  Real week is now "${meta ? meta.week : 'unknown'}", not the confirmed "1" — refusing to proceed, something changed since confirmation.`);
              return;
            }

            await firebasePut(`/leagues/${LEAGUE_ID}/season/${SEASON}/meta/week.json`, 2);
            console.log('✅ Corrected season/meta/week from 1 to 2.');

            const verify = await fetchJson(`/leagues/${LEAGUE_ID}/season/${SEASON}/meta.json`).catch(() => null);
            console.log('Real, verified meta after write:', JSON.stringify(verify));
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT

      - name: Skipped - confirmation not provided
        if: ${{ github.event.inputs.confirm != 'YES' }}
        run: echo "Skipped — re-run with confirm=YES to actually correct the value."
