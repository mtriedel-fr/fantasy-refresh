name: One-Time Diagnostic — Check Stored Live Status Right Now

# ONE-TIME USE — delete this file after running it once.
# Checks the real, currently-stored /liveGameStatus data directly, to
# see whether the backend itself genuinely never updated SF@LAC to
# Final (a real write/scheduling bug in auto-scoring.yml) or whether
# the stored data is actually correct and something else is stale.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check real, current stored data
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function check(label, path) {
            const data = await fetchJson(FB_URL + path + '.json').catch(e => ({ __error: e.message }));
            console.log(`\n=== ${label} (${path}) ===`);
            console.log(JSON.stringify(data, null, 2));
            if (data && data.updatedAt) {
              const ageMin = Math.round((Date.now() - data.updatedAt) / 60000);
              console.log(`--> Last updated ${ageMin} minute(s) ago (${new Date(data.updatedAt).toISOString()})`);
            }
          }

          async function main() {
            await check('Preseason wk3, correct path', '/liveGameStatus/2026P/Preseason_wk3');
            await check('Preseason wk3, wrong path (old bug check)', '/liveGameStatus/2026/Preseason_wk3');
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
