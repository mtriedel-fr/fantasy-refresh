name: One-Time Diagnostic — Test Removing The Salary Floor

# ONE-TIME USE — delete this file after running it once.
# Recomputes each real player's RAW, unclamped formula salary from
# their actual stored projection (same exponent/ceiling formula, just
# without the SAL_MIN floor applied) to directly test whether
# removing the floor would genuinely spread out the pile-up seen in
# the real distribution check, or whether the underlying projections
# themselves are bunched too closely together at the low end for a
# floor change alone to fix it.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Test raw, unclamped salary distribution
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;
          const WEEK = 1;

          const SALARY_EXPONENT = 0.85;
          const TARGET_CEILING = { QB: 9400, RB: 10700, WR: 11300, TE: 7400, DEF: 6900 };

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            const salaryData = await fetchJson(`/leagues/${LEAGUE_ID}/salaries/${SEASON}/week${WEEK}.json`).catch(() => null);
            if (!salaryData || !salaryData.players) { console.log('No real salary data found.'); return; }

            const players = Object.values(salaryData.players);

            const positions = ['RB', 'WR', 'TE'];
            positions.forEach(pos => {
              const posPlayers = players.filter(p => p.pos === pos && p.proj > 0);
              if (!posPlayers.length) return;

              const maxProj = Math.max(...posPlayers.map(p => p.proj));
              const mult = TARGET_CEILING[pos] / Math.pow(maxProj, SALARY_EXPONENT);

              const rawValues = posPlayers.map(p => Math.pow(p.proj, SALARY_EXPONENT) * mult).sort((a, b) => a - b);
              const belowCurrentFloor = rawValues.filter(v => v < 4500).length;
              const below1000 = rawValues.filter(v => v < 1000).length;
              const below500 = rawValues.filter(v => v < 500).length;
              const negative = rawValues.filter(v => v <= 0).length;

              const bottomHalf = rawValues.slice(0, Math.ceil(rawValues.length / 2));
              let distinctCount = bottomHalf.length ? 1 : 0;
              for (let i = 1; i < bottomHalf.length; i++) {
                if (bottomHalf[i] - bottomHalf[i - 1] > 25) distinctCount++;
              }

              console.log(`=== ${pos} (${posPlayers.length} players with real proj > 0) ===`);
              console.log(`  Raw (unclamped) range: $${rawValues[0].toFixed(0)} - $${rawValues[rawValues.length - 1].toFixed(0)}`);
              console.log(`  Currently below the $4,500 floor: ${belowCurrentFloor} of ${posPlayers.length} (${(belowCurrentFloor / posPlayers.length * 100).toFixed(1)}%)`);
              console.log(`  Below $1,000 raw: ${below1000}`);
              console.log(`  Below $500 raw: ${below500}`);
              console.log(`  At or below $0 raw: ${negative}`);
              console.log(`  Distinct (>$25 apart) price points in bottom half: ${distinctCount} of ${bottomHalf.length} players`);
              console.log('');
            });
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
