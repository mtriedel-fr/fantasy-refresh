name: URGENT Diagnostic — Re-check Real Week 2 Salaries Right Now

# ONE-TIME USE — delete this file after running it once.
# Re-checks the real, current Week 2 salary data - comparing the
# generated timestamp and real top salaries against the earlier
# confirmed-good check, to see if it's been overwritten since (e.g.
# by a manual "Generate Salaries" click using the old, un-migrated
# formula), and directly confirms whether any backup QBs (the
# $3,800-floor mechanism) exist at all right now. Read-only.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Re-check real Week 2 salaries
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;
          const WEEK = 2;

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            const meta = await fetchJson(`/leagues/${LEAGUE_ID}/salaries/${SEASON}/week${WEEK}/meta.json`).catch(() => null);
            console.log('Current real time:', new Date().toISOString());
            console.log('Real meta:', JSON.stringify(meta));
            if (meta && meta.generated) {
              console.log('Generated at:', new Date(meta.generated).toISOString());
            }
            console.log('');

            const players = await fetchJson(`/leagues/${LEAGUE_ID}/salaries/${SEASON}/week${WEEK}/players.json`).catch(() => null);
            if (!players) { console.log('No players found.'); return; }

            const entries = Object.values(players);
            const qbs = entries.filter(p => p && p.pos === 'QB').sort((a,b) => b.salary - a.salary);
            console.log(`Total real QBs: ${qbs.length}`);
            console.log(`Real top salary overall: $${Math.max(...entries.map(p => p.salary))}`);
            console.log(`Real top QB: ${qbs[0] ? qbs[0].name + ' $' + qbs[0].salary : 'none'}`);
            console.log(`Real bottom QB: ${qbs[qbs.length-1] ? qbs[qbs.length-1].name + ' $' + qbs[qbs.length-1].salary + ' proj=' + qbs[qbs.length-1].proj : 'none'}`);

            const backupQbs = qbs.filter(p => p.salary === 3800 || (p.proj === 0));
            console.log(`Real backup-QB-floor entries ($3,800 or proj=0): ${backupQbs.length}`);
            if (backupQbs.length) console.log('  Sample:', JSON.stringify(backupQbs.slice(0,3)));

            const anyAbove9100 = entries.filter(p => p.salary > 9100);
            console.log(`Real entries priced above $9,100 (the real, current max clamp): ${anyAbove9100.length}`);
            if (anyAbove9100.length) console.log('  Sample:', JSON.stringify(anyAbove9100.slice(0,5)));
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
