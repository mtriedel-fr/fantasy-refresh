name: One-Time Diagnostic — Test Real FantasyPros News Endpoint

# ONE-TIME USE — delete this file after running it once.
# Makes a real test call to FantasyPros' /nfl/news endpoint to confirm
# the actual response shape - is it genuinely bulk (no per-player
# filter needed), what fields does each item really have, is there a
# real, usable date field - before committing to rewriting the
# Worker's news handler around it. Read-only, no writes anywhere.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Test real FantasyPros /news endpoint
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const API_KEY = process.env.FANTASYPROS_API_KEY;

          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get({
                hostname: 'api.fantasypros.com',
                path,
                headers: { 'x-api-key': API_KEY }
              }, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => {
                  resolve({ status: res.statusCode, body: data });
                });
              }).on('error', reject);
            });
          }

          async function main() {
            if (!API_KEY) {
              console.error('❌ FANTASYPROS_API_KEY secret is missing.');
              process.exit(1);
            }

            console.log('=== Test 1: /nfl/news, no params ===');
            const res1 = await fetchJson('/public/v2/json/nfl/news');
            console.log('HTTP status:', res1.status);
            console.log('Raw response (first 3000 chars):');
            console.log(res1.body.slice(0, 3000));
            console.log('');

            console.log('=== Test 2: /nfl/news with limit + category=injury ===');
            const res2 = await fetchJson('/public/v2/json/nfl/news?limit=10&category=injury');
            console.log('HTTP status:', res2.status);
            console.log('Raw response (first 3000 chars):');
            console.log(res2.body.slice(0, 3000));
            console.log('');

            // Real, direct check of what fields a real item actually has
            try {
              const parsed = JSON.parse(res1.body);
              const items = parsed.news || parsed.items || parsed.results || (Array.isArray(parsed) ? parsed : []);
              if (Array.isArray(items) && items.length) {
                console.log('=== Real fields on the first actual item ===');
                console.log(JSON.stringify(items[0], null, 2));
                console.log('');
                console.log('Real field names present:', Object.keys(items[0]).join(', '));
              } else {
                console.log('Could not locate an items array in the real response — see raw output above to find the real shape.');
              }
            } catch(e) {
              console.log('Response was not valid JSON, or shape was unexpected — see raw output above.');
            }
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
