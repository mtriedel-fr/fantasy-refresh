name: One-Time Diagnostic — Check Week 4 Locks State

# ONE-TIME USE — delete this file after running it once.
# Checks the real, current locks data for the preseason league - does
# week 4 exist at all, is week 3's data still sitting there, and what
# does meta.week actually say right now - to find out whether this is
# a backend gap (kickoff-locks.yml never wrote week 4 locks) or a
# client-side issue (draft.html reading the wrong week's path).

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check real locks state
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const LEAGUE_ID = 'fr_nth60cij';

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            console.log('Server time right now:', new Date().toISOString());

            const meta = await fetchJson(`${FB_URL}/leagues/${LEAGUE_ID}/season/2026P/meta.json`).catch(() => null);
            console.log('\n=== /season/2026P/meta ===');
            console.log(JSON.stringify(meta, null, 2));
            console.log(`(meta.week + 1 = ${meta ? meta.week + 1 : '?'} — the "current week to show" most readers derive from this)`);

            for (const wk of [3, 4]) {
              const locks = await fetchJson(`${FB_URL}/leagues/${LEAGUE_ID}/locks/2026P/week${wk}.json`).catch(() => null);
              console.log(`\n=== /locks/2026P/week${wk} ===`);
              if (locks) {
                console.log(`${Object.keys(locks).length} team(s) locked:`);
                Object.entries(locks).forEach(([team, entry]) => console.log(`  ${team}: gameId=${entry.gameId}`));
              } else {
                console.log('(none / empty)');
              }
            }

            // Real schedule cache for week 4, to confirm it's even
            // populated yet.
            const sched4 = await fetchJson(`${FB_URL}/nflSchedule/2026P/Preseason.json`).catch(() => null);
            const week4Games = sched4 && sched4.weeks && sched4.weeks.week4;
            console.log(`\n=== Cached schedule for week 4 ===`);
            console.log(week4Games ? `${week4Games.length} game(s) cached` : 'No week 4 schedule cached at all');
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
