name: One-Time Fix — Correct allFinal Miscalculation

# ONE-TIME USE — delete this file after running it once.
# The earlier fix-premature-week-advance.yml correctly left this alone,
# since allFinal was (incorrectly) true, which looked legitimate at the
# time. Now confirmed: allFinal itself was miscalculated due to a real
# path-mismatch bug in auto-scoring.yml (now fixed) — real Week 3 spans
# Aug 20-23 and still has unplayed games. Resets both week and allFinal
# back to their real, correct state so future runs recompute allFinal
# for real once the week genuinely finishes.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to actually correct the value'
        required: true
        default: ''

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Correct the confirmed-wrong meta value
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          node << 'SCRIPT'
          const https = require('https');

          const FB_URL   = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const CONFIRM  = process.env.CONFIRM;
          const PATH     = '/leagues/fr_nth60cij/season/2026P/meta';

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          function firebasePut(path, payload) {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify(payload);
              const fullPath = fbAuth(FB_URL + path + '.json');
              const u = new URL(fullPath);
              const req = https.request({
                hostname: u.hostname, path: u.pathname + u.search, method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) }
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) resolve(d);
                  else reject(new Error(`PUT rejected (HTTP ${res.statusCode}) — ${d.slice(0,200)}`));
                });
              });
              req.on('error', reject);
              req.write(body); req.end();
            });
          }

          async function main() {
            const meta = await fetchJson(FB_URL + PATH + '.json').catch(() => null);
            console.log('Current value:');
            console.log(JSON.stringify(meta, null, 2));

            if (!meta || meta.week !== 3 || meta.allFinal !== true) {
              console.log('\nDoes not match the expected wrong state (week:3, allFinal:true) — stopping without changes. Check manually.');
              return;
            }

            const corrected = { ...meta, week: 2, allFinal: false };
            console.log('\nCorrected value would be:');
            console.log(JSON.stringify(corrected, null, 2));

            if (CONFIRM !== 'YES') {
              console.log('\n⚠️  Confirm input was not "YES" — nothing was changed.');
              return;
            }

            await firebasePut(PATH, corrected);
            console.log('\n✅ Corrected. Real Week 3 will be recomputed for real by the next scoring run, once it actually finishes.');
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
