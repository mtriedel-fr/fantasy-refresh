name: One-Time Fix — Clear Week 1 Recap And Check Other Weeks

# ONE-TIME USE — delete this file after running it once.
#
# Deletes the confirmed-stale Week 1 recap directly (confirmed from
# the screenshot: real team/player names, but every single stat is
# 0.00 - before the season has even started). Separately, shows the
# full, raw data for every OTHER existing recap week so it can be
# visually checked the same way, rather than trusting an automated
# "all zero" detection - an earlier version of this script tried that
# and was confirmed unreliable during testing, since a stale recap
# can still contain real, non-zero salary figures right alongside the
# zeroed-out points, which would have defeated a simple all-zero check.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to delete the Week 1 recap'
        required: true
        default: 'NO'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Week 1 recap, list other weeks for review
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
          CONFIRM_INPUT: ${{ github.event.inputs.confirm }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;
          const CONFIRM = process.env.CONFIRM_INPUT === 'YES';

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }
          function firebaseDelete(path) {
            return new Promise((resolve, reject) => {
              const url = new URL(fbAuth(`${FB_URL}${path}`));
              const req = https.request({ hostname: url.hostname, path: url.pathname + url.search, method: 'DELETE' }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => {
                  if (res.statusCode < 200 || res.statusCode >= 300) reject(new Error(`Delete failed: HTTP ${res.statusCode} — ${d}`));
                  else resolve(d);
                });
              });
              req.on('error', reject);
              req.end();
            });
          }

          async function main() {
            const allRecaps = await fetchJson(`/leagues/${LEAGUE_ID}/recaps/${SEASON}.json`).catch(() => null);
            if (!allRecaps) { console.log('No recap data exists at all for this season — nothing to do.'); return; }

            const weekKeys = Object.keys(allRecaps);
            console.log(`Found recap entries for: ${weekKeys.join(', ')}\n`);

            // Week 1 — confirmed stale from the screenshot, delete directly.
            if (allRecaps.week1) {
              console.log('=== week1 (confirmed stale, deleting) ===');
              console.log(JSON.stringify(allRecaps.week1, null, 2));
              if (CONFIRM) {
                await firebaseDelete(`/leagues/${LEAGUE_ID}/recaps/${SEASON}/week1.json`);
                console.log('✓ Deleted week1.\n');
              } else {
                console.log('(confirm=YES not set — not deleted this run)\n');
              }
            } else {
              console.log('No week1 recap found — nothing to delete there.\n');
            }

            // Every other week — shown raw for manual visual review, not
            // auto-deleted, since reliable auto-detection isn't possible
            // without knowing the real recap schema.
            const otherWeeks = weekKeys.filter(k => k !== 'week1');
            if (otherWeeks.length) {
              console.log(`=== Other weeks found — review manually, not auto-deleted ===`);
              otherWeeks.forEach(k => {
                console.log(`\n--- ${k} ---`);
                console.log(JSON.stringify(allRecaps[k], null, 2));
              });
            } else {
              console.log('No other week recaps exist — week1 was the only one.');
            }
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
