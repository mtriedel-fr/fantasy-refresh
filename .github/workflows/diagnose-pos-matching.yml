name: One-Time Diagnostic — Check Player Pool Position Matching

# ONE-TIME USE — delete this file after running it once.
# Checks whether the real player pool exists at the expected path, and
# whether the specific players from the reported screenshot are
# actually in it with a matchable name and real position - to find out
# whether this is a path issue, a coverage issue (undrafted/practice-
# squad players not in the pool), or a name-matching mismatch.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check player pool and specific player matches
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            const pool = await fetchJson(`${FB_URL}/playerPool/2026/players.json`).catch(e => ({ __error: e.message }));
            const players = Object.values(pool || {});
            console.log(`Player pool at /playerPool/2026/players: ${players.length} player(s) found.`);
            if (!players.length) {
              console.log('Pool is empty or path is wrong — checking preseason-suffixed path too, just in case:');
              const poolP = await fetchJson(`${FB_URL}/playerPool/2026P/players.json`).catch(() => null);
              console.log(`/playerPool/2026P/players: ${poolP ? Object.keys(poolP).length + ' player(s)' : 'NOT FOUND'}`);
              return;
            }

            // Check the specific players from the reported screenshot
            const targets = ['Trebor Pena', 'Will Sheppard', 'Quincy Skinner Jr.', 'Casey Washington', 'John Metchie III', 'Jordan Watkins', 'Aidan O\'Connell'];
            console.log('\nChecking specific reported players:');
            targets.forEach(name => {
              const normalized = name.toLowerCase().replace(/[.,\']/g, '').replace(/\s+(jr|sr|ii|iii|iv|v)$/i, '').trim();
              const exactMatch = players.find(p => p.name && p.name.toLowerCase() === name.toLowerCase());
              const normMatch = players.find(p => p.name && p.name.toLowerCase().replace(/[.,\']/g, '').replace(/\s+(jr|sr|ii|iii|iv|v)$/i, '').trim() === normalized);
              if (exactMatch) {
                console.log(`  "${name}": FOUND (exact) — pos="${exactMatch.pos}"`);
              } else if (normMatch) {
                console.log(`  "${name}": FOUND (normalized) — real pool name="${normMatch.name}", pos="${normMatch.pos}"`);
              } else {
                console.log(`  "${name}": NOT FOUND in pool at all`);
              }
            });

            // Sample of real pool entries, to see the real name/pos shape directly
            console.log('\nSample of 5 real pool entries (raw):');
            players.slice(0, 5).forEach(p => console.log(`  ${JSON.stringify(p)}`));
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
