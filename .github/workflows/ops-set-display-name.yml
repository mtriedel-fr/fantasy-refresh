name: One-off - set commissioner display name

# One-time, commissioner-approved (Oct 23 2026): set the display name on the
# commissioner's own member record in fr_refresh26 to "Mike". Finds the
# record by the commissioner's email; changes only the displayName field.
on:
  push:
    branches: [ops/set-display-name-mike]

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: Set displayName
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB = process.env.FIREBASE_DB_URL, T = process.env.FIREBASE_AUTH_TOKEN;
          const req = (method, p, body) => new Promise((res, rej) => {
            const u = new URL(`${FB}${p}${p.includes('?') ? '&' : '?'}auth=${T}`); const data = body === undefined ? null : JSON.stringify(body);
            const r = https.request({ hostname: u.hostname, path: u.pathname + u.search, method, headers: data ? { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(data) } : {} }, rs => {
              let d = ''; rs.on('data', c => d += c); rs.on('end', () => rs.statusCode < 300 ? res(d ? JSON.parse(d) : null) : rej(new Error(`HTTP ${rs.statusCode} ${d.slice(0,150)}`)));
            }); r.on('error', rej); if (data) r.write(data); r.end();
          });
          const ann = (l, t, m) => console.log(`::${l} title=${t}::${String(m).replace(/%/g,'%25').replace(/\n/g,'%0A')}`);
          (async () => {
            const members = await req('GET', '/leagues/fr_refresh26/members.json') || {};
            const hits = Object.entries(members).filter(([, m]) => m && String(m.email || '').toLowerCase() === 'mtriedel@gmail.com');
            if (hits.length !== 1) { ann('error', 'ABORTED', `expected exactly 1 member with that email, found ${hits.length}`); process.exit(1); }
            const [uid, m] = hits[0];
            const comm = await req('GET', `/leagues/fr_refresh26/settings/commissioners/${uid}.json`);
            if (comm !== true) { ann('error', 'ABORTED', 'matched member is not a commissioner'); process.exit(1); }
            const before = m.displayName || '';
            await req('PUT', `/leagues/fr_refresh26/members/${uid}/displayName.json`, 'Mike');
            const after = await req('GET', `/leagues/fr_refresh26/members/${uid}/displayName.json`);
            ann('notice', 'Display name set', `team ${m.teamName} - displayName "${before}" -> "${after}"`);
          })().catch(e => { ann('error', 'Failed', e.message); process.exit(1); });
          SCRIPT
