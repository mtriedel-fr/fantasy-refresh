name: One-Time Diagnostic — Preview Real Week 2 Salaries (Current Formula)

# ONE-TIME USE — delete this file after running it once.
# Fetches real, live Week 2 projections and the real player pool,
# runs them through the exact current, correct formula from
# weekly-prep.yml (the migrated per-position model), and shows
# precisely what should generate - real players, real dollar
# amounts, top and bottom of each position. Read-only - does not
# write anything to Firebase.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Preview real Week 2 salaries
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const WORKER = 'https://fantasy-refresh-news.mtriedel.workers.dev';
          const SEASON = 2026;
          const WEEK = 2;

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }
          function firebaseGet(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          function normalizeNameForMatch(name) {
            return (name || '').toLowerCase().replace(/[.,']/g, '').replace(/\s+(jr|sr|ii|iii|iv|v)$/i, '').trim();
          }

          // Exact current formula from weekly-prep.yml
          const TOP_ANCHOR_EXP = 0.6, SHARED_CAP = 8600, RB_WR_MAX = 9100, MIN_SANITY = 100, SAL_ROUND = 100;
          const POSITIONS = {
            QB:  { exp: 1.3,  premium: 1.0,   clamp: SHARED_CAP },
            RB:  { exp: 0.55, premium: 1.058, clamp: RB_WR_MAX },
            WR:  { exp: 0.55, premium: 1.12,  clamp: RB_WR_MAX },
            TE:  { exp: 0.7,  premium: 1.21,  clamp: SHARED_CAP },
            DEF: { exp: 0.6,  premium: 0.97,  clamp: SHARED_CAP }
          };
          const BACKUP_QB_SALARY = 3800;

          function buildSalariesFromProjections(projPlayers, poolPlayers, min, max) {
            const nameMap = {};
            Object.values(poolPlayers || {}).forEach(p => { if (p && p.name) nameMap[normalizeNameForMatch(p.name)] = p; });

            const maxProjByPos = {};
            ['QB','RB','WR','TE','DEF'].forEach(pos => {
              const atPos = projPlayers.filter(p => p.pos === pos && p.proj > 0);
              maxProjByPos[pos] = atPos.length ? Math.max(...atPos.map(p => p.proj)) : 0;
            });
            const globalMaxProj = Math.max(...Object.values(maxProjByPos).filter(v => v > 0), 1);
            const baseRate = SHARED_CAP / Math.pow(globalMaxProj, TOP_ANCHOR_EXP);

            const multByPos = {};
            Object.entries(POSITIONS).forEach(([pos, conf]) => {
              if (!maxProjByPos[pos]) return;
              let topAnchor = Math.pow(maxProjByPos[pos], TOP_ANCHOR_EXP) * baseRate * conf.premium;
              topAnchor = Math.min(topAnchor, conf.clamp);
              multByPos[pos] = topAnchor / Math.pow(maxProjByPos[pos], conf.exp);
            });

            const salaries = {};
            projPlayers.forEach(p => {
              if (!p.proj || p.proj <= 0) return;
              if (!POSITIONS[p.pos]) return;
              const poolP = nameMap[normalizeNameForMatch(p.name)];
              const pid = poolP ? poolP.id : ('t01_' + p.id);
              const inj = poolP ? (poolP.status || p.status || null) : (p.status || null);
              if (inj === 'O' || inj === 'IR') return;
              const conf = POSITIONS[p.pos];
              const mult = multByPos[p.pos] || 0;
              let sal = Math.ceil((Math.pow(p.proj, conf.exp) * mult) / SAL_ROUND) * SAL_ROUND;
              sal = Math.max(MIN_SANITY, Math.min(conf.clamp, sal));
              sal = Math.max(min, Math.min(max, sal));
              salaries[pid] = { name: p.name, pos: p.pos, team: p.team, proj: Math.round(p.proj*10)/10, salary: sal };
            });

            Object.values(poolPlayers || {}).forEach(poolP => {
              if (!poolP || poolP.pos !== 'QB') return;
              if (salaries[poolP.id]) return;
              const inj = poolP.status || null;
              if (inj === 'O' || inj === 'IR') return;
              salaries[poolP.id] = { name: poolP.name, pos: 'QB', team: poolP.team, proj: 0, salary: BACKUP_QB_SALARY };
            });

            return salaries;
          }

          async function main() {
            console.log(`Fetching real Week ${WEEK} projections...`);
            const projData = await fetchJson(`${WORKER}/projections?week=${WEEK}&season=${SEASON}`).catch(() => null);
            const projPlayers = (projData && projData.players) || [];
            console.log(`Real projections: ${projPlayers.length} players\n`);

            if (!projPlayers.length) {
              console.log('No real projections available for Week 2 yet — this is expected if the games/lines for that week haven\'t been set up on the projections source yet. Nothing further to preview.');
              return;
            }

            const pool = await firebaseGet(`/playerPool/${SEASON}/players.json`).catch(() => null);

            const salaries = buildSalariesFromProjections(projPlayers, pool, 100, 9100);
            const entries = Object.values(salaries);

            ['QB','RB','WR','TE','DEF'].forEach(pos => {
              const atPos = entries.filter(e => e.pos === pos).sort((a,b) => b.salary - a.salary);
              if (!atPos.length) { console.log(`${pos}: no real players`); return; }
              console.log(`${pos} (${atPos.length} players): top $${atPos[0].salary} (${atPos[0].name}, ${atPos[0].proj}pts) → bottom $${atPos[atPos.length-1].salary} (${atPos[atPos.length-1].name})`);
              console.log(`  Top 5: ${atPos.slice(0,5).map(p => p.name + ' $' + p.salary).join(', ')}`);
            });
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
