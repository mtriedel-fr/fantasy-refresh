name: One-Time Diagnostic — Tune TE Exponent Below 25% Floor-Clamp

# ONE-TIME USE — delete this file after running it once.
# Keeps TE's top anchor fixed at the value derived from the shared
# cross-position rate ($8,676, from Bowers' real projection - the
# already-validated, working part of the model), and tests
# progressively gentler exponents specifically for TE to find the
# one that brings floor-clamping below 25% of the position's real
# pool, without touching any other position's pricing.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Tune TE exponent
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;
          const WEEK = 1;

          const SAL_MAX = 11300;
          const SAL_MIN = 2400;
          const TOP_ANCHOR_EXPONENT = 0.6; // same as the validated shared-rate model
          const CANDIDATE_TE_EXPONENTS = [0.55, 0.50, 0.45, 0.40, 0.35, 0.30, 0.25];

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            const salaryData = await fetchJson(`/leagues/${LEAGUE_ID}/salaries/${SEASON}/week${WEEK}.json`).catch(() => null);
            if (!salaryData || !salaryData.players) { console.log('No real salary data found.'); return; }

            const players = Object.values(salaryData.players).filter(p => p.proj > 0);

            // Shared rate, same as the validated model - establishes TE's
            // real top anchor price without changing anything else.
            const globalMaxProj = Math.max(...players.map(p => p.proj));
            const sharedMult = SAL_MAX / Math.pow(globalMaxProj, TOP_ANCHOR_EXPONENT);

            const tePlayers = players.filter(p => p.pos === 'TE');
            const teMaxProj = Math.max(...tePlayers.map(p => p.proj));
            const teTopAnchor = Math.pow(teMaxProj, TOP_ANCHOR_EXPONENT) * sharedMult;

            console.log(`TE top anchor (fixed, from shared rate): $${teTopAnchor.toFixed(0)} at ${teMaxProj.toFixed(1)} pts\n`);

            let found = null;
            CANDIDATE_TE_EXPONENTS.forEach(exp => {
              const mult = teTopAnchor / Math.pow(teMaxProj, exp);
              const rawValues = tePlayers.map(p => Math.pow(p.proj, exp) * mult);
              const clamped = rawValues.filter(v => v < SAL_MIN).length;
              const pct = (clamped / tePlayers.length) * 100;
              const sorted = rawValues.slice().sort((a, b) => a - b);
              const median = sorted[Math.floor(sorted.length / 2)];

              const flag = pct < 25 ? '  <-- under 25%' : '';
              console.log(`  Exponent ${exp}: ${clamped} of ${tePlayers.length} clamp (${pct.toFixed(1)}%)  |  median: $${median.toFixed(0)}${flag}`);
              if (pct < 25 && !found) found = exp;
            });

            console.log('');
            if (found) {
              console.log(`Lowest exponent tested that stays under 25%: ${found}`);
            } else {
              console.log('None of the tested exponents got under 25% - would need to go even gentler, or this may be close to TE\'s real structural floor given how steep its real talent cliff is.');
            }
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
