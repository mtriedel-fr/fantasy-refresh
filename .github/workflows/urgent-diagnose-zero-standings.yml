name: URGENT Diagnostic — Find Source Of All-Zero Weekly Standings

# ONE-TIME USE — delete this file after running it once.
# Checks three layers to isolate exactly where "all zeros" is coming
# from: the real, raw season score data, the server-computed
# standings snapshot, and timestamps for both - to tell whether this
# is upstream (scoring pipeline), server-side (snapshot computation),
# or purely client-side (rendering). Read-only.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check all three layers
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;
          const WEEK = 1;

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            console.log('Current real time:', new Date().toISOString());
            console.log('');

            // Layer 1: raw season score data
            const rawScores = await fetchJson(`/leagues/${LEAGUE_ID}/season/${SEASON}/${WEEK}.json`).catch(() => null);
            if (!rawScores) {
              console.log('❌ LAYER 1 (raw scores): No data found at all.');
            } else {
              const entries = Object.values(rawScores);
              const nonZero = entries.filter(e => e && e.score);
              const withTimestamp = entries.filter(e => e && e.updatedAt).sort((a,b) => b.updatedAt - a.updatedAt);
              console.log(`LAYER 1 (raw scores): ${entries.length} entries, ${nonZero.length} with a nonzero score.`);
              if (withTimestamp.length) {
                console.log(`  Most recently updated entry: team="${withTimestamp[0].team}" score=${withTimestamp[0].score} updatedAt=${new Date(withTimestamp[0].updatedAt).toISOString()}`);
              }
              if (nonZero.length) {
                console.log(`  Sample real entry: team="${nonZero[0].team}" score=${nonZero[0].score}`);
              }
            }
            console.log('');

            // Layer 2: standings snapshot
            const snapshot = await fetchJson(`/leagues/${LEAGUE_ID}/standings/${SEASON}/week${WEEK}.json`).catch(() => null);
            if (!snapshot) {
              console.log('❌ LAYER 2 (snapshot): No snapshot found at all.');
            } else {
              const snapEntries = snapshot.entries || [];
              const snapNonZero = snapEntries.filter(e => e && e.score);
              console.log(`LAYER 2 (snapshot): written ${new Date(snapshot.updatedAt).toISOString()} (${Math.round((Date.now()-snapshot.updatedAt)/60000)} min ago)`);
              console.log(`  ${snapEntries.length} entries, ${snapNonZero.length} with a nonzero score.`);
              if (snapEntries.length) {
                console.log(`  Top 3 by rank: ${snapEntries.slice(0,3).map(e => `${e.name}=${e.score}`).join(', ')}`);
              }
            }
            console.log('');

            // Layer 3: is a live game even active right now / any recent auto-scoring activity
            const liveEntries = rawScores ? Object.values(rawScores).filter(e => e && e.status === 'live') : [];
            console.log(`LAYER 3: ${liveEntries.length} entries currently marked status='live'.`);
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
