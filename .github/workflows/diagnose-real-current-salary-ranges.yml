name: One-Time Diagnostic — Real Current Week 1 Salary Ranges

# ONE-TIME USE — delete this file after running it once.
# Pulls the real, current Week 1 salaries actually live in
# fr_refresh26 right now (production values, whatever formula is
# currently deployed) and computes top/bottom/range per position -
# same breakdown format as the proposed next-week model. Read-only.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Real current salary ranges by position
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;
          const WEEK = 1;

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            const salaryData = await fetchJson(`/leagues/${LEAGUE_ID}/salaries/${SEASON}/week${WEEK}.json`).catch(() => null);
            if (!salaryData || !salaryData.players) { console.log('No real salary data found.'); return; }

            const players = Object.values(salaryData.players);
            console.log(`Total real players: ${players.length}`);
            console.log('');

            ['QB', 'RB', 'WR', 'TE', 'DEF'].forEach(pos => {
              const posPlayers = players.filter(p => p.pos === pos && p.salary != null).sort((a, b) => b.salary - a.salary);
              if (!posPlayers.length) { console.log(`${pos}: no players found`); return; }
              const top = posPlayers[0];
              const bottom = posPlayers[posPlayers.length - 1];
              console.log(`${pos}: top $${top.salary} (${top.name})  bottom $${bottom.salary} (${bottom.name})  range $${top.salary - bottom.salary}`);
            });
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
