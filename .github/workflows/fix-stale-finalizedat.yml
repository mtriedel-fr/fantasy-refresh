name: One-Time Fix — Clear Stale finalizedAt for Week 3

# ONE-TIME USE — delete this file after running it once.
# league.html's boot() reads /leagues/{id}/season/{season}/{week}/finalizedAt
# specifically (a separate path from the meta object already fixed) to
# decide whether to auto-advance past the current week. The now-fixed
# allFinal bug very likely wrote this for Week 3 before the real root
# cause was corrected — and since finalizedAt is set "exactly once, the
# first time," it was never touched by either earlier correction
# workflow, since neither looked at this specific path. Confirmed
# directly as the real explanation for "briefly lands on Week 3, then
# gets pushed to Week 4" — that's boot()'s naive initial value (3,
# correct) getting overridden by this stale, separate flag.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to actually clear the stale value'
        required: true
        default: ''

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check and clear stale finalizedAt
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          node << 'SCRIPT'
          const https = require('https');

          const FB_URL   = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const CONFIRM  = process.env.CONFIRM;
          const PATH     = '/leagues/fr_nth60cij/season/2026P/3/finalizedAt';

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          function firebaseDelete(path) {
            return new Promise((resolve, reject) => {
              const fullPath = fbAuth(FB_URL + path + '.json');
              const u = new URL(fullPath);
              const req = https.request({
                hostname: u.hostname, path: u.pathname + u.search, method: 'DELETE'
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) resolve(d);
                  else reject(new Error(`DELETE rejected (HTTP ${res.statusCode}) — ${d.slice(0,200)}`));
                });
              });
              req.on('error', reject);
              req.end();
            });
          }

          async function main() {
            const value = await fetchJson(FB_URL + PATH + '.json').catch(() => null);
            console.log(`Current value at ${PATH}:`, JSON.stringify(value));

            if (value == null) {
              console.log('Already empty — nothing to clear. "Week 4" must be coming from somewhere else — worth checking further.');
              return;
            }

            console.log(`This is a real, set timestamp (${new Date(value).toISOString()}) — Week 3 real games (spanning through Aug 23) are NOT actually done yet, so this is confirmed stale.`);

            if (CONFIRM !== 'YES') {
              console.log('\n⚠️  Confirm input was not "YES" — nothing was cleared.');
              return;
            }

            await firebaseDelete(PATH);
            console.log(`\n✅ Cleared. Week 3 will get a real, correct finalizedAt written automatically once it genuinely finishes (now that the underlying allFinal bug is fixed).`);
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
