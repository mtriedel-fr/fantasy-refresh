name: One-Time Fix — Correct Draft Lock To 24 Hours Before Kickoff

# ONE-TIME USE — delete this file after running it once.
# draftLockedUntil is currently set to the EXACT real kickoff timestamp
# (1788913200000, Sept 9 2026 00:20 UTC, NE@SEA) instead of 24 hours
# before it. As stored, drafting would stay locked until the literal
# instant the first game starts, giving nobody real time to build a
# lineup before games begin - the opposite of what the lock's own UI
# text promises ("drafting opens 1 day before the season kicks off").
# This corrects it to genuinely be kickoff minus 24 hours.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to apply this correction'
        required: true
        default: 'NO'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Correct draftLockedUntil to real kickoff minus 24 hours
        if: ${{ github.event.inputs.confirm == 'YES' }}
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const LEAGUE_ID = 'fr_refresh26';

          const REAL_KICKOFF_MS = 1788913200000; // confirmed real NE@SEA kickoff
          const CORRECTED_LOCK_MS = REAL_KICKOFF_MS - (24 * 60 * 60 * 1000);

          function firebasePut(path, data) {
            return new Promise((resolve, reject) => {
              const url = new URL(`${FB_URL}${path}`);
              const body = JSON.stringify(data);
              const req = https.request(url, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) }
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => resolve(d));
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            const before = await fetchJson(`${FB_URL}/leagues/${LEAGUE_ID}/settings/draftLockedUntil.json`).catch(() => null);
            console.log(`Real, current value before fix: ${before} (${before ? new Date(before).toISOString() : 'none'})`);

            await firebasePut(`/leagues/${LEAGUE_ID}/settings/draftLockedUntil.json`, CORRECTED_LOCK_MS);

            console.log(`Corrected to: ${CORRECTED_LOCK_MS} (${new Date(CORRECTED_LOCK_MS).toISOString()})`);
            console.log(`That's exactly 24 hours before the real kickoff (${new Date(REAL_KICKOFF_MS).toISOString()}).`);
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT

      - name: Skipped - confirmation not provided
        if: ${{ github.event.inputs.confirm != 'YES' }}
        run: echo "Skipped — re-run with confirm=YES to actually apply this fix."
