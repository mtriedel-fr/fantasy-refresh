name: One-Time Fix + Immediate Re-Verify — Draft Lock

# ONE-TIME USE — delete this file after running it once.
# Combined fix + immediate read-back, in the same run, with no gap
# where anything else could intervene between the write and the
# check. Also checks the real HTTP status code of the write itself -
# a real gap in the earlier fix script, which only checked for a
# network-level failure, never confirmed Firebase actually accepted
# the write with a real 2xx response.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to apply this correction'
        required: true
        default: 'NO'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Fix and immediately re-verify
        if: ${{ github.event.inputs.confirm == 'YES' }}
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const LEAGUE_ID = 'fr_refresh26';
          const REAL_KICKOFF_MS = 1788913200000;
          const CORRECTED_LOCK_MS = REAL_KICKOFF_MS - (24 * 60 * 60 * 1000);

          function firebasePut(path, data) {
            return new Promise((resolve, reject) => {
              const url = new URL(`${FB_URL}${path}`);
              const body = JSON.stringify(data);
              const req = https.request(url, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) }
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => resolve({ status: res.statusCode, body: d }));
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }
          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve({ status: res.statusCode, body: JSON.parse(data) }); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            const before = await fetchJson(`${FB_URL}/leagues/${LEAGUE_ID}/settings/draftLockedUntil.json`).catch(() => null);
            console.log(`Value BEFORE write: ${before ? JSON.stringify(before.body) : 'fetch failed'}`);

            const putResult = await firebasePut(`/leagues/${LEAGUE_ID}/settings/draftLockedUntil.json`, CORRECTED_LOCK_MS);
            console.log(`Write HTTP status: ${putResult.status}`);
            console.log(`Write response body: ${putResult.body}`);
            if (putResult.status < 200 || putResult.status >= 300) {
              console.log(`⚠️  WRITE FAILED — non-2xx status. This is likely the real root cause if so.`);
            }

            // Immediate re-read, same run, no gap at all.
            const after = await fetchJson(`${FB_URL}/leagues/${LEAGUE_ID}/settings/draftLockedUntil.json`).catch(() => null);
            console.log(`Value immediately AFTER write (same run): ${after ? JSON.stringify(after.body) : 'fetch failed'}`);
            console.log(`Expected: ${CORRECTED_LOCK_MS}`);
            console.log(`Matches expected: ${after && after.body === CORRECTED_LOCK_MS}`);

            // Wait 20 seconds, then read AGAIN, to check if something
            // resets it within mere seconds of a successful write —
            // if this differs from the immediate read above, that's
            // direct, timed proof something else is actively involved.
            await new Promise(r => setTimeout(r, 20000));
            const after2 = await fetchJson(`${FB_URL}/leagues/${LEAGUE_ID}/settings/draftLockedUntil.json`).catch(() => null);
            console.log(`\nValue 20 seconds later (same run): ${after2 ? JSON.stringify(after2.body) : 'fetch failed'}`);
            console.log(`Still matches expected: ${after2 && after2.body === CORRECTED_LOCK_MS}`);
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT

      - name: Skipped - confirmation not provided
        if: ${{ github.event.inputs.confirm != 'YES' }}
        run: echo "Skipped — re-run with confirm=YES to actually apply this fix."
