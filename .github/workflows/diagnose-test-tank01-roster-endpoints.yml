name: One-Time Diagnostic — Test Tank01 Roster Endpoints

# ONE-TIME USE — delete this file after running it once.
# Tests real, candidate Tank01 endpoints for current, live NFL
# roster/player-list data - to confirm a reliable source exists for
# cross-referencing "is this player actually on a current NFL
# roster" before building anything real around it. Read-only against
# Tank01; makes no Firebase writes.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Test candidate roster endpoints
        env:
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const T01_KEY = process.env.TANK01_KEY;
          const T01_HOST = 'tank01-nfl-live-in-game-real-time-statistics-nfl.p.rapidapi.com';

          function t01(path) {
            return new Promise((resolve, reject) => {
              https.get({
                hostname: T01_HOST, path, headers: {
                  'X-RapidAPI-Key': T01_KEY, 'X-RapidAPI-Host': T01_HOST
                }
              }, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve({ status: res.statusCode, body: JSON.parse(data) }); } catch(e) { resolve({ status: res.statusCode, raw: data.slice(0,300) }); } });
              }).on('error', reject);
            });
          }

          async function tryEndpoint(label, path) {
            console.log(`\n=== ${label}: ${path} ===`);
            try {
              const res = await t01(path);
              console.log('HTTP status:', res.status);
              if (res.raw) { console.log('Raw (not JSON):', res.raw); return; }
              const body = res.body && res.body.body;
              if (Array.isArray(body)) {
                console.log(`Real array of ${body.length} entries. Sample:`, JSON.stringify(body.slice(0,2)));
              } else if (body && typeof body === 'object') {
                console.log('Real object. Top-level keys:', Object.keys(body).slice(0,20));
                const firstKey = Object.keys(body)[0];
                if (firstKey) console.log('Sample under first key:', JSON.stringify(body[firstKey]).slice(0,500));
              } else {
                console.log('Unexpected shape:', JSON.stringify(res.body).slice(0,300));
              }
            } catch(e) {
              console.log('Failed:', e.message);
            }
          }

          async function main() {
            await tryEndpoint('Full player list', '/getNFLPlayerList');
            await tryEndpoint('Team roster (single team)', '/getNFLTeamRoster?teamAbv=KC');
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
