name: One-Time Fix — Remove Confirmed Stale Entries From Week 1

# ONE-TIME USE — delete this file after it runs successfully once.
#
# Removes the 11 confirmed stale/orphaned entries from Week 1's real
# score data - confirmed directly by an earlier diagnostic: none of
# these uids correspond to any real, active member. Nine are leftover
# test accounts; two (ownership, ownershipMeta) are a real feature
# that was accidentally written into the same object namespace as
# real per-team scores.
#
# Safety: re-fetches and re-checks each specific entry immediately
# before deleting it, confirming it still matches what was confirmed
# earlier (same team name / same lack of a real member match) -
# refuses to delete anything that's changed since then. Only ever
# touches these 11 specific, named entries - never anything else in
# Week 1's data.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to delete the 11 confirmed stale entries from Week 1'
        required: true
        default: 'NO'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Remove confirmed stale entries
        if: ${{ github.event.inputs.confirm == 'YES' }}
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;
          const WEEK = 1;

          // The exact 11 uids + expected team names confirmed by the
          // earlier diagnostic run.
          const TARGETS = [
            { uid: '1fsFjj13FDdydxouvM4op1Nkd7K2', team: 'Debo7130' },
            { uid: 'At4FJ2GSk3aAd0Jq7XRuq1CFF5G2', team: 'Brendan12' },
            { uid: 'Ebb7GeTVQBaXOuM6xgzvhRkhKJB3', team: 'Riedel Test' },
            { uid: 'HTH3fAJ8IGTYRC6d2dnaGvLaCN52', team: 'Fart Eater' },
            { uid: 'Id4ePEyBbjSxjV8sIi7zMTICRsj1', team: 'I\u2019m Heatin\u2019 Up' },
            { uid: 'Sgrkkso3IjYItRn4C9lwYEYwdyq2', team: 'Switch Test' },
            { uid: 'gjXU1UqjDJfsi1aQmqtP0Dkm52v1', team: 'Kyle Beining\'s Team' },
            { uid: 'hMYL8PRpt2P59bKVmLWtC8rAfyn1', team: 'PackrBackr' },
            { uid: 'jcqsnhhdRsPhahWjJOOWe6pP26m2', team: 'Reigning Champ Dan' },
            { uid: 'ownership', team: null }, // not a team entry at all — the real feature data
            { uid: 'ownershipMeta', team: null }
          ];

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }
          function firebaseDelete(path) {
            return new Promise((resolve, reject) => {
              const url = new URL(fbAuth(`${FB_URL}${path}`));
              const req = https.request({
                hostname: url.hostname, path: url.pathname + url.search, method: 'DELETE'
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => {
                  if (res.statusCode < 200 || res.statusCode >= 300) reject(new Error(`Delete failed: HTTP ${res.statusCode} — ${d}`));
                  else resolve(d);
                });
              });
              req.on('error', reject);
              req.end();
            });
          }

          async function main() {
            const members = await fetchJson(`/leagues/${LEAGUE_ID}/members.json`).catch(() => ({})) || {};
            const realActiveUids = new Set(
              Object.entries(members).filter(([, m]) => m && m.teamName && m.active !== false).map(([uid]) => uid)
            );

            let deleted = 0, skipped = 0;
            for (const target of TARGETS) {
              const entry = await fetchJson(`/leagues/${LEAGUE_ID}/season/${SEASON}/${WEEK}/${target.uid}.json`).catch(() => null);
              if (!entry) {
                console.log(`⏭️  ${target.uid}: no longer present — already gone, skipping.`);
                skipped++;
                continue;
              }
              // Re-verify: still not a real, active member, and (for real
              // team-shaped entries) the team name still matches what was
              // confirmed. ownership/ownershipMeta have no team name to
              // check — just confirm they're not a real member uid.
              if (realActiveUids.has(target.uid)) {
                console.log(`⚠️  ${target.uid}: is now a real, active member — refusing to delete, something changed.`);
                skipped++;
                continue;
              }
              if (target.team && entry.team !== target.team) {
                console.log(`⚠️  ${target.uid}: team name is now "${entry.team}", not "${target.team}" as confirmed earlier — refusing to delete.`);
                skipped++;
                continue;
              }

              await firebaseDelete(`/leagues/${LEAGUE_ID}/season/${SEASON}/${WEEK}/${target.uid}.json`);
              deleted++;
              console.log(`✅ Deleted ${target.uid}${target.team ? ' ("' + target.team + '")' : ''}`);
            }

            console.log(`\nDone. Deleted ${deleted}, skipped ${skipped} (already gone or changed since confirmation).`);
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT

      - name: Skipped - confirmation not provided
        if: ${{ github.event.inputs.confirm != 'YES' }}
        run: echo "Skipped — re-run with confirm=YES to actually delete the confirmed stale entries."
