name: URGENT Diagnostic — Check For Embedded uid Field On Score Entries

# ONE-TIME USE — delete this file after running it once.
# The client's normalizeSeasonData() uses Object.values() on the raw
# score data, discarding the real object keys (which ARE the real
# uids), and instead relies entirely on entry.uid existing as a
# field INSIDE each value. Checks directly whether that field
# actually exists on real entries right now. Read-only.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check for embedded uid field
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;
          const WEEK = 1;

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            const rawScores = await fetchJson(`/leagues/${LEAGUE_ID}/season/${SEASON}/${WEEK}.json`).catch(() => null);
            if (!rawScores) { console.log('No raw score data found.'); return; }

            const entries = Object.entries(rawScores);
            console.log(`Total real score entries: ${entries.length}`);
            console.log('');
            console.log('First 5 entries — real object key (the actual uid) vs entry.uid FIELD (what the client relies on):');
            entries.slice(0, 5).forEach(([key, val]) => {
              console.log(`  key="${key}"`);
              console.log(`    entry.uid field = ${JSON.stringify(val.uid)}`);
              console.log(`    entry.team = ${JSON.stringify(val.team)}`);
              console.log(`    entry.score = ${JSON.stringify(val.score)}`);
              console.log(`    full raw entry: ${JSON.stringify(val)}`);
            });

            const missingUidField = entries.filter(([key, val]) => !val.uid);
            console.log(`\nEntries missing an embedded uid field entirely: ${missingUidField.length} of ${entries.length}`);
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
