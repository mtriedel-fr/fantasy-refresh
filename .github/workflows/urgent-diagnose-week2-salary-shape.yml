name: URGENT Diagnostic — Check Real Week 2 Salary Data Shape

# ONE-TIME USE — delete this file after running it once.
# Checks the real, live Week 2 salary data (written by
# weekly-auto-open.yml, since that's the one that actually fired) -
# its real field names, position values, and counts per position -
# to find why the draft board is showing no eligible players for
# any slot. Read-only.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check real Week 2 salary data shape
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;
          const WEEK = 2;

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            const meta = await fetchJson(`/leagues/${LEAGUE_ID}/salaries/${SEASON}/week${WEEK}/meta.json`).catch(() => null);
            console.log('Real meta:', JSON.stringify(meta));
            console.log('');

            const players = await fetchJson(`/leagues/${LEAGUE_ID}/salaries/${SEASON}/week${WEEK}/players.json`).catch(() => null);
            if (!players) { console.log('No players object found at all.'); return; }

            const entries = Object.entries(players);
            console.log(`Total real player entries: ${entries.length}`);
            console.log('');

            // Position breakdown - using real, raw pos values, not assuming they're clean
            const posCounts = {};
            entries.forEach(([, p]) => {
              const pos = p && p.pos;
              posCounts[JSON.stringify(pos)] = (posCounts[JSON.stringify(pos)] || 0) + 1;
            });
            console.log('Real position value breakdown:', JSON.stringify(posCounts, null, 2));
            console.log('');

            console.log('Sample of first 5 real entries (full, raw):');
            entries.slice(0, 5).forEach(([id, p]) => {
              console.log(`  id="${id}":`, JSON.stringify(p));
            });
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
