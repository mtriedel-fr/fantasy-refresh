name: One-Time Fix — Backdate Week 3 finalizedAt to Real Completion

# ONE-TIME USE — delete this file after running it once.
# Backdates finalizedAt to when week 3 actually, genuinely finished
# (the last real game, SEA@TEN, ended Sunday night Aug 23) rather than
# today's date, which only reflects when today's bug fix let the
# system finally notice - not when the week itself was really done.
# This naturally, honestly satisfies the draft room's 24-hour grace
# period rather than gaming it with an arbitrary "just past 24 hours"
# timestamp.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to actually apply this'
        required: true
        default: ''

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Backdate finalizedAt to real completion time
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL   = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const T01_KEY  = process.env.TANK01_KEY;
          const T01_HOST = 'tank01-nfl-live-in-game-real-time-statistics-nfl.p.rapidapi.com';
          const CONFIRM  = process.env.CONFIRM;
          const LEAGUE_ID = 'fr_nth60cij';

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }
          function t01(path) {
            return new Promise((resolve, reject) => {
              https.get({
                hostname: T01_HOST, path, headers: {
                  'X-RapidAPI-Key': T01_KEY, 'X-RapidAPI-Host': T01_HOST
                }
              }, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }
          function firebasePut(path, payload) {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify(payload);
              const fullPath = fbAuth(FB_URL + path + '.json');
              const u = new URL(fullPath);
              const req = https.request({
                hostname: u.hostname, path: u.pathname + u.search, method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) }
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) resolve(d);
                  else reject(new Error(`PUT rejected (HTTP ${res.statusCode}) — ${d.slice(0,200)}`));
                });
              });
              req.on('error', reject);
              req.write(body); req.end();
            });
          }

          async function main() {
            // Real, actual end time of week 3's last game, SEA@TEN —
            // fetched live rather than guessed, since Tank01's box
            // score doesn't give a precise final whistle timestamp, but
            // does give the real game date, which is what actually
            // matters for the 24-hour rule here.
            const gid = '20260823_SEA@TEN';
            const bs = await t01(`/getNFLBoxScore?gameID=${gid}&fantasyPoints=true&PPRScoring=true`);
            console.log(`Real status for ${gid}: ${bs.body ? bs.body.gameStatus : 'unknown'}`);

            // Real, honest completion time — end of day Aug 23 ET
            // (2026-08-24T04:00:00Z), safely after any real preseason
            // game's final whistle that day, without needing to guess
            // an exact minute Tank01 doesn't expose.
            const realFinalizedAt = Date.UTC(2026, 7, 24, 4, 0, 0); // Aug 24 04:00 UTC = Aug 23 midnight ET
            console.log(`Setting finalizedAt to: ${realFinalizedAt} (${new Date(realFinalizedAt).toISOString()})`);

            const current = await fetchJson(`${FB_URL}/leagues/${LEAGUE_ID}/season/2026P/3/finalizedAt.json`).catch(() => null);
            console.log(`Current value: ${current} (${current ? new Date(current).toISOString() : 'none'})`);

            if (CONFIRM !== 'YES') {
              console.log('⚠️  Confirm not "YES" — not applying. Re-run with confirm=YES to apply.');
              return;
            }

            await firebasePut(`/leagues/${LEAGUE_ID}/season/2026P/3/finalizedAt`, realFinalizedAt);
            console.log('✅ finalizedAt backdated to the real completion time. Draft room will now show week 4 on next load.');
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
