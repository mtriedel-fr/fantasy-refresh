name: One-Time Fix — Delete Stale Week 3 Salary Data

# ONE-TIME USE — delete this file after it runs successfully once.
#
# Confirmed directly: Week 3's salary data was generated on August
# 20th, 2026 - weeks before the real season even started (Week 1
# itself wasn't generated until September 9th). This is old,
# leftover test/development data that was never cleaned up, not a
# real Week 3 generation - and its nonzero player count was
# incorrectly making Week 3 show as "available" in the week
# dropdown, since that check only looks at whether a count exists,
# not how old or real the data actually is.
#
# Safety: re-fetches and re-verifies the real generation timestamp
# immediately before deleting, refusing to proceed if it no longer
# matches what was confirmed (August 20th) - in case anything
# changed since confirmation.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to delete the stale Week 3 salary data'
        required: true
        default: 'NO'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale Week 3 salary data
        if: ${{ github.event.inputs.confirm == 'YES' }}
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;
          const WEEK = 3;
          const EXPECTED_GENERATED_DATE = '2026-08-20'; // confirmed earlier — refuses to delete if this no longer matches

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }
          function firebaseDelete(path) {
            return new Promise((resolve, reject) => {
              const url = new URL(fbAuth(`${FB_URL}${path}`));
              const req = https.request({
                hostname: url.hostname, path: url.pathname + url.search, method: 'DELETE'
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => {
                  if (res.statusCode < 200 || res.statusCode >= 300) reject(new Error(`Delete failed: HTTP ${res.statusCode} — ${d}`));
                  else resolve(d);
                });
              });
              req.on('error', reject);
              req.end();
            });
          }

          async function main() {
            const meta = await fetchJson(`/leagues/${LEAGUE_ID}/salaries/${SEASON}/week${WEEK}/meta.json`).catch(() => null);
            if (!meta) {
              console.log('No Week 3 salary data found at all — already gone, nothing to do.');
              return;
            }
            const realGeneratedDate = meta.generated ? new Date(meta.generated).toISOString().slice(0, 10) : null;
            console.log(`Real Week 3 salary meta: count=${meta.count}, generated=${realGeneratedDate}`);

            if (realGeneratedDate !== EXPECTED_GENERATED_DATE) {
              console.log(`⚠️  Generation date is now "${realGeneratedDate}", not the confirmed "${EXPECTED_GENERATED_DATE}" — refusing to delete, something changed since confirmation.`);
              return;
            }

            await firebaseDelete(`/leagues/${LEAGUE_ID}/salaries/${SEASON}/week${WEEK}.json`);
            console.log(`✅ Deleted stale Week 3 salary data (was ${meta.count} players, generated ${realGeneratedDate}).`);
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT

      - name: Skipped - confirmation not provided
        if: ${{ github.event.inputs.confirm != 'YES' }}
        run: echo "Skipped — re-run with confirm=YES to actually delete the stale data."
