name: One-Time Fix — Re-Lock Draft To Real Kickoff Minus 24h

# ONE-TIME USE — delete this file after running it once.
# The earlier draftLockedUntil correction was itself built on a wrong
# foundational constant - confirmed tonight against multiple
# independent sources that the real kickoff is Wednesday, Sept 9,
# 2026, 8:20 PM ET (1788999600000), not the Tuesday value used
# earlier (1788913200000, which was exactly 24 hours off). This
# re-locks drafting until the REAL correct time: real kickoff minus
# 24 hours = Tuesday, Sept 8, 7:20 PM CT — one full day before the
# actual kickoff, matching what the lock's own UI text promises.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to apply this correction'
        required: true
        default: 'NO'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Re-lock to the real, correct time
        if: ${{ github.event.inputs.confirm == 'YES' }}
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';

          // Real, verified kickoff — confirmed directly tonight against
          // multiple independent sources (Yahoo, NBC, FOX, Wikipedia,
          // the Patriots' own site): Wednesday, Sept 9, 2026, 8:20 PM ET.
          const REAL_KICKOFF_MS = 1788999600000;
          const CORRECTED_LOCK_MS = REAL_KICKOFF_MS - (24 * 60 * 60 * 1000);

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function firebasePut(path, data) {
            return new Promise((resolve, reject) => {
              const url = new URL(fbAuth(`${FB_URL}${path}`));
              const body = JSON.stringify(data);
              const req = https.request({
                hostname: url.hostname, path: url.pathname + url.search, method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) }
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => resolve({ status: res.statusCode, body: d }));
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            const before = await fetchJson(`/leagues/${LEAGUE_ID}/settings/draftLockedUntil.json`).catch(() => null);
            console.log(`Value BEFORE re-lock: ${before} (${before ? new Date(before).toISOString() : 'none'})`);

            const putResult = await firebasePut(`/leagues/${LEAGUE_ID}/settings/draftLockedUntil.json`, CORRECTED_LOCK_MS);
            console.log(`Write HTTP status: ${putResult.status}`);
            if (putResult.status < 200 || putResult.status >= 300) {
              console.log(`⚠️  WRITE FAILED: ${putResult.body}`);
              return;
            }

            const after = await fetchJson(`/leagues/${LEAGUE_ID}/settings/draftLockedUntil.json`).catch(() => null);
            console.log(`Value AFTER re-lock: ${after} (${new Date(after).toISOString()})`);
            console.log(`Real kickoff: ${new Date(REAL_KICKOFF_MS).toISOString()} (Wed Sept 9, 8:20 PM ET)`);
            console.log(`Matches expected corrected value: ${after === CORRECTED_LOCK_MS}`);
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT

      - name: Skipped - confirmation not provided
        if: ${{ github.event.inputs.confirm != 'YES' }}
        run: echo "Skipped — re-run with confirm=YES to actually apply this fix."
