name: One-Time Cleanup — Bad Preseason Locks in Week 1

# ONE-TIME USE — delete this file after running it once.
# Directly confirmed via diagnostics: /leagues/fr_refresh26/locks/2026/week1
# currently contains 8 entries (ARI, CAR, CIN, DET, GB, IND, NE, PIT) whose
# gameId values are all real PRESEASON games (20260806_CAR@ARI,
# 20260813_DET@CIN, etc.) — written before tonight's kickoff-locks.yml fix
# existed, when that workflow's old, date-based logic incorrectly treated
# every league as preseason during August, writing preseason lock data
# into the real, regular-season league's path.
#
# Real Week 1 of the regular season doesn't start until Sept 9 — nothing
# should be locked yet. This clears the incorrect entries so the draft
# picker correctly shows these teams' players as available again. Does
# NOT touch /locks/2026/meta — only the actual week1 lock entries
# themselves, which are the only thing confirmed wrong.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to actually delete the bad week1 locks data'
        required: true
        default: ''

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Clear the incorrect preseason-dated locks from week1
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          node << 'SCRIPT'
          const https = require('https');

          const FB_URL   = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const CONFIRM  = process.env.CONFIRM;
          const PATH     = '/leagues/fr_refresh26/locks/2026/week1';

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          function firebaseDelete(path) {
            return new Promise((resolve, reject) => {
              const fullPath = fbAuth(FB_URL + path + '.json');
              const u = new URL(fullPath);
              const req = https.request({
                hostname: u.hostname, path: u.pathname + u.search, method: 'DELETE'
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) resolve(d);
                  else reject(new Error(`DELETE rejected (HTTP ${res.statusCode}) — ${d.slice(0,200)}`));
                });
              });
              req.on('error', reject);
              req.end();
            });
          }

          async function main() {
            const before = await fetchJson(FB_URL + PATH + '.json').catch(() => null);
            console.log('Current data at ' + PATH + ':');
            console.log(JSON.stringify(before, null, 2));

            const expectedTeams = ['ARI','CAR','CIN','DET','GB','IND','NE','PIT'];
            const actualTeams = before ? Object.keys(before) : [];
            const allPreseasonDated = before && actualTeams.every(t => {
              const gid = before[t] && before[t].gameId;
              return gid && (gid.startsWith('20260806') || gid.startsWith('20260813'));
            });

            if (!before) {
              console.log('Already empty — nothing to clean up.');
              return;
            }
            if (!allPreseasonDated) {
              console.log('⚠️  Found data that does NOT match the confirmed-bad preseason pattern (unexpected gameId or extra teams). Stopping without changes — check manually.');
              console.log('Teams found: ' + actualTeams.join(', '));
              return;
            }

            console.log(`Confirmed: all ${actualTeams.length} entries (${actualTeams.join(', ')}) are preseason-dated (Aug 6/13), matching the known bad data exactly.`);

            if (CONFIRM !== 'YES') {
              console.log('⚠️  Confirm input was not "YES" — nothing was deleted. Set confirm=YES and re-run to actually clean this up.');
              return;
            }

            await firebaseDelete(PATH);
            console.log(`✅ Deleted ${PATH} — real week 1 locks path is now empty, as it should be until real games actually start Sept 9.`);
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
