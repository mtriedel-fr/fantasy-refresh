name: Database rules tests

# Runs the security-rules tests (tests/rules/) against the Firebase
# emulator whenever the rules change. No secrets, no live data.
on:
  pull_request:
    paths: ['database.rules.json', 'tests/rules/**', '.github/workflows/rules-tests.yml']
  push:
    branches: [main]
    paths: ['database.rules.json', 'tests/rules/**']

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - name: Install emulator + test libraries
        run: npm i --no-save firebase-tools@13.29.1 @firebase/rules-unit-testing@3.0.4 firebase@10.14.1
      - name: Run rules tests in the emulator
        run: |
          echo '{ "emulators": { "database": { "port": 9000 } } }' > firebase.json
          npx firebase emulators:exec --only database --project fr-rules-test "node --test tests/rules/"
