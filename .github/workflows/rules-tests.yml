name: Database rules tests (OLD rules sanity check)

# Runs the security-rules tests (tests/rules/) against the Firebase
# emulator whenever the rules change. No secrets, no live data.
on:
  push:
    branches: [audit/draft-check]
    paths: ['tests/rules/**']

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - name: Install emulator + test libraries
        run: npm i --no-save firebase-tools@13.29.1 @firebase/rules-unit-testing@3.0.4 firebase@10.14.1
      - name: Run rules tests in the emulator
        run: |
          echo '{ "emulators": { "database": { "port": 9000 } } }' > firebase.json
          set +e
          npx firebase emulators:exec --only database --project fr-rules-test "node --test --test-reporter=tap tests/rules/rules.test.mjs" > rules-out.txt 2>&1
          code=$?
          # Run logs aren't readable everywhere, so report results as annotations.
          node -e '
            const s = require("fs").readFileSync("rules-out.txt", "utf8").replace(/\x1b\[[0-9;]*m/g, "");
            const esc = t => t.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
            const fails = s.split("\n").filter(l => /^\s*not ok/.test(l));
            const summary = s.split("\n").filter(l => /^# (tests|pass|fail)/.test(l)).join("  ");
            console.log(`::notice title=Rules tests::${esc(summary || "no summary")}`);
            if (process.argv[1] !== "0") {
              const tail = s.slice(-3500);
              console.log(`::error title=Rules tests failed::${esc((fails.join("\n") + "\n---\n" + tail).slice(-3800))}`);
            }
          ' "$code"
          exit $code
