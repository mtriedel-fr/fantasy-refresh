name: One-Time Diagnostic — Full Philosophy Model V3 vs Current Week 1 Salaries

# ONE-TIME USE — delete this file after running it once.
# Final re-tuned model: TE premium raised to 1.0 (top ~$8,100,
# up from $7,300) and DEF premium raised to 0.80 (top ~$5,400, up
# from $4,800), per direct request. Re-verified the 2-star/3-star
# difficulty target still holds with these updated "scrub" TE/DEF
# prices - if anything the gap widened slightly (2-star $2,100
# spare, 3-star $2,400 over cap). Read-only, does not write
# anything back to Firebase.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Compare full population - old vs final re-tuned model
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;
          const WEEK = 1;

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          const SAL_MAX = 10500;
          const MIN_SANITY = 100;
          const TOP_ANCHOR_EXP = 0.6;
          const POSITIONS = {
            QB:  { exp: 1.3,  premium: 1.0  },
            RB:  { exp: 0.35, premium: 1.10 },
            WR:  { exp: 0.35, premium: 1.05 },
            TE:  { exp: 0.7,  premium: 1.0  },
            DEF: { exp: 0.6,  premium: 0.80 }
          };

          function salRound(n) {
            return Math.max(MIN_SANITY, Math.min(SAL_MAX, Math.ceil(n / 100) * 100));
          }

          async function main() {
            const salaryData = await fetchJson(`/leagues/${LEAGUE_ID}/salaries/${SEASON}/week${WEEK}.json`).catch(() => null);
            if (!salaryData || !salaryData.players) { console.log('No real salary data found.'); return; }

            const players = Object.values(salaryData.players);
            const withProj = players.filter(p => p.proj > 0);

            const globalMaxProj = Math.max(...withProj.map(p => p.proj));
            const baseRate = SAL_MAX / Math.pow(globalMaxProj, TOP_ANCHOR_EXP);

            const maxProjByPos = {};
            Object.keys(POSITIONS).forEach(pos => {
              const posPlayers = withProj.filter(p => p.pos === pos);
              if (posPlayers.length) maxProjByPos[pos] = Math.max(...posPlayers.map(p => p.proj));
            });

            const multByPos = {};
            Object.entries(POSITIONS).forEach(([pos, conf]) => {
              if (!maxProjByPos[pos]) return;
              let topAnchor = Math.pow(maxProjByPos[pos], TOP_ANCHOR_EXP) * baseRate * conf.premium;
              topAnchor = Math.min(topAnchor, SAL_MAX);
              multByPos[pos] = topAnchor / Math.pow(maxProjByPos[pos], conf.exp);
            });

            const results = players.map(p => {
              const conf = POSITIONS[p.pos];
              let newSal;
              if (!conf || !p.proj || p.proj <= 0) {
                newSal = MIN_SANITY;
              } else {
                newSal = salRound(Math.pow(p.proj, conf.exp) * multByPos[p.pos]);
              }
              return { name: p.name, pos: p.pos, team: p.team, proj: p.proj || 0, oldSal: p.salary, newSal, delta: newSal - p.salary };
            });

            const posOrder = { QB: 0, RB: 1, WR: 2, TE: 3, DEF: 4 };
            results.sort((a, b) => (posOrder[a.pos] - posOrder[b.pos]) || (b.newSal - a.newSal));

            console.log('name,pos,team,proj,old_salary,new_salary,delta');
            results.forEach(r => {
              console.log(`${r.name},${r.pos},${r.team},${r.proj.toFixed(1)},${r.oldSal},${r.newSal},${r.delta >= 0 ? '+' : ''}${r.delta}`);
            });

            console.log(`\nTotal players: ${results.length}`);
            const avgDelta = results.reduce((s, r) => s + r.delta, 0) / results.length;
            console.log(`Average delta: ${avgDelta >= 0 ? '+' : ''}${avgDelta.toFixed(0)}`);
            Object.keys(POSITIONS).forEach(pos => {
              const posResults = results.filter(r => r.pos === pos);
              if (!posResults.length) return;
              const posAvgDelta = posResults.reduce((s, r) => s + r.delta, 0) / posResults.length;
              const posAvgOld = posResults.reduce((s, r) => s + r.oldSal, 0) / posResults.length;
              const posAvgNew = posResults.reduce((s, r) => s + r.newSal, 0) / posResults.length;
              const posTop = posResults[0].newSal;
              console.log(`${pos}: top $${posTop}  avg old $${posAvgOld.toFixed(0)} -> avg new $${posAvgNew.toFixed(0)}  (avg delta ${posAvgDelta >= 0 ? '+' : ''}${posAvgDelta.toFixed(0)})`);
            });
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
