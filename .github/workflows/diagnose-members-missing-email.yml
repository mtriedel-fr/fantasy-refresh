name: One-Time Diagnostic — Check Members Missing Email

# ONE-TIME USE — delete this file after running it once.
# Checks the real, current member data for both leagues to see which
# members are missing email, and whether there's a clear pattern
# (shared team, join date, active status, etc.) that narrows down the
# cause before assuming anything.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check real member data
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            for (const leagueId of ['fr_refresh26', 'fr_nth60cij']) {
              const members = await fetchJson(`${FB_URL}/leagues/${leagueId}/members.json`).catch(() => null);
              console.log(`\n=== ${leagueId} ===`);
              if (!members) { console.log('No members found.'); continue; }

              Object.entries(members).forEach(([uid, m]) => {
                console.log(`  ${uid}:`);
                console.log(`    teamName: ${m.teamName || '(none)'}`);
                console.log(`    email: ${m.email || 'MISSING'}`);
                console.log(`    role: ${m.role || '(none)'}`);
                console.log(`    active: ${m.active}`);
                console.log(`    joined: ${m.joined ? new Date(m.joined).toISOString() : '(none)'}`);
                console.log(`    all fields: ${Object.keys(m).join(', ')}`);
              });
            }
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
