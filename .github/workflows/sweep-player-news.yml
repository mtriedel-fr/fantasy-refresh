name: Sweep Player News

# ── SCHEDULED — every 4 hours, plus manual trigger for testing ──────────
# Keeps a permanent, growing news archive fresh for every player someone
# could realistically draft, without depending on anyone happening to
# open that specific player's card first. Tank01 only ever hands back a
# handful of the most recent items per player (maxItems=6) — anything
# older just falls off and is gone forever unless captured here. This
# job checks what's current each run and adds only genuinely NEW items
# to /nflNewsArchive, skipping anything already saved, so the archive
# accumulates real history over time instead of only ever showing
# "today's top few."
#
# Scoped to the salary-eligible pool (~500-600 players — the exact same
# list already populating the draft picker), not the full player pool
# (~3,200) and not just already-rostered players — news matters most
# exactly when someone's deciding whether to DRAFT a player, which is
# before they're rostered, so "rostered only" was missing the actual
# highest-value moment. The full pool would run ~19,000+ calls/day on
# this schedule, well over the daily cap — this scope keeps it a small
# fraction of that while still covering everyone actually draftable.
# Reuses the Worker's own /news endpoint rather than calling Tank01
# directly, so once the field-name mapping there is fixed (it's
# currently unverified — see the _debug output added to /news), this
# sweep automatically benefits with no separate fix needed here.

on:
  schedule:
    - cron: '17 */4 * * *'  # every 4 hours, offset from the hour so it doesn't pile up with other scheduled jobs
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Test mode — sweep one league only, write nothing'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  sweep-news:
    runs-on: ubuntu-latest
    steps:
      - name: Sweep rostered player news
        env:
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');

          const FB_URL   = 'https://fantasy-refresh-default-rtdb.firebaseio.com';
          const FB_TOKEN  = process.env.FIREBASE_AUTH_TOKEN;
          const WORKER    = 'https://fantasy-refresh-news.mtriedel.workers.dev';
          const SEASON    = process.env.FR_SEASON || '2026';
          const TEST_ONLY = '${{ inputs.test_only }}' === 'true' || !('${{ inputs.test_only }}');

          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => {
                  try { resolve(JSON.parse(data)); } catch(e) { reject(e); }
                });
              }).on('error', reject);
            });
          }

          function firebaseGet(path) { return fetchJson(FB_URL + path); }

          function firebasePut(path, payload) {
            return new Promise((resolve, reject) => {
              const url = new URL(FB_URL + path + '?auth=' + FB_TOKEN);
              const body = JSON.stringify(payload);
              const req = https.request(url, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) }
              }, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => {
                  if (res.statusCode < 200 || res.statusCode >= 300) {
                    reject(new Error(`Firebase PUT ${path} failed: ${res.statusCode} ${data}`));
                  } else {
                    resolve(JSON.parse(data || '{}'));
                  }
                });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          // Firebase RTDB keys can't contain . $ # [ ] /
          function sanitizeFirebaseKey(s) {
            return (s || '').replace(/[.$#\[\]\/]/g, '');
          }

          async function getSalaryEligiblePlayers(week) {
            // Same list already used to populate the draft picker itself —
            // sourced from the salary data weekly-prep.yml already
            // generates, not a separate lookup. fr_refresh26 used as the
            // canonical source (same default used throughout this app
            // whenever a single source of truth is needed), since the
            // eligible player SET is broadly the same regardless of which
            // league happens to be asking.
            const players = new Map(); // name (lowercase) -> {name, team, tank01PlayerID}
            try {
              const salaryData = await firebaseGet(`/leagues/fr_refresh26/salaries/${SEASON}/week${week}.json`);
              if (!salaryData || salaryData.error || !salaryData.players) return players;
              Object.values(salaryData.players).forEach(p => {
                if (!p || !p.name) return;
                players.set(p.name.toLowerCase(), { name: p.name, team: p.team || '', tank01PlayerID: p.tank01PlayerID || null });
              });
            } catch(e) { console.error('  Could not read salary-eligible player list:', e.message); }
            return players;
          }

          async function getCurrentWeek() {
            try {
              const meta = await firebaseGet(`/leagues/fr_refresh26/season/${SEASON}/meta.json`);
              return (meta && meta.week) || 1;
            } catch(e) { return 1; }
          }

          // A news item has no stable ID from Tank01, and — confirmed via
          // a real sample — no date field either, just title and link.
          // Dedupe using a sanitized version of the title alone, which is
          // deterministic (the same real item always produces the same
          // key) and specific enough on its own, since Tank01's titles
          // here are full sentences, not short generic headlines.
          function itemKey(item) {
            const raw = (item.title || '').toLowerCase();
            return sanitizeFirebaseKey(raw).replace(/\s+/g, '_').slice(0, 120) || ('item_' + Date.now());
          }

          async function sweepPlayer(name, team, tank01PlayerID) {
            let data;
            try {
              var newsUrl = `${WORKER}/news?name=${encodeURIComponent(name)}`;
              if (tank01PlayerID) newsUrl += `&playerID=${encodeURIComponent(tank01PlayerID)}`;
              data = await fetchJson(newsUrl);
            } catch(e) {
              console.error(`  ${name}: news fetch failed —`, e.message);
              return { added: 0 };
            }
            const items = data.items || [];
            if (!items.length) return { added: 0 };

            const playerKey = sanitizeFirebaseKey(name.toLowerCase());
            let existing = {};
            try {
              existing = await firebaseGet(`/nflNewsArchive/${playerKey}.json`) || {};
              if (existing.error) existing = {};
            } catch(e) { /* nothing archived yet for this player */ }

            let added = 0;
            for (const item of items) {
              const key = itemKey(item);
              if (existing[key]) continue; // already archived — genuinely new items only
              if (TEST_ONLY) { added++; continue; }
              try {
                await firebasePut(`/nflNewsArchive/${playerKey}/${key}.json`, {
                  ...item, playerName: name, team, archivedAt: Date.now()
                });
                added++;
              } catch(e) {
                console.error(`    Failed to archive item for ${name}:`, e.message);
              }
            }
            return { added, totalSeen: items.length };
          }

          (async () => {
            if (!TEST_ONLY && !FB_TOKEN) {
              console.error('❌ FIREBASE_AUTH_TOKEN secret is missing — required for a real (non-test) sweep.');
              process.exit(1);
            }

            const week = await getCurrentWeek();
            console.log(`=== News sweep | week ${week} | mode: ${TEST_ONLY ? 'TEST (10 players, no writes)' : 'REAL'} | scope: salary-eligible pool ===`);

            const allPlayers = await getSalaryEligiblePlayers(week);

            console.log(`Found ${allPlayers.size} unique rostered player(s) to check.`);

            let totalAdded = 0, checked = 0;
            for (const { name, team, tank01PlayerID } of allPlayers.values()) {
              const result = await sweepPlayer(name, team, tank01PlayerID);
              if (result.added > 0) {
                console.log(`  ${TEST_ONLY ? '[TEST] would add' : '✓ added'} ${result.added} new item(s) for ${name}`);
                totalAdded += result.added;
              }
              checked++;
              await sleep(500); // pacing — spread calls out, don't burst
              if (TEST_ONLY && checked >= 10) {
                console.log('  [TEST MODE] Stopping after 10 players — enough to confirm this works.');
                break;
              }
            }

            console.log(`\n✓ Sweep complete — checked ${checked} player(s), ${TEST_ONLY ? 'would add' : 'added'} ${totalAdded} new news item(s).`);
          })();
          SCRIPT
