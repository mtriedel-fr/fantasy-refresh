name: Sweep Player News

# ── SCHEDULED — pulls fantasy-relevant player NEWS NOTES into
# /nflNewsArchive, one player at a time, keyed to the player pool. ────────
#
# PROVIDER-PLUGGABLE. The source of news is a single swappable "provider"
# selected by the NEWS_PROVIDER env below. Everything else — matching news
# to the player pool, storing it, showing how fresh it is, pruning stale
# items — is provider-agnostic and identical no matter where the notes come
# from. To change sources you change ONE value; you do not touch the core.
#
#   NEWS_PROVIDER = 'sleeper'      (default, free, no key)
#                   'rotowire'     (paid feed — set ROTOWIRE_API_KEY secret)
#                   'fantasypros'  (the previous source — kept as a fallback)
#
# WHY SLEEPER IS THE DEFAULT
#   • Content type: short fantasy-relevant notes (injuries, role/usage,
#     "expected to start") — NOT long articles. Same kind of blurb Sleeper's
#     own app shows (largely Rotowire-sourced).
#   • Matching: Sleeper news carries the Sleeper player_id, and the player
#     pool is ALREADY keyed by Sleeper player_id — so news joins to the pool
#     by exact ID, with none of the name-suffix problems (Fannin Jr. etc.).
#   • Freshness: each item has a real published timestamp, so the draft card
#     can show "3d ago" and hide anything stale.
#   • Cost: free, no punishing per-day request cap (unlike FantasyPros' 50/day).
#
# ROTOWIRE LATER (after growth)
#   Rotowire is the paid, contractually-stable version of these same notes.
#   To switch: get a Rotowire API key, add it as the ROTOWIRE_API_KEY repo
#   secret, and set NEWS_PROVIDER to 'rotowire'. Nothing else changes — the
#   rotowire provider below already normalizes to the same shape the core
#   consumes. (The endpoint path is the documented api.rotowire.com pattern;
#   confirm the exact field names against your account's docs on first run
#   with test_only=true, same as we do for Sleeper.)
#
# STALENESS FIX (the "Matthew Golden showing May draft-prep news" bug)
#   The old sweep only ever APPENDED — it never removed old items, so a
#   player who stopped getting fresh news kept showing months-old notes
#   forever. This version PRUNES: after refreshing a player, it deletes that
#   player's items older than PRUNE_AFTER_DAYS. Combined with the draft
#   card's own recency filter, stale notes can't surface.

on:
  # Triggered externally by cron-job.org (POST to workflow_dispatch), same
  # pattern as auto-scoring / kickoff-locks. A scheduled cron sends no input,
  # so an empty test_only means REAL. Only an explicit test_only=true (the
  # manual-dispatch default) is a dry run that writes nothing.
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Test mode — write nothing, dump what the provider returns'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      provider_override:
        description: "Override the news provider for this run (blank = use default)"
        required: false
        default: ''
        type: choice
        options: ['', 'sleeper', 'rotowire', 'fantasypros']

jobs:
  sweep-news:
    runs-on: ubuntu-latest
    steps:
      - name: Sweep fantasy player news
        env:
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
          ROTOWIRE_API_KEY: ${{ secrets.ROTOWIRE_API_KEY }}
          FR_SEASON: "2026"
          # ── THE ONE SWITCH ──────────────────────────────────────────────
          NEWS_PROVIDER: "sleeper"
          TEST_ONLY_INPUT: ${{ inputs.test_only }}
          PROVIDER_OVERRIDE: ${{ inputs.provider_override }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL   = 'https://fantasy-refresh-default-rtdb.firebaseio.com';
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const SEASON   = process.env.FR_SEASON || '2026';
          const TEST_ONLY = (process.env.TEST_ONLY_INPUT || '').trim() === 'true';
          const PROVIDER = ((process.env.PROVIDER_OVERRIDE || '').trim() || (process.env.NEWS_PROVIDER || 'sleeper').trim()).toLowerCase();

          // ── Tunables ────────────────────────────────────────────────────
          const PRUNE_AFTER_DAYS = 21;              // items older than this are removed on refresh
          const MAX_ITEMS_PER_PLAYER = 8;           // keep the newest N per player
          const SLEEPER_NEWS_LIMIT = 10;            // items to request per player from Sleeper
          const SLEEPER_CONCURRENCY = 10;           // parallel per-player lookups (keeps a ~450-player run under a minute)
          const PRUNE_MS = PRUNE_AFTER_DAYS * 24 * 60 * 60 * 1000;

          // ── HTTP helpers ────────────────────────────────────────────────
          function getJson(url, headers) {
            return new Promise((resolve, reject) => {
              https.get(url, { headers: headers || {} }, res => {
                let d = ''; res.on('data', c => d += c);
                res.on('end', () => { try { resolve(JSON.parse(d)); } catch(e) { reject(new Error('non-JSON from ' + url + ': ' + d.slice(0,160))); } });
              }).on('error', reject);
            });
          }
          function postJson(url, bodyObj, headers) {
            return new Promise((resolve, reject) => {
              const u = new URL(url);
              const body = JSON.stringify(bodyObj);
              const req = https.request(u, {
                method: 'POST',
                headers: Object.assign({ 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) }, headers || {})
              }, res => {
                let d = ''; res.on('data', c => d += c);
                res.on('end', () => { try { resolve(JSON.parse(d)); } catch(e) { reject(new Error('non-JSON (HTTP ' + res.statusCode + ') from ' + url + ': ' + d.slice(0,200))); } });
              });
              req.on('error', reject); req.write(body); req.end();
            });
          }
          function firebaseGet(path) { return getJson(FB_URL + path); }
          function firebaseWrite(method, path, payload) {
            return new Promise((resolve, reject) => {
              const u = new URL(FB_URL + path + '?auth=' + FB_TOKEN);
              const body = payload != null ? JSON.stringify(payload) : null;
              const opts = { method, headers: { 'Content-Type': 'application/json' } };
              if (body) opts.headers['Content-Length'] = Buffer.byteLength(body);
              const req = https.request(u, opts, res => {
                let d = ''; res.on('data', c => d += c);
                res.on('end', () => {
                  if (res.statusCode < 200 || res.statusCode >= 300) reject(new Error('Firebase ' + method + ' ' + path + ' failed: ' + res.statusCode + ' ' + d.slice(0,160)));
                  else { try { resolve(d ? JSON.parse(d) : null); } catch(e) { resolve(null); } }
                });
              });
              req.on('error', reject); if (body) req.write(body); req.end();
            });
          }
          const firebasePut    = (p, v) => firebaseWrite('PUT', p, v);
          const firebaseDelete = (p)    => firebaseWrite('DELETE', p, null);

          // Firebase RTDB keys can't contain . $ # [ ] /
          function sanitizeKey(s) { return (s || '').replace(/[.$#\[\]\/]/g, ''); }
          // Canonical name for name-based matching (RotoWire/FantasyPros): drop
          // punctuation and generational suffixes so spellings line up.
          function normName(s) {
            return (s || '').toLowerCase().replace(/[^a-z0-9\s]/g,'').replace(/\b(jr|sr|ii|iii|iv|v)\b/g,'').replace(/\s+/g,' ').trim();
          }

          // ── Player pool (the single source of truth for who exists) ──────
          // Keyed by Sleeper player_id — the same id Sleeper news uses, so a
          // Sleeper match is exact. Also indexed by normalized name for the
          // name-based providers (RotoWire / FantasyPros).
          async function getCurrentWeek() {
            try { const m = await firebaseGet(`/leagues/fr_refresh26/season/${SEASON}/meta.json`); return (m && m.week) || 1; }
            catch(e) { return 1; }
          }
          // The draftable set for the current week — the only players whose
          // news the draft card ever shows. Scoping the sweep to these keeps it
          // to a few hundred lookups instead of the whole 3,000+ pool.
          async function salaryEligibleIds(week) {
            const ids = [];
            try {
              const s = await firebaseGet(`/leagues/fr_refresh26/salaries/${SEASON}/week${week}.json`);
              if (s && s.players) Object.values(s.players).forEach(p => { if (p && p.id) ids.push(String(p.id)); });
            } catch(e) { /* no salaries yet */ }
            return ids;
          }

          async function loadPool() {
            const byId = {}, byName = {};
            try {
              const pool = await firebaseGet(`/playerPool/${SEASON}/players.json`);
              Object.entries(pool || {}).forEach(([id, p]) => {
                if (!p || !p.name) return;
                const rec = { id, name: p.name, team: p.team || '' };
                byId[id] = rec;
                byName[normName(p.name)] = rec;
              });
            } catch(e) { console.error('  Could not load player pool:', e.message); }
            return { byId, byName };
          }

          // ── Normalized item shape every provider returns ─────────────────
          //   { providerId, playerId, playerName, team, title, analysis,
          //     link, image, publishedMs, source }
          // playerId (Sleeper id) is preferred for matching; playerName is the
          // fallback for name-based providers.

          // ════════════════════════════════════════════════════════════════
          //  PROVIDER: SLEEPER  (default) — undocumented GraphQL, free, id-keyed
          // ════════════════════════════════════════════════════════════════
          // Sleeper's app fetches player notes from its GraphQL API. The exact
          // operation/field names are undocumented, so they're isolated here as
          // constants — if a run in test mode shows the response shape differs,
          // this is the ONLY block to adjust. The request format matches
          // Sleeper's known GraphQL pattern (POST { operationName, query,
          // variables } to /graphql). news items carry a `published` (ms) time.
          const SLEEPER_GRAPHQL = 'https://sleeper.com/graphql';
          // Verified live against Sleeper: on type PlayerNews the fields
          // player_id, published, source, source_key and metadata are valid;
          // news_id and title are NOT (title/body live inside metadata).
          const SLEEPER_NEWS_QUERY =
            'query get_player_news($sport: String!, $player_id: String!, $limit: Int!) {' +
            '  get_player_news(sport: $sport, player_id: $player_id, limit: $limit) {' +
            '    player_id published source source_key metadata' +
            '  }' +
            '}';
          async function sleeperNewsForPlayer(playerId) {
            const resp = await postJson(SLEEPER_GRAPHQL, {
              operationName: 'get_player_news',
              query: SLEEPER_NEWS_QUERY,
              variables: { sport: 'nfl', player_id: String(playerId), limit: SLEEPER_NEWS_LIMIT }
            }, { 'User-Agent': 'fantasyrefresh' });
            const rows = (resp && resp.data && resp.data.get_player_news) || [];
            return rows.map(r => {
              // metadata is a JSON blob on Sleeper items — pull the human note
              // and any link/image out of it defensively.
              let meta = r.metadata;
              if (typeof meta === 'string') { try { meta = JSON.parse(meta); } catch(e) { meta = {}; } }
              meta = meta || {};
              const publishedMs = Number(r.published) || Date.now();
              return {
                providerId: 'sl_' + (r.source_key || (r.player_id + '_' + publishedMs)),
                playerId: r.player_id ? String(r.player_id) : null,
                playerName: null,
                team: '',
                title: meta.title || meta.headline || '',
                // Prefer the fantasy ANALYSIS (what it means for your lineup)
                // over the dry factual description (the stat line). Confirmed
                // live: Sleeper items carry both under metadata.
                analysis: meta.analysis || meta.description || meta.news || meta.body || '',
                link: meta.url || meta.link || '',
                image: meta.image || '',
                publishedMs,
                source: r.source || 'sleeper'
              };
            });
          }
          async function fetchSleeper(pool, opts) {
            const ids = Object.keys(pool.byId);
            // In test mode, prefer a few players likely to actually HAVE notes,
            // so the raw dump shows a populated metadata blob to confirm field
            // paths against (a kicker with no news tells us nothing).
            let targets;
            if (opts.test) {
              const wanted = ['patrick mahomes','justin jefferson','christian mccaffrey','ceedee lamb','tyreek hill'];
              const picked = wanted.map(n => pool.byName[n]).filter(Boolean).map(r => r.id);
              targets = (picked.length ? picked : ids.slice(0, 3)).slice(0, 3);
            } else {
              // Real run: only draftable players (this week's salary pool),
              // intersected with the pool so we have valid Sleeper ids. Falls
              // back to the whole pool only if no salaries exist yet.
              const week = await getCurrentWeek();
              const elig = (await salaryEligibleIds(week)).filter(id => pool.byId[id]);
              targets = elig.length ? elig : ids;
              console.log(`  Scope: ${elig.length ? elig.length + ' salary-eligible player(s) (week ' + week + ')' : 'FULL pool (no salaries found)'}.`);
            }
            console.log(`  Sleeper: querying news for ${targets.length} player(s)${opts.test ? ' (TEST sample of 3)' : ''}…`);

            // Test mode: dump one raw response so the (undocumented) shape can
            // be confirmed / field paths finalized.
            if (opts.test && targets.length) {
              const rawProbe = await postJson(SLEEPER_GRAPHQL, {
                operationName: 'get_player_news',
                query: SLEEPER_NEWS_QUERY,
                variables: { sport: 'nfl', player_id: String(targets[0]), limit: SLEEPER_NEWS_LIMIT }
              }, { 'User-Agent': 'fantasyrefresh' }).catch(e => ({ _error: e.message }));
              console.log('  [TEST] raw Sleeper response for player ' + targets[0] + ' (' + (pool.byId[targets[0]] && pool.byId[targets[0]].name) + '):');
              console.log('  ' + JSON.stringify(rawProbe).slice(0, 1200));
            }

            // Run the per-player lookups in parallel BATCHES rather than one at
            // a time. Sequentially, ~450 requests at a few hundred ms each took
            // minutes; batching cuts that to well under a minute while staying
            // gentle on Sleeper.
            const out = [];
            let ok = 0, empty = 0, failed = 0;
            for (let i = 0; i < targets.length; i += SLEEPER_CONCURRENCY) {
              const chunk = targets.slice(i, i + SLEEPER_CONCURRENCY);
              const results = await Promise.all(chunk.map(id =>
                sleeperNewsForPlayer(id).then(items => ({ items })).catch(e => ({ err: e.message }))
              ));
              results.forEach(r => {
                if (r.err) { failed++; if (failed <= 3) console.error('    Sleeper news failed: ' + r.err); }
                else if (r.items.length) { ok++; out.push(...r.items); }
                else empty++;
              });
            }
            console.log(`  Sleeper: ${ok} player(s) with news, ${empty} with none, ${failed} errored; ${out.length} item(s) total.`);
            if (!out.length && failed > 0) {
              console.error('  ⚠️  Sleeper returned no usable items and errored — the undocumented query may need adjusting. Run with test_only=true and check the raw dump above, then update SLEEPER_NEWS_QUERY / field paths.');
            }
            return out;
          }

          // ════════════════════════════════════════════════════════════════
          //  PROVIDER: ROTOWIRE  (drop-in for later — needs ROTOWIRE_API_KEY)
          // ════════════════════════════════════════════════════════════════
          // Documented pattern: https://api.rotowire.com/{sport}/news.php?key=...
          // Confirm exact field names against your Rotowire account docs on the
          // first test_only run; they're isolated in the mapping below.
          async function fetchRotowire(pool, opts) {
            const key = process.env.ROTOWIRE_API_KEY;
            if (!key) {
              console.error('  ⚠️  NEWS_PROVIDER=rotowire but ROTOWIRE_API_KEY secret is not set — nothing fetched.');
              return [];
            }
            const url = `https://api.rotowire.com/Football/News.php?key=${encodeURIComponent(key)}&format=json`;
            let data;
            try { data = await getJson(url); }
            catch(e) { console.error('  Rotowire fetch failed: ' + e.message); return []; }
            if (opts.test) console.log('  [TEST] raw Rotowire response (first 1000 chars): ' + JSON.stringify(data).slice(0, 1000));
            const rows = (data && (data.Updates || data.updates || data.items)) || [];
            return rows.map(r => {
              const publishedMs = Date.parse(r.Date || r.date || r.timestamp || '') || Date.now();
              return {
                providerId: 'rw_' + (r.ID || r.id || (r.Player + '_' + publishedMs)),
                playerId: null,                                   // Rotowire is name-matched into the pool
                playerName: r.Player || r.player || r.name || '',
                team: r.Team || r.team || '',
                title: r.Headline || r.headline || r.Notes || '',
                analysis: r.Analysis || r.analysis || r.Notes || '',
                link: r.URL || r.url || '',
                image: '',
                publishedMs,
                source: 'rotowire'
              };
            });
          }

          // ════════════════════════════════════════════════════════════════
          //  PROVIDER: FANTASYPROS  (previous source — retained fallback)
          // ════════════════════════════════════════════════════════════════
          async function fetchFantasyPros(pool, opts) {
            const key = process.env.FANTASYPROS_API_KEY;
            if (!key) { console.error('  ⚠️  NEWS_PROVIDER=fantasypros but FANTASYPROS_API_KEY is not set.'); return []; }
            let data;
            try { data = await getJson('https://api.fantasypros.com/public/v2/json/nfl/news?limit=100', { 'x-api-key': key }); }
            catch(e) { console.error('  FantasyPros fetch failed (likely rate-limited): ' + e.message); return []; }
            const rows = (data && data.items) || [];
            if (opts.test) console.log('  [TEST] FantasyPros returned ' + rows.length + ' item(s).');
            // Titles lead with the player's full name; the pool's normalized
            // index resolves them. Name carried through for the name-match core.
            return rows.map(r => {
              const created = (r.created || '').replace(' ', 'T') + 'Z';
              const publishedMs = Date.parse(created) || Date.now();
              // best-effort leading name off the title front
              const words = (r.title || '').trim().split(/\s+/);
              const nameWords = [];
              for (const w of words) { if (w.startsWith('(')) break; const c = w.replace(/[.,']/g,''); if (c && /^[A-Z]/.test(c)) nameWords.push(w); else break; }
              return {
                providerId: 'fp_' + (r.id || sanitizeKey((r.title||'').toLowerCase()).slice(0,80)),
                playerId: null,
                playerName: nameWords.join(' '),
                team: r.team_id || '',
                title: r.title || '',
                analysis: r.content || r.analysis || '',
                link: r.link || '',
                image: r.image || '',
                publishedMs,
                source: 'fantasypros.com'
              };
            });
          }

          const PROVIDERS = { sleeper: fetchSleeper, rotowire: fetchRotowire, fantasypros: fetchFantasyPros };

          // ── Resolve a normalized item to a pool player key ───────────────
          // Prefer exact Sleeper id; else normalized name. Unresolved items are
          // still archived under a best-effort name, tagged unconfirmed.
          function resolvePlayer(item, pool) {
            if (item.playerId && pool.byId[item.playerId]) {
              const r = pool.byId[item.playerId];
              return { key: sanitizeKey(r.name.toLowerCase()), name: r.name, team: r.team, confirmed: true };
            }
            if (item.playerName) {
              const r = pool.byName[normName(item.playerName)];
              if (r) return { key: sanitizeKey(r.name.toLowerCase()), name: r.name, team: r.team, confirmed: true };
              return { key: sanitizeKey(item.playerName.toLowerCase()), name: item.playerName, team: item.team || '', confirmed: false };
            }
            return null;
          }

          // ── Prune a player's stale items (the anti-Golden fix) ───────────
          async function prunePlayer(playerKey, now) {
            const existing = await firebaseGet(`/nflNewsArchive/${playerKey}.json`).catch(() => null);
            if (!existing) return 0;
            const entries = Object.entries(existing);
            // oldest-first list of keys to drop: past the window, or beyond the cap
            const dated = entries.map(([k, v]) => ({ k, ms: (v && (v.publishedAt || v.archivedAt)) || 0 }))
                                 .sort((a, b) => b.ms - a.ms);
            const toDelete = [];
            dated.forEach((e, i) => {
              if (e.ms < now - PRUNE_MS) toDelete.push(e.k);       // too old
              else if (i >= MAX_ITEMS_PER_PLAYER) toDelete.push(e.k); // beyond cap
            });
            if (TEST_ONLY) return toDelete.length;
            for (const k of toDelete) { await firebaseDelete(`/nflNewsArchive/${playerKey}/${k}.json`).catch(() => {}); }
            return toDelete.length;
          }

          // ── MAIN ─────────────────────────────────────────────────────────
          (async () => {
            if (!TEST_ONLY && !FB_TOKEN) { console.error('❌ FIREBASE_AUTH_TOKEN required for a real sweep.'); process.exit(1); }
            const fetchFn = PROVIDERS[PROVIDER];
            if (!fetchFn) { console.error(`❌ Unknown NEWS_PROVIDER "${PROVIDER}". Use sleeper | rotowire | fantasypros.`); process.exit(1); }

            console.log(`=== News sweep | provider: ${PROVIDER} | mode: ${TEST_ONLY ? 'TEST (no writes)' : 'REAL'} ===`);
            const pool = await loadPool();
            console.log(`Player pool: ${Object.keys(pool.byId).length} players.`);

            const items = await fetchFn(pool, { test: TEST_ONLY });
            console.log(`Provider returned ${items.length} normalized item(s).`);

            let added = 0, confirmed = 0, unconfirmed = 0, skippedNoPlayer = 0, pruned = 0;
            const now = Date.now();

            // Group items by resolved player so each player is written in ONE
            // merged PATCH instead of a GET+PUT per item. The same providerId
            // always maps to the same item key, so a re-run overwrites the
            // identical record (natural dedup) — no per-item existence check
            // needed, which is what made a real run slow.
            const byPlayer = {}; // key -> { name, updates: { itemKey: record } }
            for (const item of items) {
              const who = resolvePlayer(item, pool);
              if (!who || !who.key) { skippedNoPlayer++; continue; }
              who.confirmed ? confirmed++ : unconfirmed++;
              const itemKey = sanitizeKey(item.providerId).replace(/\s+/g, '_').slice(0, 120);
              const record = {
                title: item.title, analysis: item.analysis || '',
                link: item.link || '', image: item.image || '',
                source: item.source, playerName: who.name, team: who.team,
                confirmedMatch: who.confirmed,
                publishedAt: item.publishedMs,   // real publish time (canonical)
                archivedAt: item.publishedMs      // kept equal for backward-compat with existing readers
              };
              if (!byPlayer[who.key]) byPlayer[who.key] = { name: who.name, updates: {} };
              byPlayer[who.key].updates[itemKey] = record;
              added++;
            }

            const playerKeys = Object.keys(byPlayer);
            if (TEST_ONLY) {
              playerKeys.slice(0, 40).forEach(k => {
                Object.values(byPlayer[k].updates).forEach(r => {
                  console.log(`  [TEST] would add for ${r.playerName}${r.confirmedMatch ? '' : ' (unconfirmed)'}: "${r.title}" — ${new Date(r.publishedAt).toISOString()}`);
                });
              });
            } else {
              // One merged PATCH per player, in parallel batches.
              for (let i = 0; i < playerKeys.length; i += SLEEPER_CONCURRENCY) {
                const chunk = playerKeys.slice(i, i + SLEEPER_CONCURRENCY);
                await Promise.all(chunk.map(k =>
                  firebaseWrite('PATCH', `/nflNewsArchive/${k}.json`, byPlayer[k].updates)
                    .catch(e => console.error(`    Failed to write ${byPlayer[k].name}: ${e.message}`))
                ));
              }
            }

            // Prune every player we wrote to (parallel batches), so refreshed
            // players never keep stale notes. Untouched players are also
            // protected on the read side by the draft card's recency filter.
            for (let i = 0; i < playerKeys.length; i += SLEEPER_CONCURRENCY) {
              const chunk = playerKeys.slice(i, i + SLEEPER_CONCURRENCY);
              const counts = await Promise.all(chunk.map(k => prunePlayer(k, now).catch(() => 0)));
              counts.forEach(c => { pruned += c; });
            }

            console.log(`\n✓ Sweep complete — provider ${PROVIDER}, ${items.length} item(s): ${added} ${TEST_ONLY ? 'would-add' : 'written'} across ${playerKeys.length} player(s), ${confirmed} confirmed / ${unconfirmed} unconfirmed, ${skippedNoPlayer} unmatchable, ${pruned} stale ${TEST_ONLY ? 'would be ' : ''}pruned.`);
          })().catch(e => {
            console.error('❌ Sweep failed:', (e && e.message) ? e.message : e);
            process.exit(1);
          });
          SCRIPT
