name: One-Time Diagnostic — Test New Formula Against Real Roster

# ONE-TIME USE — delete this file after running it once.
# Pulls real, current week 1 projections for the exact 9 players from
# the reported "too good" roster, then prices them under the current
# linear formula and several candidate new formulas (raised floor +
# concave power curve), to directly verify which change actually
# prevents this specific roster from fitting under the $60,000 cap.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Test candidate formulas against the real, reported roster
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const WORKER = 'https://fantasy-refresh-news.mtriedel.workers.dev';

          const ROSTER = [
            { name: 'Baker Mayfield', pos: 'QB' },
            { name: 'Kenneth Walker', pos: 'RB' },
            { name: 'Saquon Barkley', pos: 'RB' },
            { name: 'Christian Watson', pos: 'WR' },
            { name: 'DK Metcalf', pos: 'WR' },
            { name: 'Luther Burden', pos: 'WR' },
            { name: 'Isaiah Likely', pos: 'TE' },
            { name: 'Bijan Robinson', pos: 'RB' }, // rostered in FLEX
            { name: 'TEN', pos: 'DEF' },
          ];

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          function normalizeNameForMatch(name) {
            return (name || '').toLowerCase().replace(/[^a-z]/g, '');
          }

          function priceLinear(proj, mult, min, max) {
            let sal = Math.ceil((proj * mult) / 100) * 100;
            return Math.max(min, Math.min(max, sal));
          }

          function priceCurve(proj, maxProjAtPos, ceiling, floor, power) {
            const ratio = maxProjAtPos > 0 ? Math.min(1, proj / maxProjAtPos) : 0;
            const scaled = Math.pow(ratio, power);
            const sal = floor + (ceiling - floor) * scaled;
            return Math.round(sal / 100) * 100;
          }

          async function main() {
            const proj = await fetchJson(`${WORKER}/projections?week=1&season=2026`);
            const players = proj.players || [];

            // Find each roster player's real projection
            const matched = ROSTER.map(r => {
              const target = normalizeNameForMatch(r.name);
              const found = players.find(p => p.pos === r.pos && normalizeNameForMatch(p.name).includes(target));
              return { ...r, proj: found ? found.proj : null, realName: found ? found.name : '(not found)' };
            });

            console.log('=== Real projections found for this roster ===');
            matched.forEach(p => console.log(`  ${p.pos} ${p.realName}: ${p.proj}`));

            // Real max projection per position this week (needed for the curve formula)
            const maxByPos = {};
            ['QB','RB','WR','TE','DEF'].forEach(pos => {
              const atPos = players.filter(p => p.pos === pos && p.proj > 0);
              maxByPos[pos] = atPos.length ? Math.max(...atPos.map(p => p.proj)) : 0;
            });

            const CURRENT_MULT = { QB: 475, RB: 515, WR: 575, TE: 520, DEF: 465 };
            const CEIL = { QB: 9400, RB: 10700, WR: 11300, TE: 7400, DEF: 5000 };
            const OLD_MIN = 4500, OLD_MAX = 11300;
            const NEW_FLOOR = { QB: 6000, RB: 6000, WR: 6000, TE: 5500, DEF: 4200 };

            console.log('\n=== Pricing this exact roster under each formula ===');
            [
              { label: 'CURRENT (linear, post-recalibration)', fn: p => priceLinear(p.proj, CURRENT_MULT[p.pos], OLD_MIN, OLD_MAX) },
              { label: 'Curve power=0.6, raised floor', fn: p => priceCurve(p.proj, maxByPos[p.pos], CEIL[p.pos], NEW_FLOOR[p.pos], 0.6) },
              { label: 'Curve power=0.45, raised floor', fn: p => priceCurve(p.proj, maxByPos[p.pos], CEIL[p.pos], NEW_FLOOR[p.pos], 0.45) },
              { label: 'Curve power=0.35, raised floor', fn: p => priceCurve(p.proj, maxByPos[p.pos], CEIL[p.pos], NEW_FLOOR[p.pos], 0.35) },
            ].forEach(({ label, fn }) => {
              console.log(`\n--- ${label} ---`);
              let total = 0;
              matched.forEach(p => {
                if (p.proj == null) { console.log(`  ${p.realName}: NOT FOUND, skipped`); return; }
                const price = fn(p);
                total += price;
                console.log(`  ${p.realName} (${p.pos}, ${p.proj} proj): $${price.toLocaleString()}`);
              });
              console.log(`  TOTAL: $${total.toLocaleString()}  (cap: $60,000 — ${total > 60000 ? 'OVER CAP, forces real changes' : 'fits, ' + (60000-total).toLocaleString() + ' remaining'})`);
            });
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
