name: One-Time Fix — Remove Stale PackrBackr Duplicate Entry

# ONE-TIME USE — delete this file after it runs successfully once.
#
# Confirmed directly: two different UIDs share the team name
# "PackrBackr" in Week 1's real data.
#   - ztcSWJwZQrUyh7bywBb1DIUWzgj2: real, active member, score 7.8
#   - hMYL8PRpt2P59bKVmLWtC8rAfyn1: NOT in /leagues/fr_refresh26/members
#     at all — a stale, orphaned entry, score 5.6
# 7.8 + 5.6 = 13.4, exactly matching the inflated "Season Total"
# reported. Every place in the app that sums scores by team name
# instead of by uid (season wrap, multi-team compare charts, season
# rank) silently double-counts whenever two entries share a name —
# this removes the confirmed stale entry causing it, without
# touching the real PackrBackr entry or any other team.
#
# Safety: re-verifies the target uid is still absent from members
# and still has team name "PackrBackr" immediately before deleting,
# refusing to proceed if anything about that no longer matches what
# was confirmed.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to delete the stale entry from Week 1'
        required: true
        default: 'NO'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Remove stale PackrBackr duplicate
        if: ${{ github.event.inputs.confirm == 'YES' }}
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;
          const WEEK = 1;
          const STALE_UID = 'hMYL8PRpt2P59bKVmLWtC8rAfyn1';

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }
          function firebaseDelete(path) {
            return new Promise((resolve, reject) => {
              const url = new URL(fbAuth(`${FB_URL}${path}`));
              const req = https.request({
                hostname: url.hostname, path: url.pathname + url.search, method: 'DELETE'
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => {
                  if (res.statusCode < 200 || res.statusCode >= 300) reject(new Error(`Delete failed: HTTP ${res.statusCode} — ${d}`));
                  else resolve(d);
                });
              });
              req.on('error', reject);
              req.end();
            });
          }

          async function main() {
            const entry = await fetchJson(`/leagues/${LEAGUE_ID}/season/${SEASON}/${WEEK}/${STALE_UID}.json`).catch(() => null);
            if (!entry) {
              console.log(`No entry found at that uid — already gone, or nothing to do.`);
              return;
            }
            console.log(`Found target entry: team="${entry.team}" score=${entry.score}`);

            if ((entry.team || '').toLowerCase() !== 'packrbackr') {
              console.log(`⚠️  Team name is "${entry.team}", not "PackrBackr" as confirmed earlier — refusing to delete. Something changed since the diagnostic ran.`);
              return;
            }

            const memberCheck = await fetchJson(`/leagues/${LEAGUE_ID}/members/${STALE_UID}.json`).catch(() => null);
            if (memberCheck) {
              console.log(`⚠️  This uid now exists in /members (teamName="${memberCheck.teamName}") — no longer orphaned as confirmed earlier. Refusing to delete.`);
              return;
            }

            await firebaseDelete(`/leagues/${LEAGUE_ID}/season/${SEASON}/${WEEK}/${STALE_UID}.json`);
            console.log(`\n✓ Deleted stale entry (uid=${STALE_UID}, team="${entry.team}", score=${entry.score}) from Week ${WEEK}.`);
            console.log(`  The real PackrBackr entry (uid=ztcSWJwZQrUyh7bywBb1DIUWzgj2, score=7.8) was not touched.`);
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT

      - name: Skipped - confirmation not provided
        if: ${{ github.event.inputs.confirm != 'YES' }}
        run: echo "Skipped — re-run with confirm=YES to actually delete the stale entry."
