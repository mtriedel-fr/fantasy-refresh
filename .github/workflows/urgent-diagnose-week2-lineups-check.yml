name: URGENT Diagnostic — Has Anyone Drafted Week 2 Yet

# ONE-TIME USE — delete this file after running it once.
# Checks whether any real Week 2 lineups have actually been
# submitted yet - needed before safely regenerating salaries with
# the correct formula, since that could break already-drafted
# lineups if player ids or salary references changed underneath
# them. Read-only.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check for real Week 2 lineups
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;
          const WEEK = 2;

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            const lineups = await fetchJson(`/leagues/${LEAGUE_ID}/lineups/${SEASON}/week${WEEK}.json`).catch(() => null);
            if (!lineups) { console.log('No real Week 2 lineups exist at all — safe to regenerate.'); return; }

            const entries = Object.entries(lineups);
            const withRealSlots = entries.filter(([, l]) => l && l.slots && Object.values(l.slots).filter(Boolean).length > 0);
            console.log(`Real lineup entries: ${entries.length}`);
            console.log(`With real, populated slots (actually drafted): ${withRealSlots.length}`);
            withRealSlots.forEach(([uid, l]) => {
              console.log(`  ${l.team || uid}: ${Object.values(l.slots).filter(Boolean).length} slots, submitted=${l.submitted ? new Date(l.submitted).toISOString() : 'n/a'}`);
            });
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
