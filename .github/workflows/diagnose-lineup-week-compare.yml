name: One-Time Diagnostic — Compare Week 2 vs Week 3 Lineup Data

# ONE-TIME USE — delete this file after running it once.
# Checks the real, stored lineup data directly for every league member,
# comparing week 2 against week 3 - to find out whether week 3's data
# genuinely duplicates week 2's (a real data-level issue) or whether
# week 3 is empty/different (pointing to a client-side display bug
# instead, not the underlying data itself).

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Compare stored week 2 vs week 3 lineups
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const LEAGUE_ID = 'fr_nth60cij'; // preseason league

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            const season = '2026P';
            const wk2 = await fetchJson(`${FB_URL}/leagues/${LEAGUE_ID}/lineups/${season}/week2.json`).catch(() => null);
            const wk3 = await fetchJson(`${FB_URL}/leagues/${LEAGUE_ID}/lineups/${season}/week3.json`).catch(() => null);

            const wk2Uids = wk2 ? Object.keys(wk2) : [];
            const wk3Uids = wk3 ? Object.keys(wk3) : [];
            console.log(`Week 2 lineups: ${wk2Uids.length} team(s)`);
            console.log(`Week 3 lineups: ${wk3Uids.length} team(s)\n`);

            const allUids = [...new Set([...wk2Uids, ...wk3Uids])];
            for (const uid of allUids) {
              const l2 = wk2 ? wk2[uid] : null;
              const l3 = wk3 ? wk3[uid] : null;
              console.log(`=== ${uid} ===`);
              console.log(`  Week 2 team: ${l2 ? l2.team : '(none)'}, slots: ${l2 && l2.slots ? Object.keys(l2.slots).length : 0}`);
              console.log(`  Week 3 team: ${l3 ? l3.team : '(none)'}, slots: ${l3 && l3.slots ? Object.keys(l3.slots).length : 0}`);
              if (l2 && l3 && l2.slots && l3.slots) {
                const identical = JSON.stringify(l2.slots) === JSON.stringify(l3.slots);
                console.log(`  Slots identical: ${identical}`);
                if (identical) {
                  console.log('  ⚠️  Week 3 data is a genuine duplicate of week 2.');
                }
              }
              console.log('');
            }
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
