name: One-Time Diagnostic — Check Real draftLockedUntil Value

# ONE-TIME USE — delete this file after running it once.
# Checks the real, currently-stored draftLockedUntil value directly -
# the countdown calculation logic itself checks out fine, so this
# checks whether the stored value actually matches what was intended
# (1 day before the real Sept 9 kickoff), or whether something else is
# actually stored there.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check the real stored value
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            const value = await fetchJson(`${FB_URL}/leagues/fr_refresh26/settings/draftLockedUntil.json`).catch(() => null);
            console.log('Real, currently-stored value:', value);
            if (value != null) {
              console.log('As a date:', new Date(value).toISOString());
              const now = Date.now();
              const msRemaining = value - now;
              const daysRemaining = Math.max(0, Math.ceil(msRemaining / (24*60*60*1000)));
              console.log('Right now (server time):', new Date(now).toISOString());
              console.log('Days remaining, computed the same way the popup does:', daysRemaining);
            } else {
              console.log('No value found at all — this would make isDraftLocked() always return false.');
            }
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
