name: One-Time Diagnostic — Check A Real, Confirmed Blocked Kick Game

# ONE-TIME USE — delete this file after running it once.
# Checks a real, well-documented, confirmed blocked field goal game
# directly (Eagles blocked a Rams FG attempt and returned it for a TD,
# Sept 21 2025, per real news coverage) - to definitively resolve
# whether blockedFG actually populates with a real, non-zero value when
# a block genuinely happened, or stays at zero regardless of what
# actually occurred in the game.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check the real, confirmed blocked-kick game directly
        env:
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const T01_KEY = process.env.TANK01_KEY;
          const T01_HOST = 'tank01-nfl-live-in-game-real-time-statistics-nfl.p.rapidapi.com';

          // Real, confirmed game: Eagles blocked a Rams FG attempt
          // (Joshua Karty) and returned it for a TD, Sept 21 2025,
          // Eagles 33 - Rams 26, played in Philadelphia. Trying a
          // couple of plausible ID formats since the exact one isn't
          // confirmed.
          const CANDIDATES = ['20250921_LAR@PHI', '20250921_LA@PHI'];

          function t01(path) {
            return new Promise((resolve, reject) => {
              https.get({
                hostname: T01_HOST, path, headers: {
                  'X-RapidAPI-Key': T01_KEY, 'X-RapidAPI-Host': T01_HOST
                }
              }, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            for (const gid of CANDIDATES) {
              try {
                const bs = await t01(`/getNFLBoxScore?gameID=${gid}&fantasyPoints=true&PPRScoring=true`);
                if (!bs.body) { console.log(`${gid}: no body - ${JSON.stringify(bs).slice(0,150)}`); continue; }
                console.log(`\n${gid}: FOUND — real score away(${bs.body.away})=${bs.body.awayPts}, home(${bs.body.home})=${bs.body.homePts}, status=${bs.body.gameStatus}`);

                const ts = bs.body.teamStats || {};
                console.log('Real teamStats.blockedFG values:');
                console.log(`  home (${ts.home && ts.home.teamAbv}): blockedFG=${ts.home && ts.home.blockedFG}, blockedPunt=${ts.home && ts.home.blockedPunt}, blockedXP=${ts.home && ts.home.blockedXP}`);
                console.log(`  away (${ts.away && ts.away.teamAbv}): blockedFG=${ts.away && ts.away.blockedFG}, blockedPunt=${ts.away && ts.away.blockedPunt}, blockedXP=${ts.away && ts.away.blockedXP}`);

                console.log('\nReal scoring plays (to directly confirm the blocked-FG-return TD is even in this data):');
                (bs.body.scoringPlays || []).forEach(p => console.log(`  [${p.team}] ${p.score}`));
              } catch(e) {
                console.log(`${gid}: fetch failed - ${e.message}`);
              }
            }
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
