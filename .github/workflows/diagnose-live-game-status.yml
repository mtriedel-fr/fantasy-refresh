name: One-Time Diagnostic — Check Live Game Status Data

# ONE-TIME USE — delete this file after running it once.
# Checks the real, current liveGameStatus data for the preseason league
# under both possible season-key paths, to confirm whether the draft
# page is showing stale, leftover data from before today's backend fix.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check real liveGameStatus data
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function check(label, path) {
            const data = await fetchJson(FB_URL + path + '.json').catch(e => ({ __error: e.message }));
            console.log(`\n=== ${label} (${path}) ===`);
            console.log(JSON.stringify(data, null, 2));
          }

          async function main() {
            await check('2026P / Preseason_wk3', '/liveGameStatus/2026P/Preseason_wk3');
            await check('2026 / Preseason_wk3', '/liveGameStatus/2026/Preseason_wk3');
            await check('2026P / Preseason_wk2 (prior week, checking for leftover data)', '/liveGameStatus/2026P/Preseason_wk2');
            await check('2026 / Preseason_wk2 (prior week, checking for leftover data)', '/liveGameStatus/2026/Preseason_wk2');
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
