name: One-Time Diagnostic — Test Shared Cross-Position Rate

# ONE-TIME USE — delete this file after running it once.
# Tests a single, shared $/point rate calibrated off the single
# highest real projection across ALL positions combined (not each
# position independently), applied with a gentler exponent (0.6), so
# each position's ceiling falls out naturally from its own top
# player's real projection - matching real DraftKings' pattern where
# RB prices above WR because Gibbs actually projects higher than
# Chase, rather than each position getting an arbitrary, independent
# target ceiling regardless of the underlying numbers.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Test a shared cross-position rate
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;
          const WEEK = 1;

          const SAL_MAX = 11300; // this app's existing absolute ceiling
          const TEST_EXPONENT = 0.6;
          const TEST_FLOOR = 2400;

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            const salaryData = await fetchJson(`/leagues/${LEAGUE_ID}/salaries/${SEASON}/week${WEEK}.json`).catch(() => null);
            if (!salaryData || !salaryData.players) { console.log('No real salary data found.'); return; }

            const players = Object.values(salaryData.players).filter(p => p.proj > 0);
            const positions = ['QB', 'RB', 'WR', 'TE', 'DEF'];

            // ONE shared rate, calibrated off the single highest real
            // projection across every position combined.
            const globalMaxProj = Math.max(...players.map(p => p.proj));
            const globalMaxPlayer = players.find(p => p.proj === globalMaxProj);
            const sharedMult = SAL_MAX / Math.pow(globalMaxProj, TEST_EXPONENT);

            console.log(`Global top projection: ${globalMaxPlayer.name} (${globalMaxPlayer.pos}) at ${globalMaxProj.toFixed(1)} pts -> calibrated to hit exactly $${SAL_MAX}\n`);

            positions.forEach(pos => {
              const posPlayers = players.filter(p => p.pos === pos);
              if (!posPlayers.length) return;

              const rawValues = posPlayers.map(p => ({
                name: p.name,
                proj: p.proj,
                raw: Math.pow(p.proj, TEST_EXPONENT) * sharedMult
              })).sort((a, b) => b.raw - a.raw);

              const clamped = rawValues.filter(v => v.raw < TEST_FLOOR).length;
              const pct = (clamped / posPlayers.length * 100).toFixed(1);
              const top = rawValues[0];

              console.log(`=== ${pos} (${posPlayers.length} players) ===`);
              console.log(`  Top player: ${top.name} — $${top.raw.toFixed(0)} (${top.proj.toFixed(1)} pts)`);
              console.log(`  Below $${TEST_FLOOR} floor: ${clamped} of ${posPlayers.length} (${pct}%)`);
              console.log('');
            });
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
