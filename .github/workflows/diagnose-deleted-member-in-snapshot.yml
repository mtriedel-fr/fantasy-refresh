name: One-Time Diagnostic — Confirm Deleted Member Still In Snapshot

# ONE-TIME USE — delete this file after running it once.
# Confirms whether "Game, Blouses" is actually gone/inactive in the
# real member list, and whether the standings snapshot still has a
# stale entry for them - confirming the theory that deletion
# succeeded but the snapshot just hasn't refreshed since. Read-only.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check real member state vs snapshot
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;
          const WEEK = 1;
          const TARGET_NAME = 'game, blouses';

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            const members = await fetchJson(`/leagues/${LEAGUE_ID}/members.json`).catch(() => ({})) || {};
            const match = Object.entries(members).find(([, m]) => m && m.teamName && m.teamName.toLowerCase() === TARGET_NAME);
            console.log('Real member record:', match ? JSON.stringify(match[1]) : '(no longer exists in /members at all)');

            const snapshot = await fetchJson(`/leagues/${LEAGUE_ID}/standings/${SEASON}/week${WEEK}.json`).catch(() => null);
            if (snapshot) {
              console.log(`\nSnapshot last written: ${new Date(snapshot.updatedAt).toISOString()}`);
              const snapEntry = (snapshot.entries || []).find(e => e.name && e.name.toLowerCase() === TARGET_NAME);
              console.log('Snapshot entry for this team:', snapEntry ? JSON.stringify(snapEntry) : '(not present)');
            } else {
              console.log('No snapshot found.');
            }
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
