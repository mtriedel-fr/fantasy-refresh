name: URGENT Diagnostic — Current Week State And Salary Generation History

# ONE-TIME USE — delete this file after running it once.
# Checks the real, current season meta.week, whether Week 2 and
# Week 3 genuinely have real salaries already generated, their real
# generation timestamps, and the current draftLockedUntil value -
# needed to understand a confusing report (the auto-open workflow
# currently thinks "next week" is Week 1, which couldn't be what
# opened Week 2 or 3). Read-only.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check current week state and salary history
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            console.log('Current real time:', new Date().toISOString());

            const seasonMeta = await fetchJson(`/leagues/${LEAGUE_ID}/season/${SEASON}/meta.json`).catch(() => null);
            console.log('\nReal season/meta:', JSON.stringify(seasonMeta));

            const settings = await fetchJson(`/leagues/${LEAGUE_ID}/settings.json`).catch(() => null);
            console.log('Real settings.draftLockedUntil:', settings ? settings.draftLockedUntil : '(no settings found)');
            console.log('Real settings.draftLockedUntil as date:', settings && settings.draftLockedUntil ? new Date(settings.draftLockedUntil).toISOString() : 'n/a');

            for (const week of [1, 2, 3, 4]) {
              const meta = await fetchJson(`/leagues/${LEAGUE_ID}/salaries/${SEASON}/week${week}/meta.json`).catch(() => null);
              if (meta) {
                console.log(`\nWeek ${week} salary meta: count=${meta.count}, generated=${meta.generated ? new Date(meta.generated).toISOString() : 'n/a'}, locked=${meta.locked}`);
              } else {
                console.log(`\nWeek ${week} salary meta: none found — not generated.`);
              }
            }
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
