name: One-Time Diagnostic — Test Gentler Exponent Candidates

# ONE-TIME USE — delete this file after running it once.
# Tests lower SALARY_EXPONENT values (0.85 current, plus 0.70 / 0.65 /
# 0.60 / 0.55) against the real Week 1 projections, each paired with
# a $2,400 floor (the real DraftKings-proportional value), to see
# whether a gentler curve - not just a lower floor - is what actually
# fixes the pile-up, since the floor tests alone showed the floor
# isn't the whole story (41.6% of TE still clamped even at the lowest
# floor tested).

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Test gentler exponent values against real data
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;
          const WEEK = 1;

          const TARGET_CEILING = { QB: 9400, RB: 10700, WR: 11300, TE: 7400, DEF: 6900 };
          const TEST_FLOOR = 2400;
          const CANDIDATE_EXPONENTS = [0.85, 0.70, 0.65, 0.60, 0.55];

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            const salaryData = await fetchJson(`/leagues/${LEAGUE_ID}/salaries/${SEASON}/week${WEEK}.json`).catch(() => null);
            if (!salaryData || !salaryData.players) { console.log('No real salary data found.'); return; }

            const players = Object.values(salaryData.players);
            const positions = ['RB', 'WR', 'TE'];

            positions.forEach(pos => {
              const posPlayers = players.filter(p => p.pos === pos && p.proj > 0);
              if (!posPlayers.length) return;

              const maxProj = Math.max(...posPlayers.map(p => p.proj));

              console.log(`=== ${pos} (${posPlayers.length} players, floor fixed at $${TEST_FLOOR}) ===`);
              CANDIDATE_EXPONENTS.forEach(exp => {
                const mult = TARGET_CEILING[pos] / Math.pow(maxProj, exp);
                const rawValues = posPlayers.map(p => Math.pow(p.proj, exp) * mult);
                const clamped = rawValues.filter(v => v < TEST_FLOOR).length;
                const pct = (clamped / posPlayers.length * 100).toFixed(1);

                // Median salary as a sanity check on overall pricing feel
                const sorted = rawValues.slice().sort((a, b) => a - b);
                const median = sorted[Math.floor(sorted.length / 2)];

                console.log(`  Exponent ${exp}: ${clamped} of ${posPlayers.length} clamp (${pct}%)  |  median raw: $${median.toFixed(0)}`);
              });
              console.log('');
            });
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
