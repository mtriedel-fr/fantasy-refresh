name: One-Time Cleanup — Clear Week 1 Rosters (Salary Recalibration)

# ONE-TIME USE — delete this file after running it once.
# Clears every member's already-submitted week 1 lineup for the real
# league, since the salary recalibration changes what those lineups
# were priced against — a roster built under the old, undervalued
# pricing could now exceed the cap, or simply reflect stale prices
# that no longer match what's actually shown in the draft picker.
#
# Only touches /leagues/fr_refresh26/lineups/2026/week1 — does not
# touch salaries, schedule, locks, or any other week.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to actually clear week 1 rosters'
        required: true
        default: ''

jobs:
  clear-rosters:
    runs-on: ubuntu-latest
    steps:
      - name: Preview, then clear, week 1 lineups
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          node << 'SCRIPT'
          const https = require('https');

          const FB_URL   = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const CONFIRM  = process.env.CONFIRM;
          const PATH     = '/leagues/fr_refresh26/lineups/2026/week1';

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          function firebaseDelete(path) {
            return new Promise((resolve, reject) => {
              const fullPath = fbAuth(FB_URL + path + '.json');
              const u = new URL(fullPath);
              const req = https.request({
                hostname: u.hostname, path: u.pathname + u.search, method: 'DELETE'
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) resolve(d);
                  else reject(new Error(`DELETE rejected (HTTP ${res.statusCode}) — ${d.slice(0,200)}`));
                });
              });
              req.on('error', reject);
              req.end();
            });
          }

          async function main() {
            const lineups = await fetchJson(FB_URL + PATH + '.json').catch(() => null);

            if (!lineups) {
              console.log('No week 1 lineups exist yet — nothing to clear.');
              return;
            }

            const uids = Object.keys(lineups);
            console.log(`Found ${uids.length} submitted week 1 lineup(s):\n`);
            uids.forEach(uid => {
              const l = lineups[uid];
              const filled = l.slots ? Object.values(l.slots).filter(Boolean).length : 0;
              console.log(`  ${l.team || uid}: ${filled} slot(s) filled, submitted=${l.submitted ? new Date(l.submitted).toISOString() : 'not marked submitted'}`);
            });

            if (CONFIRM !== 'YES') {
              console.log('\n⚠️  Confirm input was not "YES" — nothing was deleted. Set confirm=YES and re-run to actually clear these.');
              return;
            }

            await firebaseDelete(PATH);
            console.log(`\n✅ Cleared ${PATH} — all ${uids.length} team(s) now need to re-draft week 1 with the recalibrated salaries.`);
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
