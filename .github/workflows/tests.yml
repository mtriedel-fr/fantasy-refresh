name: Tests

# Automatic checks on scoring and pricing rules. Runs on every pull request;
# a red ❌ on the PR means a change broke something that worked before.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --test tests/*.test.js
