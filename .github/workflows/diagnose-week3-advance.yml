name: One-Time Diagnostic — Check Week 3 Advance State

# ONE-TIME USE — delete this file after running it once.
# Checks the real, current backend state for the preseason league's
# week-advance mechanism directly - meta.week/allFinal, and the
# separate finalizedAt flag league.html's boot() actually reads - to
# find out whether the backend itself never marked week 3 as finished,
# or whether it did and this is a client-side issue instead.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check real week-advance state
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const LEAGUE_ID = 'fr_nth60cij';

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            console.log('Server time right now:', new Date().toISOString());

            const meta = await fetchJson(`${FB_URL}/leagues/${LEAGUE_ID}/season/2026P/meta.json`).catch(() => null);
            console.log('\n=== /season/2026P/meta ===');
            console.log(JSON.stringify(meta, null, 2));

            const finalizedAt3 = await fetchJson(`${FB_URL}/leagues/${LEAGUE_ID}/season/2026P/3/finalizedAt.json`).catch(() => null);
            console.log('\n=== /season/2026P/3/finalizedAt ===');
            console.log(finalizedAt3, finalizedAt3 ? `(${new Date(finalizedAt3).toISOString()})` : '');

            const week3 = await fetchJson(`${FB_URL}/leagues/${LEAGUE_ID}/season/2026P/3.json`).catch(() => null);
            const teamCount = week3 ? Object.keys(week3).filter(k => k !== 'finalizedAt').length : 0;
            console.log(`\n=== /season/2026P/3 — ${teamCount} team entries ===`);
            if (week3) {
              Object.entries(week3).forEach(([uid, entry]) => {
                if (uid === 'finalizedAt') return;
                console.log(`  ${entry.team}: status=${entry.status}, score=${entry.score}`);
              });
            }

            // Real, current liveGameStatus for week 3 - to confirm
            // whether every game is actually, genuinely final right now.
            const live = await fetchJson(`${FB_URL}/liveGameStatus/2026P/Preseason_wk3.json`).catch(() => null);
            console.log('\n=== /liveGameStatus/2026P/Preseason_wk3 ===');
            if (live && live.games) {
              const notFinal = Object.entries(live.games).filter(([gid, g]) => g.statusCode !== 2);
              console.log(`Total games tracked: ${Object.keys(live.games).length}, not yet final: ${notFinal.length}`);
              notFinal.forEach(([gid, g]) => console.log(`  ${gid}: statusCode=${g.statusCode}`));
            } else {
              console.log('No liveGameStatus data found.');
            }
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
