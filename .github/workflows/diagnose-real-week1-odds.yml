name: One-Time Diagnostic — Test Real Odds For Week 1 Regular Season

# ONE-TIME USE — delete this file after running it once.
# Tests Tank01's real getNFLBettingOdds endpoint directly (not through
# the worker) for real Week 1 regular-season dates, since preseason
# games are often not covered by sportsbooks at all. Shows the full,
# raw response structure to confirm whether real data exists here, and
# whether the field names the worker's parsing logic expects
# (sportsBooks, sportsBook, overUnder/total, spread/homeSpread) match
# what Tank01 actually returns.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Test real odds data for Week 1 regular season
        env:
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const T01_KEY = process.env.TANK01_KEY;
          const T01_HOST = 'tank01-nfl-live-in-game-real-time-statistics-nfl.p.rapidapi.com';

          function t01(path) {
            return new Promise((resolve, reject) => {
              https.get({
                hostname: T01_HOST, path, headers: {
                  'X-RapidAPI-Key': T01_KEY, 'X-RapidAPI-Host': T01_HOST
                }
              }, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            // Real, confirmed Week 1 regular-season dates (season
            // starts Sept 9, 2026 with NE@SEA; real Week 1 spans
            // through the following Monday).
            const dates = ['20260909', '20260910', '20260913', '20260914'];
            for (const d of dates) {
              console.log(`\n=== Tank01 /getNFLBettingOdds?gameDate=${d} ===`);
              try {
                const result = await t01(`/getNFLBettingOdds?gameDate=${d}`);
                const games = result.body || {};
                const gameIds = Object.keys(games);
                console.log(`${gameIds.length} game(s) with odds data found.`);
                if (gameIds.length) {
                  const firstId = gameIds[0];
                  console.log(`\nFull, raw structure for first game (${firstId}):`);
                  console.log(JSON.stringify(games[firstId], null, 2));
                }
              } catch(e) {
                console.log(`Failed: ${e.message}`);
              }
            }
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
