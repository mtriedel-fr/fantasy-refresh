name: One-Time Diagnostic — When Does Week 2 Actually Open

# ONE-TIME USE — delete this file after running it once.
# Computes the real, exact Week 2 open time from the real, cached
# NFL schedule, using the identical logic weekly-auto-open.yml
# itself uses. Read-only.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Compute real Week 2 open time
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const SEASON = 2026;

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          function getChicagoOffsetMinutes(approxDate) {
            const parts = new Intl.DateTimeFormat('en-US', {
              timeZone: 'America/Chicago', timeZoneName: 'shortOffset'
            }).formatToParts(approxDate);
            const offsetPart = parts.find(p => p.type === 'timeZoneName').value;
            const match = offsetPart.match(/GMT([+-]\d+)/);
            return match ? parseInt(match[1]) * 60 : -300;
          }

          function computeTargetOpenTime(kickoffMs) {
            const ctParts = new Intl.DateTimeFormat('en-US', {
              timeZone: 'America/Chicago', year: 'numeric', month: '2-digit', day: '2-digit'
            }).formatToParts(new Date(kickoffMs));
            const y = parseInt(ctParts.find(p => p.type === 'year').value);
            const m = parseInt(ctParts.find(p => p.type === 'month').value);
            const d = parseInt(ctParts.find(p => p.type === 'day').value);
            const dayBeforeMs = Date.UTC(y, m - 1, d - 1, 12, 0, 0);
            const offsetMin = getChicagoOffsetMinutes(new Date(dayBeforeMs));
            const dayBefore = new Date(dayBeforeMs);
            return Date.UTC(dayBefore.getUTCFullYear(), dayBefore.getUTCMonth(), dayBefore.getUTCDate(), 7, 0, 0) - (offsetMin * 60 * 1000);
          }

          async function main() {
            console.log('Current real time:', new Date().toISOString());

            const cachedSeason = await fetchJson(`/nflSchedule/${SEASON}/Regular.json`).catch(() => null);
            const weekGames = cachedSeason && cachedSeason.weeks && cachedSeason.weeks.week2;
            if (!Array.isArray(weekGames) || !weekGames.length) {
              console.log('No cached Week 2 schedule found yet.');
              return;
            }

            const gameTimes = weekGames.filter(g => g && g.time).map(g => new Date(g.time).getTime());
            if (!gameTimes.length) { console.log('Week 2 schedule has no real game times yet.'); return; }

            const firstKickoffMs = Math.min(...gameTimes);
            const targetMs = computeTargetOpenTime(firstKickoffMs);

            console.log(`Week 2 real first kickoff: ${new Date(firstKickoffMs).toISOString()}`);
            console.log(`Real target open time: ${new Date(targetMs).toISOString()}`);

            const etOpen = new Intl.DateTimeFormat('en-US', {
              timeZone: 'America/Chicago', weekday: 'long', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit'
            }).format(new Date(targetMs));
            console.log(`In plain terms (CT): ${etOpen} CT`);

            const alreadyPast = Date.now() >= targetMs;
            console.log(`Has this moment already passed: ${alreadyPast}`);

            // Also check whether it's actually already open
            const existingMeta = await fetchJson(`/leagues/fr_refresh26/salaries/${SEASON}/week2/meta.json`).catch(() => null);
            console.log(`Week 2 salaries already exist right now: ${!!(existingMeta && existingMeta.count > 0)}`);
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
