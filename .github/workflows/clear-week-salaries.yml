name: Clear Week Salaries (one-time fix)

# One-click removal of a single week's generated salary sheet. Built for the
# Sept 2026 case: a Weekly Prep TEST run generated Week 3's salaries early,
# which made Week 3 draftable ~14h before the intended Wed 7am CT open. Since
# the client treats a week as "ready to draft" the moment its salaries exist,
# deleting them puts Week 3 back to held. Weekly Auto-Open then regenerates a
# fresh sheet and unlocks the draft on schedule Wednesday morning — this works
# whether or not the updated auto-open is deployed, because the salaries will
# no longer pre-exist.
#
# It:
#   1. BACKS UP the salary node to /backups (nothing is truly lost)
#   2. DELETES  /leagues/<league>/salaries/<season>/week<week>
#
# SAFETY: requires typing the confirm phrase, refuses if any lineups already
# exist for that week (so it never yanks salaries out from under a real draft),
# and backs up before deleting.

concurrency:
  group: clear-week-salaries
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type EXACTLY: CLEAR WEEK 3 SALARIES   (guard against accidental runs)'
        required: true
        default: ''
      league_id:
        description: 'League ID'
        required: true
        default: 'fr_refresh26'
      season:
        description: 'Season key'
        required: true
        default: '2026'
      week:
        description: 'Week number whose salaries to clear'
        required: true
        default: '3'
      force:
        description: 'Set to "true" to delete even if lineups already exist for this week (normally leave blank)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Backup and delete the week's salary sheet
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
          CONFIRM: ${{ inputs.confirm }}
          LEAGUE_ID: ${{ inputs.league_id }}
          SEASON: ${{ inputs.season }}
          WEEK: ${{ inputs.week }}
          FORCE: ${{ inputs.force }}
        run: |
          node << 'SCRIPT'
          const https = require('https');

          const FB_URL   = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE   = (process.env.LEAGUE_ID || 'fr_refresh26').trim();
          const SEASON   = (process.env.SEASON || '2026').trim();
          const WEEK     = (process.env.WEEK || '3').trim();
          const FORCE    = (process.env.FORCE || '').trim() === 'true';

          const EXPECTED = `CLEAR WEEK ${WEEK} SALARIES`;
          if ((process.env.CONFIRM || '').trim() !== EXPECTED) {
            console.error(`❌ Confirm phrase did not match "${EXPECTED}" — aborting. Nothing was changed.`);
            process.exit(1);
          }
          if (!FB_URL)   { console.error('Missing FIREBASE_DB_URL secret.'); process.exit(1); }
          if (!FB_TOKEN) { console.error('Missing FIREBASE_AUTH_TOKEN secret — writes would be rejected. Aborting.'); process.exit(1); }

          function authed(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_URL + path + sep + 'auth=' + FB_TOKEN;
          }
          function req(method, path, body) {
            return new Promise((resolve, reject) => {
              const u = new URL(authed(path));
              const opts = { hostname: u.hostname, path: u.pathname + u.search, method,
                headers: { 'Content-Type': 'application/json' } };
              const payload = body != null ? JSON.stringify(body) : null;
              if (payload) opts.headers['Content-Length'] = Buffer.byteLength(payload);
              const r = https.request(opts, res => {
                let d = ''; res.on('data', c => d += c);
                res.on('end', () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) resolve(d ? JSON.parse(d) : null);
                  else reject(new Error(`HTTP ${res.statusCode} on ${method} ${path} — ${d.slice(0,200)}`));
                });
              });
              r.on('error', reject);
              if (payload) r.write(payload);
              r.end();
            });
          }

          (async () => {
            const salaryPath = `/leagues/${LEAGUE}/salaries/${SEASON}/week${WEEK}.json`;
            const lineupsPath = `/leagues/${LEAGUE}/lineups/${SEASON}/week${WEEK}.json?shallow=true`;
            const ts = Date.now();
            const backupPath = `/backups/salaries_${LEAGUE}_${SEASON}_wk${WEEK}_${ts}.json`;

            // Guard: never pull salaries out from under a draft in progress.
            const lineups = await req('GET', lineupsPath).catch(() => null);
            const lineupCount = lineups ? Object.keys(lineups).length : 0;
            if (lineupCount > 0 && !FORCE) {
              console.error(`❌ ${lineupCount} lineup(s) already exist for week ${WEEK} — refusing to delete salaries under an active draft.`);
              console.error(`   If you really mean to, re-run with force = "true".`);
              process.exit(1);
            }
            if (lineupCount > 0) {
              console.log(`⚠️  ${lineupCount} lineup(s) exist for week ${WEEK}, but force=true — proceeding anyway.`);
            } else {
              console.log(`✓ No lineups exist for week ${WEEK} — safe to clear.`);
            }

            console.log(`Reading current salaries at ${salaryPath} …`);
            const current = await req('GET', salaryPath).catch(e => { console.log('  (read failed: ' + e.message + ')'); return null; });
            const playerCount = (current && current.meta && typeof current.meta.count === 'number')
              ? current.meta.count
              : (current && current.players ? Object.keys(current.players).length : 0);
            console.log(`  Found a salary sheet with ${playerCount} player(s).`);

            if (current) {
              await req('PUT', backupPath, { savedAt: ts, note: `pre-clear backup of week ${WEEK} salaries`, data: current });
              console.log(`  ✅ Backed up to ${backupPath}`);
            } else {
              console.log('  Nothing to back up (node already empty).');
            }

            await req('DELETE', salaryPath);
            console.log(`  ✅ Deleted salary node ${salaryPath}`);

            console.log(`\nDone. Week ${WEEK} is no longer draftable. Weekly Auto-Open will regenerate a`);
            console.log(`fresh sheet and open the draft at its scheduled time. To undo, restore the`);
            console.log(`node from ${backupPath}.`);
          })().catch(e => { console.error('Clear failed:', e.message); process.exit(1); });
          SCRIPT
