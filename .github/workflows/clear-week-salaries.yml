name: Clear Week Salaries (manual, confirm-gated)

# Deletes a single week's salary sheet so it can be regenerated (e.g. after a
# pricing-constant change). This is the "Clear Week Salaries" action the app UI
# never had — the commissioner panel only has Lock/Unlock.
#
# SAFE BY DESIGN:
#   • Manual only (workflow_dispatch) — never fires on a schedule.
#   • Requires typing the exact confirm phrase, so it can't run by accident.
#   • Logs what it's about to delete (count / flat / generated) before deleting.
#   • Optionally re-locks the draft so nobody can draft on an empty sheet during
#     the gap between clearing and regenerating (default: yes).
#
# TYPICAL RECOVERY FLOW (after deploying updated pricing constants):
#   1. Run THIS workflow for the target week (relock = true).
#   2. Run "Weekly Prep" — rebuilds a complete real sheet on the new constants.
#   3. Run "Weekly Auto-Open" — re-opens the draft once the sheet is complete.
#
# ⚠️ Clearing a week that people have ALREADY drafted will reprice under them.
#    Only clear a week before real drafting has started, or when you intend to
#    reprice everyone.

on:
  workflow_dispatch:
    inputs:
      league_id:
        description: 'League ID'
        required: true
        default: 'fr_refresh26'
      season:
        description: 'Season key (2026, or 2026P for preseason)'
        required: true
        default: '2026'
      week:
        description: 'Week number to clear (no default — must be set on purpose)'
        required: true
      confirm:
        description: 'Type CLEAR to confirm deletion'
        required: true
        default: ''
      relock:
        description: 'Re-lock the draft after clearing (true/false)'
        required: true
        default: 'true'

jobs:
  clear-week-salaries:
    runs-on: ubuntu-latest
    steps:
      - name: Clear one week's salary sheet
        env:
          FIREBASE_DB_URL:     ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
          IN_LEAGUE:  ${{ github.event.inputs.league_id }}
          IN_SEASON:  ${{ github.event.inputs.season }}
          IN_WEEK:    ${{ github.event.inputs.week }}
          IN_CONFIRM: ${{ github.event.inputs.confirm }}
          IN_RELOCK:  ${{ github.event.inputs.relock }}
        run: |
          node << 'SCRIPT'
          const https = require('https');

          const FB_URL   = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE   = (process.env.IN_LEAGUE || '').trim();
          const SEASON   = (process.env.IN_SEASON || '').trim();
          const WEEK     = parseInt(process.env.IN_WEEK || '', 10);
          const CONFIRM  = (process.env.IN_CONFIRM || '').trim();
          const RELOCK   = (process.env.IN_RELOCK || 'true').trim().toLowerCase() === 'true';

          // ── Guards ──
          if (CONFIRM !== 'CLEAR') {
            console.error(`❌ Confirmation failed: you typed "${CONFIRM}", expected exactly "CLEAR". Nothing deleted.`);
            process.exit(1);
          }
          if (!LEAGUE || !SEASON || !Number.isInteger(WEEK) || WEEK < 1 || WEEK > 18) {
            console.error(`❌ Bad inputs: league="${LEAGUE}" season="${SEASON}" week="${process.env.IN_WEEK}". Nothing deleted.`);
            process.exit(1);
          }
          if (!FB_URL || !FB_TOKEN) {
            console.error('❌ Missing FIREBASE_DB_URL or FIREBASE_AUTH_TOKEN secret. Nothing deleted.');
            process.exit(1);
          }

          function authed(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fbRequest(method, path, body) {
            return new Promise((resolve, reject) => {
              const u = new URL(FB_URL + authed(path));
              const opts = { hostname: u.hostname, path: u.pathname + u.search, method,
                headers: { 'Content-Type': 'application/json' } };
              const payload = body !== undefined ? JSON.stringify(body) : null;
              if (payload) opts.headers['Content-Length'] = Buffer.byteLength(payload);
              const req = https.request(opts, res => {
                let d = ''; res.on('data', c => d += c);
                res.on('end', () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) resolve(d);
                  else reject(new Error(`HTTP ${res.statusCode} on ${method} ${path} — ${d.slice(0,200)}`));
                });
              });
              req.on('error', reject);
              if (payload) req.write(payload);
              req.end();
            });
          }
          const fbGet = p => fbRequest('GET', p).then(d => { try { return JSON.parse(d); } catch { return null; } });
          const fbDelete = p => fbRequest('DELETE', p);
          const fbPut = (p, v) => fbRequest('PUT', p, v);

          async function main() {
            const base = `/leagues/${LEAGUE}/salaries/${SEASON}/week${WEEK}`;
            console.log('════════════════════════════════════════════════════════════');
            console.log(`  CLEAR WEEK SALARIES`);
            console.log(`  League ${LEAGUE} · Season ${SEASON} · Week ${WEEK} · ${new Date().toISOString()}`);
            console.log('════════════════════════════════════════════════════════════');

            // Show what's there before deleting.
            const meta = await fbGet(`${base}/meta.json`).catch(() => null);
            if (!meta) {
              console.log(`No existing sheet at ${base} (meta is null). Nothing to delete — treating as already clear.`);
            } else {
              console.log(`Existing sheet: count=${meta.count} flat=${meta.flat} locked=${meta.locked} generated=${meta.generated ? new Date(meta.generated).toISOString() : '?'}`);
              if (meta.locked) {
                console.error('❌ This week is LOCKED (meta.locked=true). Unlock it first (commissioner panel) — refusing to clear a locked week.');
                process.exit(1);
              }
              await fbDelete(`${base}.json`);
              console.log(`🗑️  Deleted ${base}`);
            }

            // Optionally re-lock the draft so nobody drafts on an empty sheet.
            if (RELOCK) {
              const HOLD_MS = 30 * 24 * 60 * 60 * 1000;
              await fbPut(`/leagues/${LEAGUE}/settings/draftLockedUntil.json`, Date.now() + HOLD_MS);
              console.log(`🔒 Re-locked draft (draftLockedUntil set ~30 days out). Regenerate, then Auto-Open will re-open it.`);
            } else {
              console.log('Draft lock left unchanged (relock=false).');
            }

            console.log('\n✅ Done. Next: run "Weekly Prep" to rebuild, then "Weekly Auto-Open" to re-open.');
          }
          main().catch(e => { console.error('Clear failed:', e.message); process.exit(1); });
          SCRIPT
