name: One-Time Diagnostic — Check Riedel Lineup DEF Slot Data

# ONE-TIME USE — delete this file after running it once.
# Checks the real, stored lineup data (what player.id is stored for the
# DEF slot) and the real, stored season score entry (slotPts/
# slotBreakdown) for Riedel's week 4 lineup - to see whether the lookup
# key mismatches playerStats['LAR'], or whether the stored score itself
# is just stale from before recent scoring fixes.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check the real lineup and score entry
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const LEAGUE_ID = 'fr_nth60cij';
          const UID = 'bUw1041FsMQjHxBUc58NnclGwyJ2'; // Riedel

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            console.log('=== Real, stored lineup for week 4 ===');
            const lineup = await fetchJson(`${FB_URL}/leagues/${LEAGUE_ID}/lineups/2026P/week4/${UID}.json`).catch(() => null);
            if (lineup && lineup.slots) {
              Object.entries(lineup.slots).forEach(([slot, p]) => {
                if (p && (p.pos === 'DEF' || slot === 'df1')) {
                  console.log(`  ${slot}: ${JSON.stringify(p)}`);
                }
              });
            } else {
              console.log('  No lineup found at all.');
            }

            console.log('\n=== Real, stored season score entry for week 4 ===');
            const score = await fetchJson(`${FB_URL}/leagues/${LEAGUE_ID}/season/2026P/4/${UID}.json`).catch(() => null);
            if (score) {
              console.log(`  score: ${score.score}, status: ${score.status}, updatedAt: ${score.updatedAt ? new Date(score.updatedAt).toISOString() : 'none'}`);
              console.log(`  slotPts.df1: ${score.slotPts && score.slotPts.df1}`);
              console.log(`  slotBreakdown.df1: ${JSON.stringify(score.slotBreakdown && score.slotBreakdown.df1)}`);
            } else {
              console.log('  No score entry found at all for week 4.');
            }
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
