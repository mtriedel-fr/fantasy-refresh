name: One-Time Diagnostic — Check For Stale Final/Locked Week 1 Entries

# ONE-TIME USE — delete this file after running it once.
# Checks every real member's Week 1 entry in the real seasonData
# array for an incorrectly stale status='final' or locked=true flag -
# confirmed as the direct, likely cause of a player being unable to
# reach the draft board at all ("click and get sent back to the main
# screen"), since goToDraft() redirects to the Weekly Review modal
# instead of the draft page whenever this condition is true for the
# logged-in user's own team - a real, live problem given the season
# hasn't even started, so nothing should genuinely be final yet.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check every Week 1 entry for stale final/locked flags
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            const week1 = await fetchJson(`/leagues/${LEAGUE_ID}/season/${SEASON}/1.json`).catch(() => null);
            if (!week1) {
              console.log('No Week 1 entry in seasonData at all — nothing to check. (This alone would NOT cause the reported issue, since goToDraft() only redirects when a matching entry IS found and IS final/locked.)');
              return;
            }

            console.log(`Found Week 1 seasonData: ${Array.isArray(week1) ? week1.length : Object.keys(week1).length} entries.\n`);

            const entries = Array.isArray(week1) ? week1 : Object.values(week1);
            let staleCount = 0;

            entries.forEach((e, i) => {
              if (!e) return;
              const isStale = e.status === 'final' || e.locked === true;
              if (isStale) {
                staleCount++;
                console.log(`⚠️  Entry ${i}: name="${e.name}"  status="${e.status}"  locked=${e.locked}`);
                console.log(`    This team's "Draft"/"My Team" button will redirect to the Weekly Review instead of the draft page.`);
              }
            });

            if (!staleCount) {
              console.log('No entries found with status=final or locked=true — this specific mechanism is not the cause. Worth checking auth/session state for the affected player instead.');
            } else {
              console.log(`\n${staleCount} entr${staleCount === 1 ? 'y' : 'ies'} found with a stale final/locked flag, out of ${entries.length} total.`);
            }
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
