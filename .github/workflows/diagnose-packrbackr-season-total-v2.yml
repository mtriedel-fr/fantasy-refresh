name: One-Time Diagnostic — Find PackrBackr Season Total Discrepancy V2

# ONE-TIME USE — delete this file after running it once.
# Corrected version - properly handles Week 1's real structure
# (an object keyed by uid, not a literal array). Searches every
# entry for anything matching "PackrBackr" (case-insensitive) to
# check for duplicate UIDs under the same team name, and also checks
# /leagues/fr_refresh26/members for the same. Read-only.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Find the real discrepancy
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const LEAGUE_ID = 'fr_refresh26';
          const SEASON = 2026;
          const TEAM_NAME = 'packrbackr';

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              https.get(fbAuth(`${FB_URL}${path}`), res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            const week1 = await fetchJson(`/leagues/${LEAGUE_ID}/season/${SEASON}/1.json`).catch(() => null);
            if (!week1) { console.log('No Week 1 data found.'); return; }

            console.log(`Total entries in Week 1: ${Object.keys(week1).length}`);
            console.log('');
            console.log('Every entry matching "PackrBackr" (case-insensitive):');
            let matchCount = 0;
            let sumOfMatches = 0;
            for (const [uid, entry] of Object.entries(week1)) {
              if (!entry || typeof entry !== 'object') continue;
              const name = (entry.team || entry.name || '').toLowerCase();
              if (name.includes(TEAM_NAME)) {
                matchCount++;
                sumOfMatches += (entry.score || 0);
                console.log(`  uid=${uid}  team="${entry.team}"  score=${entry.score}  locked=${entry.locked}  status=${entry.status}`);
              }
            }
            console.log(`\nMatch count: ${matchCount}`);
            console.log(`Sum of all matching entries' scores: ${sumOfMatches}`);

            console.log('\n--- Checking /leagues/fr_refresh26/members for duplicate PackrBackr entries ---');
            const members = await fetchJson(`/leagues/${LEAGUE_ID}/members.json`).catch(() => ({}));
            let memberMatches = 0;
            for (const [uid, m] of Object.entries(members || {})) {
              if (!m || typeof m !== 'object') continue;
              const name = (m.teamName || '').toLowerCase();
              if (name.includes(TEAM_NAME)) {
                memberMatches++;
                console.log(`  uid=${uid}  teamName="${m.teamName}"  active=${m.active}  email=${m.email || '(none)'}`);
              }
            }
            console.log(`\nMember match count: ${memberMatches}`);
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
