name: One-Time Fix — Correct Premature Week Advance

# ONE-TIME USE — delete this file after running it once.
# Checks the real, current meta.json for both leagues. If a league's
# meta.week was incorrectly advanced to the current, still-in-progress
# week (allFinal: false) by the now-fixed bug in auto-scoring.yml,
# rolls it back to week - 1, which is what it should have been until
# the week is genuinely, fully finished. Only touches a league if it's
# confirmed to actually be in this wrong state.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to actually correct the wrong value(s)'
        required: true
        default: ''

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check and correct meta.week for both leagues
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          node << 'SCRIPT'
          const https = require('https');

          const FB_URL   = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const CONFIRM  = process.env.CONFIRM;
          const LEAGUES = [
            { id: 'fr_nth60cij', seasonKey: '2026P' },
            { id: 'fr_refresh26', seasonKey: '2026' }
          ];

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          function firebasePut(path, payload) {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify(payload);
              const fullPath = fbAuth(FB_URL + path + '.json');
              const u = new URL(fullPath);
              const req = https.request({
                hostname: u.hostname, path: u.pathname + u.search, method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) }
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) resolve(d);
                  else reject(new Error(`PUT rejected (HTTP ${res.statusCode}) — ${d.slice(0,200)}`));
                });
              });
              req.on('error', reject);
              req.write(body); req.end();
            });
          }

          async function main() {
            for (const { id, seasonKey } of LEAGUES) {
              const path = `/leagues/${id}/season/${seasonKey}/meta`;
              const meta = await fetchJson(FB_URL + path + '.json').catch(() => null);
              console.log(`\n=== ${id} (${path}) ===`);
              console.log(JSON.stringify(meta, null, 2));

              if (!meta || typeof meta.week !== 'number') {
                console.log('  No meta or no week field — nothing to check.');
                continue;
              }

              if (meta.allFinal === true) {
                console.log(`  allFinal is true — week ${meta.week} genuinely finished. Correct as-is, not touching.`);
                continue;
              }

              // Wrong state: week is set to a real week number, but that
              // week isn't actually finished yet. Should be one behind.
              const correctedWeek = meta.week - 1;
              console.log(`  ⚠️  allFinal is false but week is ${meta.week} — this looks like the confirmed premature-advance bug. Should be ${correctedWeek}.`);

              if (CONFIRM !== 'YES') {
                console.log('  Confirm input was not "YES" — not correcting yet.');
                continue;
              }

              await firebasePut(path, { ...meta, week: correctedWeek });
              console.log(`  ✅ Corrected ${id}'s meta.week from ${meta.week} to ${correctedWeek}.`);
            }
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
