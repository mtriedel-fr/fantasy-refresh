name: One-Time Fix — Correct Stuck Game + Wrongly-Locked Teams

# ONE-TIME USE — delete this file after running it once.
# Part 1: Corrects GB@DEN's stuck liveGameStatus entry, using its real,
# current final score fetched live from Tank01 - not a guess.
# Part 2: Clears any team locked against fr_refresh26's real week 1
# whose lock came from a preseason game (gameId dated before the real,
# confirmed regular-season kickoff) - the confirmed root cause fixed in
# kickoff-locks.yml, this corrects what it already, wrongly wrote.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to actually apply both corrections'
        required: true
        default: ''

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Correct both pieces of stale/wrong data
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL   = process.env.FIREBASE_DB_URL;
          const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
          const T01_KEY  = process.env.TANK01_KEY;
          const T01_HOST = 'tank01-nfl-live-in-game-real-time-statistics-nfl.p.rapidapi.com';
          const CONFIRM  = process.env.CONFIRM;
          // Real, confirmed first kickoff of the actual regular season.
          const REAL_SEASON_KICKOFF_MS = 1788913200000;

          function fbAuth(path) {
            const sep = path.includes('?') ? '&' : '?';
            return FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
          }
          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }
          function t01(path) {
            return new Promise((resolve, reject) => {
              https.get({
                hostname: T01_HOST, path, headers: {
                  'X-RapidAPI-Key': T01_KEY, 'X-RapidAPI-Host': T01_HOST
                }
              }, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }
          function firebasePut(path, payload) {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify(payload);
              const fullPath = fbAuth(FB_URL + path + '.json');
              const u = new URL(fullPath);
              const req = https.request({
                hostname: u.hostname, path: u.pathname + u.search, method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) }
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) resolve(d);
                  else reject(new Error(`PUT rejected (HTTP ${res.statusCode}) — ${d.slice(0,200)}`));
                });
              });
              req.on('error', reject);
              req.write(body); req.end();
            });
          }
          function firebaseDelete(path) {
            return new Promise((resolve, reject) => {
              const fullPath = fbAuth(FB_URL + path + '.json');
              const u = new URL(fullPath);
              const req = https.request({
                hostname: u.hostname, path: u.pathname + u.search, method: 'DELETE'
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) resolve(d);
                  else reject(new Error(`DELETE rejected (HTTP ${res.statusCode}) — ${d.slice(0,200)}`));
                });
              });
              req.on('error', reject);
              req.end();
            });
          }

          async function main() {
            console.log('========== PART 1: Correct GB@DEN stuck status ==========\n');
            const gid = '20260821_GB@DEN';
            const real = await t01(`/getNFLBoxScore?gameID=${gid}&fantasyPoints=true&PPRScoring=true`);
            console.log(`Real status: ${real.body.gameStatus} (code ${real.body.gameStatusCode})`);
            console.log(`Real score: away ${real.body.awayPts}, home ${real.body.homePts}`);

            const path = '/liveGameStatus/2026P/Preseason_wk3';
            const current = await fetchJson(FB_URL + path + '.json').catch(() => null);
            if (current && current.games && current.games[gid]) {
              const corrected = {
                ...current.games,
                [gid]: {
                  away: current.games[gid].away, home: current.games[gid].home,
                  awayScore: parseInt(real.body.awayPts) || 0,
                  homeScore: parseInt(real.body.homePts) || 0,
                  statusCode: 2
                }
              };
              console.log('\nCorrected entry:');
              console.log(JSON.stringify(corrected[gid], null, 2));
              if (CONFIRM === 'YES') {
                await firebasePut(path, { games: corrected, updatedAt: Date.now() });
                console.log('✅ Corrected GB@DEN.');
              } else {
                console.log('⚠️  Confirm not "YES" — not applying.');
              }
            } else {
              console.log('GB@DEN entry not found at expected path — nothing to correct there.');
            }

            console.log('\n\n========== PART 2: Clear wrongly-locked regular-season teams ==========\n');
            const lockPath = '/leagues/fr_refresh26/locks/2026/week1';
            const locks = await fetchJson(FB_URL + lockPath + '.json').catch(() => null);
            if (!locks) {
              console.log('No locks found at this path — nothing to check.');
              return;
            }
            const wrongTeams = Object.keys(locks).filter(team => {
              const entry = locks[team];
              // A real regular-season lock's gameId should date on or
              // after the real kickoff — anything before that can only
              // be a preseason game that leaked in.
              const dateStr = (entry.gameId || '').split('_')[0];
              const ts = dateStr.length === 8
                ? Date.UTC(+dateStr.slice(0,4), +dateStr.slice(4,6)-1, +dateStr.slice(6,8))
                : null;
              return ts !== null && ts < REAL_SEASON_KICKOFF_MS;
            });
            console.log(`Found ${wrongTeams.length} team(s) locked from a preseason game: ${wrongTeams.join(', ') || '(none)'}`);
            if (!wrongTeams.length) return;

            if (CONFIRM !== 'YES') {
              console.log('⚠️  Confirm not "YES" — not clearing.');
              return;
            }
            const cleaned = { ...locks };
            wrongTeams.forEach(t => delete cleaned[t]);
            if (Object.keys(cleaned).length) {
              await firebasePut(lockPath, cleaned);
            } else {
              await firebaseDelete(lockPath);
            }
            console.log(`✅ Cleared ${wrongTeams.length} wrongly-locked team(s).`);
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
