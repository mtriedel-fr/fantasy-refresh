name: One-Time Diagnostic — Check Why Auto-Open Misfired

# ONE-TIME USE — delete this file after running it once.
# Checks the real, current state that weekly-auto-open.yml would have
# seen on its last run: the real season meta (current week), whether
# week 2 salaries already got generated (confirming or ruling out that
# it actually ran through to completion, not just touched the lock),
# and the full raw week 2 schedule data - checking directly for any
# missing/malformed game time value that could produce NaN and
# silently bypass the "not yet time" safety check.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check what auto-open actually saw
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const LEAGUE_ID = 'fr_refresh26';

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            const settings = await fetchJson(`${FB_URL}/leagues/${LEAGUE_ID}/settings.json`).catch(() => null);
            const season = settings ? settings.season : 2026;
            console.log(`Real season used: ${season}`);

            const seasonMeta = await fetchJson(`${FB_URL}/leagues/${LEAGUE_ID}/season/${season}/meta.json`).catch(() => null);
            console.log(`\nReal season meta: ${JSON.stringify(seasonMeta)}`);
            const currentWeek = (seasonMeta && typeof seasonMeta.week === 'number') ? seasonMeta.week : 1;
            const nextWeek = currentWeek + 1;
            console.log(`Computed currentWeek: ${currentWeek}, nextWeek: ${nextWeek}`);

            const salaryMeta = await fetchJson(`${FB_URL}/leagues/${LEAGUE_ID}/salaries/${season}/week${nextWeek}/meta.json`).catch(() => null);
            console.log(`\nReal week ${nextWeek} salary meta (did it actually generate?): ${JSON.stringify(salaryMeta)}`);

            const cachedSeason = await fetchJson(`${FB_URL}/nflSchedule/${season}/Regular.json`).catch(() => null);
            const weekGames = cachedSeason && cachedSeason.weeks && cachedSeason.weeks[`week${nextWeek}`];
            console.log(`\nReal, raw week ${nextWeek} cached schedule (${Array.isArray(weekGames) ? weekGames.length : 0} games):`);
            console.log(JSON.stringify(weekGames, null, 2));

            if (Array.isArray(weekGames)) {
              const gameTimes = weekGames.filter(g => g && g.time).map(g => new Date(g.time).getTime());
              console.log(`\nGames with a real "time" field: ${gameTimes.length} of ${weekGames.length}`);
              const hasNaN = gameTimes.some(t => isNaN(t));
              console.log(`Any NaN in parsed game times: ${hasNaN}`);
              if (gameTimes.length) {
                const firstKickoffMs = Math.min(...gameTimes);
                console.log(`Computed first kickoff: ${firstKickoffMs} (${isNaN(firstKickoffMs) ? 'INVALID — NaN!' : new Date(firstKickoffMs).toISOString()})`);
              }
            }
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
