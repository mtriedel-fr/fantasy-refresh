name: One-Time Diagnostic — Check Week 3 finalizedAt Timing

# ONE-TIME USE — delete this file after running it once.
# Checks exactly when week 3's finalizedAt was actually written, and
# how much of the draft room's intentional 24-hour grace period
# remains - to confirm whether that's the real, honest explanation for
# the draft room still showing week 3, rather than assuming it without
# checking.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check finalizedAt timing
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;
          const LEAGUE_ID = 'fr_nth60cij';

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            const now = Date.now();
            console.log('Server time right now:', new Date(now).toISOString());

            const finalizedAt = await fetchJson(`${FB_URL}/leagues/${LEAGUE_ID}/season/2026P/3/finalizedAt.json`).catch(() => null);
            if (finalizedAt == null) {
              console.log('\nfinalizedAt is still null — week 3 has never been marked finalized at all.');
              return;
            }
            const elapsedMs = now - finalizedAt;
            const elapsedHours = (elapsedMs / (60*60*1000)).toFixed(2);
            const remainingHours = (24 - elapsedMs / (60*60*1000)).toFixed(2);
            console.log(`\nfinalizedAt: ${finalizedAt} (${new Date(finalizedAt).toISOString()})`);
            console.log(`Elapsed since finalizedAt: ${elapsedHours} hours`);
            if (elapsedMs > 24*60*60*1000) {
              console.log('Past the 24-hour mark — draft room SHOULD be showing week 4. If it\'s not, something else is wrong.');
            } else {
              console.log(`Still within the 24-hour grace period — ${remainingHours} hours remaining before the draft room auto-advances to week 4.`);
            }
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
