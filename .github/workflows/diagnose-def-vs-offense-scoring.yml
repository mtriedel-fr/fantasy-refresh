name: One-Time Diagnostic — Compare DEF vs Offensive Scoring Distribution

# ONE-TIME USE — delete this file after running it once.
# Pulls real gameStats across every preseason game so far, comparing
# DEF scoring distribution directly against offensive positions - real
# data instead of theorizing about the formula in the abstract. Also
# checks value-per-dollar using the real salary ceilings already
# calibrated tonight, since a formula being "standard" doesn't tell us
# whether it's actually balanced against this app's own real salaries.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and compare real scores by position
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const FB_URL = process.env.FIREBASE_DB_URL;

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          function stats(arr) {
            if (!arr.length) return { count: 0, avg: 0, max: 0, min: 0 };
            const sorted = [...arr].sort((a,b) => a-b);
            const avg = arr.reduce((a,b) => a+b, 0) / arr.length;
            return { count: arr.length, avg: +avg.toFixed(2), max: sorted[sorted.length-1], min: sorted[0] };
          }

          async function main() {
            const allGameStats = await fetchJson(`${FB_URL}/gameStats/2026P.json`).catch(() => null);
            if (!allGameStats) { console.log('No gameStats found.'); return; }

            const byPos = { QB: [], RB: [], WR: [], TE: [], DEF: [] };
            Object.values(allGameStats).forEach(gs => {
              (gs.players || []).forEach(p => {
                if (byPos[p.pos]) byPos[p.pos].push(p.pts);
              });
            });

            console.log('=== Real scoring distribution by position, this preseason ===\n');
            Object.keys(byPos).forEach(pos => {
              const s = stats(byPos[pos]);
              console.log(`${pos}: ${s.count} performances — avg ${s.avg}, min ${s.min}, max ${s.max}`);
            });

            // Real salary ceilings confirmed during tonight's earlier
            // calibration work — checking real points-per-dollar at
            // each position's actual ceiling price.
            const ceilings = { QB: 9400, RB: 10700, WR: 11300, TE: 7400, DEF: 5000 };
            console.log('\n=== Points-per-$1000 at each position\'s real target ceiling ===');
            Object.keys(byPos).forEach(pos => {
              const s = stats(byPos[pos]);
              const perThousand = (s.max / (ceilings[pos] / 1000)).toFixed(2);
              console.log(`${pos}: max real score ${s.max} at ~$${ceilings[pos]} ceiling → ${perThousand} pts per $1,000`);
            });

            // Top 10 single-game DEF performances specifically, to see
            // the real shape of DEF's ceiling outcomes directly.
            console.log('\n=== Top 10 real single-game DEF scores this preseason ===');
            const allDef = [];
            Object.entries(allGameStats).forEach(([gid, gs]) => {
              (gs.players || []).forEach(p => {
                if (p.pos === 'DEF') allDef.push({ gid, name: p.name, pts: p.pts });
              });
            });
            allDef.sort((a,b) => b.pts - a.pts).slice(0, 10).forEach(d => {
              console.log(`  ${d.name} (${d.gid}): ${d.pts}`);
            });
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
