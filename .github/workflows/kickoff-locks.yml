name: Kickoff Locks

concurrency:
  group: kickoff-locks
  cancel-in-progress: false

on:
  # Schedule triggers removed — this workflow is now triggered
  # externally on a reliable cadence (cron-job.org), which supersedes
  # GitHub's own unreliable high-frequency scheduling (confirmed tonight
  # it was actually only firing about once an hour despite asking for
  # every 5 minutes).
  workflow_dispatch:

jobs:
  check-kickoffs:
    runs-on: ubuntu-latest
    steps:
      - name: Check game statuses and write locks
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
          FR_SEASON: "2026"
        run: |
          node << 'SCRIPT'
          const https = require('https');

          const FB_URL   = process.env.FIREBASE_DB_URL;
          const T01_KEY  = process.env.TANK01_KEY;
          let SEASON   = process.env.FR_SEASON || '2026';
          // Stable, never-reassigned — see the identical fix and full
          // explanation in auto-scoring.yml tonight. SEASON itself is
          // never reassigned anymore in this particular file (removed
          // earlier tonight), so this is currently safe either way, but
          // relying on that as an implicit guarantee is fragile —
          // comparing against a name that explicitly promises "the
          // plain year, always" is correct on its own terms regardless
          // of what any other code in this file happens to do.
          const BASE_SEASON = SEASON;
          const T01_HOST = 'tank01-nfl-live-in-game-real-time-statistics-nfl.p.rapidapi.com';
          // Real, confirmed first kickoff of the actual regular season
          // (NE@SEA, Sept 9 2026, 8:20pm ET / 2026-09-10T00:20:00Z) —
          // same value already confirmed and used for the draft-lock
          // feature earlier tonight. Any game before this timestamp
          // cannot possibly be a genuine regular-season game.
          const REAL_SEASON_KICKOFF_MS = 1788913200000;

          function fetchJson(url, headers) {
            return new Promise((resolve, reject) => {
              const opts = new URL(url);
              const options = {
                hostname: opts.hostname,
                path: opts.pathname + opts.search,
                headers: headers || {}
              };
              https.get(options, res => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try { resolve(JSON.parse(data)); }
                  catch(e) { reject(e); }
                });
              }).on('error', reject);
            });
          }

          function firebasePut(path, payload) {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify(payload);
              // Append auth token — locks writes require commissioner/admin auth
              // under the published security rules. This function previously sent
              // writes unauthenticated (worked under old loose rules, silently
              // rejected under current ones).
              const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
              const sep = path.includes('?') ? '&' : '?';
              const authedPath = FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
              const opts = new URL(FB_URL + authedPath);
              const options = {
                hostname: opts.hostname,
                path: opts.pathname + opts.search,
                method: 'PUT',
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(body)
                }
              };
              const req = https.request(options, res => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) resolve(data);
                  else reject(new Error(`Firebase PUT REJECTED (HTTP ${res.statusCode}) at ${path} — ${data.slice(0,200)}`));
                });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          function firebaseGet(path) {
            // Append auth token — reads to paths without their own
            // explicit public .read rule (like the parent /leagues node
            // itself, as opposed to a specific league's own data) are
            // rejected without it. This was the actual, confirmed root
            // cause of every run silently falling back to a hardcoded,
            // single-league list: getActiveLeagues()'s attempt to read
            // the full /leagues node was always being denied, since
            // that parent node has no .read rule of its own — only each
            // specific league underneath it does, and rules don't
            // cascade upward from children to a parent. Every league
            // beyond the hardcoded fallback, including the preseason
            // one, was silently never being processed by this workflow
            // at all as a result.
            const FB_TOKEN = process.env.FIREBASE_AUTH_TOKEN;
            const sep = path.includes('?') ? '&' : '?';
            const authedPath = FB_TOKEN ? `${path}${sep}auth=${FB_TOKEN}` : path;
            return fetchJson(FB_URL + authedPath, {});
          }

          // Only meaningful for genuine preseason leagues — maps
          // today's real calendar date onto this season's specific,
          // established preseason game windows. A regular-season league
          // must never use this: during this same August/early-September
          // window, the real season hasn't started at all, so this
          // would incorrectly report something like "week 3" for a
          // league that actually needs its own real week 1.
          function getPreseasonCalendarWeek() {
            const now = new Date();
            const etParts = new Intl.DateTimeFormat('en-CA', {
              timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit'
            }).format(now).split('-').map(Number);
            const [etYear, etMonth, etDay] = etParts;
            const mmdd = etMonth * 100 + etDay;
            let psWeek;
            if (mmdd <= 812)      psWeek = 1; // through Aug 12 — HOF game, before Week 2 starts
            else if (mmdd <= 819) psWeek = 2; // Aug 13-19 — real games Aug 13-17
            else if (mmdd <= 826) psWeek = 3; // Aug 20-26 — real games Aug 20-23
            else                  psWeek = 4; // Aug 27 onward — real games Aug 27-30
            console.log(`Preseason window (by ET date ${etYear}-${String(etMonth).padStart(2,'0')}-${String(etDay).padStart(2,'0')}) — calendar week ${psWeek}`);
            return psWeek;
          }

          // For a genuine regular-season league — Tank01's own real,
          // current week. During this same window this correctly
          // reports week 1 (or similar), since the regular season
          // itself hasn't started yet — never the preseason calendar's
          // week number, which means something different entirely.
          async function getRegularSeasonWeek() {
            try {
              const data = await fetchJson(
                `https://${T01_HOST}/getNFLCurrentWeek`,
                { 'X-RapidAPI-Key': T01_KEY, 'X-RapidAPI-Host': T01_HOST }
              );
              return data.body ? parseInt(data.body.week) : 1;
            } catch(e) {
              console.error('Could not get current week:', e.message);
              return 1;
            }
          }

          // Same active-league discovery as auto-scoring.yml — keeps the
          // two workflows in sync on which leagues are live.
          async function getActiveLeagues() {
            try {
              const leagues = await firebaseGet('/leagues.json?shallow=true');
              if (!leagues || leagues.error) {
                console.log('Could not fetch leagues, falling back to fr_refresh26');
                return ['fr_refresh26'];
              }
              const leagueIds = Object.keys(leagues);
              console.log(`Found ${leagueIds.length} league(s): ${leagueIds.join(', ')}`);
              // FIXED: previously silently dropped any league with no settings
              // node, or whose settings.season didn't exactly match — with
              // zero logging. Kickoff locks silently missing a league means
              // that league's rosters never lock at game time. Now defaults
              // to active/included unless explicitly excluded, and logs why.
              const active = [];
              for (const id of leagueIds) {
                try {
                  const settings = await firebaseGet(`/leagues/${id}/settings.json`);
                  if (settings && settings.active === false) {
                    console.log(`  ⊘ ${id}: skipped — settings.active is explicitly false`);
                    continue;
                  }
                  if (settings && settings.season != null && String(settings.season) !== String(BASE_SEASON)) {
                    console.log(`  ⊘ ${id}: skipped — settings.season (${settings.season}) doesn't match current season (${BASE_SEASON})`);
                    continue;
                  }
                  active.push(id);
                  console.log(`  ✓ ${id}: included${settings ? '' : ' (no settings node — defaulting to active)'}`);
                } catch(e) {
                  console.log(`  ⚠️  ${id}: could not read settings (${e.message}) — including anyway, defaulting to active`);
                  active.push(id);
                }
              }
              if (!active.length) console.log('⚠️  No leagues survived filtering — falling back to fr_refresh26 only');
              return active.length ? active : ['fr_refresh26'];
            } catch(e) {
              console.log('Error fetching leagues:', e.message);
              return ['fr_refresh26'];
            }
          }

          async function lockLeagueWeek(leagueId, week, games, seasonKey) {
            const existingLocks = await firebaseGet(
              `/leagues/${leagueId}/locks/${seasonKey}/week${week}.json`
            ).catch(() => ({}));

            const locks = existingLocks || {};
            let newLocks = 0;

            for (const game of games) {
              const status   = (game.gameStatus || game.status || '').toLowerCase();
              // Confirmed months ago (and only ever fixed in the Worker,
              // never ported here): this endpoint's real field is just
              // 'home'/'away', not 'homeTeamAbbr'/'homeTeam' — checking
              // those first, since if they're always empty, nothing
              // could ever match correctly regardless of status.
              const homeTeam = game.home || game.homeTeamAbbr || game.homeTeam || '';
              const awayTeam = game.away || game.awayTeamAbbr || game.awayTeam || '';
              const gameId   = game.gameID || '';

              console.log(`  Game check: ${awayTeam}@${homeTeam} — raw status: "${game.gameStatus || game.status || '(none)'}"`);

              // Same field mapping already proven correct in the Worker's
              // own /schedule endpoint — gameTime_epoch (seconds) or
              // gameTime (a parseable date string) are Tank01's real
              // fields for a game's scheduled kickoff.
              const kickoffMs = game.gameTime_epoch ? game.gameTime_epoch * 1000
                               : game.gameTime ? new Date(game.gameTime).getTime() : 0;
              // Locking should never depend entirely on Tank01's own
              // status string — confirmed tonight that its reporting can
              // lag several minutes behind a game's real, scheduled
              // kickoff, leaving players unlocked and swappable well
              // after their game had actually started. A game whose
              // known kickoff time has already passed is locked
              // immediately regardless of what Tank01's status currently
              // says — this is static, already-known data with zero
              // dependency on Tank01's own latency at any given moment.
              const pastKickoff = kickoffMs > 0 && Date.now() >= kickoffMs;

              const isLocked = pastKickoff ||
                               status.includes('in progress') ||
                               status.includes('inprogress') ||
                               status.includes('final') ||
                               status === 'completed' ||
                               status === 'live';

              if (pastKickoff && !status.includes('progress') && !status.includes('final') && status !== 'live' && status !== 'completed') {
                console.log(`  ⏰ Locking by scheduled kickoff time (Tank01 status hasn't caught up yet): ${awayTeam}@${homeTeam}`);
              }

              if (isLocked) {
                // Use the real, known scheduled kickoff time when that's
                // what triggered this lock — exactly accurate, rather
                // than "whenever this run happened to execute and
                // notice," which could still be off by up to the ~2
                // minute run interval even with the fix above. Falls
                // back to the actual detection time when locked via
                // Tank01's own status instead, since there's no precise
                // kickoff moment to use in that case.
                const lockTime = pastKickoff ? kickoffMs : Date.now();
                if (!locks[homeTeam]) {
                  locks[homeTeam] = { lockedAt: lockTime, gameId, opponent: awayTeam };
                  newLocks++;
                  console.log(`  Locked: ${homeTeam} (${gameId})`);
                }
                if (!locks[awayTeam]) {
                  locks[awayTeam] = { lockedAt: lockTime, gameId, opponent: homeTeam };
                  newLocks++;
                  console.log(`  Locked: ${awayTeam} (${gameId})`);
                }
              }
            }

            if (newLocks > 0) {
              await firebasePut(`/leagues/${leagueId}/locks/${seasonKey}/week${week}.json`, locks);
              console.log(`  ✅ Wrote ${newLocks} new locks for ${leagueId}`);
            } else {
              console.log(`  No new locks for ${leagueId} this run.`);
            }

            await firebasePut(`/leagues/${leagueId}/locks/${seasonKey}/meta.json`, {
              lastChecked: Date.now(),
              week
            });
          }

          async function main() {
            // Auto-detect preseason vs regular by date, same logic as
            // auto-scoring.yml — this was hardcoded to seasonType=Regular
            // before, meaning it was checking regular-season Week 1 games
            // Switched from getNFLGamesForWeek to getNFLScoresOnly with a
            // gameDate — confirmed via real docs that gameWeek "will
            // default the seasonType to 'regular'" regardless of what's
            // passed, which would fight us on preseason. A specific
            // calendar date sidesteps season type and week-numbering
            // ambiguity entirely, and this is the exact endpoint already
            // directly confirmed working tonight (real gameStatus values
            // seen in testing), unlike the flaky/ambiguous week-based one.
            //
            // Date computed directly in US Eastern time — confirmed
            // tonight that the earlier "try today's UTC date, fall back to
            // yesterday's" heuristic breaks specifically when multiple
            // different days in the same week all have real games
            // scheduled (exactly the case for a preseason week spanning
            // Thu-Mon): once UTC crosses midnight, "today" quietly becomes
            // tomorrow, and since tomorrow ALSO has real games, the
            // fallback to yesterday never triggers — it just confidently
            // locks onto the wrong day. Intl.DateTimeFormat gives the
            // actual, correct US Eastern calendar date directly, handling
            // DST automatically, rather than guessing between UTC
            // candidates.
            const now = new Date();
            const etDate = new Intl.DateTimeFormat('en-CA', {
              timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit'
            }).format(now).replace(/-/g, '');
            console.log(`Today in US Eastern time: ${etDate}`);

            let games = [];
            try {
              const gamesData = await fetchJson(
                `https://${T01_HOST}/getNFLScoresOnly?gameDate=${etDate}`,
                { 'X-RapidAPI-Key': T01_KEY, 'X-RapidAPI-Host': T01_HOST }
              );
              games = Object.values(gamesData.body || {});
              console.log(`Found ${games.length} game(s) for ${etDate} via getNFLScoresOnly`);
            } catch(e) {
              console.log(`  gameDate=${etDate} attempt failed: ${e.message}`);
            }
            if (!games.length) console.log('⚠️  No games found for any week candidate — check seasonType/week manually if this persists.');

            const leagues = await getActiveLeagues();
            console.log(`Leagues to lock: ${leagues.join(', ')}`);

            let regularSeasonWeek = null; // fetched at most once, shared by every regular-season league this run

            for (const leagueId of leagues) {
              console.log(`\n--- ${leagueId} ---`);
              try {
                const settings = await firebaseGet(`/leagues/${leagueId}/settings.json`).catch(() => null);
                const leagueIsPreseason = !!(settings && settings.isPreseason);
                const seasonKey = leagueIsPreseason ? SEASON + 'P' : SEASON;
                let week;
                if (leagueIsPreseason) {
                  week = getPreseasonCalendarWeek();
                } else {
                  if (regularSeasonWeek === null) regularSeasonWeek = await getRegularSeasonWeek();
                  week = regularSeasonWeek;
                }
                console.log(`  ${leagueId}: ${leagueIsPreseason ? 'preseason' : 'regular season'}, week ${week}, path season "${seasonKey}"`);
                // A regular-season league must never lock a team based
                // on a preseason game — confirmed as a real, live bug:
                // today's real games (fetched once, globally, above)
                // are whatever's actually being played right now, which
                // during this entire window is exclusively preseason,
                // and that same shared array was being passed to every
                // league's lockLeagueWeek() call regardless of type.
                // The earlier fix corrected which PATH locks land at
                // (so a preseason league's locks stop overwriting a
                // regular-season league's), but never filtered the
                // actual games being locked against — a preseason
                // team's game was still being treated as evidence that
                // team is locked for the real season's Week 1, months
                // before that's actually true. REAL_SEASON_KICKOFF_MS
                // is the confirmed, real first kickoff of the actual
                // regular season — any game before that timestamp
                // cannot possibly be a genuine regular-season game,
                // regardless of what Tank01's own season-type reporting
                // says.
                const gamesForThisLeague = leagueIsPreseason
                  ? games
                  : games.filter(g => {
                      const t = g.gameTime_epoch ? g.gameTime_epoch * 1000 : (g.gameTime ? new Date(g.gameTime).getTime() : 0);
                      return t >= REAL_SEASON_KICKOFF_MS;
                    });
                await lockLeagueWeek(leagueId, week, gamesForThisLeague, seasonKey);
              } catch(e) {
                console.error(`Failed locking ${leagueId}:`, e.message);
              }
            }
          }

          // Internal loop removed — this workflow will be triggered
          // externally on a reliable cadence (cron-job.org), same as
          // auto-scoring.yml, which supersedes GitHub's own unreliable
          // high-frequency scheduling entirely. Looping internally on
          // top of a reliable external trigger would cause overlapping
          // runs and wasted Tank01 API calls for no benefit.
          main().catch(e => {
            console.error('Lock job failed:', e);
            process.exit(1);
          });
          SCRIPT
