name: One-Time Diagnostic — Find Real Position Field Name

# ONE-TIME USE — delete this file after running it once.
# Fetches the real, raw box score for a recent completed game and
# prints the full, deep structure of a few players' stats objects, to
# find the actual position field name. The current code guesses at
# three field names (pos, position, playerPosition), none of which
# have ever matched, always falling back to the generic "FLEX" label.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch real box score and inspect player stat shape
        env:
          TANK01_KEY: ${{ secrets.TANK01_KEY }}
        run: |
          node << 'SCRIPT'
          const https = require('https');
          const T01_KEY = process.env.TANK01_KEY;
          const T01_HOST = 'tank01-nfl-live-in-game-real-time-statistics-nfl.p.rapidapi.com';
          const GAME_ID = '20260820_LV@HOU';

          function t01(path) {
            return new Promise((resolve, reject) => {
              https.get({
                hostname: T01_HOST, path, headers: {
                  'X-RapidAPI-Key': T01_KEY, 'X-RapidAPI-Host': T01_HOST
                }
              }, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          async function main() {
            const bs = await t01(`/getNFLBoxScore?gameID=${GAME_ID}&fantasyPoints=true&PPRScoring=true`);
            const playerStats = (bs.body && bs.body.playerStats) || {};
            const ids = Object.keys(playerStats);
            console.log(`Found ${ids.length} players in playerStats.\n`);

            // Print the FULL, raw object for the first 5 players — every
            // field, not a shallow summary — so the real position field
            // name is directly visible, whatever it's actually called.
            ids.slice(0, 5).forEach(id => {
              console.log(`=== Player key: ${id} ===`);
              console.log(JSON.stringify(playerStats[id], null, 2));
              console.log('');
            });
          }

          main().catch(e => { console.error('Failed:', e); process.exit(1); });
          SCRIPT
