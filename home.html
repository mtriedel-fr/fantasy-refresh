<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#00E5D4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fantasy Refresh — My Leagues</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon.svg">
<script src="/js/auth.js"></script>
<script src="/league-context.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/theme.css">
<style>
/* :root variables now live in /css/theme.css — removed from here to stop the per-file drift the review flagged */
[data-theme="light"]{
  --hdr:#F0F8F8;--bg:#F5FAFA;--bg2:#E8F5F5;--bg3:#DCF0F0;
  --or:#007A70;--pk:#CC3070;--pu:#6030CC;
  --ink:#0A1818;--ink2:#1A6060;--ink3:#3A8888;
  --bdr:#B0DEDE;--bdr2:#80CCCC;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);min-height:100vh;}

/* HEADER */
.hdr{background:var(--hdr);border-bottom:2px solid var(--pk);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.hdr-logo{display:flex;align-items:center;gap:10px;}
.hdr-logo-text{font-family:var(--fd);font-size:22px;font-weight:800;color:var(--ink);text-transform:uppercase;letter-spacing:.5px;}
.hdr-logo-text span{color:var(--pk);}
.hdr-right{display:flex;align-items:center;gap:8px;}
.hdr-user{font-family:var(--fd);font-size:13px;font-weight:700;color:var(--or);background:rgba(0,229,212,.1);border:1px solid rgba(0,229,212,.25);padding:6px 12px;border-radius:20px;cursor:pointer;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis;transition:all .15s;}
.hdr-user:hover{background:rgba(0,229,212,.2);}
.hdr-btn{background:transparent;border:1px solid var(--bdr2);color:var(--ink3);font-size:15px;width:34px;height:34px;border-radius:8px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;}
.hdr-btn:hover{border-color:var(--or);}

/* MAIN */
.main{max-width:600px;margin:0 auto;padding:24px 16px 90px;}

/* PROFILE BTN */
.profile-btn{display:flex;align-items:center;gap:7px;background:rgba(0,229,212,.08);border:1px solid rgba(0,229,212,.2);border-radius:20px;padding:5px 12px 5px 5px;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;}
.profile-btn:hover{background:rgba(0,229,212,.15);}
.profile-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--or),var(--pk));display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:12px;font-weight:800;color:#050808;flex-shrink:0;}
.profile-btn span:last-child{font-family:var(--fd);font-size:13px;font-weight:700;color:var(--or);white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;}

/* GREETING */
.greeting{margin-bottom:28px;}
.greeting-eyebrow{font-family:var(--fd);font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:2px;margin-bottom:4px;}
.greeting-name{font-family:var(--fd);font-size:34px;font-weight:900;color:var(--ink);text-transform:uppercase;line-height:1;}
.greeting-name span{color:var(--or);}

/* SECTION LABEL */
.section-label{font-family:var(--fd);font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;margin-top:4px;}

/* LEAGUE CARD */
.league-card{background:var(--bg2);border-radius:16px;border:1px solid var(--bdr);margin-bottom:12px;overflow:hidden;cursor:pointer;transition:transform .12s,box-shadow .12s;-webkit-tap-highlight-color:transparent;}
.league-card:active{transform:scale(.98);}
.league-card:hover{box-shadow:0 6px 24px rgba(0,229,212,.07);}
.card-top-bar{height:3px;background:linear-gradient(90deg,var(--or),var(--pk));}
.card-top-bar.guillotine{background:linear-gradient(90deg,var(--pk),var(--pu));}
.card-top-bar.headtohead{background:linear-gradient(90deg,var(--pu),var(--or));}
.card-inner{padding:16px 18px;}
.card-row1{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;}
.card-info{flex:1;min-width:0;}
.card-name{font-family:var(--fd);font-size:20px;font-weight:800;color:var(--ink);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px;}
.card-badges{display:flex;gap:5px;flex-wrap:wrap;}
.badge{font-family:var(--fd);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 8px;border-radius:10px;}
.badge-format{background:rgba(0,229,212,.1);color:var(--or);border:1px solid rgba(0,229,212,.25);}
.badge-guillotine{background:rgba(255,95,160,.1);color:var(--pk);border:1px solid rgba(255,95,160,.25);}
.badge-h2h{background:rgba(155,109,255,.1);color:var(--pu);border:1px solid rgba(155,109,255,.25);}
.badge-comm{background:rgba(0,229,212,.1);color:var(--or);border:1px solid rgba(0,229,212,.25);}
.card-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.gear-btn{background:rgba(0,229,212,.08);border:1px solid rgba(0,229,212,.2);color:var(--or);width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0;}
.gear-btn:hover{background:rgba(0,229,212,.15);}
.gear-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.enter-btn{background:var(--or);color:#050808;width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s;}
.enter-btn:hover{background:var(--or2,#33EDE0);}
.enter-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.card-team-row{display:flex;align-items:center;gap:6px;margin-bottom:11px;}
.card-team-label{font-family:var(--fd);font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;}
.card-team-name{font-family:var(--fd);font-size:14px;font-weight:700;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--bdr);border-radius:10px;overflow:hidden;}
.stat{background:var(--bg3);padding:10px 0;text-align:center;}
.stat-label{font-family:var(--fd);font-size:9px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;}
.stat-val{font-family:var(--fd);font-size:20px;font-weight:800;line-height:1;}
.stat-val.rank{color:var(--pk);}
.stat-val.score{color:var(--or);}
.stat-val.neutral{color:var(--ink2);}

/* ACTION CARDS */
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;}
.action-card{background:var(--bg2);border:1px solid var(--bdr);border-radius:14px;padding:20px 16px;cursor:pointer;transition:all .15s;text-align:center;-webkit-tap-highlight-color:transparent;}
.action-card:hover{border-color:var(--or);background:var(--bg3);}
.action-card:active{transform:scale(.97);}
.action-icon{font-size:30px;margin-bottom:10px;}
.action-title{font-family:var(--fd);font-size:15px;font-weight:800;color:var(--ink);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;}
.action-sub{font-size:12px;color:var(--ink3);line-height:1.4;}

/* EMPTY */
.empty-state{text-align:center;padding:48px 24px;background:var(--bg2);border-radius:16px;border:1px dashed var(--bdr2);}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.5;}
.empty-title{font-family:var(--fd);font-size:20px;font-weight:800;color:var(--ink2);text-transform:uppercase;margin-bottom:8px;}
.empty-sub{font-size:13px;color:var(--ink3);line-height:1.6;}

/* LOADING */
.loading-wrap{display:flex;flex-direction:column;align-items:center;padding:56px 24px;gap:14px;}
.spinner{width:36px;height:36px;border:3px solid var(--bdr2);border-top-color:var(--or);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-family:var(--fd);font-size:12px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:1px;}

/* GREETING MESSAGE */
.greeting-message{font-size:14px;color:var(--ink2);margin-top:6px;line-height:1.5;min-height:20px;font-style:italic;}

/* WEEK PILL */
.week-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,95,160,.1);border:1px solid rgba(255,95,160,.25);border-radius:20px;padding:5px 12px;margin-bottom:16px;}
.week-dot{width:6px;height:6px;border-radius:50%;background:var(--pk);flex-shrink:0;}
.week-text{font-family:var(--fd);font-size:11px;font-weight:700;color:var(--pk);text-transform:uppercase;letter-spacing:.5px;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--hdr);border-top:1px solid var(--bdr);display:flex;align-items:center;z-index:100;padding-bottom:env(safe-area-inset-bottom);}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 0 8px;gap:3px;cursor:pointer;-webkit-tap-highlight-color:transparent;border:none;background:transparent;}
.bn-icon{font-size:20px;line-height:1;}
.bn-label{font-family:var(--fd);font-size:9px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
.bn-item.active .bn-label{color:var(--or);}
.bn-item.active .bn-icon{filter:drop-shadow(0 0 3px var(--or));}
.bn-item:not(.active) .bn-label{color:var(--ink3);}
.bn-item:not(.active) .bn-icon{opacity:.6;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--or);color:#050808;font-family:var(--fd);font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:12px 24px;border-radius:10px;opacity:0;transition:all .3s;z-index:9999;pointer-events:none;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.toast.err{background:var(--pk);}

/* MOBILE */
@media(max-width:480px){
  .main{padding:20px 12px 100px;}
  .greeting-name{font-size:28px;}
  .card-name{font-size:17px;}
  .stat-val{font-size:18px;}
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-logo">
    <svg style="width:34px;height:34px;flex-shrink:0;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
      <defs>
        <linearGradient id="tlg" x1="100%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#00E5D4"/><stop offset="100%" stop-color="#00E5D4" stop-opacity="0.6"/></linearGradient>
        <linearGradient id="plg" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FF5FA0"/><stop offset="100%" stop-color="#FF5FA0" stop-opacity="0.6"/></linearGradient>
      </defs>
      <rect x="25" y="25" width="350" height="350" rx="70" fill="#050808"/>
      <g transform="translate(200,200) scale(3.79) translate(-475.5,-241.6)">
        <path fill="url(#tlg)" d="M504.547,265.443h-9.019a30.964,30.964,0,0,0-29.042-52.733,1.5,1.5,0,1,0,.792,2.894,27.955,27.955,0,0,1,25.512,48.253l0-10.169h-.011a1.493,1.493,0,0,0-2.985,0h0v13.255a1.5,1.5,0,0,0,1.5,1.5h13.256a1.5,1.5,0,1,0,0-3Z"/>
        <path fill="url(#plg)" d="M485.389,267.995a27.956,27.956,0,0,1-25.561-48.213l0,10.2h.015a1.491,1.491,0,0,0,2.978,0h.007V216.791a1.484,1.484,0,0,0-1.189-1.532l-.018-.005a1.533,1.533,0,0,0-.223-.022c-.024,0-.046-.007-.07-.007H448.071a1.5,1.5,0,0,0,0,3h8.995a30.963,30.963,0,0,0,29.115,52.664,1.5,1.5,0,0,0-.792-2.894Z"/>
      </g>
    </svg>
    <div class="hdr-logo-text">Fantasy <span>Refresh</span></div>
    <button onclick="showMyWelcomeTour()" title="Show the welcome tour again" style="margin-left:4px;width:22px;height:22px;border-radius:50%;border:1px solid var(--bdr);background:transparent;color:var(--ink3);font-family:var(--fd);font-size:12px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;">?</button>
  </div>
  <div class="hdr-right">
    <button class="profile-btn" id="hdr-user" onclick="openProfileDrawer()">
      <span class="profile-avatar" id="hdr-avatar">—</span>
      <span id="hdr-name">—</span>
    </button>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <div class="greeting">
    <div class="greeting-name" id="greeting-name">—<span>'s Leagues</span></div>
  </div>

  <div class="week-pill" id="week-pill">
    <div class="week-dot"></div>
    <span class="week-text" id="week-pill-text">Preseason · Season starts Sep 4</span>
  </div>

  <div id="leagues-wrap">
    <div class="loading-wrap">
      <div class="spinner"></div>
      <div class="loading-text">Loading your leagues</div>
    </div>
  </div>



</div>

<div class="toast" id="toast"></div>

<!-- PROFILE DRAWER -->
<div id="profile-overlay" onclick="closeProfileDrawer()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;"></div>
<div id="profile-drawer" style="display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-radius:20px 20px 0 0;border-top:3px solid var(--or);z-index:501;padding:0 0 env(safe-area-inset-bottom);max-height:85vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s ease;">
  <div style="display:flex;justify-content:center;padding:12px 0 4px;">
    <div style="width:36px;height:4px;border-radius:2px;background:var(--bdr2);"></div>
  </div>
  <div style="padding:16px 24px 20px;border-bottom:1px solid var(--bdr);">
    <div style="display:flex;align-items:center;gap:14px;">
      <div id="pd-avatar" style="width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--or),var(--pk));display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:22px;font-weight:900;color:#050808;flex-shrink:0;">—</div>
      <div style="flex:1;min-width:0;">
        <div id="pd-name" style="font-family:var(--fd);font-size:20px;font-weight:900;color:var(--ink);text-transform:uppercase;letter-spacing:.3px;">—</div>
        <div id="pd-email" style="font-size:12px;color:var(--ink3);margin-top:2px;">—</div>
      </div>
    </div>
  </div>
  <div style="padding:8px 0;">
    <!-- Appearance -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 24px;cursor:pointer;" onclick="toggleThemeFromDrawer()">
      <div style="display:flex;align-items:center;gap:12px;">
        <span id="pd-theme-icon" style="font-size:18px;">🌙</span>
        <div>
          <div style="font-family:var(--fd);font-size:15px;font-weight:700;color:var(--ink);text-transform:uppercase;">Appearance</div>
          <div id="pd-theme-label" style="font-size:12px;color:var(--ink3);">Dark mode</div>
        </div>
      </div>
      <div id="pd-theme-toggle" style="width:44px;height:24px;border-radius:12px;background:var(--bdr2);position:relative;transition:background .2s;">
        <div id="pd-toggle-dot" style="position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#F0FAFA;transition:left .2s;"></div>
      </div>
    </div>
    <!-- Change Password -->
    <div style="border-top:1px solid var(--bdr);">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 24px;cursor:pointer;" onclick="togglePasswordChange()">
        <div style="display:flex;align-items:center;gap:12px;">
          <span style="font-size:18px;">🔑</span>
          <div>
            <div style="font-family:var(--fd);font-size:15px;font-weight:700;color:var(--ink);text-transform:uppercase;">Change Password</div>
            <div style="font-size:12px;color:var(--ink3);">Send a reset link to your email</div>
          </div>
        </div>
        <span style="color:var(--ink3);font-size:18px;">›</span>
      </div>
      <div id="pd-pw-section" style="display:none;padding:0 24px 16px;">
        <button onclick="sendPasswordReset()" style="width:100%;padding:11px;background:var(--bg3);border:1px solid var(--bdr2);border-radius:10px;color:var(--or);font-family:var(--fd);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;">Send Reset Email →</button>
        <div id="pd-pw-status" style="font-family:var(--fd);font-size:11px;color:var(--or);text-align:center;margin-top:8px;min-height:14px;text-transform:uppercase;letter-spacing:.5px;"></div>
      </div>
    </div>
    <!-- Sign out -->
    <div style="border-top:1px solid var(--bdr);padding:14px 24px;">
      <button onclick="FRAuth.signOut()" style="width:100%;padding:12px;background:rgba(255,95,160,.08);border:1px solid rgba(255,95,160,.2);border-radius:10px;color:var(--pk);font-family:var(--fd);font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;">Sign Out</button>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="bn-item active" onclick="window.location.href='/home.html'">
    <span class="bn-icon">🏠</span>
    <span class="bn-label">Home</span>
  </button>
  <button class="bn-item" onclick="goToLeague()">
    <span class="bn-icon">🏈</span>
    <span class="bn-label">League</span>
  </button>
  <button class="bn-item" onclick="handleCreateLeagueTap()">
    <span class="bn-icon">🏆</span>
    <span class="bn-label">Create</span>
  </button>
  <button class="bn-item" onclick="window.location.href='/league-setup.html?mode=join'">
    <span class="bn-icon">🎟</span>
    <span class="bn-label">Join</span>
  </button>
</nav>

<script>
// ── ROUTE GUARD ──────────────────────────────────────────────────
// One line — if not signed in, go to welcome
if (!FRAuth.requireAuth()) { /* requireAuth handles the redirect */ }

var FB_DB_URL = FRAuth.FB_DB_URL;
var user = FRAuth.getUser();

// ── THEME ────────────────────────────────────────────────────────
function toggleTheme() {
  var next = FRAuth.toggleTheme();
  document.getElementById('theme-btn').textContent = next === 'light' ? '☀️' : '🌙';
}
(function() {
  var t = FRAuth.applyTheme();
  var btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = t === 'light' ? '☀️' : '🌙';
})();

// ── TOAST ────────────────────────────────────────────────────────
// showToast() now provided by the shared league-context.js global —
// removed the local duplicate that used to live here.

// ── SIGN OUT ─────────────────────────────────────────────────────
function confirmSignOut() {
  var name = user ? (user.displayName || user.teamName || user.email) : '';
  if (confirm('Signed in as: ' + name + '\n\nSign out?')) {
    FRAuth.signOut(); // clears storage and goes to welcome
  }
}

// ── ENTER LEAGUE ─────────────────────────────────────────────────
function enterLeague(leagueId) {
  fetch(FB_DB_URL + '/leagues/' + leagueId + '/settings.json')
    .then(function(r) { return r.json(); })
    .then(function(s) {
      if (s && !s.error) {
        FRAuth.enterLeague(leagueId, s, user ? user.teamName : '');
      }
      window.location.href = '/league.html';
    })
    .catch(function() { window.location.href = '/league.html'; });
}

// ── COMMISSIONER SETTINGS ────────────────────────────────────────
function openCommSettings(leagueId, e) {
  e.stopPropagation();
  fetch(FB_DB_URL + '/leagues/' + leagueId + '/settings.json')
    .then(function(r) { return r.json(); })
    .then(function(s) {
      if (s && !s.error) FRAuth.enterLeague(leagueId, s, user ? user.teamName : '');
      window.location.href = '/league.html?comm=1';
    })
    .catch(function() {
      try{ localStorage.setItem('fr_league_ctx', JSON.stringify({leagueId:leagueId,leagueName:leagueId,season:2026})); }catch(e2){}
      window.location.href = '/league.html?comm=1';
    });
}

// ── SEASON/WEEK TOGGLE ────────────────────────────────────────────
function switchCardView(cardIdSuffix, view) {
  var wkStats  = document.getElementById('wk-stats-' + cardIdSuffix);
  var sznStats = document.getElementById('szn-stats-' + cardIdSuffix);
  var wkBtn    = document.getElementById('tgl-wk-' + cardIdSuffix);
  var sznBtn   = document.getElementById('tgl-szn-' + cardIdSuffix);
  if (!wkStats || !sznStats || !wkBtn || !sznBtn) return;

  var showWeek = view === 'week';
  wkStats.style.display  = showWeek ? '' : 'none';
  sznStats.style.display = showWeek ? 'none' : '';
  wkBtn.style.background  = showWeek ? 'var(--pk)' : 'transparent';
  wkBtn.style.color       = showWeek ? '#fff' : 'var(--ink2)';
  sznBtn.style.background = showWeek ? 'transparent' : 'var(--pk)';
  sznBtn.style.color      = showWeek ? 'var(--ink2)' : '#fff';
}

// ── FORMAT HELPERS ───────────────────────────────────────────────
function formatBadge(s) {
  if (s.guillotine) return '<span class="badge badge-guillotine">☠️ Guillotine</span>';
  if (s.format === 'headtohead') return '<span class="badge badge-h2h">⚔️ H2H</span>';
  return '<span class="badge badge-format">📊 Cumulative</span>';
}

function barClass(s) {
  if (s.guillotine) return 'guillotine';
  if (s.format === 'headtohead') return 'headtohead';
  return '';
}

// ── SEASON-LONG STATS ────────────────────────────────────────────
// Pulls real entries out of a week's raw Firebase object (keyed by
// team uid, with an "ownership" sibling key that isn't a real team).
function weekEntries(seasonData, wk) {
  var raw = (seasonData && seasonData[String(wk)]) || {};
  return Object.keys(raw)
    .filter(function(k) { return k !== 'ownership' && raw[k] && raw[k].team; })
    .map(function(k) { return raw[k]; });
}

// Same elimination-schedule formula already proven correct twice
// tonight — once in league.html's own live client-side view, once
// ported to auto-scoring.yml for the recap feature. Reused here as-is
// rather than writing a third, separate version that could drift from
// the other two over time.
// buildElimSchedule() and computeGuillotineAlive() removed — guillotine
// status now comes from the real, persisted backend value (computed
// once by auto-scoring.yml exactly when a week finishes), fetched
// alongside everything else in renderCards(), rather than this page
// independently replaying the entire season from scratch every time.

// Season totals (sum of every week's real score) and season rank,
// computed from the same seasonData already fetched for the weekly
// view — no extra fetch needed. Guillotine status is only meaningful
// once real weeks have actually been played, hence the weeks.length
// check before attempting the replay.
function computeSeasonStats(l, teamName) {
  var out = { total: '—', rank: '—', guillotineStatus: null };
  if (!l.seasonData) return out;
  var weeks = Object.keys(l.seasonData).filter(function(k) {
    return !isNaN(Number(k)) && l.seasonData[k] && Object.keys(l.seasonData[k]).length;
  }).map(Number).sort(function(a, b) { return a - b; });
  if (!weeks.length) return out;

  var totals = {}; // team name (lowercase) -> {team, total}
  weeks.forEach(function(w) {
    weekEntries(l.seasonData, w).forEach(function(e) {
      var key = e.team.toLowerCase();
      if (!totals[key]) totals[key] = { team: e.team, total: 0 };
      totals[key].total += (typeof e.score === 'number' ? e.score : 0);
    });
  });
  var totalsList = Object.keys(totals).map(function(k) { return totals[k]; });
  var mine = totalsList.filter(function(t) { return teamName && t.team.toLowerCase() === teamName.toLowerCase(); })[0];
  if (mine) {
    out.total = mine.total.toFixed(1);
    var sorted = totalsList.slice().sort(function(a, b) { return b.total - a.total; });
    var r = sorted.findIndex(function(t) { return t.team.toLowerCase() === mine.team.toLowerCase(); });
    out.rank = r >= 0 ? '#' + (r + 1) : '—';
  }

  if (l.settings && l.settings.guillotine) {
    // Real, persisted status from the backend, fetched alongside
    // everything else in renderCards() — not recomputed here anymore.
    var gs = l.guillotineStatus && l.guillotineStatus.teams;
    if (gs && teamName) {
      var teamEntry = null;
      Object.keys(gs).forEach(function(t) {
        if (t.toLowerCase() === teamName.toLowerCase()) teamEntry = gs[t];
      });
      out.guillotineStatus = teamEntry ? teamEntry.status : null;
    }
  }

  return out;
}

// ── BUILD LEAGUE CARD ────────────────────────────────────────────
function buildCard(l) {
  var s        = l.settings;
  var m        = l.member;
  var teamName = (m && m.teamName) || (user && user.teamName) || '—';
  var bar      = barClass(s);

  // Stats from season data
  var rank = '—', score = '—', wksLeft = '—';
  if (l.seasonData) {
    // Real Firebase shape is an object keyed by team uid (e.g.
    // {"uid1": {...}, "uid2": {...}, "ownership": {...}}), not an
    // array — .length on a plain object is always undefined, which
    // silently made every week look empty regardless of real data
    // present. Object.keys(...).length is the correct check, and
    // "ownership" (a sibling key, not a real team entry) needs to be
    // filtered out before treating this as a list of teams.
    var weeks = Object.keys(l.seasonData).filter(function(k) {
      return !isNaN(Number(k)) && l.seasonData[k] && Object.keys(l.seasonData[k]).length;
    }).map(Number);
    if (weeks.length) {
      var latest      = Math.max.apply(null, weeks);
      var weekEntries = l.seasonData[String(latest)] || {};
      var entries     = Object.keys(weekEntries)
        .filter(function(k) { return k !== 'ownership' && weekEntries[k] && weekEntries[k].team; })
        .map(function(k) { return weekEntries[k]; });
      var mine = entries.find(function(e) {
        return e.team && teamName && e.team.toLowerCase() === teamName.toLowerCase();
      });
      if (mine) {
        score = typeof mine.score === 'number' ? mine.score.toFixed(1) : '—';
        var sorted = entries.slice().sort(function(a, b) { return b.score - a.score; });
        var r = sorted.findIndex(function(e) { return e.uid === mine.uid; });
        rank = r >= 0 ? '#' + (r + 1) : '—';
      }
      wksLeft = 18 - weeks.length;
    }
  }

  var seasonStats = computeSeasonStats(l, teamName);
  var cardIdSuffix = l.leagueId.replace(/[^a-zA-Z0-9]/g, '');
  var weekStatsId   = 'wk-stats-' + cardIdSuffix;
  var seasonStatsId = 'szn-stats-' + cardIdSuffix;
  var toggleWkId    = 'tgl-wk-' + cardIdSuffix;
  var toggleSznId   = 'tgl-szn-' + cardIdSuffix;

  var guillotineBadge = '';
  if (seasonStats.guillotineStatus === 'alive') {
    guillotineBadge = '<div style="text-align:center;font-family:var(--fd);font-size:12px;font-weight:800;color:#22C55E;padding:8px 0 2px;">💚 STILL ALIVE</div>';
  } else if (seasonStats.guillotineStatus === 'eliminated') {
    guillotineBadge = '<div style="text-align:center;font-family:var(--fd);font-size:12px;font-weight:800;color:#EF4444;padding:8px 0 2px;">☠️ ELIMINATED</div>';
  }

  // Toggle buttons stop click propagation so tapping them switches the
  // view instead of also triggering the card's own navigation into the
  // league (the whole card is clickable via its own onclick).
  var toggleRow = '<div style="display:flex;gap:6px;margin:8px 0 4px;" onclick="event.stopPropagation();">'
    + '<button id="' + toggleWkId + '" onclick="switchCardView(\'' + cardIdSuffix + '\',\'week\')" style="flex:1;padding:6px;border-radius:8px;border:1px solid var(--bdr);background:var(--pk);color:#fff;font-family:var(--fd);font-size:11px;font-weight:800;cursor:pointer;">WEEK</button>'
    + '<button id="' + toggleSznId + '" onclick="switchCardView(\'' + cardIdSuffix + '\',\'season\')" style="flex:1;padding:6px;border-radius:8px;border:1px solid var(--bdr);background:transparent;color:var(--ink2);font-family:var(--fd);font-size:11px;font-weight:800;cursor:pointer;">SEASON</button>'
    + '</div>';

  var weekStatsBlock = '<div id="' + weekStatsId + '">'
    + '<div class="card-stats">'
    + '<div class="stat"><div class="stat-label">Rank</div><div class="stat-val rank">' + rank + '</div></div>'
    + '<div class="stat"><div class="stat-label">Score</div><div class="stat-val score">' + score + '</div></div>'
    + '<div class="stat"><div class="stat-label">Wks Left</div><div class="stat-val neutral">' + (typeof wksLeft === 'number' ? wksLeft : '—') + '</div></div>'
    + '</div>'
    + '</div>';

  var seasonStatsBlock = '<div id="' + seasonStatsId + '" style="display:none;">'
    + '<div class="card-stats">'
    + '<div class="stat"><div class="stat-label">Season Rank</div><div class="stat-val rank">' + seasonStats.rank + '</div></div>'
    + '<div class="stat"><div class="stat-label">Total Pts</div><div class="stat-val score">' + seasonStats.total + '</div></div>'
    + '<div class="stat"><div class="stat-label">Wks Left</div><div class="stat-val neutral">' + (typeof wksLeft === 'number' ? wksLeft : '—') + '</div></div>'
    + '</div>'
    + guillotineBadge
    + '</div>';

  var commBadge = l.isComm ? '<span class="badge badge-comm">👑 Commissioner</span>' : '';
  var gearBtn   = l.isComm
    ? '<div class="gear-btn" onclick="openCommSettings(\'' + l.leagueId + '\',event)" title="League settings">'
      + '<svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>'
      + '<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>'
      + '</div>'
    : '';

  var cardId = 'card-msg-' + l.leagueId;
  var card = '<div class="league-card" onclick="enterLeague(\'' + l.leagueId + '\')">'
    + '<div class="card-top-bar ' + bar + '"></div>'
    + '<div class="card-inner">'
    + '<div class="card-row1">'
    + '<div class="card-info">'
    + '<div class="card-name">' + s.name + '</div>'
    + '<div class="card-badges">' + formatBadge(s) + commBadge + '</div>'
    + '</div>'
    + '<div class="card-actions">' + gearBtn
    + '<div class="enter-btn"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></div>'
    + '</div>'
    + '</div>'
    + '<div class="card-team-row">'
    + '<span class="card-team-name" style="font-family:var(--fd);font-size:14px;font-weight:700;color:var(--ink2);">' + teamName + '</span>'
    + '</div>'
    + toggleRow
    + weekStatsBlock
    + seasonStatsBlock
    + '<div id="' + cardId + '" style="font-size:13px;color:var(--ink2);font-style:italic;padding:10px 0 2px;min-height:0;line-height:1.4;"></div>'
    + '</div>'
    + '</div>';

  // Load message for this league async
  fetch(FB_DB_URL + '/leagues/' + l.leagueId + '/settings/weekMessage.json')
    .then(function(r){ return r.json(); })
    .then(function(msg){
      var el = document.getElementById(cardId);
      if(el && msg && typeof msg === 'string' && msg.trim()){
        el.textContent = '“' + msg.trim() + '”';
        el.style.paddingTop = '10px';
      }
    }).catch(function(){});

  return card;
}

// ── PROFILE DRAWER ────────────────────────────────────────────
function openProfileDrawer(){
  if(!user) return;
  var name = user.displayName || user.email || '—';
  var initials = name.charAt(0).toUpperCase();
  var avatar = document.getElementById('pd-avatar');
  var pdName = document.getElementById('pd-name');
  var pdEmail = document.getElementById('pd-email');
  if(avatar) avatar.textContent = initials;
  if(pdName) pdName.textContent = name;
  if(pdEmail) pdEmail.textContent = user.email || '—';
  updateDrawerTheme();
  var overlay = document.getElementById('profile-overlay');
  var drawer = document.getElementById('profile-drawer');
  if(overlay) overlay.style.display = 'block';
  if(drawer){ drawer.style.display = 'block'; setTimeout(function(){ drawer.style.transform = 'translateY(0)'; }, 10); }
}

function closeProfileDrawer(){
  var overlay = document.getElementById('profile-overlay');
  var drawer = document.getElementById('profile-drawer');
  if(drawer) drawer.style.transform = 'translateY(100%)';
  setTimeout(function(){
    if(overlay) overlay.style.display = 'none';
    if(drawer) drawer.style.display = 'none';
  }, 300);
}

function updateDrawerTheme(){
  var t = document.documentElement.getAttribute('data-theme');
  var isLight = t === 'light';
  var icon = document.getElementById('pd-theme-icon');
  var label = document.getElementById('pd-theme-label');
  var toggle = document.getElementById('pd-theme-toggle');
  var dot = document.getElementById('pd-toggle-dot');
  if(icon) icon.textContent = isLight ? '☀️' : '🌙';
  if(label) label.textContent = isLight ? 'Light mode' : 'Dark mode';
  if(toggle) toggle.style.background = isLight ? 'var(--or)' : 'var(--bdr2)';
  if(dot){ dot.style.left = isLight ? '22px' : '2px'; }
}

function toggleThemeFromDrawer(){
  var next = FRAuth.toggleTheme();
  document.documentElement.setAttribute('data-theme', next);
  updateDrawerTheme();
}

function togglePasswordChange(){
  var s = document.getElementById('pd-pw-section');
  if(s) s.style.display = s.style.display === 'none' ? 'block' : 'none';
}

function sendPasswordReset(){
  if(!user || !user.email) return;
  var status = document.getElementById('pd-pw-status');
  if(status) status.textContent = 'Sending…';
  FRAuth.resetPassword(user.email)
    .then(function(){ if(status) status.textContent = '✓ Reset email sent'; })
    .catch(function(e){ if(status){ status.style.color='var(--pk)'; status.textContent='✗ Error'; } });
}

// ── LOAD LEAGUES ─────────────────────────────────────────────────
function loadLeagues() {
  if (!user) return;

  var uid         = user.uid;
  var displayName = user.displayName || user.email || 'Coach';

  // Update greeting and header
  var greet = document.getElementById('greeting-name');
  if (greet) greet.innerHTML = displayName + '<span>\'s Leagues</span>';
  var nameEl = document.getElementById('hdr-name');
  var avatarEl = document.getElementById('hdr-avatar');
  if (nameEl) nameEl.textContent = displayName;
  if (avatarEl) avatarEl.textContent = displayName.charAt(0).toUpperCase();

  // Collect league IDs to check
  var leagueIds = ['fr_refresh26'];
  try {
    var ctx = FRAuth.getLeagueCtx();
    if (ctx && ctx.leagueId && leagueIds.indexOf(ctx.leagueId) < 0) {
      leagueIds.push(ctx.leagueId);
    }
  } catch(e) {}

  // Try user profile for additional leagues (non-blocking)
  fetch(FB_DB_URL + '/users/' + uid + '.json')
    .then(function(r) { return r.json(); })
    .then(function(profile) {
      if (profile && !profile.error && profile.leagues) {
        Object.keys(profile.leagues).forEach(function(id) {
          if (leagueIds.indexOf(id) < 0) leagueIds.push(id);
        });
      }
      renderCards(leagueIds, uid);
    })
    .catch(function() { renderCards(leagueIds, uid); });
}

// ── WELCOME TOUR ──────────────────────────────────────────────────
// Same shared pattern as league.html and draft.html: WELCOME_TOUR_KEY
// tracks whether THIS specific page's tour has been dismissed,
// WELCOME_TOUR_OPTOUT_KEY is the identical, shared key across every
// page — if set anywhere, it suppresses all of them everywhere, for
// someone who just doesn't want these at all.
var WELCOME_TOUR_KEY = 'fr_welcome_tour_seen_home';
var WELCOME_TOUR_TITLE = '👋 Welcome to Fantasy Refresh!';
var WELCOME_TOUR_ITEMS = [
  { icon: '🏆', title: 'Your Leagues', body: 'Every league you\u2019re part of shows here, with your current rank and score. Tap a card to jump into that league.' },
  { icon: '🔀', title: 'Week / Season Toggle', body: 'Switch between this week\u2019s standing and your cumulative season-long total and rank, right on each card.' },
  { icon: '💀', title: 'Guillotine Status', body: 'In a guillotine league, switch to Season view to see whether you\u2019re still alive or already eliminated.' },
  { icon: '⚙️', title: 'League Settings', body: 'If you\u2019re commissioner of a league, the gear icon on its card opens settings for that league.' }
];

function showMyWelcomeTour(){
  showWelcomeTour(WELCOME_TOUR_KEY, WELCOME_TOUR_TITLE, WELCOME_TOUR_ITEMS);
}

// showWelcomeTourIfNeeded/dismissWelcomeTour/optOutWelcomeTours are now
// the shared, parameterized versions from league-context.js.

function renderCards(leagueIds, uid) {
  var wrap = document.getElementById('leagues-wrap');

  Promise.all(leagueIds.map(function(leagueId) {
    return Promise.all([
      fetch(FB_DB_URL + '/leagues/' + leagueId + '/settings.json').then(function(r) { return r.json(); }),
      fetch(FB_DB_URL + '/leagues/' + leagueId + '/members/' + uid + '.json').then(function(r) { return r.json(); }),
      fetch(FB_DB_URL + '/leagues/' + leagueId + '/settings/commissioners/' + uid + '.json').then(function(r) { return r.json(); }),
      fetch(FB_DB_URL + '/leagues/' + leagueId + '/season/' + FR.seasonKey() + '.json').then(function(r) { return r.json(); }).catch(function() { return null; }),
      // Real, persisted guillotine status — computed once on the
      // backend exactly when a week finishes, the same way scores
      // themselves work. Replaces this page independently replaying
      // the entire season from scratch every time someone loads it.
      // Cheap to fetch unconditionally even for non-guillotine leagues,
      // where it just resolves to nothing.
      fetch(FB_DB_URL + '/leagues/' + leagueId + '/guillotineStatus/' + FR.seasonKey() + '.json').then(function(r) { return r.json(); }).catch(function() { return null; })
    ]).then(function(res) {
      var settings = res[0];
      var isCreator = !!(settings && settings.createdBy === uid);
      return {
        leagueId:   leagueId,
        settings:   settings,
        member:     res[1],
        isComm:     res[2] === true || isCreator,
        seasonData: res[3],
        guillotineStatus: res[4]
      };
    }).catch(function() { return null; });
  }))
  .then(function(all) {
    // Only show leagues where this user is a member
    var mine = all.filter(function(l) {
      return l && l.settings && !l.settings.error && l.member && !l.member.error;
    });

    if (!mine.length) {
      wrap.innerHTML = '<div class="empty-state">'
        + '<div class="empty-icon">🏈</div>'
        + '<div class="empty-title">No leagues yet</div>'
        + '<div class="empty-sub">Create a new league or use a join code to get started.</div>'
        + '</div>';
      return;
    }

    wrap.innerHTML = mine.map(buildCard).join('');
    showWelcomeTourIfNeeded(WELCOME_TOUR_KEY, WELCOME_TOUR_TITLE, WELCOME_TOUR_ITEMS);

  })
  .catch(function(err) {
    console.error('Failed to load/render leagues:', err);
    wrap.innerHTML = '<div class="empty-state">'
      + '<div class="empty-icon">⚠️</div>'
      + '<div class="empty-title">Could not load leagues</div>'
      + '<div class="empty-sub">Check your connection and try refreshing.</div>'
      + '</div>';
  });
}

// ── HELPERS ──────────────────────────────────────────────────────
function goToLeague() {
  var ctx = FRAuth.getLeagueCtx();
  if (ctx && ctx.leagueId) {
    window.location.href = '/league.html';
  } else if (user) {
    // Find first league from cards and enter it
    var card = document.querySelector('[onclick^="enterLeague"]');
    if (card) card.click();
    else window.location.href = '/league-setup.html?mode=join';
  }
}

function updateWeekPill() {
  // Will update dynamically once season data is available
  var pill = document.getElementById('week-pill-text');
  if (!pill) return;
  var now = new Date();
  var seasonStart = new Date('2026-09-03');
  if (now < seasonStart) {
    var days = Math.ceil((seasonStart - now) / (1000 * 60 * 60 * 24));
    pill.textContent = 'Season starts in ' + days + ' days';
  }
}
